  assumptions:
  - name: n_mc_samples
    value: 100000.0
    units: dimensionless
    description: Number of Monte Carlo samples for uncertainty propagation.
    rationale: 100,000 samples provide stable median and 95% CI estimates.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        rng = np.random.default_rng(42)
        med = inputs['treg_density_median']
        q1 = inputs['treg_density_q1']
        q3 = inputs['treg_density_q3']
        z_q = 0.67448975
        sigma = np.log(q3.magnitude / max(q1.magnitude, 0.5)) / (2.0 * z_q)
        mu = np.log(med.magnitude)
        samples = rng.lognormal(mu, sigma, 100000) * med.units
        return {
            'median_obs': np.median(samples),
            'ci95_lower': np.percentile(samples, 2.5),
            'ci95_upper': np.percentile(samples, 97.5),
        }
