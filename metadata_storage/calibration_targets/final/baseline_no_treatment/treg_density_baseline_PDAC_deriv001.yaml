study_interpretation: |
  Sivagnanam et al. (Cancer Discovery 2021) quantified immune cell densities by mIHC in 113 treatment-naive primary PDAC resection specimens. Supplementary Table S5 reports median Treg density (Foxp3+ cells) in the Tumor region as 14 cells/mm^2 (IQR 5-26). This provides a direct baseline constraint for V_T.Treg density in the model.
key_assumptions:
- Foxp3+ cells detected by mIHC correspond to the model's V_T.Treg population.
- |
  Patient-level Treg density follows a lognormal distribution parameterized from the reported median and IQR.
key_study_limitations:
- |
  Densities from FFPE tissue sections (2D) may not fully capture 3D spatial heterogeneity.
- |
  Foxp3 can be transiently expressed by activated conventional T cells, potentially overestimating true Treg counts.
observable:
  code: |
    def compute_observable(time, species_dict, constants, ureg):
        treg = species_dict['V_T.Treg']
        c_cells = species_dict['V_T.C1']
        area_per_cell = constants['pdac_cancer_cell_cross_section']
        cellularity = constants['pdac_cellularity_fraction']
        tumor_area = c_cells * area_per_cell / cellularity
        density = treg / tumor_area
        return density.to('cell/mm**2')
  units: cell / millimeter**2
  species:
  - V_T.Treg
  - V_T.C1
  constants:
  - name: pdac_cancer_cell_cross_section
    value: 0.000227
    units: millimeter**2 / cell
    biological_basis: |
      Cross-sectional area of a typical PDAC cancer cell (~17 um diameter, area ~2.27e-4 mm^2).
    source_type: reference_db
    reference_db_name: pdac_cancer_cell_cross_section
    reference_db_names:
    source_tag:
  - name: pdac_cellularity_fraction
    value: 0.15
    units: dimensionless
    biological_basis: |
      Fraction of PDAC tumor area occupied by cancer cells (~15%), remainder is stroma.
    source_type: reference_db
    reference_db_name: pdac_cellularity_fraction
    reference_db_names:
    source_tag:
  inputs: []
  support: positive
  mapping_rationale: |
    Foxp3+ T cell density from mIHC maps to V_T.Treg / tumor_area. Tumor area estimated from V_T.C1 and cellularity fraction.
  experimental_denominator: mm^2 of tumor tissue section
