  inputs: []
  support: unit_interval
  mapping_rationale: |
    The experimental tumor stroma percentage (TSP) is the area fraction of CA19-9-negative tissue (stroma) relative to total tumor tissue area. By the Delesse principle, area fraction equals volume fraction for isotropic random sections. The observable computes the model-predicted stromal volume fraction from explicit species: cancer cell volume (V_T.C1 × vol_cancer_cell), CAF volume (iCAF + myCAF + apCAF × vol_CAF), immune cell volume (lymphocytes × vol_lymphocyte + macrophages × vol_macrophage), and ECM volume (V_T.ECM / ecm_tissue_density). Stromal fraction = (CAF + immune + ECM volume) / (cancer + CAF + immune + ECM volume). This makes the target sensitive to the dynamic balance between tumor growth, CAF activation, immune infiltration, and ECM deposition.
  experimental_denominator: |
    Total tumor tissue area (CA19-9-positive epithelial islands + CA19-9-negative stroma).
  model_denominator_species:
  - V_T.C1
  - V_T.iCAF
  - V_T.myCAF
  - V_T.apCAF
