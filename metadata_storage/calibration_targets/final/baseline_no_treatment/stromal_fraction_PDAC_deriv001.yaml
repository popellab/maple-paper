  - V_T.Mac_M2
  - V_T.ECM
  unmodeled_denominator_components: |
    Histologic stroma includes endothelial cells, pericytes, and neural elements not explicitly modeled. Their combined volume contribution is assumed small relative to ECM and CAFs. Vascular lumen volume is also excluded.
