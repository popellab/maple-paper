study_interpretation: |
  From Sivagnanam et al. Table S5, the M2 macrophage fraction is derived as CD163+ / (CD163+ + CD163-) monocyte/macrophage density in the Tumor region. CD163+ density (61 cells/mm^2) and CD163- density (39 cells/mm^2) give an approximate M2 fraction of ~0.61.
key_assumptions:
- |
  CD163+ monocyte/macrophages represent M2-polarized macrophages; CD163- represent M1-like.
- |
  CD163+ and CD163- densities sampled independently (no within-patient correlation), which widens the CI of the fraction.
key_study_limitations:
- |
  M2 fraction CI is wide (0.08-0.96) due to independent sampling of numerator and denominator.
- CD163 is one of several M2 markers; some M2 macrophages may be CD163-negative.
observable:
