    def compute_observable(time, species_dict, constants, ureg):
        m1 = species_dict['V_T.Mac_M1']
        m2 = species_dict['V_T.Mac_M2']
        fraction = (m2 / (m1 + m2)).to('dimensionless')
        return fraction
