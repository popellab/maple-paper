study_interpretation: |
  Sivagnanam et al. (Cancer Discovery 2021) reported CD163+ and CD163- monocyte/macrophage densities in Tumor regions of 113 treatment-naive PDAC resections (Table S5). CD163+ (61 cells/mm^2) maps to M2-polarized and CD163- (39 cells/mm^2) to M1-like macrophages. Total TAM density is their sum.
key_assumptions:
- CD163+ monocyte/macrophages correspond to V_T.Mac_M2 and CD163- to V_T.Mac_M1.
- |
  CD163+ and CD163- densities are sampled independently due to lack of within-patient correlation data, which may widen the CI of the sum.
key_study_limitations:
- |
  CD163-negative monocyte/macrophages include monocytes and unpolarized macrophages, not just M1.
- Independent sampling of CD163+ and CD163- ignores within-patient correlation.
observable:
  code: |
    def compute_observable(time, species_dict, constants, ureg):
        m1 = species_dict['V_T.Mac_M1']
        m2 = species_dict['V_T.Mac_M2']
        c_cells = species_dict['V_T.C1']
        area_per_cell = constants['pdac_cancer_cell_cross_section']
        cellularity = constants['pdac_cellularity_fraction']
        tumor_area = c_cells * area_per_cell / cellularity
        density = (m1 + m2) / tumor_area
        return density.to('cell/mm**2')
  units: cell / millimeter**2
  species:
  - V_T.Mac_M1
  - V_T.Mac_M2
  - V_T.C1
  constants:
  - name: pdac_cancer_cell_cross_section
    value: 0.000227
    units: millimeter**2 / cell
    biological_basis: |
      Cross-sectional area of a typical PDAC cancer cell (~17 um diameter, area ~2.27e-4 mm^2).
    source_type: reference_db
    reference_db_name: pdac_cancer_cell_cross_section
    reference_db_names:
    source_tag:
  - name: pdac_cellularity_fraction
    value: 0.15
    units: dimensionless
    biological_basis: |
      Fraction of PDAC tumor area occupied by cancer cells (~15%), remainder is stroma.
    source_type: reference_db
    reference_db_name: pdac_cellularity_fraction
    reference_db_names:
    source_tag:
  inputs: []
  support: positive
  mapping_rationale: |
    Total TAM density = (V_T.Mac_M1 + V_T.Mac_M2) / tumor_area. CD163+ maps to M2, CD163- to M1.
  experimental_denominator: mm^2 of tumor tissue section
  model_denominator_species:
  - V_T.C1
  unmodeled_denominator_components:
