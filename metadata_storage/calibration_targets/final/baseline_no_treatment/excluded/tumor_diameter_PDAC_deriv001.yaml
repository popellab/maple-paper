study_interpretation: |
  Tran et al. (2022) systematically measured tumor size in 315 consecutive
  pancreatic cancer resection specimens at Oslo University Hospital using
  four approaches (2D-macro, 2D-micro, 3D-macro, 3D-micro). The standard
  macroscopic measurement (2D-macro) gives mean 30 mm (SD 10), median 30 mm
  (IQR 23-35), range 9-110 mm. This is a large single-center pathology
  series with rigorous measurement methodology, providing the most detailed
  continuous tumor size distribution available for resected PDAC. T-stage
  distribution: T1c 3%, T2 60%, T3 37%, consistent with AJCC 8th edition
  staging.

key_assumptions:
- |
  The 2D macroscopic measurement (standard pathology approach) is used as
  the reference measurement, since this is what most clinical studies and
  the AJCC staging system are based on.
- |
  Resected PDAC specimens are representative of PDAC tumors at diagnosis
  in a resectable population. The model's evolve_to_diagnosis function
  initializes to a target diameter matching this distribution.
- |
  Tumor diameter is computed from V_T assuming spherical geometry:
  diameter = 2 * (3 * V_T / (4 * pi))^(1/3), with V_T in mL (= cm^3).
- |
  The distribution is modeled as lognormal, parameterized from the reported
  median and IQR, which naturally captures the positive support and right
  skew observed in the data (range 9-110 mm).

key_study_limitations:
- |
  Single-center Norwegian cohort (n=315); demographics and stage
  distribution may differ from other populations.
- |
  All specimens are resected, representing only ~15-20% of PDAC patients.
  Unresectable tumors at diagnosis are likely larger.
- |
  Body/tail tumors (n=84, 27%) have larger mean size (31mm 2D-macro)
  than head tumors (n=231, 73%, mean 30mm), reflecting earlier
  symptomatic presentation of head tumors due to bile duct obstruction.

observable:
  code: |
    def compute_observable(time, species_dict, constants, ureg):
        import numpy as np
        V_T = species_dict['V_T']  # tumor volume in mL (= cm^3)
        V_T_cm3 = V_T.to('milliliter').magnitude
        diameter_cm = 2.0 * (3.0 * V_T_cm3 / (4.0 * np.pi)) ** (1.0 / 3.0)
        return diameter_cm * ureg.centimeter
  units: centimeter
  species:
  - V_T
  constants: []
  inputs: []
  support: positive_unbounded
  mapping_rationale: |
    Pathologic tumor diameter is the greatest dimension of the resected
    tumor, measured macroscopically. In the QSP model, the tumor
    compartment V_T represents tumor volume in mL (= cm^3). Assuming
    spherical geometry, diameter = 2 * (3*V/(4*pi))^(1/3). This is
    the standard mapping used for RECIST-like diameter calculations.
  experimental_denominator:
  model_denominator_species:
  unmodeled_denominator_components:
  aggregation:

