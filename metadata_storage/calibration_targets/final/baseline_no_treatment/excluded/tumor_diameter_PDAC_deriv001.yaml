  assumptions: []
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        rng = np.random.default_rng(42)

        # Convert mm inputs to cm for the observable
        median_cm = inputs['median_diameter'].magnitude / 10.0
        q1_cm = inputs['iqr_lower'].magnitude / 10.0
        q3_cm = inputs['iqr_upper'].magnitude / 10.0

        # Lognormal from median and IQR
        z_q = 0.6745  # z for 25th percentile
        mu = np.log(median_cm)
        sigma = np.log(q3_cm / q1_cm) / (2.0 * z_q)

        samples = rng.lognormal(mu, sigma, 10000) * ureg.centimeter
        return {
            'median_obs': np.median(samples),
            'ci95_lower': np.percentile(samples, 2.5),
            'ci95_upper': np.percentile(samples, 97.5),
        }

