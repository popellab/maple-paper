study_interpretation: |
  Battini et al. (2017) used 1H HRMAS NMR spectroscopy on intact tissue samples from
  patients undergoing surgical resection for pancreatic adenocarcinoma. Table 2 reports
  mean +/- SD metabolite concentrations in nmol/mg for the subgroup without neoadjuvant
  chemotherapy: pancreatic adenocarcinoma (PA, n=44) lactate was 16.137 +/- 4.727 nmol/mg.
  Assuming tissue density ~1 g/mL, this converts to 16,137 +/- 4,727 uM. This absolute
  concentration target complements the fold-change target (deriv001) from the same source:
  together they pin both the ratio (tumor/normal) and the absolute scale of V_T.lactate.

key_assumptions:
- |
  Tissue density of ~1 g/mL is assumed for the nmol/mg to uM conversion:
  1 nmol/mg = 1 nmol per 0.001 g = 1,000 nmol/g. If density ~1 g/mL,
  this equals 1,000 nmol/mL = 1 umol/mL = 1,000 uM. So 16.137 nmol/mg
  = 16,137 uM.
- |
  HRMAS NMR measures total tissue lactate (intracellular + extracellular),
  which maps to the well-mixed V_T.lactate species in the QSP model.
- |
  Positive metabolite concentrations are modeled as lognormal, consistent
  with the moderate CV (~0.29) and the physically positive support.

key_study_limitations:
- |
  Single-center French cohort with limited untreated PA samples (n=44);
  may not generalize to all PDAC populations.
- |
  HRMAS NMR underestimates total metabolite content by ~20% compared to
  extraction methods (noted by authors); systematic bias not modeled.
- |
  Small biopsy cores (15-20 mg) may not capture intratumoral spatial
  heterogeneity in lactate distribution.

