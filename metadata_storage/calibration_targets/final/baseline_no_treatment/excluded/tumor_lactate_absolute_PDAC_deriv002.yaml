      deviation (SD)."
  - name: lactate_pa_sd
    value: 4.7272
    units: nanomole / milligram
    description: |
      Standard deviation of lactate concentration in PA tissue (nmol/mg).
    source_ref: Battini2017_HRMAS
    value_location: Table 2
    value_snippet: PA 16.1370 +/- 4.7272
    input_type: direct_parameter
    conversion_formula:
    source_type: table
    figure_id:
    extraction_method: manual
    extraction_notes:
    dispersion_type: sd
    dispersion_type_rationale: |
      Explicitly reported as SD per the Methods section.
  assumptions: []
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        rng = np.random.default_rng(42)

        # Convert nmol/mg to uM: 1 nmol/mg = 1000 uM (tissue density ~1 g/mL)
        mean_um = inputs['lactate_pa_mean'].magnitude * 1000.0
        sd_um = inputs['lactate_pa_sd'].magnitude * 1000.0

        # Lognormal parameters from mean and SD
        sigma2 = np.log(1.0 + (sd_um / mean_um) ** 2)
        sigma = np.sqrt(sigma2)
        mu = np.log(mean_um) - 0.5 * sigma2

        samples = rng.lognormal(mu, sigma, 10000) * ureg.micromolarity
        return {
            'median_obs': np.median(samples),
            'ci95_lower': np.percentile(samples, 2.5),
            'ci95_upper': np.percentile(samples, 97.5),
        }

