  assumptions:
  - name: ci95_lower_floor
    value: 0.3
    units: millimeter_mercury
    description: |
      Floor for the lower CI bound. The reported minimum per-patient median pO2 is
      0 mmHg, but log-normal parameterization requires strictly positive values.
      0.3 mmHg represents the approximate Eppendorf electrode detection limit.
    rationale: |
      Log-normal parameterization requires strictly positive values. Setting the lower
      bound to 0.3 mmHg avoids log(0) while still capturing near-anoxic conditions.
  - name: n_mc_samples
    value: 100000
    units: dimensionless
    description: |
      Number of Monte Carlo samples for deriving median and 95% CI from the
      log-normal distribution fit to the reported range.
    rationale: |
      100,000 samples provide stable percentile estimates with Monte Carlo error
      well below 1%.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np

        # Reported values from Koong 2000 (verbatim)
        median_reported = inputs['overall_median_pO2'].magnitude  # 2.7 mmHg
        range_max = inputs['max_patient_median_pO2'].magnitude    # 5.3 mmHg
        units = inputs['overall_median_pO2'].units

        # Modeling assumption: floor for lower bound
        range_min = inputs['ci95_lower_floor'].magnitude           # 0.3 mmHg

        n_samples = int(inputs['n_mc_samples'].magnitude)

        # Fit log-normal: median of log-normal = exp(mu), so mu = log(median)
        mu = np.log(median_reported)

        # Estimate sigma from the range: treat range_min and range_max as
        # approximate 2.5th and 97.5th percentiles of per-patient variability.
        # For log-normal: log(x_97.5) = mu + 1.96*sigma
        sigma = (np.log(range_max) - np.log(range_min)) / (2 * 1.96)

        rng = np.random.default_rng(42)
        samples = rng.lognormal(mu, sigma, n_samples) * units

        median_obs = np.median(samples)
        ci95_lower = np.percentile(samples, 2.5)
        ci95_upper = np.percentile(samples, 97.5)

        return {
            'median_obs': median_obs,
            'ci95_lower': ci95_lower,
            'ci95_upper': ci95_upper,
        }

