study_interpretation: |
  Koong et al. (2000) measured intratumoral oxygen tension using computerized Eppendorf
  polarographic needle electrode in 7 patients with locally advanced, unresectable pancreatic
  adenocarcinoma prior to intraoperative radiotherapy. Per-patient median pO2 values ranged
  from 0 to 5.3 mmHg, with an overall median of approximately 2.7 mmHg. The normal tissue
  reference (pO2_normal = 50 mmHg) comes from Vaupel et al. 2007.

  For QSP calibration, we model the distribution of per-patient median pO2 values as
  log-normal (strictly positive, right-skewed), parameterized to match the reported overall
  median of 2.7 mmHg with 95% coverage spanning the observed per-patient range. Because
  pO2 cannot be negative and one patient had median pO2 = 0 mmHg (electrode detection limit),
  we set the lower CI bound to 0.3 mmHg rather than 0.

key_assumptions:
- |
  Per-patient median pO2 values from Eppendorf electrode measurements are taken as
  representative of the bulk tumor oxygen tension that the QSP model's algebraic pO2
  variable captures. The model assumes a well-mixed tumor compartment, whereas real
  tumors have spatial gradients; the Eppendorf technique samples multiple tracks per
  tumor, and the per-patient median integrates over this heterogeneity.
- |
  The distribution of per-patient median pO2 is modeled as log-normal, reflecting that
  pO2 is strictly positive and right-skewed across patients. The overall median of
  2.7 mmHg and CI95 of [0.3, 5.3] are chosen to span the observed per-patient range
  while avoiding the non-physical value of 0.
- |
  The patient with median pO2 = 0 mmHg likely reflects the electrode detection limit
  rather than true zero oxygen; we use 0.3 mmHg as the lower CI bound to avoid log(0)
  in the log-normal parameterization.
- |
  Although the Koong et al. cohort consists of locally advanced, unresectable tumors
  (potentially more hypoxic than resectable disease), PDAC is uniformly severely
  hypoxic across stages. The pO2 values are assumed representative of the hypoxic
  steady state the model should achieve at diagnosis.

key_study_limitations:
- |
  Very small sample size (n = 7 patients) limits the precision of the pO2 distribution
  estimate and may not capture the full range of inter-patient variability.
- |
  Patients had locally advanced, unresectable PDAC and were measured intraoperatively
  before radiotherapy; this cohort may be more hypoxic than resectable PDAC patients
  used for other calibration targets in this model.
- |
  Eppendorf polarographic electrodes consume oxygen during measurement and can
  underestimate true tissue pO2 in very low-oxygen environments; the reported values
  may be slight underestimates.
- |
  The study was published in 2000 with older electrode technology; modern fiber-optic
  probes (OxyLite) or pimonidazole staining might yield somewhat different absolute
  values, though the qualitative finding of severe hypoxia in PDAC is robust.

observable:
  code: |
    def compute_observable(time, species_dict, constants, ureg):
        """Tumor pO2 at diagnosis.

        pO2 is a repeatedAssignment algebraic parameter in the hypoxia module,
        representing bulk tumor oxygen partial pressure in mmHg. It equilibrates
        quasi-instantaneously relative to the model's daily timestep.
        """
        pO2 = species_dict['pO2']
        return pO2.to('millimeter_mercury')
  units: millimeter_mercury
  species:
  - pO2
  constants: []
  inputs: []
  support: positive_unbounded
  mapping_rationale: |
    The model's pO2 variable is a repeatedAssignment algebraic parameter computed from
    oxygen supply (proportional to vasculature K), demand (metabolically active cells),
    and vascular quality (VEGF-driven aberration). It represents bulk tumor oxygen
    tension in mmHg — directly comparable to Eppendorf electrode polarography
    measurements which report tissue pO2 in mmHg.
  experimental_denominator:
  model_denominator_species:
  unmodeled_denominator_components:
  aggregation:

