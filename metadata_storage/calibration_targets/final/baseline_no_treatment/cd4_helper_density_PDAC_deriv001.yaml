study_interpretation: |
  Sivagnanam et al. Table S5 reports densities of T helper subtypes (Th0, Th1, Th2, Th17) separately. The model lumps all CD4+Foxp3- T helpers into V_T.Th + V_T.Th_exh. Total Th density = Th0 (77) + Th1 (3) + Th2 (7) + Th17 (1) ≈ 88 cells/mm^2.
key_assumptions:
- |
  Th0 + Th1 + Th2 + Th17 from mIHC correspond to V_T.Th + V_T.Th_exh (all non-Treg CD4+ T cells).
- Th subtypes are sampled independently from lognormal distributions and summed.
- |
  Th0 dominates (~88% of total Th density), so the sum is relatively insensitive to the minor subtypes.
key_study_limitations:
- |
  Th17 has Q1=0 in Table S5; a floor of 0.5 cells/mm^2 was used for lognormal parameterization.
- Some CD4+ T cells may not fit cleanly into Th0/1/2/17 categories.
observable:
  code: |
    def compute_observable(time, species_dict, constants, ureg):
        th = species_dict['V_T.Th']
        th_exh = species_dict['V_T.Th_exh']
        c_cells = species_dict['V_T.C1']
        area_per_cell = constants['pdac_cancer_cell_cross_section']
        cellularity = constants['pdac_cellularity_fraction']
        tumor_area = c_cells * area_per_cell / cellularity
        density = (th + th_exh) / tumor_area
        return density.to('cell/mm**2')
  units: cell / millimeter**2
  species:
  - V_T.Th
  - V_T.Th_exh
  - V_T.C1
  constants:
  - name: pdac_cancer_cell_cross_section
    value: 0.000227
    units: millimeter**2 / cell
    biological_basis: |
      Cross-sectional area of a typical PDAC cancer cell (~17 um diameter, area ~2.27e-4 mm^2).
    source_type: reference_db
    reference_db_name: pdac_cancer_cell_cross_section
    reference_db_names:
    source_tag:
  - name: pdac_cellularity_fraction
    value: 0.15
    units: dimensionless
    biological_basis: |
      Fraction of PDAC tumor area occupied by cancer cells (~15%), remainder is stroma.
    source_type: reference_db
    reference_db_name: pdac_cellularity_fraction
    reference_db_names:
    source_tag:
