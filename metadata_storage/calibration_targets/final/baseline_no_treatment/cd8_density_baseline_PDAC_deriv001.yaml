  support: positive
  mapping_rationale: |
    CD8 immunohistochemistry detects all CD8+ T cells regardless of functional or exhaustion state. The observable therefore sums effector (V_T.CD8) and exhausted (V_T.CD8_exh) CD8 T cells in the tumor compartment and divides by tumor cross-sectional area estimated from tumor cell count (V_T.C1), PDAC cancer cell cross-sectional area, and PDAC cellularity fraction to yield a surface density (cells/mm^2) comparable to the digital image analysis used in Jansen et al. 2021.
  experimental_denominator: mm^2 of tumor tissue section (cancer cells + stroma, from 0.6-mm TMA cores)
  model_denominator_species:
