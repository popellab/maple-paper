study_interpretation: |
  Jansen et al. (2021, PeerJ) analyzed 599 pancreatic cancers (predominantly pancreatic ductal adenocarcinomas) on a tissue microarray to study DOG1 expression and its relationship to clinicopathologic parameters. CD8+ cytotoxic T-lymphocyte density (cells/mm^2) in the tumor area was quantified by immunohistochemistry and digital image analysis, and reported for ductal adenocarcinomas stratified by DOG1 expression in tumor cells and in stromal cells. Because DOG1 status did not significantly affect CD8 density, the group-wise means and dispersions for DOG1-negative and DOG1-positive stromal PDAC cases (n=368 and n=76, respectively) were combined via Monte Carlo sampling to obtain an overall patient-level distribution for intratumoral CD8+ T-cell surface density in resected human PDAC. This distribution is mapped to the QSP model by computing total CD8+ T cells (effector plus exhausted) per tumor cross-sectional area at the time of surgical resection.

key_assumptions:
- |
  CD8 immunohistochemistry detects all CD8+ T cells (effector and exhausted) equivalently; in the QSP model this is represented by summing V_T.CD8 and V_T.CD8_exh to obtain total intratumoral CD8+ T-cell number before converting to a surface density.
- |
  The +/- values reported for CD8 density in Table 4 of Jansen et al. 2021 are standard errors of the mean (SEM), not standard deviations. Evidence: (1) the paper does not explicitly state SD vs SEM, but (2) the sqrt(n) test is definitive — SEM_neg=15.0 with n=368 gives SD=15.0*sqrt(368)=287.7, and SEM_pos=33.0 with n=76 gives SD=33.0*sqrt(76)=287.7; both subgroups yield identical SDs, as expected for the same measurement in similar tumors; (3) if treated as SD, implied CV would be 6.6% (implausibly low for immune cell density data; typical CV is 50-200%). The distribution_code converts SEM to SD before sampling.
- |
  DOG1 expression in stromal cells is not strongly associated with CD8+ T-cell density, as indicated by similar means and a non-significant p value (0.8326); therefore, combining DOG1-negative and DOG1-positive stromal PDAC cases into a single mixture distribution is an appropriate way to approximate the overall intratumoral CD8 density distribution in resected PDAC.
- |
  The reference values for PDAC cancer cell cross-sectional area and PDAC cellularity fraction from the curated database are applicable to the Jansen et al. cohort, allowing conversion from model cancer cell counts to tumor cross-sectional area that is comparable to the histologic sections used for CD8 density quantification.

key_study_limitations:
- |
  The CD8+ T-cell densities are derived from 0.6-mm tissue microarray cores rather than whole-slide sections, so spatial heterogeneity of T-cell infiltration within individual tumors may not be fully captured.
- |
  The patient cohort consists of surgically resected PDACs with mixed pathologic stages (pT1 to pT4, pN0 and pN+), and the original paper does not explicitly report neoadjuvant therapy status; using this cohort as a proxy for treatment-naive, resectable PDAC introduces some uncertainty in matching the exact model context.
- |
  Only group-wise summary statistics (mean +/- SEM and sample size per DOG1 stromal category) are available; the overall PDAC CD8+ T-cell density distribution is therefore reconstructed via a mixture-of-lognormals Monte Carlo approach (with SEM→SD conversion) rather than from individual-patient raw data.
- |
  CD8+ T-cell density is measured in two-dimensional histologic sections (cells/mm^2), whereas the model represents a three-dimensional tumor compartment; conversion using cross-sectional area and cellularity assumes approximate spherical cells and homogeneous cellular packing, which may not hold in all regions of the desmoplastic PDAC microenvironment.

observable:
  code: |
    def compute_observable(time, species_dict, constants, ureg):
        """Compute total intratumoral CD8+ T-cell density (cells/mm^2).

        Total CD8+ cells are taken as the sum of effector (V_T.CD8)
        and exhausted (V_T.CD8_exh) CD8 T cells in the tumor compartment.
        Tumor area is estimated from the cancer cell count (V_T.C1),
        a reference cross-sectional area per PDAC cancer cell, and the
        PDAC cellularity fraction (cancer-cell area fraction of the tumor).
        """
        cd8_eff = species_dict['V_T.CD8']       # cells
        cd8_exh = species_dict['V_T.CD8_exh']   # cells
        c_cells = species_dict['V_T.C1']        # cancer cells

        area_per_cell = constants['pdac_cancer_cell_cross_section']  # mm^2/cell
        cellularity = constants['pdac_cellularity_fraction']         # dimensionless

        # Total tumor cross-sectional area represented by the compartment
        tumor_area = c_cells * area_per_cell / cellularity           # mm^2

        cd8_total = cd8_eff + cd8_exh                                # cells
        density = cd8_total / tumor_area                             # cells/mm^2

        return density.to('cell/mm**2')
  units: cell / millimeter**2
  species:
  - V_T.CD8
  - V_T.CD8_exh
  - V_T.C1
  constants:
  - name: pdac_cancer_cell_cross_section
    value: 0.000227
    units: millimeter**2 / cell
    biological_basis: |
      From reference DB entry 'pdac_cancer_cell_cross_section', which gives the cross-sectional area of a typical PDAC cancer cell based on an approximate diameter of 17 micrometer (area about 2.27e-4 mm^2 per cell). This is used to convert tumor cell counts to cross-sectional area in IHC sections.
    source_type: reference_db
    reference_db_name: pdac_cancer_cell_cross_section
    reference_db_names:
    source_tag:
  - name: pdac_cellularity_fraction
    value: 0.15
    units: dimensionless
    biological_basis: |
      From reference DB entry 'pdac_cellularity_fraction', representing the approximate fraction of PDAC tumor volume occupied by cancer cells (~15%) versus stroma (~85%). This is used to scale from cancer-cell cross-sectional area to total tumor cross-sectional area in tissue sections.
    source_type: reference_db
    reference_db_name: pdac_cellularity_fraction
    reference_db_names:
    source_tag:
