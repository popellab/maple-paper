study_interpretation: |
  Sivagnanam et al. Table S5 reports PanCK+ cell density of 995 (660-1526) cells/mm^2 in the Tumor region of 113 treatment-naive PDAC specimens. PanCK marks epithelial cells, which in the tumor region are predominantly cancer cells.
key_assumptions:
- PanCK+ cells in the tumor region correspond to cancer cells (V_T.C1).
- Patient-level PanCK+ density follows a lognormal distribution.
- |
  Tumor tissue area for the density denominator is derived from the total tissue
  volume of all modeled species using dynamic cellularity (cancer_vol / total_vol),
  rather than a fixed cellularity constant. This makes the observable sensitive to
  the cancer-to-stroma ratio rather than being a trivial constant.
key_study_limitations:
- |
  PanCK may also stain non-malignant ductal epithelial cells entrapped in the tumor.
observable:
  code: |
    def compute_observable(time, species_dict, constants, ureg):
        """Compute cancer cell density (cells/mm^2) using dynamic cellularity.

        The denominator (tumor tissue area) is derived from the total tissue
        volume of all modeled species, not from C1 alone. This avoids the
        tautology that arises when tumor_area = C1 * area_per_cell / cellularity
        (which simplifies to the constant cellularity / area_per_cell).

        Dynamic cellularity = cancer_vol / total_tissue_vol, which varies
        across simulations as the cancer-to-stroma ratio changes.
        """
        # Cancer cells
        C1 = species_dict['V_T.C1']

        # CAF subtypes
        iCAF = species_dict['V_T.iCAF']
        myCAF = species_dict['V_T.myCAF']
        apCAF = species_dict['V_T.apCAF']

        # Lymphocyte-sized immune cells
        CD8 = species_dict['V_T.CD8']
        Th = species_dict['V_T.Th']
        Treg = species_dict['V_T.Treg']
        NK = species_dict['V_T.NK']
        MDSC = species_dict['V_T.MDSC']
        cDC1 = species_dict['V_T.cDC1']
        cDC2 = species_dict['V_T.cDC2']

        # Macrophages
        Mac_M1 = species_dict['V_T.Mac_M1']
        Mac_M2 = species_dict['V_T.Mac_M2']

        # ECM
        ECM = species_dict['V_T.ECM']

        # Cell volumes and ECM density
        vol_cancer = constants['vol_cancer_cell']
        vol_caf = constants['vol_CAF']
        vol_lymph = constants['vol_lymphocyte']
        vol_mac = constants['vol_macrophage']
        ecm_density = constants['ecm_tissue_density']
        area_per_cell = constants['pdac_cancer_cell_cross_section']

        # Volume contributions
        cancer_vol = C1 * vol_cancer
        caf_vol = (iCAF + myCAF + apCAF) * vol_caf
        lymph_vol = (CD8 + Th + Treg + NK + MDSC + cDC1 + cDC2) * vol_lymph
        mac_vol = (Mac_M1 + Mac_M2) * vol_mac
        ecm_vol = ECM / ecm_density
        total_vol = cancer_vol + caf_vol + lymph_vol + mac_vol + ecm_vol

        # Dynamic cellularity (cancer volume fraction of total tissue)
        dynamic_cellularity = (cancer_vol / total_vol).to('dimensionless')

        # Cancer cell density = dynamic_cellularity / area_per_cell
        # = C1 * vol_cancer / (total_vol * area_per_cell)
        density = dynamic_cellularity / area_per_cell
        return density.to('cell/mm**2')
