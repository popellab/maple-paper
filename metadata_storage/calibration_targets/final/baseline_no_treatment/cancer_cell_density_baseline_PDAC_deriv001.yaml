  inputs: []
  support: positive
  mapping_rationale: |
    PanCK+ density maps to C1 / tumor_area, where tumor_area is derived from the
    total tissue volume of all modeled species (cancer cells, CAFs, immune cells, ECM)
    using dynamic cellularity = cancer_vol / total_vol. This avoids the tautology of
    the previous formula (where tumor_area was derived from C1 alone, making density
    a constant = cellularity / area_per_cell). The dynamic formulation means cancer
    cell density increases when cancer cells are a larger fraction of the tumor tissue
    (high cellularity) and decreases when stroma dominates (low cellularity), matching
    the biological reality that desmoplastic PDACs have lower cancer cell density on IHC.
    Uses the same cell volume and ECM density constants as the stromal_fraction and
    tumor_volume_resection targets for internal consistency.
  experimental_denominator: mm^2 of tumor tissue section
  model_denominator_species:
