  - name: n_mc_samples
    value: 10000.0
    units: dimensionless
    description: |
      Number of Monte Carlo samples used to approximate the sampling distribution of the true HIF-1alpha positivity proportion in PDAC.
    rationale: |
      10,000 samples provide stable estimates of the median and 95% credible interval of the positivity proportion while keeping computation inexpensive.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        rng = np.random.default_rng(42)

        # Inputs are counts from Sun et al. (2007)
        n_pos = inputs['n_positive_pdac']  # dimensionless Quantity
        n_tot = inputs['n_total_pdac']     # dimensionless Quantity
        n_mc = int(inputs['n_mc_samples'].magnitude)

        # Conjugate Beta posterior for a binomial proportion with uniform prior
        a = n_pos.magnitude + 1.0
        b = (n_tot - n_pos).magnitude + 1.0

        samples = rng.beta(a, b, n_mc) * ureg('dimensionless')

        median_obs = np.median(samples)
        ci95_lower = np.percentile(samples, 2.5)
        ci95_upper = np.percentile(samples, 97.5)

        return {
            'median_obs': median_obs,
            'ci95_lower': ci95_lower,
            'ci95_upper': ci95_upper,
        }

