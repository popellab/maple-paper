study_interpretation: |
  Sun et al. (Int J Oncol 2007) quantified hypoxia-inducible factor-1alpha (HIF-1alpha) protein expression by immunohistochemistry in 58 patients with pancreatic ductal adenocarcinoma who underwent radical pancreatic surgery without preoperative chemo- or radiotherapy, and in 20 samples of normal pancreas from non-cancer operations. HIF-1alpha staining was evaluated semi-quantitatively using a weighted score combining the fraction of positive tumor cells and staining intensity, and tumors were categorized as negative, weak, moderate, or strong. Any detectable HIF-1alpha staining (weak, moderate, or strong) was considered positive, yielding 41/58 (70.7%) HIF-1alpha-positive PDAC tumors, whereas no HIF-1alpha expression was detected in the exocrine portion of normal pancreatic samples. For calibration, we treat the observable as the population-level fraction of PDAC tumors that are HIF-1alpha-positive at surgical resection. The model-level observable returns a dimensionless HIF activity trajectory in the tumor compartment, and a response-rate aggregation with an IHC-inspired threshold is used to map continuous HIF activity to the binary IHC positivity outcome.

key_assumptions:
- |
  The 58 patients with pancreatic ductal adenocarcinoma who underwent radical surgery and had no preoperative chemo- or radiotherapy are taken as representative of treatment-naive, resectable human PDAC, even though pathologic TNM stages (I-IV) are heterogeneous.
- |
  HIF-1alpha immunohistochemical positivity defined as any detectable nuclear and/or cytoplasmic staining (weak, moderate, or strong) is assumed to correspond to tumors with elevated effective HIF activity in the QSP model, which is represented by a 0-1 algebraic HIF variable in the tumor compartment.
- |
  The semi-quantitative IHC scoring system (weighted score 1-7 combining percentage of positive cells and intensity) is approximated on a 0-1 continuous HIF scale, and the boundary between negative (scores 1-2) and positive (scores >=3) staining is mapped to a dimensionless model threshold of approximately 0.25.
- |
  Binomial sampling of HIF-1alpha-positive versus -negative tumors (41/58) is modeled with a Beta posterior using a uniform prior, providing a reasonable description of uncertainty in the underlying positivity proportion.
- |
  Normal pancreatic tissue obtained from patients operated for non-cancer indications is assumed to represent physiologic pancreas with respect to exocrine HIF-1alpha expression, despite the underlying benign pathology prompting surgery.

key_study_limitations:
- |
  Single-center retrospective cohort (n=58) from a Chinese surgical series between 1993 and 2005 limits generalizability to contemporary, multi-center PDAC populations.
- |
  Pathologic TNM stage distribution is broad (I-IV), so the cohort is not restricted to early-stage or strictly resectable PDAC in modern terminology, although all cases underwent radical surgery.
- |
  HIF-1alpha expression is assessed by semi-quantitative IHC scoring rather than fully quantitative image analysis; positivity is based on categorical thresholds that may vary across laboratories.
- |
  Normal pancreatic controls come from patients undergoing surgery for benign or non-PDAC conditions, which may not perfectly represent completely healthy pancreas.
- |
  The calibration target uses tumor-level positivity (fraction of tumors positive) rather than per-tumor continuous HIF-1alpha expression values (e.g., H-score or fraction of positive cells), which may discard information about the distribution of HIF-1alpha expression intensity across tumors.

observable:
  code: |
    def compute_observable(time, species_dict, constants, ureg):
        """Tumor HIF-1alpha activity level (0-1 scaled) over the simulated time course.

        In this calibration target, HIF activity is represented as an algebraic
        or algebraically constrained variable 'HIF' stored in species_dict as a
        dimensionless Pint Quantity array with the same length as the time array.
        The observable returns the HIF trajectory (no time indexing), and the
        population-level aggregation handles how this trajectory is summarized
        for response-rate calculations.
        """
        hif = species_dict['HIF']  # dimensionless Pint Quantity array
        return hif.to('dimensionless')
  units: dimensionless
  species:
  - HIF
  constants:
  - name: hif_positivity_threshold
    value: 0.25
    units: dimensionless
    biological_basis: |
      Sun et al. scored HIF-1alpha immunoreactivity by combining the percentage of positive tumor cells (1-4 points for increasing positive-cell fractions) and staining intensity (0-3 points for negative to strong) to yield a weighted score from 1 to 7. Tumors were considered HIF-1alpha-positive when the weighted score was >=3 (categories +, ++, +++), whereas scores 1-2 were considered negative. We approximate this categorical cutoff on a 0-1 normalized HIF scale by placing the positivity threshold between negative and weak categories (around 2.5/7) and represent it as a dimensionless threshold of 0.25 for calibration purposes.
    source_type: literature
    reference_db_name:
    reference_db_names:
    source_tag: Sun2007_HIF1a_PDAC
  inputs: []
  support: unit_interval
  mapping_rationale: |
    Sun et al. quantified HIF-1alpha expression in resected PDAC by semi-quantitative IHC scoring based on the fraction of positive tumor cells and staining intensity. In the QSP model, HIF is represented as a dimensionless 0-1 algebraic variable capturing effective HIF-1alpha activity in the tumor compartment. We map IHC positivity to model output by assuming that tumors with model HIF above a threshold (hif_positivity_threshold) correspond to IHC-positive cases. The observable returns the full HIF trajectory over time, and a response-rate aggregation with a threshold on this trajectory is used to recover the clinically observed fraction of HIF-1alpha-positive tumors.
  experimental_denominator:
  model_denominator_species:
  unmodeled_denominator_components:
  aggregation:
    type: response_rate
    threshold_code: |
      def classify_patient(time, species_dict, constants, ureg):
          """Classify a virtual patient as HIF-1alpha-positive or -negative by IHC.

          A tumor is considered HIF-1alpha-positive if the model HIF activity at
          the end of the simulated time course (representing resection) is greater
          than or equal to the IHC-derived threshold (hif_positivity_threshold).
          """
          hif = species_dict['HIF']
          if hasattr(hif, '__len__'):
              hif_value = hif[-1].to('dimensionless')
          else:
              hif_value = hif.to('dimensionless')

          threshold = constants['hif_positivity_threshold']
          return bool(hif_value >= threshold)
    time_point:
    time_unit:
    rationale: |
      The clinical observable is the proportion of PDAC tumors that are HIF-1alpha-positive by IHC (41/58, 70.7%). This is a population summary, not a per-patient continuous measurement. We therefore treat the per-patient observable as a time course of tumor HIF activity (0-1) and apply a binary classifier corresponding to the IHC scoring cutoff to compute the response rate (fraction of virtual patients that are HIF-1alpha-positive).

