study_interpretation: |
  Marcon et al. (OncoImmunology 2020) analyzed NK cells in blood and tumor tissue from patients with resectable PDAC undergoing Whipple's resection. Tumor-infiltrating lymphocytes were isolated from primary tumor samples and stained for CD3 and CD56 to identify NK cells (CD3- CD56+). They report that NK cells comprise only 3.5% of tumor-infiltrating lymphocytes, indicating that NK cells are a minority subset within the PDAC tumor microenvironment. This calibration target maps that NK fraction to the model as the fraction of NK cells (V_T.NK) among modeled tumor-infiltrating T and NK lymphocytes (V_T.CD8, V_T.CD8_exh, V_T.Th, V_T.Th_exh, V_T.Treg, V_T.NK) at the time of tumor resection.

key_assumptions:
- |
  The reported '3.5% of cells' for NK cells within TIL populations is interpreted as the mean fraction of CD3- CD56+ NK cells among all tumor-infiltrating lymphocytes in the nine tumors analyzed, and is treated as a single-group descriptive statistic rather than a stratification threshold.
- |
  The cohort is assumed to be largely treatment-naive prior to surgery (no neoadjuvant therapy is described), so the NK fraction is interpreted as reflecting the untreated PDAC tumor microenvironment at the time of resection.
- |
  Between-patient variability in NK fraction is approximated using a Beta distribution with concentration parameter 100 (alpha = 3.5, beta = 96.5), chosen to reproduce the approximate spread of values visible in Figure 4b violin plots; this introduces additional model-based uncertainty beyond the reported mean.
- |
  The experimental denominator for the reported percentage (all lymphocytes in the flow cytometry gate, likely including B cells and other subsets) is approximated in the model by the sum of T cells and NK cells only, which may slightly overestimate the NK fraction relative to the experimental value.

key_study_limitations:
- |
  NK TIL data are available for only 9 patients from a single center, limiting generalizability and precision of the estimated distribution for NK fraction among TILs.
- |
  Tumor-infiltrating lymphocytes were obtained by overnight migration out of small tumor fragments rather than immediate enzymatic digestion, which may bias the relative recovery of different lymphocyte subsets.
- |
  The experimental denominator includes B cells and other lymphocyte subsets not explicitly modeled, leading to a small but systematic denominator mismatch between experiment and model. The calibration therefore emphasizes the NK fraction among modeled T and NK cells as an approximation of the reported NK fraction among all lymphocytes.

observable:
  code: |
    def compute_observable(time, species_dict, constants, ureg):
        nk = species_dict['V_T.NK']
        cd8 = species_dict['V_T.CD8']
        cd8_exh = species_dict['V_T.CD8_exh']
        th = species_dict['V_T.Th']
        th_exh = species_dict['V_T.Th_exh']
        treg = species_dict['V_T.Treg']
        total_lymph = nk + cd8 + cd8_exh + th + th_exh + treg
        return (nk / total_lymph).to('dimensionless')
  units: dimensionless
  species:
  - V_T.NK
  - V_T.CD8
  - V_T.CD8_exh
  - V_T.Th
  - V_T.Th_exh
  - V_T.Treg
  constants: []
  inputs: []
  support: unit_interval
  mapping_rationale: |
    The experimental measurement reports NK cells (CD3- CD56+) as a percentage of total tumor-infiltrating lymphocytes isolated from resected PDAC tumors by flow cytometry. In the model, NK cells are represented by V_T.NK and tumor-infiltrating T lymphocytes by V_T.CD8, V_T.CD8_exh, V_T.Th, V_T.Th_exh, and V_T.Treg. The observable computes the fraction of NK cells among modeled tumor-infiltrating T and NK lymphocytes to approximate the experimental NK fraction among all lymphocytes.
  experimental_denominator: |
    Total tumor-infiltrating lymphocytes in the flow cytometry lymphocyte gate from PDAC tumor digests (CD45+ lymphocytes, including T cells, NK cells, B cells and other lymphocyte subsets).
  model_denominator_species:
  - V_T.NK
  - V_T.CD8
  - V_T.CD8_exh
  - V_T.Th
  - V_T.Th_exh
  - V_T.Treg
  unmodeled_denominator_components: |
    The experimental denominator likely includes B cells and other CD45+ lymphocyte subsets that are not represented explicitly in the model; therefore, the model-based NK fraction among T and NK cells may be slightly higher than the experimental NK fraction among all lymphocytes.
