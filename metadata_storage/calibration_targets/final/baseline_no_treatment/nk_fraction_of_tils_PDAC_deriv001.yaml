    dispersion_type_rationale:
  assumptions:
  - name: nk_fraction_concentration
    value: 100.0
    units: dimensionless
    description: |
      Concentration parameter (alpha+beta) for a Beta distribution approximating between-patient variability in NK fraction among TILs; alpha = mean * phi, beta = (1 - mean) * phi with mean = 3.5%.
    rationale: |
      Figure 4b violin plots show NK cell fraction among TILs clustering around approximately 2–5% with relatively few values above ~8%. Setting an effective sample size phi = 100 yields a Beta(3.5, 96.5) distribution with a 95% interval of roughly 0.9–7.9%, matching this visual spread while keeping the mean fixed at the reported 3.5%. This treats the reported 3.5% as the mean across the nine tumors.
  - name: n_mc_samples
    value: 10000.0
    units: dimensionless
    description: |
      Number of Monte Carlo samples drawn from the Beta distribution to estimate median and 95% confidence interval for NK fraction among TILs.
    rationale: |
      10,000 samples provide stable estimates of median and percentile-based confidence intervals with negligible Monte Carlo error for a one-dimensional Beta distribution.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        rng = np.random.default_rng(42)
        # Reported mean NK percentage (3.5%) as Pint quantity with 'percent' units
        mean_pct = inputs['nk_fraction_mean_pct']
        # Convert to fraction in [0, 1]
        mean_frac = mean_pct.to('dimensionless')
        # Beta concentration parameter (alpha + beta)
        phi = inputs['nk_fraction_concentration']
        n_samples = int(inputs['n_mc_samples'].magnitude)
        m = mean_frac.magnitude
        phi_val = phi.magnitude
        alpha = m * phi_val
        beta_param = (1.0 - m) * phi_val
        # Draw Monte Carlo samples from Beta distribution and reattach units
        samples = rng.beta(alpha, beta_param, size=n_samples) * mean_frac.units
        median_obs = np.median(samples)
        ci95_lower = np.percentile(samples, 2.5)
        ci95_upper = np.percentile(samples, 97.5)
        return {
            'median_obs': median_obs,
            'ci95_lower': ci95_lower,
            'ci95_upper': ci95_upper,
        }

