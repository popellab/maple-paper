  assumptions:
  - name: n_mc_samples
    value: 200000.0
    units: dimensionless
    description: |
      Number of Monte Carlo samples used to approximate the distribution of the tumor-to-normal glucose ratio from the reported group-level means and SDs for PA and PP glucose concentrations.
    rationale: |
      A sample size of 200,000 draws provides stable estimates of the median and 95% CI for the ratio distribution with Monte Carlo error well below 1% for the summary statistics used in calibration.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np

        # Literature-derived mean and SD for glucose concentration (nmol/mg)
        mean_pp = inputs['pp_glc_mean']
        sd_pp = inputs['pp_glc_sd']
        mean_pa = inputs['pa_glc_mean']
        sd_pa = inputs['pa_glc_sd']

        # Number of Monte Carlo samples (modeling assumption)
        n_samples = 200000
        rng = np.random.default_rng(123)

        # Convert mean/SD of a positive, right-skewed variable into lognormal
        # parameters for PP (normal pancreas) and PA (tumor)
        mu_pp = np.log(mean_pp.magnitude ** 2 / np.sqrt(mean_pp.magnitude ** 2 + sd_pp.magnitude ** 2))
        sigma_pp = np.sqrt(np.log(1.0 + (sd_pp.magnitude ** 2) / (mean_pp.magnitude ** 2)))

        mu_pa = np.log(mean_pa.magnitude ** 2 / np.sqrt(mean_pa.magnitude ** 2 + sd_pa.magnitude ** 2))
        sigma_pa = np.sqrt(np.log(1.0 + (sd_pa.magnitude ** 2) / (mean_pa.magnitude ** 2)))

        # Sample lognormal distributions for PP and PA glucose (nmol/mg)
        samples_pp = rng.lognormal(mu_pp, sigma_pp, n_samples) * mean_pp.units
        samples_pa = rng.lognormal(mu_pa, sigma_pa, n_samples) * mean_pa.units

        # Compute tumor-to-normal glucose ratio; units cancel to dimensionless
        ratio_samples = samples_pa / samples_pp

        median_obs = np.median(ratio_samples)
        ci95_lower = np.percentile(ratio_samples, 2.5)
        ci95_upper = np.percentile(ratio_samples, 97.5)

        return {
            'median_obs': median_obs,
            'ci95_lower': ci95_lower,
            'ci95_upper': ci95_upper,
        }

