study_interpretation: |
  Battini et al. used HR-MAS 1H NMR spectroscopy on resected pancreatic tissues to quantify absolute metabolite concentrations (nmol/mg) in pancreatic adenocarcinoma (PA) tumors and normal pancreatic parenchyma (PP). For the subgroup without neoadjuvant chemotherapy (treatment-naive at surgery), Table 2 reports mean ± SD glucose concentrations for PP (n = 9) and PA (n = 44). These measurements reflect steady-state tissue metabolism in resectable PDAC at the time of surgery. For QSP calibration, we construct a dimensionless tumor-to-normal glucose ratio by modeling PP and PA glucose as lognormal distributions fit to the reported means and SDs, then sampling their ratio. The resulting median and 95% CI constrain the relative tumor glucose level, informing the parameter k_glc_tumor that controls tumor glucose utilization in the metabolism module.

key_assumptions:
- |
  Glucose concentrations in both PP and PA (nmol/mg tissue) are modeled as lognormal distributions rather than normal, reflecting that metabolite concentrations are strictly positive and often right-skewed; this avoids negative sampled values and better matches biochemical variability.
- |
  The ± values reported in Table 2 are interpreted as standard deviations (SD), not standard errors, based on the explicit statement 'Continuous variables are expressed as mean ± standard deviation (SD).' in the Results section.
- |
  Within-patient pairing between PA and PP glucose measurements is not available; the tumor-to-normal glucose ratio distribution is therefore approximated by independently sampling from the group-level lognormal distributions for PA (n = 44) and PP (n = 9).
- |
  The algebraic variable `glc` in the metabolism module represents tumor glucose availability as a dimensionless quantity; at baseline (no consumption), glc equals glc_normal (default 5.0). To match the empirical PA/PP glucose ratio, the observable computes glc / glc_normal, which yields a dimensionless fraction of normal glucose remaining in the tumor.
- |
  The chemo-naive subgroup (PA and PP without neoadjuvant chemotherapy) is assumed to best match the model context of treatment-naive, resectable PDAC, whereas patients who received neoadjuvant chemotherapy are excluded from this calibration target.

key_study_limitations:
- |
  Normal pancreatic parenchyma (PP) samples without neoadjuvant chemotherapy were available for only 9 patients, which limits the precision of the estimated normal glucose distribution and may underrepresent inter-patient variability.
- |
  The tumor and normal tissue samples, while often collected from the same surgical specimen, are not reported as paired data with individual-level glucose values, so correlation between tumor and normal metabolism within patients cannot be captured explicitly.
- |
  HR-MAS NMR quantification depends on sample handling, normalization by tissue weight, and calibration against an external lactate standard; systematic scaling errors in nmol/mg may affect both PP and PA measurements, though these should partially cancel in the ratio.
- |
  The analyzed tissue pieces may not fully capture intra-tumoral heterogeneity or spatial gradients in glucose associated with hypoxia and perfusion differences within PDAC tumors.
- |
  The QSP model does not explicitly include systemic glucose homeostasis or a separate normal pancreas compartment, so mapping ex vivo tissue metabolite levels onto the single-compartment tumor glucose variable `glc` omits potential contributions from endocrine regulation and regional metabolic differences.

observable:
  code: |
    def compute_observable(time, species_dict, constants, ureg):
        """Tumor glucose as fraction of normal.

        glc is a repeatedAssignment algebraic variable representing tumor
        glucose availability (micromolarity). At baseline (no consumption),
        glc = glc_normal. The ratio glc/glc_normal gives the tumor-to-normal
        glucose fraction, comparable to the empirical PA/PP glucose ratio
        from Battini et al. 2017.
        """
        glc = species_dict['glc']
        glc_normal = constants['glc_normal']
        ratio = glc / glc_normal
        return ratio.to('dimensionless')
