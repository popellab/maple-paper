  assumptions:
  - name: n_mc_samples
    value: 10000.0
    units: dimensionless
    description: |
      Number of Monte Carlo samples used to approximate the sampling distribution of cDC2 density from the reported mean and SEM.
    rationale: |
      10,000 samples provide a stable estimate of the median and 95% CI for the observable.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np

        # Literature-derived inputs (Pint Quantities)
        mean = inputs['mean_cdc2_density_wta']          # cell/mm^2
        sem = inputs['sem_cdc2_density_wta']           # cell/mm^2 (SEM)
        n_patients = inputs['sample_size_cdc2']        # dimensionless
        n_samples = int(inputs['n_mc_samples'].magnitude)

        # Convert SEM to SD: SD = SEM * sqrt(n)
        sd = sem * np.sqrt(n_patients.magnitude)

        # Convert normal(mean, sd) to lognormal parameters to avoid negative densities
        mean_mag = mean.magnitude
        sd_mag = sd.magnitude
        mu_log = np.log(mean_mag**2 / np.sqrt(mean_mag**2 + sd_mag**2))
        sigma_log = np.sqrt(np.log(1.0 + (sd_mag**2 / mean_mag**2)))

        rng = np.random.default_rng(42)
        samples = rng.lognormal(mu_log, sigma_log, n_samples) * mean.units

        median_obs = np.median(samples)
        ci95_lower = np.percentile(samples, 2.5)
        ci95_upper = np.percentile(samples, 97.5)

        return {
            'median_obs': median_obs,
            'ci95_lower': ci95_lower,
            'ci95_upper': ci95_upper,
        }

