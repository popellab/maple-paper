study_interpretation: |
  Xu et al. (2017) used label-free multiphoton microscopy on fresh frozen pancreatic neck margin specimens from 8 patients undergoing pancreaticoduodenectomy for ductal adenocarcinoma in the pancreatic head. Second harmonic generation (SHG) and two-photon excited fluorescence (TPEF) signals were used to visualize collagen fibers and tissue architecture. They quantified the pixel density of collagen (D_collagen = A_collagen / A_total) in regions classified as normal pancreatic tissue versus ductal adenocarcinoma. The mean pixel density was 2.09 ± 0.26 in normal pancreas and 20.85 ± 4.50 in PDAC (n = 8 for each), indicating a roughly 10-fold increase in collagen content in tumor relative to normal tissue. We interpret D_collagen as proportional to collagen (and thus ECM) volume and mass fraction, and use the tumor-to-normal ratio as a calibration target for ECM accumulation in human PDAC. The observable maps model ECM mass (V_T.ECM) to an ECM fold-change relative to normal pancreas by dividing by the ECM mass that would be present in an equivalent tissue volume with normal pancreas collagen content, using curated reference values for normal collagen content and pancreatic tissue density.

key_assumptions:
- |
  Collagen pixel density measured by SHG/TPEF (area fraction of collagen in optical sections) is proportional to the 3D collagen volume fraction and, via approximately constant tissue density, to collagen mass fraction in tissue.
- |
  Because collagen I dominates the PDAC desmoplastic stroma, the tumor-to-normal collagen fraction is used as a proxy for total ECM protein fold-change, consistent with the model variable V_T.ECM representing total ECM mass.
- |
  The same 8 resected pancreatic neck margin specimens provide both normal and tumor measurements, so the reported group means (2.09 ± 0.26 vs 20.85 ± 4.50) are treated as paired within-patient summaries, but the Monte Carlo derivation assumes independent normal and tumor distributions due to lack of reported correlation; this slightly overestimates uncertainty in the ratio.
- |
  Reported values are interpreted as mean ± SD based on the Methods statement that all quantitative results are presented as "mean ± SD"; no SEM values are used.
- |
  Both normal and tumor collagen pixel densities are modeled as lognormally distributed positive quantities, which is appropriate for positive, right-skewed structural measurements; using a normal distribution would permit non-physical negative values, even if rare.
- |
  Pancreas tissue density (1.04 g/cm^3) from ICRU soft-tissue data is assumed to apply to both normal pancreas and PDAC tissue when converting the reference tumor volume to tissue mass; differences between normal and tumor tissue density are neglected.
- |
  The reference resectable tumor volume (10 mL) from the curated PDAC reference database is assumed representative of the tumors in the Xu et al. cohort; the ECM fold-change calibration depends only on the ratio of modeled ECM mass to the normal-pancreas expectation for this volume, not on absolute tumor volume.
- |
  We assume that neoadjuvant therapy was not systematically applied in this small cohort or that any such treatment did not dramatically alter collagen content at the pancreatic neck margin; the paper does not provide detailed neoadjuvant treatment information, so potential heterogeneity is acknowledged as a limitation.

key_study_limitations:
- |
  Small, single-center cohort (n = 8 patients), limiting generalizability and precision of the ECM fold-change estimate.
- |
  Collagen content is quantified via pixel density in 2D multiphoton images rather than direct biochemical measurement of collagen mass; while proportional, the relationship between pixel density and absolute protein concentration is not explicitly calibrated.
- |
  Normal pancreatic tissue measurements are taken from regions within resected specimens (adjacent normal tissue) rather than from truly disease-free pancreas in healthy donors, so they may partially reflect field effects or early stromal changes.
- |
  Measurements are from pancreatic neck margin tissue in tumors of the pancreatic head; ECM content in other regions of the primary tumor (body/tail, central vs peripheral areas) may differ.
- |
  Neoadjuvant therapy status, fat content, and other clinical characteristics that could affect stromal composition are mentioned as potential modifiers but not detailed for individual specimens, introducing unquantified variability.

observable:
  code: |
    def compute_observable(time, species_dict, constants, ureg):
        # ECM fold-change in PDAC tumor relative to normal pancreas, using collagen fraction as proxy
        ecm = species_dict['V_T.ECM']  # total ECM mass in tumor compartment

        tumor_vol = constants['pdac_tumor_volume_resectable']  # reference resectable PDAC tumor volume
        tissue_density = constants['pancreas_tissue_density']  # pancreas tissue density (mass/volume)
        normal_collagen = constants['normal_pancreas_collagen']  # collagen mass per unit tissue mass in normal pancreas

        # Tumor tissue mass corresponding to reference resectable tumor volume
        tumor_mass = (tumor_vol.to('centimeter**3') * tissue_density).to('gram')

        # Convert normal pancreas collagen content to a mass fraction (g collagen / g tissue)
        normal_collagen_frac = normal_collagen.to('gram/gram')

        # Expected ECM (collagen-dominated) mass in a normal pancreas volume equal to the reference tumor volume
        normal_ecm_mass = (tumor_mass * normal_collagen_frac).to('milligram')

        ecm_mass = ecm.to('milligram')

        fold_change = (ecm_mass / normal_ecm_mass).to('dimensionless')

        return fold_change
  units: dimensionless
  species:
  - V_T.ECM
  constants:
  - name: normal_pancreas_collagen
    value: 5.0
    units: microgram / milligram
    biological_basis: |
      From curated reference DB entry 'normal_pancreas_collagen': collagen content of normal human pancreas is 5 micrograms of collagen per milligram of wet tissue (5 µg/mg). Used here as collagen mass fraction in normal pancreas to compute the expected ECM mass for a tumor-sized volume of normal pancreas.
    source_type: reference_db
    reference_db_name: normal_pancreas_collagen
    reference_db_names:
    source_tag:
  - name: pdac_tumor_volume_resectable
    value: 10.0
    units: milliliter
    biological_basis: |
      From curated reference DB entry 'pdac_tumor_volume_resectable': typical primary tumor volume at surgical resection for resectable PDAC is approximately 10 mL. Used as a reference volume to map model ECM mass to a clinically relevant tumor size.
    source_type: reference_db
    reference_db_name: pdac_tumor_volume_resectable
    reference_db_names:
    source_tag:
  - name: pancreas_tissue_density
    value: 1.04
    units: gram / centimeter**3
    biological_basis: |
      Pancreas physical density reported as 1.04 g/cm^3 in ICRU soft-tissue data, as summarized in Table 1 of Noblet et al., "A new tissue segmentation method to calculate 3D dose in small animal radiation therapy" (Radiat Oncol 13:32, 2018). This density converts the reference pancreatic tumor volume into tissue mass for applying the normal pancreas collagen mass fraction.
