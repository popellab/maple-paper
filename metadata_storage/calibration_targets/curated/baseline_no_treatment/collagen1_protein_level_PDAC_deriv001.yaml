    The observable computes the ratio of modeled ECM mass in the PDAC tumor compartment (V_T.ECM) to the ECM mass that would be present if the same tissue volume had the collagen content of normal pancreas. Collagen I dominates PDAC desmoplasia, so the tumor-to-normal collagen fraction is used as a proxy for total ECM fold-change, calibrated against SHG/TPEF-measured collagen area fraction in human pancreatic head PDAC versus normal pancreas.
