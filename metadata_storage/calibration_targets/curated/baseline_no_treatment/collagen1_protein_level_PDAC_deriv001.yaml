  assumptions:
  - name: n_mc_samples
    value: 100000.0
    units: dimensionless
    description: |
      Number of Monte Carlo samples used to propagate uncertainty from normal and tumor collagen pixel densities into the fold-change distribution.
    rationale: |
      100,000 samples provide stable estimates of the median and 95% confidence interval for the tumor-to-normal collagen ratio while keeping computation tractable.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np

        rng = np.random.default_rng(42)

        mean_norm = inputs['d_collagen_normal_mean']
        sd_norm = inputs['d_collagen_normal_sd']
        mean_tum = inputs['d_collagen_tumor_mean']
        sd_tum = inputs['d_collagen_tumor_sd']

        def lognormal_params(mean_q, sd_q):
            mean = mean_q.magnitude
            sd = sd_q.magnitude
            variance = sd ** 2
            sigma2 = np.log(1.0 + variance / (mean ** 2))
            sigma = np.sqrt(sigma2)
            mu = np.log(mean) - sigma2 / 2.0
            return mu, sigma

        mu_n, sigma_n = lognormal_params(mean_norm, sd_norm)
        mu_t, sigma_t = lognormal_params(mean_tum, sd_tum)

        n_samples = int(inputs['n_mc_samples'].magnitude)

        samples_normal = rng.lognormal(mu_n, sigma_n, n_samples) * mean_norm.units
        samples_tumor = rng.lognormal(mu_t, sigma_t, n_samples) * mean_tum.units

        ratio_samples = samples_tumor / samples_normal

        median_obs = np.median(ratio_samples)
        ci95_lower = np.percentile(ratio_samples, 2.5)
        ci95_upper = np.percentile(ratio_samples, 97.5)

        return {
            'median_obs': median_obs,
            'ci95_lower': ci95_lower,
            'ci95_upper': ci95_upper,
        }

