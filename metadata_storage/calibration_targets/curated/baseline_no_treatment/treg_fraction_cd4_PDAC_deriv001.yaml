study_interpretation: |
  From Sivagnanam et al. Table S5, Treg density (14 cells/mm^2) divided by total CD4+ T cells (Treg + Th0 + Th1 + Th2 + Th17 ≈ 102 cells/mm^2) gives a Treg fraction of ~14% of CD4+ T cells.
key_assumptions:
- |
  Treg + all Th subtypes = total CD4+ T cells in the tumor. No other CD4+ populations exist.
- All densities sampled independently from lognormal distributions.
key_study_limitations:
- Independent sampling of 5 densities widens the CI of the derived fraction.
observable:
  code: |
    def compute_observable(time, species_dict, constants, ureg):
        treg = species_dict['V_T.Treg']
        th = species_dict['V_T.Th']
        th_exh = species_dict['V_T.Th_exh']
        fraction = (treg / (treg + th + th_exh)).to('dimensionless')
        return fraction
  units: dimensionless
  species:
  - V_T.Treg
  - V_T.Th
  - V_T.Th_exh
  constants: []
  inputs: []
  support: unit_interval
  mapping_rationale: Treg / total CD4+ maps to V_T.Treg / (V_T.Treg + V_T.Th + V_T.Th_exh).
  experimental_denominator: Total CD4+ T cell density (Treg + all Th subtypes)
  model_denominator_species:
