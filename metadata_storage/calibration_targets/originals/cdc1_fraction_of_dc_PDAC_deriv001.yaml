  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    import math\n\n    # Extract Pint\
    \ Quantities from inputs\n    mean_cdc1 = inputs['mean_cdc1_wta']\n    sem_cdc1 = inputs['sem_cdc1_wta']\n    mean_cdc2\
    \ = inputs['mean_cdc2_wta']\n    sem_cdc2 = inputs['sem_cdc2_wta']\n    n_pat = int(inputs['n_patients_cdc_mihc'].magnitude)\n\
    \n    # Convert SEM to SD using SD = SEM * sqrt(n)\n    sd_cdc1 = sem_cdc1 * math.sqrt(n_pat)\n    sd_cdc2 = sem_cdc2\
    \ * math.sqrt(n_pat)\n\n    # Helper to compute lognormal parameters (mu, sigma) from mean and SD of the\n    # underlying\
    \ positive-valued variable.\n    def lognormal_params(mean_q, sd_q):\n        mean = mean_q.magnitude\n        sd = sd_q.magnitude\n\
    \        mu = math.log(mean ** 2 / math.sqrt(sd ** 2 + mean ** 2))\n        sigma = math.sqrt(math.log(1.0 + (sd ** 2)\
    \ / (mean ** 2)))\n        return mu, sigma\n\n    mu1, sigma1 = lognormal_params(mean_cdc1, sd_cdc1)\n    mu2, sigma2\
    \ = lognormal_params(mean_cdc2, sd_cdc2)\n\n    rng = np.random.default_rng(42)\n    n_mc_samples = 100000\n\n    # Sampling\
    \ strips units; sample in floats and then reattach units\n    cdc1_samples = rng.lognormal(mu1, sigma1, n_mc_samples)\
    \ * mean_cdc1.units\n    cdc2_samples = rng.lognormal(mu2, sigma2, n_mc_samples) * mean_cdc2.units\n\n    # Fraction of\
    \ cDC1 among conventional DCs (cDC1 + cDC2), dimensionless\n    total_cdc = cdc1_samples + cdc2_samples\n    frac_cdc1\
    \ = cdc1_samples / total_cdc\n\n    median_obs = np.median(frac_cdc1)\n    ci95_lower = np.percentile(frac_cdc1, 2.5)\n\
    \    ci95_upper = np.percentile(frac_cdc1, 97.5)\n\n    return {\n        'median_obs': median_obs.to('dimensionless'),\n\
    \        'ci95_lower': ci95_lower.to('dimensionless'),\n        'ci95_upper': ci95_upper.to('dimensionless'),\n    }"
