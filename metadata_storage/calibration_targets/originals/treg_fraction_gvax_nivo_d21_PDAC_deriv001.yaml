key_assumptions:
- The visually estimated Treg mean (0.08) and SD (0.04) from Figure 2A reasonably approximate the true values; uncertainty
  from manual figure reading is smaller than biological between-patient variability.
- Percentages reported as 'density of immune cell subtypes' in Figure 2A represent fractions of all nucleated cells in the
  mIHC regions of interest within intratumoral lymphoid aggregates, and these fractions are treated as dimensionless values
  on [0,1].
- The fraction of FoxP3+ Tregs among all T cells in the tumor compartment is adequately approximated for calibration purposes
  by the fraction of FoxP3+ Tregs among all cells in LAs measured by mIHC, recognizing that non-T cells (tumor and stromal
  cells) contribute to the denominator in the experimental measurement but are not explicitly modeled.
- A beta distribution is an appropriate approximation for the sampling distribution of a bounded fraction (Treg proportion),
  using parameters inferred from the mean and SD extracted from the figure.
key_study_limitations:
- Treg fractions and other immune cell densities are estimated from figure panels rather than numeric tables, introducing
  additional measurement uncertainty beyond the reported SDs.
- The mIHC regions of interest focus on intratumoral lymphoid aggregates and may not capture the full spatial heterogeneity
  of Tregs across the entire primary tumor mass.
- The clinical trial sample size is small (n=10 for arm B with evaluable LAs in Figure 2A), so estimates of between-patient
  variability for Treg fractions are imprecise.
observable:
  aggregation: null
  code: "def compute_observable(time, species_dict, constants, ureg):\n    treg = species_dict['V_T.Treg']\n    cd8 = species_dict['V_T.CD8']\n\
    \    th = species_dict['V_T.Th']\n    cd8_exh = species_dict['V_T.CD8_exh']\n    th_exh = species_dict['V_T.Th_exh']\n\
    \n    total_t = treg + cd8 + th + cd8_exh + th_exh\n    frac = (treg / total_t).to('dimensionless')\n    return frac\n"
  constants: []
  inputs: []
  mapping_rationale: Multiplex IHC in Li et al. (Cancer Cell 2022) quantifies FoxP3+ CD4+ Tregs as a percentage of all cells
    in regions of interest within intratumoral lymphoid aggregates (LAs) after neoadjuvant GVAX or GVAX + nivolumab. The model
    tracks separate tumor-infiltrating T cell subsets (Tregs, CD4+ Th, CD8+ effectors, and their exhausted counterparts) in
    the tumor compartment. We map the experimental measurement to the model as the fraction of Tregs among all tumor-infiltrating
    T cells in the tumor compartment, i.e., V_T.Treg divided by the sum of V_T.Treg, V_T.Th, V_T.Th_exh, V_T.CD8, and V_T.CD8_exh.
  species:
  - V_T.Treg
  - V_T.CD8
  - V_T.Th
  - V_T.CD8_exh
  - V_T.Th_exh
  support: unit_interval
  units: dimensionless
