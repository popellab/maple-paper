scenario:
  description: Resectable PDAC patients randomized to neoadjuvant GVAX alone (arm A) or GVAX plus nivolumab (arm B) followed
    by surgical resection approximately 2 weeks after one treatment; multiplex IHC performed on post-treatment resection specimens
    to quantify immune cell subsets in tumor lymphoid aggregates (LAs) and non-LA tumor areas.
  interventions:
  - intervention_description: '[Scrubbed due to ''secret'']'
secondary_data_sources: []
source_relevance: null
study_interpretation: Li et al. (Cancer Cell 2022) performed multi-omic profiling of tumor specimens from a platform trial
  in resectable PDAC in which patients received neoadjuvant GVAX alone (arm A) or GVAX plus nivolumab (arm B) followed by
  surgical resection. Multiplex IHC was used to quantify CD4+ and CD8+ T cell subsets, including FoxP3+ regulatory T cells
  (Tregs), in intratumoral tertiary lymphoid aggregate (LA) regions and non-LA tumor areas. Figure 2A reports post-treatment
  densities (percentage of all cells in the region of interest) of multiple immune cell subtypes in LAs for arm A and arm
  B. We extract the mean and standard deviation of the fraction of FoxP3+ Tregs among all cells in post-treatment LAs in arm
  B as a proxy for the regulatory T cell fraction in the tumor after neoadjuvant GVAX + nivolumab.
