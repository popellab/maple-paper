empirical_data:
  assumptions:
  - description: Number of Monte Carlo samples used to approximate the sampling distribution of the Treg fraction.
    name: n_mc_samples
    rationale: 10,000 beta-distribution draws provide stable estimates of the median and 95% credible interval while keeping
      computation inexpensive.
    units: dimensionless
    value: 10000.0
  ci95:
  - - 0.02092
    - 0.17456
  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    rng = np.random.default_rng(42)\n\
    \n    mean = inputs['treg_fraction_mean']  # dimensionless fraction\n    sd = inputs['treg_fraction_sd']      # dimensionless\
    \ fraction\n    n_mc = int(inputs['n_mc_samples'].magnitude)\n\n    m = mean.magnitude\n    s = sd.magnitude\n    var\
    \ = s ** 2\n\n    # Convert mean and variance on [0,1] to beta distribution parameters\n    # mean = a / (a + b); var\
    \ = a*b / ((a + b)**2 * (a + b + 1))\n    k = m * (1.0 - m) / var - 1.0\n    alpha = m * k\n    beta = (1.0 - m) * k\n\
    \n    samples = rng.beta(alpha, beta, n_mc) * mean.units\n\n    median_obs = np.median(samples)\n    ci95_lower = np.percentile(samples,\
    \ 2.5)\n    ci95_upper = np.percentile(samples, 97.5)\n\n    return {\n        'median_obs': median_obs,\n        'ci95_lower':\
    \ ci95_lower,\n        'ci95_upper': ci95_upper,\n    }\n"
