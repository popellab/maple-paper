  title: Neoadjuvant chemotherapy is associated with altered immune cell infiltration and an anti-tumorigenic microenvironment
    in resected pancreatic cancer
  year: 2022
scenario:
  description: Baseline tumor immune microenvironment in primary, resectable PDAC at the time of up-front surgical resection,
    prior to any neoadjuvant systemic therapy.
  interventions:
  - intervention_description: No neoadjuvant chemotherapy or radiotherapy prior to tumor resection (up-front surgery). Resection
      of primary pancreatic ductal adenocarcinoma was the initial definitive treatment, and immune cell densities were measured
      on the resected specimen.
secondary_data_sources: []
source_relevance: null
study_interpretation: Costa et al. (Clin Cancer Res 2022) used multiplex immunofluorescence panels including CD68, CD163,
  IRF5, CD86, and CD206 to classify tumor-associated macrophages along an M1–M2 polarization spectrum in primary PDAC. In
  a comparative cohort of up-front surgery (treatment-naive) and FOLFIRINOX-treated patients, they quantified immune cell
  densities per square millimeter separately in tumor epithelium and stroma. Table 2 reports stromal macrophage densities
  as medians with interquartile ranges in cells/mm^2 for M1- and M2-polarized macrophages in the up-front surgery group (n=30).
  Because macrophages in PDAC are predominantly stromal and both M1 and M2 densities are measured per unit stromal area in
  the same tumors, the stromal M1/M2 density ratio is interpreted as a good proxy for the overall intratumoral ratio of M1
  to M2 macrophage numbers. We therefore use this stromal M1/M2 ratio to calibrate the model observable V_T.Mac_M1 / V_T.Mac_M2
  at the time of surgical resection in resectable, treatment-naive human PDAC.
