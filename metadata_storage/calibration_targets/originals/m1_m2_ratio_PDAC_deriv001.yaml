empirical_data:
  assumptions:
  - description: Number of Monte Carlo samples used to propagate uncertainty from M1 and M2 stromal densities to the M1/M2
      ratio.
    name: n_mc_samples
    rationale: 100,000 samples provide stable estimates of the median and 95% interval (<1% Monte Carlo error) for the ratio
      distribution.
    units: dimensionless
    value: 100000.0
  ci95:
  - - 0.0712913078823203
    - 3.72190991880916
  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n\n    # Extract inputs as Pint Quantities\n\
    \    M1_med = inputs['M1_stromal_median']\n    M1_q1 = inputs['M1_stromal_q1']\n    M1_q3 = inputs['M1_stromal_q3']\n\
    \    M2_med = inputs['M2_stromal_median']\n    M2_q1 = inputs['M2_stromal_q1']\n    M2_q3 = inputs['M2_stromal_q3']\n\
    \    n_samples = int(inputs['n_mc_samples'].magnitude)\n\n    # z-score for first and third quartiles of a standard normal\n\
    \    z_q = 0.67448975\n\n    def lognormal_params(median_q, q1_q, q3_q):\n        \"\"\"Derive lognormal mu, sigma from\
    \ median and IQR (all Pint).\"\"\"\n        m = median_q.magnitude\n        q1 = q1_q.magnitude\n        q3 = q3_q.magnitude\n\
    \        sigma = np.log(q3 / q1) / (2.0 * z_q)\n        mu = np.log(m)\n        return mu, sigma\n\n    # Derive lognormal\
    \ parameters for M1 and M2 stromal densities\n    mu_M1, sigma_M1 = lognormal_params(M1_med, M1_q1, M1_q3)\n    mu_M2,\
    \ sigma_M2 = lognormal_params(M2_med, M2_q1, M2_q3)\n\n    rng = np.random.default_rng(42)\n\n    # Sample from lognormal\
    \ distributions and immediately reattach units\n    M1_samples = rng.lognormal(mu_M1, sigma_M1, n_samples) * M1_med.units\n\
    \    M2_samples = rng.lognormal(mu_M2, sigma_M2, n_samples) * M2_med.units\n\n    # Compute M1/M2 ratio; units cancel\
    \ to dimensionless\n    ratio_samples = (M1_samples / M2_samples).to('dimensionless')\n\n    median_obs = np.median(ratio_samples)\n\
    \    ci95_lower = np.percentile(ratio_samples, 2.5)\n    ci95_upper = np.percentile(ratio_samples, 97.5)\n\n    return\
    \ {\n        'median_obs': median_obs,\n        'ci95_lower': ci95_lower,\n        'ci95_upper': ci95_upper,\n    }"
