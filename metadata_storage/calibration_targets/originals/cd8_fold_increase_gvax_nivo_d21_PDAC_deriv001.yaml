scenario:
  description: Neoadjuvant GVAX plus nivolumab immunotherapy in patients with resectable PDAC, with paired pre-treatment biopsy
    and post-treatment resection specimens analyzed by multiplex immunohistochemistry to quantify intratumoral immune cell
    subsets in non-lymphoid aggregate (non-LA) tumor areas.
  interventions:
  - intervention_description: Baseline endoscopic core biopsy of the primary PDAC tumor obtained before initiation of neoadjuvant
      immunotherapy; tissue processed as formalin-fixed, paraffin-embedded (FFPE) blocks for multiplex immunohistochemistry.
  - intervention_description: '[Scrubbed due to ''secret'']'
  - intervention_description: Surgical resection of the primary PDAC tumor approximately 2 weeks after the neoadjuvant GVAX
      + nivolumab treatment, with multiple ROIs selected from FFPE sections of the resected tumor for multiplex immunohistochemistry
      analysis of immune cell subsets in LA and non-LA tumor areas.
secondary_data_sources: []
source_relevance: null
study_interpretation: This calibration target is based on a neoadjuvant platform trial in which patients with resectable pancreatic
  ductal adenocarcinoma (PDAC) received GVAX vaccine alone (arm A) or GVAX plus nivolumab (arm B) prior to surgery. The paper
  prospectively collected paired pre-treatment core biopsies and post-treatment surgical resection specimens from 19 patients
  whose tumors were suitable for multiplex immunohistochemistry (mIHC). In Figures 1F and 1G, the authors quantified the densities
  of multiple immune cell subsets in non-lymphoid aggregate (non-LA) tumor areas before and after treatment for each patient,
  expressing density as the percentage of all nucleated cells within annotated ROIs. For arm B (GVAX + nivolumab, n = 10),
  CD8+ T cell density in non-LA tumor areas increased substantially between baseline biopsy and post-treatment resection.
  We interpret this as a treatment-induced fold-increase in intratumoral CD8+ T cell density over approximately 2 weeks of
  neoadjuvant therapy. To align with the QSP model, we map the experimental percentage-based densities to a dimensionless
  fold-change in the total number of CD8+ T cells in the primary tumor compartment from baseline (pre-immunotherapy) to day
  21 (approximate time of resection), using CD8(t)/CD8(t0) as the model observable. The magnitude and uncertainty of this
  fold-change are derived from approximate mean ± SD values for pre- and post-treatment CD8+ T cell fractions read from Figure
  1G and propagated via a lognormal Monte Carlo model.
