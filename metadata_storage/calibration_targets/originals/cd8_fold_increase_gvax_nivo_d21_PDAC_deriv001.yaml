empirical_data:
  assumptions:
  - description: Number of Monte Carlo samples used in the parametric bootstrap to propagate uncertainty from mean ± SD estimates
      of CD8+ T cell fractions to the distribution of the fold-change observable.
    name: n_mc_samples
    rationale: 200,000 samples provide stable estimates of the median and 95% uncertainty bounds for the fold-change distribution
      while keeping computation feasible.
    units: dimensionless
    value: 200000.0
  - description: Indicator flag that CD8+ T cell fractions (pre- and post-treatment) are modeled with lognormal, rather than
      normal, distributions when sampling across patients.
    name: lognormal_cd8_density_distribution
    rationale: Immune cell fractions are positive and right-skewed; modeling them as lognormal avoids negative values and
      better reflects multiplicative biological variability.
    units: dimensionless
    value: 1.0
  - description: Assumes independence between pre- and post-treatment CD8+ T cell fractions when sampling paired values for
      the fold-change calculation.
    name: ignore_pre_post_correlation
    rationale: The paper provides group-level means and SDs but not the covariance between pre- and post-treatment CD8+ T
      cell fractions. Without access to patient-level data, we conservatively treat pre- and post-treatment measurements as
      independent when generating Monte Carlo samples, acknowledging that this likely overestimates the variance of the fold-change.
    units: dimensionless
    value: 0.0
  ci95:
  - - 1.4
    - 6.55
  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    import math\n\n    rng = np.random.default_rng(42)\n\
    \n    pre_mean = inputs['cd8_pre_mean']  # fraction of all cells (dimensionless)\n    pre_sd = inputs['cd8_pre_sd']\n\
    \    post_mean = inputs['cd8_post_mean']\n    post_sd = inputs['cd8_post_sd']\n\n    n_mc_samples = 200000  # Monte Carlo\
    \ sample size\n\n    def sample_lognormal(mean_q, sd_q):\n        \"\"\"Sample a lognormal distribution whose mean and\
    \ SD match mean_q and sd_q.\n\n        mean_q and sd_q are Pint Quantities with the same (dimensionless) units.\n    \
    \    \"\"\"\n        m = float(mean_q.magnitude)\n        s = float(sd_q.magnitude)\n        # Avoid division by zero\
    \ or negative values\n        if m <= 0.0:\n            raise ValueError('Mean for lognormal sampling must be positive.')\n\
    \        if s <= 0.0:\n            # Degenerate case: no variability\n            samples = np.full(n_mc_samples, m) *\
    \ mean_q.units\n            return samples\n        sigma2 = math.log(1.0 + (s ** 2) / (m ** 2))\n        sigma = math.sqrt(sigma2)\n\
    \        mu = math.log(m) - 0.5 * sigma2\n        raw_samples = rng.lognormal(mu, sigma, n_mc_samples)\n        samples\
    \ = raw_samples * mean_q.units\n        return samples\n\n    pre_samples = sample_lognormal(pre_mean, pre_sd)\n    post_samples\
    \ = sample_lognormal(post_mean, post_sd)\n\n    # Fold-change in CD8+ T cell fraction (post / pre) per virtual patient\n\
    \    fold_samples = (post_samples / pre_samples).to('dimensionless')\n\n    median_obs = np.median(fold_samples)\n   \
    \ ci95_lower = np.percentile(fold_samples, 2.5)\n    ci95_upper = np.percentile(fold_samples, 97.5)\n\n    return {\n\
    \        'median_obs': median_obs,\n        'ci95_lower': ci95_lower,\n        'ci95_upper': ci95_upper,\n    }"
