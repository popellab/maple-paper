key_assumptions:
- Intratumoral CD8+ T cell "density" measured in the paper is calculated as the percentage of all nucleated cells within multiplex
  IHC ROIs in non-LA tumor areas. We assume this percentage is proportional to the true volumetric CD8+ T cell density in
  the primary tumor and that proportionality constants (e.g., section thickness, tumor cellularity) cancel when computing
  the pre/post fold-change.
- Approximate numerical values for baseline and post-treatment CD8+ T cell fractions in arm B (0.05 ± 0.015 and 0.15 ± 0.04,
  respectively, as fractions of all cells) are obtained by manual visual estimation from Figure 1G rather than from tabulated
  data. We assume these approximations are sufficiently accurate for calibration of the fold-change magnitude but acknowledge
  potential systematic error of order ~10–20%.
- CD8+ T cell fractions across patients at each timepoint are modeled as lognormal random variables to reflect positive, right-skewed
  biological variability and to avoid non-physical negative densities. This choice may slightly overestimate the contribution
  of high-density outliers to the fold-change distribution compared with a true, unknown underlying distribution.
- The Monte Carlo procedure treats pre- and post-treatment CD8+ T cell fractions as independent across patients when computing
  the distribution of post/pre fold-change because the paper reports only group-level means and SDs and not the covariance
  structure of paired measurements. This likely overestimates the variance of the fold-change observable by neglecting within-patient
  correlation but preserves the central tendency implied by the reported means.
- We approximate the time between baseline biopsy and post-treatment resection as 21 days (2 weeks after one neoadjuvant treatment
  cycle) for mapping to the QSP model timeline, consistent with the text stating that surgical resection occurred 2 weeks
  after one treatment; this is close to the requested day 21 calibration time point.
key_study_limitations:
- CD8+ T cell densities are reported as percentages of all nucleated cells in ROIs rather than as absolute cells per unit
  area or volume; while appropriate for a fold-change observable, this limits direct comparison to absolute density predictions
  and assumes that total cell density and ROI sampling are comparable between baseline biopsies and post-treatment resections.
- Pre-treatment biopsies and post-treatment resections sample different spatial regions of the same primary tumor (endoscopic
  core biopsy versus surgical specimen). Spatial heterogeneity in immune infiltration could introduce additional variability
  in the apparent fold-change that is not explicitly modeled here.
- The sample size for arm B is small (n = 10) and the CD8+ T cell density values are extracted manually from Figure 1G rather
  than from a numeric table, introducing uncertainty in the exact mean and SD estimates used for calibration.
- Pre-treatment biopsy specimens did not contain lymphoid aggregates (LAs), so pre/post comparisons are limited to non-LA
  tumor areas; the calibrated fold-change therefore reflects changes in CD8+ T cells in non-LA tumor regions only and may
  underestimate or overestimate whole-tumor average changes if LAs contribute substantially to overall CD8+ T cell burden.
- The article does not provide exact dosing (mg/kg) and scheduling details for GVAX and nivolumab within this specific arm,
  relying instead on reference to the clinical trial (NCT02451982). As a result, the pharmacokinetic exposure underlying the
  observed fold-change is not fully specified within this source and must be approximated from external protocol information
  if needed for mechanistic PK/PD modeling.
observable:
  aggregation: null
  code: "def compute_observable(time, species_dict, constants, ureg):\n    \"\"\"Compute fold-change in intratumoral CD8+\
    \ T cell count relative to baseline.\n\n    The observable is defined as CD8_T(t) / CD8_T(t0), where CD8_T is the\n  \
    \  total number of CD8+ T cells in the primary tumor compartment (V_T.CD8).\n\n    This provides a dimensionless fold-change\
    \ trajectory over time. The\n    calibration target uses the value at day 21 post-treatment.\n    \"\"\"\n    import numpy\
    \ as np\n\n    cd8 = species_dict['V_T.CD8']  # Quantity array with units of 'cell'\n\n    # Use a small epsilon to avoid\
    \ numerical division-by-zero if the\n    # baseline CD8+ T cell count is extremely small in a simulated patient.\n   \
    \ baseline = cd8[0]\n    eps = 1e-12 * baseline.units\n    effective_baseline = baseline + eps\n\n    fold_change = cd8\
    \ / effective_baseline\n    return fold_change.to('dimensionless')\n"
  constants: []
  inputs: []
  mapping_rationale: The paper quantifies CD8+ T cell "density" in non-LA tumor areas as the percentage of all nucleated cells
    within multiplex IHC regions of interest (ROIs). For the QSP model, we map this to the fold-change in the absolute number
    of CD8+ T cells in the primary tumor compartment (V_T.CD8) relative to the baseline value prior to treatment. Because
    both the experimental quantity and the model quantity are proportional to the underlying CD8+ T cell density in the tumor
    (up to a constant factor that cancels in the ratio), using CD8(t)/CD8(t0) provides a consistent dimensionless fold-change
    observable that reflects treatment-induced changes in intratumoral CD8+ T cell infiltration.
  species:
  - V_T.CD8
  support: positive_unbounded
  units: dimensionless
