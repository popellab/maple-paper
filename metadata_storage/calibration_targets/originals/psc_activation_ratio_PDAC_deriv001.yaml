empirical_data:
  assumptions:
  - description: Prior coefficient of variation for stromal α-SMA-positive area fraction in tumor core when only a mean value
      is reported.
    name: alpha_sma_core_cv_prior
    rationale: Drifka et al. 2016 provide point estimates (e.g., 0.572 in tumor core) but no dispersion. We assume a moderate
      CV≈0.2, consistent with variability seen for other stromal marker quantifications in PDAC, to avoid an unrealistically
      narrow calibration target.
    units: dimensionless
    value: 0.2
  - description: Monte Carlo sample size for parametric bootstrap used to derive empirical median and 95% CI.
    name: n_mc_samples_internal
    rationale: 100000 samples provide stable percentile estimates (<1% Monte Carlo error on median) while keeping computation
      inexpensive.
    units: dimensionless
    value: 100000.0
  ci95:
  - - 0.34461198
    - 0.78594315
  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    mean_q = inputs['alpha_sma_core_mean']\n\
    \    cv_q = inputs['alpha_sma_core_cv']\n    n_mc_q = inputs['n_mc_samples']\n    # Convert to dimensionless scalars\n\
    \    m = mean_q.to('dimensionless').magnitude\n    cv = cv_q.to('dimensionless').magnitude\n    n_mc = int(n_mc_q.to('dimensionless').magnitude)\n\
    \    # Compute Beta distribution parameters from mean and coefficient of variation\n    var = (cv * m)**2\n    phi = m\
    \ * (1.0 - m) / var - 1.0\n    a = m * phi\n    b = (1.0 - m) * phi\n    rng = np.random.default_rng(42)\n    samples\
    \ = rng.beta(a, b, n_mc) * ureg.dimensionless\n    median_obs = np.median(samples)\n    ci95_lower = np.percentile(samples,\
    \ 2.5)\n    ci95_upper = np.percentile(samples, 97.5)\n    return {\n        'median_obs': median_obs,\n        'ci95_lower':\
    \ ci95_lower,\n        'ci95_upper': ci95_upper,\n    }"
