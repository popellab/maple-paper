study_interpretation: Drifka et al. analyzed 114 human PDAC resection specimens (no neoadjuvant therapy) using a tissue microarray.
  For each patient, multiple pathology-confirmed regions of interest in the tumor core and infiltrating edge were cored, and
  adjacent sections were stained for collagen (via SHG imaging) and for α-SMA and syndecan-1 by immunohistochemistry. Stromal
  α-SMA positivity was quantified by color deconvolution as DAB pixels divided by total (DAB + hematoxylin) pixels in each
  stromal region. They report that periductal α-SMA expression in PDAC-associated stroma is substantially higher than in normal
  stroma, with mean stromal α-SMA fractions of 0.572 in tumor core regions versus 0.503 at the tumor edge, and 0.599 versus
  0.499 in low- versus high-grade tumors. This α-SMA-positive area fraction is interpreted as a quantitative measure of activated
  myofibroblastic CAF density in the tumor microenvironment. The present calibration target uses the mean stromal α-SMA fraction
  in tumor core regions (0.572) as a representative baseline for treatment-naive, resectable human PDAC, and maps it to the
  model as the fraction of tumor-compartment cells that are activated CAFs (V_T.iCAF + V_T.myCAF) relative to all modeled
  tumor and stromal/immune cells, scaled by the PDAC cellularity fraction.
