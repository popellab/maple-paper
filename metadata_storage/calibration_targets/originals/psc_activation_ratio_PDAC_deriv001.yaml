key_assumptions:
- α-SMA-positive stromal area in PDAC periductal regions primarily reflects activated CAF populations (myCAFs and iCAFs),
  with negligible contribution from quiescent PSCs or apCAFs; we therefore map α-SMA positivity to V_T.iCAF + V_T.myCAF in
  the model.
- The PDAC cellularity fraction (0.25) from the reference database is assumed to apply to the Drifka et al. cohort, allowing
  us to relate modeled cell counts to total tumor tissue area when computing an area fraction.
- Total modeled cell counts in the tumor compartment (cancer cells, CAFs, T cells, macrophages, MDSCs, NK cells, and DCs)
  are assumed to approximate the cellular component of the periductal ROIs used for image analysis, despite the presence of
  additional unmodeled cell types (endothelial cells, pericytes, B cells, etc.).
- Drifka et al. report only point estimates (e.g., 0.572 for tumor core stromal α-SMA fraction) without dispersion metrics,
  so we approximate inter-sample variability by assuming a moderate coefficient of variation (CV ≈ 0.2) and modeling the distribution
  as Beta-distributed on [0,1].
- We treat the 356 PDAC tissue cores as independent replicates for estimating the distribution of stromal α-SMA positivity,
  even though multiple cores originate from the same patient; this likely underestimates patient-level variability but is
  acceptable for a first-pass calibration target.
key_study_limitations:
- Measurements are derived from a single-center retrospective tissue microarray with selected inclusion criteria (curative-intent
  surgery, no neoadjuvant therapy, inclusion of long-term survivors), which may limit generalizability to all resectable PDAC.
- Stromal α-SMA positivity is quantified on periductal regions of 1 mm tissue cores rather than whole-tumor sections; spatial
  heterogeneity beyond core locations is not captured.
- Multiple cores per patient are analyzed, but core-level measurements are not explicitly aggregated to per-patient statistics
  for α-SMA; treating all 356 cores as independent replicates may underestimate between-patient variance.
- Only central values (e.g., 0.572 in tumor core) are reported for α-SMA fractions; dispersion (SD/SEM/IQR) must be approximated,
  making the uncertainty on this calibration target more assumption-driven than data-driven.
- The experimental denominator includes all stromal and epithelial cells in the ROI, whereas the model denominator includes
  only explicitly modeled cell types; unmodeled components (endothelial cells, B cells, etc.) introduce systematic but likely
  modest bias in the mapping.
observable:
  aggregation: null
  code: "def compute_observable(time, species_dict, constants, ureg):\n    iCAF = species_dict['V_T.iCAF']\n    myCAF = species_dict['V_T.myCAF']\n\
    \    total_cells = (\n        species_dict['V_T.C1']\n        + species_dict['V_T.iCAF']\n        + species_dict['V_T.myCAF']\n\
    \        + species_dict['V_T.apCAF']\n        + species_dict['V_T.qPSC']\n        + species_dict['V_T.CD8']\n        +\
    \ species_dict['V_T.CD8_exh']\n        + species_dict['V_T.Th']\n        + species_dict['V_T.Th_exh']\n        + species_dict['V_T.Treg']\n\
    \        + species_dict['V_T.Mac_M1']\n        + species_dict['V_T.Mac_M2']\n        + species_dict['V_T.MDSC']\n    \
    \    + species_dict['V_T.NK']\n        + species_dict['V_T.cDC1']\n        + species_dict['V_T.cDC2']\n        + species_dict['V_T.mcDC1']\n\
    \        + species_dict['V_T.mcDC2']\n    )\n    cellularity_frac = constants['pdac_cellularity_fraction']\n    frac_area\
    \ = cellularity_frac * (iCAF + myCAF) / total_cells\n    return frac_area.to('dimensionless')"
  constants:
  - biological_basis: PDAC tumors are highly desmoplastic with approximately 25% cellular volume fraction and 75% acellular
      stroma. The reference value pdac_cellularity_fraction summarizes this consensus and is used here to convert modeled
      cell counts to total tumor tissue area.
    name: pdac_cellularity_fraction
    reference_db_name: pdac_cellularity_fraction
    reference_db_names: null
    source_tag: null
    source_type: reference_db
    units: dimensionless
    value: 0.25
  experimental_denominator: All cells within pathology-confirmed periductal tumor regions of interest (tumor epithelium plus
    stromal and immune cells) in resected PDAC tissue cores, quantified as total tissue area (hematoxylin + DAB pixels).
  inputs: []
  mapping_rationale: Drifka et al. quantify stromal activation as the fraction of periductal tumor tissue area positive for
    α-SMA (DAB pixels/(DAB+hematoxylin pixels)). In the model, α-SMA positivity arises from activated CAF populations (iCAF
    and myCAF). We approximate the α-SMA-positive area fraction as the fraction of all modeled cells in the tumor compartment
    that are iCAFs or myCAFs, scaled by the PDAC cellularity fraction to map cell counts to tissue area. This provides a dimensionless
    fraction comparable to the reported percent positivity.
