scenario:
  description: Baseline primary PDAC tumors at time of surgical resection without prior neoadjuvant therapy; stromal α-SMA
    positivity quantified on tissue microarray cores.
  interventions:
  - intervention_description: Curative-intent pancreatic resection (pancreaticoduodenectomy, distal pancreatectomy, or total
      pancreatectomy) performed without prior neoadjuvant chemotherapy or radiotherapy; tumor tissue was fixed, embedded,
      and sampled into 1 mm cores for tissue microarray construction, after which α-SMA immunohistochemistry and image analysis
      were performed.
