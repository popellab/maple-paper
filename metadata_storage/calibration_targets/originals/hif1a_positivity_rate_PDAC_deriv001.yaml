empirical_data:
  assumptions:
  - description: Number of Monte Carlo samples used to approximate the sampling distribution of the true HIF-1alpha positivity
      proportion in PDAC.
    name: n_mc_samples
    rationale: 10,000 samples provide stable estimates of the median and 95% credible interval of the positivity proportion
      while keeping computation inexpensive.
    units: dimensionless
    value: 10000.0
  ci95:
  - - 0.5787117406511141
    - 0.8092905011304343
  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    rng = np.random.default_rng(42)\n\
    \n    # Inputs are counts from Sun et al. (2007)\n    n_pos = inputs['n_positive_pdac']  # dimensionless Quantity\n  \
    \  n_tot = inputs['n_total_pdac']     # dimensionless Quantity\n    n_mc = int(inputs['n_mc_samples'].magnitude)\n\n \
    \   # Conjugate Beta posterior for a binomial proportion with uniform prior\n    a = n_pos.magnitude + 1.0\n    b = (n_tot\
    \ - n_pos).magnitude + 1.0\n\n    samples = rng.beta(a, b, n_mc) * ureg('dimensionless')\n\n    median_obs = np.median(samples)\n\
    \    ci95_lower = np.percentile(samples, 2.5)\n    ci95_upper = np.percentile(samples, 97.5)\n\n    return {\n       \
    \ 'median_obs': median_obs,\n        'ci95_lower': ci95_lower,\n        'ci95_upper': ci95_upper,\n    }"
