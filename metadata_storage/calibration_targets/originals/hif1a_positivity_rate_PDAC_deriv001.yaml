source_relevance: null
study_interpretation: Sun et al. (Int J Oncol 2007) quantified hypoxia-inducible factor-1alpha (HIF-1alpha) protein expression
  by immunohistochemistry in 58 patients with pancreatic ductal adenocarcinoma who underwent radical pancreatic surgery without
  preoperative chemo- or radiotherapy, and in 20 samples of normal pancreas from non-cancer operations. HIF-1alpha staining
  was evaluated semi-quantitatively using a weighted score combining the fraction of positive tumor cells and staining intensity,
  and tumors were categorized as negative, weak, moderate, or strong. Any detectable HIF-1alpha staining (weak, moderate,
  or strong) was considered positive, yielding 41/58 (70.7%) HIF-1alpha-positive PDAC tumors, whereas no HIF-1alpha expression
  was detected in the exocrine portion of normal pancreatic samples. For calibration, we treat the observable as the population-level
  fraction of PDAC tumors that are HIF-1alpha-positive at surgical resection. The model-level observable returns a dimensionless
  HIF activity trajectory in the tumor compartment, and a response-rate aggregation with an IHC-inspired threshold is used
  to map continuous HIF activity to the binary IHC positivity outcome.
