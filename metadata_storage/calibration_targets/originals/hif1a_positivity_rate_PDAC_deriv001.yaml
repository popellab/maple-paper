key_assumptions:
- The 58 patients with pancreatic ductal adenocarcinoma who underwent radical surgery and had no preoperative chemo- or radiotherapy
  are taken as representative of treatment-naive, resectable human PDAC, even though pathologic TNM stages (I-IV) are heterogeneous.
- HIF-1alpha immunohistochemical positivity defined as any detectable nuclear and/or cytoplasmic staining (weak, moderate,
  or strong) is assumed to correspond to tumors with elevated effective HIF activity in the QSP model, which is represented
  by a 0-1 algebraic HIF variable in the tumor compartment.
- The semi-quantitative IHC scoring system (weighted score 1-7 combining percentage of positive cells and intensity) is approximated
  on a 0-1 continuous HIF scale, and the boundary between negative (scores 1-2) and positive (scores >=3) staining is mapped
  to a dimensionless model threshold of approximately 0.25.
- Binomial sampling of HIF-1alpha-positive versus -negative tumors (41/58) is modeled with a Beta posterior using a uniform
  prior, providing a reasonable description of uncertainty in the underlying positivity proportion.
- Normal pancreatic tissue obtained from patients operated for non-cancer indications is assumed to represent physiologic
  pancreas with respect to exocrine HIF-1alpha expression, despite the underlying benign pathology prompting surgery.
key_study_limitations:
- Single-center retrospective cohort (n=58) from a Chinese surgical series between 1993 and 2005 limits generalizability to
  contemporary, multi-center PDAC populations.
- Pathologic TNM stage distribution is broad (I-IV), so the cohort is not restricted to early-stage or strictly resectable
  PDAC in modern terminology, although all cases underwent radical surgery.
- HIF-1alpha expression is assessed by semi-quantitative IHC scoring rather than fully quantitative image analysis; positivity
  is based on categorical thresholds that may vary across laboratories.
- Normal pancreatic controls come from patients undergoing surgery for benign or non-PDAC conditions, which may not perfectly
  represent completely healthy pancreas.
- The calibration target uses tumor-level positivity (fraction of tumors positive) rather than per-tumor continuous HIF-1alpha
  expression values (e.g., H-score or fraction of positive cells), which may discard information about the distribution of
  HIF-1alpha expression intensity across tumors.
observable:
  aggregation:
    rationale: The clinical observable is the proportion of PDAC tumors that are HIF-1alpha-positive by IHC (41/58, 70.7%).
      This is a population summary, not a per-patient continuous measurement. We therefore treat the per-patient observable
      as a time course of tumor HIF activity (0-1) and apply a binary classifier corresponding to the IHC scoring cutoff to
      compute the response rate (fraction of virtual patients that are HIF-1alpha-positive).
    threshold_code: "def classify_patient(time, species_dict, constants, ureg):\n    \"\"\"Classify a virtual patient as HIF-1alpha-positive\
      \ or -negative by IHC.\n\n    A tumor is considered HIF-1alpha-positive if the model HIF activity at\n    the end of\
      \ the simulated time course (representing resection) is greater\n    than or equal to the IHC-derived threshold (hif_positivity_threshold).\n\
      \    \"\"\"\n    hif = species_dict['HIF']\n    if hasattr(hif, '__len__'):\n        hif_value = hif[-1].to('dimensionless')\n\
      \    else:\n        hif_value = hif.to('dimensionless')\n\n    threshold = constants['hif_positivity_threshold']\n \
      \   return bool(hif_value >= threshold)\n"
    time_point: null
    time_unit: null
    type: response_rate
  code: "def compute_observable(time, species_dict, constants, ureg):\n    \"\"\"Tumor HIF-1alpha activity level (0-1 scaled)\
    \ over the simulated time course.\n\n    In this calibration target, HIF activity is represented as an algebraic\n   \
    \ or algebraically constrained variable 'HIF' stored in species_dict as a\n    dimensionless Pint Quantity array with\
    \ the same length as the time array.\n    The observable returns the HIF trajectory (no time indexing), and the\n    population-level\
    \ aggregation handles how this trajectory is summarized\n    for response-rate calculations.\n    \"\"\"\n    hif = species_dict['HIF']\
    \  # dimensionless Pint Quantity array\n    return hif.to('dimensionless')\n"
  constants:
  - biological_basis: Sun et al. scored HIF-1alpha immunoreactivity by combining the percentage of positive tumor cells (1-4
      points for increasing positive-cell fractions) and staining intensity (0-3 points for negative to strong) to yield a
      weighted score from 1 to 7. Tumors were considered HIF-1alpha-positive when the weighted score was >=3 (categories +,
      ++, +++), whereas scores 1-2 were considered negative. We approximate this categorical cutoff on a 0-1 normalized HIF
      scale by placing the positivity threshold between negative and weak categories (around 2.5/7) and represent it as a
      dimensionless threshold of 0.25 for calibration purposes.
    name: hif_positivity_threshold
    reference_db_name: null
    reference_db_names: null
    source_tag: Sun2007_HIF1a_PDAC
    source_type: literature
    units: dimensionless
    value: 0.25
  experimental_denominator: null
  inputs: []
  mapping_rationale: Sun et al. quantified HIF-1alpha expression in resected PDAC by semi-quantitative IHC scoring based on
    the fraction of positive tumor cells and staining intensity. In the QSP model, HIF is represented as a dimensionless 0-1
    algebraic variable capturing effective HIF-1alpha activity in the tumor compartment. We map IHC positivity to model output
    by assuming that tumors with model HIF above a threshold (hif_positivity_threshold) correspond to IHC-positive cases.
    The observable returns the full HIF trajectory over time, and a response-rate aggregation with a threshold on this trajectory
    is used to recover the clinically observed fraction of HIF-1alpha-positive tumors.
  model_denominator_species: null
  species:
  - HIF
  support: unit_interval
  units: dimensionless
  unmodeled_denominator_components: null
