scenario:
  description: Untreated primary PDAC prior to radical pancreatic resection, with HIF-1alpha protein expression measured by
    immunohistochemistry on resection specimens and normal pancreas controls.
  interventions:
  - intervention_description: Natural disease progression of primary pancreatic ductal adenocarcinoma without neoadjuvant
      chemotherapy or radiotherapy until the time of radical pancreatic resection (pancreatoduodenectomy or distal pancreatectomy).
      Tissue for HIF-1alpha immunohistochemistry is obtained from the resected primary tumor at surgery.
