empirical_data:
  assumptions:
  - description: Number of Monte Carlo samples for parametric bootstrap of the apCAF fraction.
    name: n_mc_samples
    rationale: Standard sample size for stable percentile estimates of median and 95% CI while keeping computation lightweight.
    units: dimensionless
    value: 10000.0
  ci95:
  - - 0.18428189876108292
    - 0.23553007293368053
  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    # Point estimate of apCAF fraction\
    \ (dimensionless)\n    p_hat = inputs['apcaf_fraction_point']  # Pint Quantity\n    n_cells = inputs['n_cells']      \
    \       # Pint Quantity\n    n_mc = int(inputs['n_mc_samples'].magnitude)\n\n    # Beta-binomial posterior for true proportion\
    \ p, using a uniform Beta(1,1) prior\n    alpha = p_hat.magnitude * n_cells.magnitude + 1.0\n    beta = (1.0 - p_hat.magnitude)\
    \ * n_cells.magnitude + 1.0\n\n    rng = np.random.default_rng(42)\n    samples = rng.beta(alpha, beta, n_mc) * p_hat.units\
    \  # reattach units (dimensionless)\n\n    median_obs = np.median(samples)\n    ci95_lower = np.percentile(samples, 2.5)\n\
    \    ci95_upper = np.percentile(samples, 97.5)\n\n    return {\n        'median_obs': median_obs,\n        'ci95_lower':\
    \ ci95_lower,\n        'ci95_upper': ci95_upper,\n    }"
