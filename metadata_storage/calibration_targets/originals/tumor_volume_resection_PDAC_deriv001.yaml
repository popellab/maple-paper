empirical_data:
  assumptions:
  - description: Number of Monte Carlo samples used to approximate the distribution of tumor volume from the reported mean
      and SD of diameter.
    name: n_mc_samples
    rationale: 100,000 samples provide stable estimates of the median and 95% confidence interval (<1% Monte Carlo error)
      while keeping computation inexpensive.
    units: dimensionless
    value: 100000.0
  ci95:
  - - 0.59
    - 15.76
  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    import math\n\n    # Extract inputs\
    \ as Pint quantities\n    mean_d = inputs['mean_tumor_diameter'].to('millimeter')\n    sd_d = inputs['sd_tumor_diameter'].to('millimeter')\n\
    \    n_samples = int(inputs['n_mc_samples'].magnitude)\n\n    # Work in magnitudes (dimensionless) to compute lognormal\
    \ parameters\n    mean_mag = mean_d.magnitude\n    sd_mag = sd_d.magnitude\n\n    # Lognormal parameterization that matches\
    \ mean and SD of diameter\n    mu_log = np.log(mean_mag ** 2 / np.sqrt(mean_mag ** 2 + sd_mag ** 2))\n    sigma_log =\
    \ np.sqrt(np.log(1.0 + (sd_mag ** 2) / (mean_mag ** 2)))\n\n    rng = np.random.default_rng(42)\n\n    # Sample diameters\
    \ in mm and immediately reattach units\n    diameters = rng.lognormal(mu_log, sigma_log, n_samples) * ureg('millimeter')\n\
    \n    # Convert diameter → volume assuming spherical tumors:\n    # V = (pi / 6) * D^3\n    volumes_mm3 = (math.pi / 6.0)\
    \ * (diameters ** 3)\n\n    # Convert mm^3 → cm^3; 1 cm^3 = 1000 mm^3, handled by Pint conversion\n    volumes_cm3 = volumes_mm3.to('centimeter**3')\n\
    \n    median_obs = np.median(volumes_cm3)\n    ci95_lower = np.percentile(volumes_cm3, 2.5)\n    ci95_upper = np.percentile(volumes_cm3,\
    \ 97.5)\n\n    return {\n        'median_obs': median_obs,\n        'ci95_lower': ci95_lower,\n        'ci95_upper': ci95_upper,\n\
    \    }"
