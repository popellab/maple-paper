  doi: 10.1186/s12880-022-00751-3
  first_author: Noda
  source_tag: Noda2022_PDAC_ADC
  title: 'Prediction of overall survival in patients with pancreatic ductal adenocarcinoma: histogram analysis of ADC value
    and correlation with pathological intratumoral necrosis'
  year: 2022
scenario:
  description: Patients with pathologically proven, surgically resected pancreatic ductal adenocarcinoma who underwent preoperative
    MRI followed by pancreaticoduodenectomy or distal pancreatectomy. Tumor size was recorded (largest diameter in mm), and
    pathological staging, nodal status, resection margin, and intratumoral necrosis were assessed on the resection specimens.
  interventions:
  - intervention_description: Surgical resection of primary PDAC via pancreaticoduodenectomy (53.8%, n = 21) or distal pancreatectomy
      (46.2%, n = 18) after preoperative MRI. A subset of patients (12/39, 30.8%) received neoadjuvant chemotherapy prior
      to surgery with gemcitabine+S-1 (n=6), gemcitabine+nab-paclitaxel (n=4), or FOLFIRINOX (n=2); doses and exact schedules
      were not reported. R0 resection was achieved in 33/39 patients (84.6%).
