key_assumptions:
- Reported "tumor size (mm)" in Table 2 represents the largest pathological tumor diameter on the resection specimen, not
  a radiologic measurement, and corresponds to the size used to assign pathological T stage according to AJCC 8th edition.
- Tumors are approximated as spheres for converting diameter to volume (V = pi/6 · D^3). While PDACs are infiltrative and
  irregular, spherical approximation is considered adequate for estimating order-of-magnitude tumor volume for calibration.
- The distribution of tumor diameters across patients is better represented by a lognormal distribution than by a normal distribution,
  consistent with strictly positive, right-skewed size data. We therefore transform the reported mean and SD of diameter to
  lognormal parameters before Monte Carlo sampling.
- The ±5.3 mm value reported with the mean tumor size is treated as a standard deviation (not SEM) based on the explicit table
  footnote stating that continuous variables are reported as mean ± 1 standard deviation with ranges in parentheses.
- The observed diameter distribution in this relatively small, mostly early-stage (pT1c–T2) cohort is assumed to be reasonably
  representative of tumor burden in resectable PDAC at surgery, while recognizing that larger resectable tumors seen in other
  series are underrepresented.
- We assume that neoadjuvant chemotherapy, received by 12 of 39 patients, does not drastically distort the distribution of
  tumor diameters at resection relative to treatment-naive resectable disease, and we treat the combined cohort as a single
  calibration population while documenting this mismatch.
key_study_limitations:
- Single-center retrospective study with a small cohort (n=39) limits precision of the tumor size distribution and may not
  capture the full spectrum of resectable PDAC tumor burdens.
- Approximately 30.8% of patients received neoadjuvant chemotherapy before surgery, so the cohort is not purely treatment-naive.
  Neoadjuvant therapy may reduce tumor size and alter intratumoral necrosis, potentially biasing the diameter distribution
  relative to untreated resectable PDAC.
- Tumor size is reported only as overall mean ± SD and range for the whole cohort; no stratified size data are given for the
  neoadjuvant vs upfront surgery subgroups, preventing isolation of a strictly treatment-naive subset for calibration.
- Tumor shape is assumed spherical for volume conversion, whereas PDAC tumors are often irregular and infiltrative within
  a desmoplastic stroma, potentially introducing systematic error in absolute volume estimates.
observable:
  aggregation: null
  code: "def compute_observable(time, species_dict, constants, ureg):\n    \"\"\"Compute primary tumor volume from tumor cell\
    \ count.\n\n    Observable: tumor volume in cm^3 = V_T.C1 [cells] * volume_per_cancer_cell [cm^3/cell]\n    \"\"\"\n \
    \   c_cells = species_dict['V_T.C1']\n    cell_vol = constants['volume_per_cancer_cell']\n\n    tumor_volume = (c_cells\
    \ * cell_vol).to('centimeter**3')\n    return tumor_volume\n"
  constants:
  - biological_basis: 'Derived from reference DB entries for typical resectable PDAC tumor burden: pdac_tumor_volume_resectable
      = 10 milliliter (10 cm^3) and pdac_total_tumor_cells = 1e9 cells. Assuming tumor volume is dominated by cancer cells
      and associated stroma, the effective volume per cancer cell is volume_per_cancer_cell = 10 cm^3 / 1e9 cells = 1e-8 cm^3
      per cell.'
    name: volume_per_cancer_cell
    reference_db_name: null
    reference_db_names:
    - pdac_tumor_volume_resectable
    - pdac_total_tumor_cells
    source_tag: null
    source_type: derived_from_reference_db
    units: centimeter**3 / cell
    value: 1.0e-08
  experimental_denominator: null
  inputs: []
  mapping_rationale: The model state V_T.C1 represents the total number of cancer cells in the primary pancreatic tumor. Pathology
    reports in the source study provide tumor size as the largest diameter in millimeters, which is converted to an equivalent
    spherical volume in cm^3 via Monte Carlo sampling in distribution_code. The observable code maps model cell count to tumor
    volume using a per-cell volume derived from curated reference estimates of total tumor volume and total tumor cell count
    for resectable PDAC, enabling direct comparison between simulated tumor volume and the empirical volume distribution.
  model_denominator_species: null
  species:
  - V_T.C1
  support: positive
  units: centimeter**3
  unmodeled_denominator_components: null
