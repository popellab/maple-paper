study_interpretation: This study reports tumor size (largest diameter) in millimeters for a cohort of 39 patients with surgically
  resected PDAC who underwent preoperative MRI. Tumor size and pathological TNM stage are derived from the resection specimen,
  reflecting the primary tumor burden at the time of surgery. We reinterpret the reported mean ± SD of tumor diameter (18.7
  ± 5.3 mm, range 9.2–30.6 mm) as a lognormally distributed size variable and convert it to a distribution of tumor volumes
  assuming spherical geometry. The resulting empirical volume distribution (median ≈ 3.0 cm^3, 95% CI ≈ 0.6–15.8 cm^3) characterizes
  the tumor burden of small, predominantly T1c–T2 resectable PDACs at resection. This observable is mapped to the model by
  converting the simulated tumor cell count V_T.C1 to cm^3 using a per-cell volume derived from curated reference values.
  The cohort includes both upfront resections and resections after neoadjuvant chemotherapy, but all measurements are made
  on the resection specimen, approximating the primary tumor compartment at the time of surgery.
