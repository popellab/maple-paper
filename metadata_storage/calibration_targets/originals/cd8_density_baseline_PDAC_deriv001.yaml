key_assumptions:
- CD8 immunohistochemistry detects all CD8+ T cells (effector and exhausted) equivalently; in the QSP model this is represented
  by summing V_T.CD8 and V_T.CD8_exh to obtain total intratumoral CD8+ T-cell number before converting to a surface density.
- The +/- values reported for CD8 density in Table 4 of Jansen et al. 2021 are treated as standard deviations of patient-level
  densities within each DOG1-defined stromal subgroup. If they instead represent standard errors of the mean, the true inter-patient
  variance would be larger, but the central tendency (median) used for calibration would be minimally affected.
- DOG1 expression in stromal cells is not strongly associated with CD8+ T-cell density, as indicated by similar means and
  a non-significant p value (0.8326); therefore, combining DOG1-negative and DOG1-positive stromal PDAC cases into a single
  mixture distribution is an appropriate way to approximate the overall intratumoral CD8 density distribution in resected
  PDAC.
- The reference values for PDAC cancer cell cross-sectional area and PDAC cellularity fraction from the curated database are
  applicable to the Jansen et al. cohort, allowing conversion from model cancer cell counts to tumor cross-sectional area
  that is comparable to the histologic sections used for CD8 density quantification.
key_study_limitations:
- The CD8+ T-cell densities are derived from 0.6-mm tissue microarray cores rather than whole-slide sections, so spatial heterogeneity
  of T-cell infiltration within individual tumors may not be fully captured.
- The patient cohort consists of surgically resected PDACs with mixed pathologic stages (pT1 to pT4, pN0 and pN+), and the
  original paper does not explicitly report neoadjuvant therapy status; using this cohort as a proxy for treatment-naive,
  resectable PDAC introduces some uncertainty in matching the exact model context.
- Only group-wise summary statistics (mean +/- dispersion and sample size per DOG1 stromal category) are available; the overall
  PDAC CD8+ T-cell density distribution is therefore reconstructed via a mixture-of-normals Monte Carlo approach rather than
  from individual-patient raw data.
- CD8+ T-cell density is measured in two-dimensional histologic sections (cells/mm^2), whereas the model represents a three-dimensional
  tumor compartment; conversion using cross-sectional area and cellularity assumes approximate spherical cells and homogeneous
  cellular packing, which may not hold in all regions of the desmoplastic PDAC microenvironment.
observable:
  aggregation: null
  code: "def compute_observable(time, species_dict, constants, ureg):\n    \"\"\"Compute total intratumoral CD8+ T-cell density\
    \ (cells/mm^2).\n\n    Total CD8+ cells are taken as the sum of effector (V_T.CD8)\n    and exhausted (V_T.CD8_exh) CD8\
    \ T cells in the tumor compartment.\n    Tumor area is estimated from the cancer cell count (V_T.C1),\n    a reference\
    \ cross-sectional area per PDAC cancer cell, and the\n    PDAC cellularity fraction (cancer-cell area fraction of the\
    \ tumor).\n    \"\"\"\n    cd8_eff = species_dict['V_T.CD8']       # cells\n    cd8_exh = species_dict['V_T.CD8_exh']\
    \   # cells\n    c_cells = species_dict['V_T.C1']        # cancer cells\n\n    area_per_cell = constants['pdac_cancer_cell_cross_section']\
    \  # mm^2/cell\n    cellularity = constants['pdac_cellularity_fraction']         # dimensionless\n\n    # Total tumor\
    \ cross-sectional area represented by the compartment\n    tumor_area = c_cells * area_per_cell / cellularity        \
    \   # mm^2\n\n    cd8_total = cd8_eff + cd8_exh                                # cells\n    density = cd8_total / tumor_area\
    \                             # cells/mm^2\n\n    return density.to('cell/mm**2')"
  constants:
  - biological_basis: From reference DB entry 'pdac_cancer_cell_cross_section', which gives the cross-sectional area of a
      typical PDAC cancer cell based on an approximate diameter of 17 micrometer (area about 2.27e-4 mm^2 per cell). This
      is used to convert tumor cell counts to cross-sectional area in IHC sections.
    name: pdac_cancer_cell_cross_section
    reference_db_name: pdac_cancer_cell_cross_section
    reference_db_names: null
    source_tag: null
    source_type: reference_db
    units: millimeter**2 / cell
    value: 0.000227
  - biological_basis: From reference DB entry 'pdac_cellularity_fraction', representing the approximate fraction of PDAC tumor
      volume occupied by cancer cells (~25%) versus stroma (~75%). This is used to scale from cancer-cell cross-sectional
      area to total tumor cross-sectional area in tissue sections.
    name: pdac_cellularity_fraction
    reference_db_name: pdac_cellularity_fraction
    reference_db_names: null
    source_tag: null
    source_type: reference_db
    units: dimensionless
    value: 0.25
  inputs: []
  mapping_rationale: CD8 immunohistochemistry detects all CD8+ T cells regardless of functional or exhaustion state. The observable
    therefore sums effector (V_T.CD8) and exhausted (V_T.CD8_exh) CD8 T cells in the tumor compartment and divides by tumor
    cross-sectional area estimated from tumor cell count (V_T.C1), PDAC cancer cell cross-sectional area, and PDAC cellularity
    fraction to yield a surface density (cells/mm^2) comparable to the digital image analysis used in Jansen et al. 2021.
  species:
  - V_T.CD8
  - V_T.CD8_exh
  - V_T.C1
  support: positive
  units: cell / millimeter**2
