study_interpretation: Jansen et al. (2021, PeerJ) analyzed 599 pancreatic cancers (predominantly pancreatic ductal adenocarcinomas)
  on a tissue microarray to study DOG1 expression and its relationship to clinicopathologic parameters. CD8+ cytotoxic T-lymphocyte
  density (cells/mm^2) in the tumor area was quantified by immunohistochemistry and digital image analysis, and reported for
  ductal adenocarcinomas stratified by DOG1 expression in tumor cells and in stromal cells. Because DOG1 status did not significantly
  affect CD8 density, the group-wise means and dispersions for DOG1-negative and DOG1-positive stromal PDAC cases (n=368 and
  n=76, respectively) were combined via Monte Carlo sampling to obtain an overall patient-level distribution for intratumoral
  CD8+ T-cell surface density in resected human PDAC. This distribution is mapped to the QSP model by computing total CD8+
  T cells (effector plus exhausted) per tumor cross-sectional area at the time of surgical resection.
