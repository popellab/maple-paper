  assumptions:
  - description: Number of Monte Carlo samples used to approximate the distribution of intratumoral CD8+ T-cell density from
      groupwise mean and dispersion values in Table 4.
    name: n_mc_samples
    rationale: 100,000 samples provide stable estimates of the median and 95% confidence interval while remaining computationally
      inexpensive.
    units: dimensionless
    value: 100000.0
  ci95:
  - - 183.34736054
    - 262.76770277
  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n\n    rng = np.random.default_rng(42)\n\
    \n    # Means and standard deviations for CD8+ T-cell density (cells/mm^2)\n    # in ductal adenocarcinomas, stratified\
    \ by DOG1 expression in stromal cells.\n    mean_neg = inputs['mean_cd8_stroma_neg']      # Quantity\n    sd_neg = inputs['sd_cd8_stroma_neg']\
    \          # Quantity\n    n_neg = int(inputs['n_stroma_neg'].magnitude)\n\n    mean_pos = inputs['mean_cd8_stroma_pos']\
    \      # Quantity\n    sd_pos = inputs['sd_cd8_stroma_pos']          # Quantity\n    n_pos = int(inputs['n_stroma_pos'].magnitude)\n\
    \n    total_n = n_neg + n_pos\n    units = mean_neg.units\n\n    # Monte Carlo sample size (dimensionless modeling choice)\n\
    \    n_mc = 100000\n\n    # Allocate samples across groups according to their sample size\n    n_mc_neg = int(round(n_mc\
    \ * n_neg / total_n))\n    n_mc_pos = n_mc - n_mc_neg\n\n    # Sample from normal distributions for each group using magnitudes,\n\
    \    # then reattach physical units immediately after sampling (Pint golden rule).\n    samples_neg = rng.normal(mean_neg.magnitude,\
    \ sd_neg.magnitude, n_mc_neg) * units\n    samples_pos = rng.normal(mean_pos.magnitude, sd_pos.magnitude, n_mc_pos) *\
    \ units\n\n    # Combine groups into a single patient-level distribution\n    samples = np.concatenate([samples_neg.magnitude,\
    \ samples_pos.magnitude]) * units\n\n    # np.median and np.percentile preserve Pint units\n    median_obs = np.median(samples)\n\
    \    ci95_lower = np.percentile(samples, 2.5)\n    ci95_upper = np.percentile(samples, 97.5)\n\n    return {\n       \
    \ 'median_obs': median_obs,\n        'ci95_lower': ci95_lower,\n        'ci95_upper': ci95_upper,\n    }"
