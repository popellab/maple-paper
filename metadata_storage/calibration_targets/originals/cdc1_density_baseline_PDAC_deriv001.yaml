empirical_data:
  assumptions:
  - description: Number of Monte Carlo samples used to approximate the sampling distribution of cDC1 density from the reported
      mean and SEM.
    name: n_mc_samples
    rationale: 10,000 samples provide a stable estimate of the median and 95% CI for the observable without excessive computational
      cost; this is a standard choice for parametric bootstrap in QSP calibration.
    units: dimensionless
    value: 10000.0
  ci95:
  - - 2.125134894026662
    - 29.21619111562768
  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n\n    # Literature-derived inputs (Pint\
    \ Quantities)\n    mean = inputs['mean_cdc1_density_wta']          # cell/mm^2\n    sem = inputs['sem_cdc1_density_wta']\
    \           # cell/mm^2 (SEM)\n    n_patients = inputs['sample_size_cdc1']        # dimensionless\n    n_samples = int(inputs['n_mc_samples'].magnitude)\n\
    \n    # Convert SEM to SD: SD = SEM * sqrt(n)\n    sd = sem * np.sqrt(n_patients.magnitude)\n\n    # Convert normal(mean,\
    \ sd) to lognormal parameters to avoid negative densities\n    mean_mag = mean.magnitude\n    sd_mag = sd.magnitude\n\
    \    mu_log = np.log(mean_mag**2 / np.sqrt(mean_mag**2 + sd_mag**2))\n    sigma_log = np.sqrt(np.log(1.0 + (sd_mag**2\
    \ / mean_mag**2)))\n\n    rng = np.random.default_rng(42)\n    # Sampling strips units; reattach immediately\n    samples\
    \ = rng.lognormal(mu_log, sigma_log, n_samples) * mean.units\n\n    median_obs = np.median(samples)\n    ci95_lower =\
    \ np.percentile(samples, 2.5)\n    ci95_upper = np.percentile(samples, 97.5)\n\n    return {\n        'median_obs': median_obs,\n\
    \        'ci95_lower': ci95_lower,\n        'ci95_upper': ci95_upper,\n    }"
