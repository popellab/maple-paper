key_assumptions:
- CLEC9A+ tumor-infiltrating cells in human PDAC correspond predominantly to the cDC1 subset (co-expressing CD141/BDCA-3 and
  XCR1) and are appropriately mapped to the total cross-presenting dendritic cell population represented by V_T.cDC1 + V_T.mcDC1
  in the model.
- The reported 9.84 ± 1.16 cDC1s/mm^2 values in the WTA are treated as mean ± SEM across 40 patients, as explicitly stated
  in the Statistical Analysis section; we convert SEM to SD using SD = SEM·sqrt(n) and assume an underlying lognormal distribution
  for positive cell densities.
- Densities measured on 25–50% of tumor-containing regions per slide (as defined by a pathologist) are assumed to be representative
  of the entire primary tumor immune microenvironment for each patient.
- Although 36% of patients received neoadjuvant chemotherapy before resection and 64% underwent primary resection without
  neoadjuvant therapy, we treat the pooled cDC1 density as characteristic of resectable, untreated PDAC at surgery, based
  on the authors’ finding that neoadjuvant chemotherapy did not significantly change cDC1 frequencies.
- Tumor cellularity is approximated as a fixed 25% across patients (pdac_cellularity_fraction) when converting model cancer
  cell counts to whole tumor area; inter-patient variability in cellularity and stromal content is not explicitly propagated
  into the uncertainty of the observable.
key_study_limitations:
- Retrospective single-center cohort of 58 PDAC patients (40 with multiplex IHC data for cDC1/cDC2) treated between 2008 and
  2015; results may not generalize to other institutions, ethnicities, or treatment eras.
- Approximately 36% of patients received neoadjuvant chemotherapy, whereas 64% underwent primary resection; although the authors
  report no significant impact of neoadjuvant therapy on cDC1, cDC2, or pDC frequencies, subtle therapy-induced shifts in
  dendritic cell density or function cannot be excluded.
- Dendritic cell densities were quantified on 25–50% of tumor-containing regions per slide rather than on the entire tumor,
  which may introduce sampling bias, especially in tumors with heterogeneous immune infiltration or patchy stromal architecture.
- CLEC9A staining identifies human cDC1s but may also detect a small subset of other myeloid cells; rare misclassification
  or marker expression heterogeneity could affect absolute cDC1 counts and their spatial distribution.
observable:
  aggregation: null
  code: "def compute_observable(time, species_dict, constants, ureg):\n    \"\"\"Compute total cDC1 density (immature + mature)\
    \ in PDAC tumor tissue.\n\n    This observable returns the density of cross-presenting dendritic cells\n    (cDC1s) per\
    \ mm^2 of whole tumor area (intraepithelial tumor + stroma),\n    matching the CLEC9A+ cDC1 counts reported by Plesca\
    \ et al. 2022.\n    \"\"\"\n    # Model species: immature and mature cDC1 in the tumor compartment\n    cdc1_imm = species_dict['V_T.cDC1']\n\
    \    cdc1_mat = species_dict['V_T.mcDC1']\n    tumor_cells = species_dict['V_T.C1']\n\n    # Geometric conversion: cancer\
    \ cell count -> whole tumor area\n    area_per_cell = constants['cancer_cell_cross_section']  # mm^2/cell\n    cellularity\
    \ = constants['cellularity_fraction']         # fraction of area composed of cancer cells\n\n    # Whole tumor area (cancer\
    \ cells + stroma) in mm^2\n    tumor_area = tumor_cells * area_per_cell / cellularity\n\n    total_cdc1 = cdc1_imm + cdc1_mat\n\
    \    density = total_cdc1 / tumor_area\n    return density.to('cell / millimeter**2')"
  constants:
  - biological_basis: Cross-sectional area of a typical PDAC cancer cell at the equatorial plane. Taken directly from the
      curated reference value pdac_cancer_cell_cross_section, which is derived from a mean PDAC cancer cell diameter of 17
      µm (area ≈ π·(8.5 µm)^2 ≈ 2.27×10^-4 mm^2 per cell).
    name: cancer_cell_cross_section
    reference_db_name: pdac_cancer_cell_cross_section
    reference_db_names: null
    source_tag: null
    source_type: reference_db
    units: millimeter**2 / cell
    value: 0.000227
  - biological_basis: Fraction of PDAC tumor cross-sectional area occupied by cancer cells versus stroma and other components.
      Value taken directly from the curated reference value pdac_cellularity_fraction, which integrates histopathologic estimates
      of PDAC cellularity (~25%) in resectable tumors.
    name: cellularity_fraction
    reference_db_name: pdac_cellularity_fraction
    reference_db_names: null
    source_tag: null
    source_type: reference_db
    units: dimensionless
    value: 0.25
  experimental_denominator: mm^2 of whole tumor tissue cross-section (intraepithelial tumor area plus tumor stroma) on resected
    PDAC specimens, as defined in the multiplex IHC analysis.
  inputs: []
  mapping_rationale: Plesca et al. quantified tumor-infiltrating cDC1s in resected human PDAC using multiplex IHC for CLEC9A
    (a canonical human cDC1 marker, co-expressed with CD141/BDCA-3 and XCR1). They reported mean densities of CLEC9A+ cDC1s
    per mm^2 of the whole tumor area (WTA), defined as intraepithelial tumor plus tumor stroma. In the QSP model, immature
    and mature cross-presenting dendritic cells are represented by V_T.cDC1 and V_T.mcDC1 in the tumor compartment. We map
    the experimental CLEC9A+ cDC1 counts to the sum V_T.cDC1 + V_T.mcDC1, and convert model cancer cell counts (V_T.C1) to
    whole tumor area using the PDAC cancer cell cross-sectional area and a fixed 25% tumor cellularity fraction, so that the
    observable returns total cDC1 density (cells/mm^2 of WTA) comparable to the mIHC measurement.
  model_denominator_species:
  - V_T.C1
  species:
  - V_T.cDC1
  - V_T.mcDC1
  - V_T.C1
  support: positive
  units: cell / millimeter**2
  unmodeled_denominator_components: The experimental denominator (whole tumor area) includes stromal fibroblasts, vasculature,
    extracellular matrix, and non-malignant cells that are not explicitly modeled as area-contributing species. We approximate
    their contribution via a fixed PDAC cellularity fraction (0.25), but residual heterogeneity in stromal content and non-cancer
    cellularity may introduce systematic error in the absolute density.
