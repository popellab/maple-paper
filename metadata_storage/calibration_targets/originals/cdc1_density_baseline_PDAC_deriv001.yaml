source_relevance: null
study_interpretation: Plesca et al. analyzed tumor-infiltrating dendritic cell subsets in primary PDAC resections from 58
  patients (40 with multiplex IHC data for cDC1/cDC2). Using multiplex immunohistochemistry and automated image analysis,
  they identified CLEC9A+ cells as human cDC1s and quantified their density (cells/mm^2) within the whole tumor area (intraepithelial
  tumor plus tumor stroma) on formalin-fixed, paraffin-embedded sections. They reported mean ± SEM densities for cDC1s, cDC2s,
  and pDCs in distinct tumor regions and correlated these with clinicopathologic parameters and survival. For calibration,
  we use the mean CLEC9A+ cDC1 density in the whole tumor area (9.84 ± 1.16 cells/mm^2, n = 40), interpreted as the density
  of all cross-presenting cDC1s (immature + mature) in resectable human PDAC. In the QSP model this maps to the sum of immature
  and mature cross-presenting dendritic cells in the tumor compartment (V_T.cDC1 + V_T.mcDC1), normalized by whole tumor area
  derived from modeled cancer cell counts and a fixed PDAC cellularity fraction.
