empirical_data:
  assumptions:
  - description: Concentration parameter (alpha+beta) for a Beta distribution approximating between-patient variability in
      NK fraction among TILs; alpha = mean * phi, beta = (1 - mean) * phi with mean = 3.5%.
    name: nk_fraction_concentration
    rationale: Figure 4b violin plots show NK cell fraction among TILs clustering around approximately 2–5% with relatively
      few values above ~8%. Setting an effective sample size phi = 100 yields a Beta(3.5, 96.5) distribution with a 95% interval
      of roughly 0.9–7.9%, matching this visual spread while keeping the mean fixed at the reported 3.5%. This treats the
      reported 3.5% as the mean across the nine tumors.
    units: dimensionless
    value: 100.0
  - description: Number of Monte Carlo samples drawn from the Beta distribution to estimate median and 95% confidence interval
      for NK fraction among TILs.
    name: n_mc_samples
    rationale: 10,000 samples provide stable estimates of median and percentile-based confidence intervals with negligible
      Monte Carlo error for a one-dimensional Beta distribution.
    units: dimensionless
    value: 10000.0
  ci95:
  - - 0.008642703868143635
    - 0.07917228686127573
  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    rng = np.random.default_rng(42)\n\
    \    # Reported mean NK percentage (3.5%) as Pint quantity with 'percent' units\n    mean_pct = inputs['nk_fraction_mean_pct']\n\
    \    # Convert to fraction in [0, 1]\n    mean_frac = mean_pct.to('dimensionless')\n    # Beta concentration parameter\
    \ (alpha + beta)\n    phi = inputs['nk_fraction_concentration']\n    n_samples = int(inputs['n_mc_samples'].magnitude)\n\
    \    m = mean_frac.magnitude\n    phi_val = phi.magnitude\n    alpha = m * phi_val\n    beta_param = (1.0 - m) * phi_val\n\
    \    # Draw Monte Carlo samples from Beta distribution and reattach units\n    samples = rng.beta(alpha, beta_param, size=n_samples)\
    \ * mean_frac.units\n    median_obs = np.median(samples)\n    ci95_lower = np.percentile(samples, 2.5)\n    ci95_upper\
    \ = np.percentile(samples, 97.5)\n    return {\n        'median_obs': median_obs,\n        'ci95_lower': ci95_lower,\n\
    \        'ci95_upper': ci95_upper,\n    }\n"
