scenario:
  description: Baseline immune composition of resectable PDAC tumors at the time of surgical resection; tumor-infiltrating
    lymphocytes were isolated from primary tumor tissue and analyzed by flow cytometry without prior systemic anticancer therapy.
  interventions:
  - intervention_description: Pancreaticoduodenectomy (Whipple's resection) with curative intent for localized PDAC; tumor
      tissue from the primary lesion was collected at surgery for isolation of tumor-infiltrating lymphocytes.
secondary_data_sources: []
source_relevance: null
study_interpretation: Marcon et al. (OncoImmunology 2020) analyzed NK cells in blood and tumor tissue from patients with resectable
  PDAC undergoing Whipple's resection. Tumor-infiltrating lymphocytes were isolated from primary tumor samples and stained
  for CD3 and CD56 to identify NK cells (CD3- CD56+). They report that NK cells comprise only 3.5% of tumor-infiltrating lymphocytes,
  indicating that NK cells are a minority subset within the PDAC tumor microenvironment. This calibration target maps that
  NK fraction to the model as the fraction of NK cells (V_T.NK) among modeled tumor-infiltrating T and NK lymphocytes (V_T.CD8,
  V_T.CD8_exh, V_T.Th, V_T.Th_exh, V_T.Treg, V_T.NK) at the time of tumor resection.
