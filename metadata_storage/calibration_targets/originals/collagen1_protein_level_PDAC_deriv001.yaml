  doi: 10.1038/s41598-017-04771-w
  first_author: Xu
  source_tag: Xu2017_MPM_PDAC
  title: Identifying the neck margin status of ductal adenocarcinoma in the pancreatic head by multiphoton microscopy
  year: 2017
scenario:
  description: Untreated primary pancreatic ductal adenocarcinoma in the head of the pancreas, sampled at the time of pancreaticoduodenectomy.
    No ECM-targeted therapy is applied; measurement reflects the desmoplastic stroma present at surgical resection.
  interventions:
  - intervention_description: No pharmacologic or radiotherapeutic intervention is modeled explicitly; tumor evolves under
      natural disease progression until surgical resection (pancreaticoduodenectomy) at a resectable stage, when pancreatic
      neck margin tissue is excised and analyzed ex vivo.
