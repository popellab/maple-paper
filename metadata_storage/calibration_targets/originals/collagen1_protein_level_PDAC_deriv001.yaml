key_assumptions:
- Collagen pixel density measured by SHG/TPEF (area fraction of collagen in optical sections) is proportional to the 3D collagen
  volume fraction and, via approximately constant tissue density, to collagen mass fraction in tissue.
- Because collagen I dominates the PDAC desmoplastic stroma, the tumor-to-normal collagen fraction is used as a proxy for
  total ECM protein fold-change, consistent with the model variable V_T.ECM representing total ECM mass.
- The same 8 resected pancreatic neck margin specimens provide both normal and tumor measurements, so the reported group means
  (2.09 ± 0.26 vs 20.85 ± 4.50) are treated as paired within-patient summaries, but the Monte Carlo derivation assumes independent
  normal and tumor distributions due to lack of reported correlation; this slightly overestimates uncertainty in the ratio.
- Reported values are interpreted as mean ± SD based on the Methods statement that all quantitative results are presented
  as "mean ± SD"; no SEM values are used.
- Both normal and tumor collagen pixel densities are modeled as lognormally distributed positive quantities, which is appropriate
  for positive, right-skewed structural measurements; using a normal distribution would permit non-physical negative values,
  even if rare.
- Pancreas tissue density (1.04 g/cm^3) from ICRU soft-tissue data is assumed to apply to both normal pancreas and PDAC tissue
  when converting the reference tumor volume to tissue mass; differences between normal and tumor tissue density are neglected.
- The reference resectable tumor volume (10 mL) from the curated PDAC reference database is assumed representative of the
  tumors in the Xu et al. cohort; the ECM fold-change calibration depends only on the ratio of modeled ECM mass to the normal-pancreas
  expectation for this volume, not on absolute tumor volume.
- We assume that neoadjuvant therapy was not systematically applied in this small cohort or that any such treatment did not
  dramatically alter collagen content at the pancreatic neck margin; the paper does not provide detailed neoadjuvant treatment
  information, so potential heterogeneity is acknowledged as a limitation.
key_study_limitations:
- Small, single-center cohort (n = 8 patients), limiting generalizability and precision of the ECM fold-change estimate.
- Collagen content is quantified via pixel density in 2D multiphoton images rather than direct biochemical measurement of
  collagen mass; while proportional, the relationship between pixel density and absolute protein concentration is not explicitly
  calibrated.
- Normal pancreatic tissue measurements are taken from regions within resected specimens (adjacent normal tissue) rather than
  from truly disease-free pancreas in healthy donors, so they may partially reflect field effects or early stromal changes.
- Measurements are from pancreatic neck margin tissue in tumors of the pancreatic head; ECM content in other regions of the
  primary tumor (body/tail, central vs peripheral areas) may differ.
- Neoadjuvant therapy status, fat content, and other clinical characteristics that could affect stromal composition are mentioned
  as potential modifiers but not detailed for individual specimens, introducing unquantified variability.
observable:
  aggregation: null
  code: "def compute_observable(time, species_dict, constants, ureg):\n    # ECM fold-change in PDAC tumor relative to normal\
    \ pancreas, using collagen fraction as proxy\n    ecm = species_dict['V_T.ECM']  # total ECM mass in tumor compartment\n\
    \n    tumor_vol = constants['pdac_tumor_volume_resectable']  # reference resectable PDAC tumor volume\n    tissue_density\
    \ = constants['pancreas_tissue_density']  # pancreas tissue density (mass/volume)\n    normal_collagen = constants['normal_pancreas_collagen']\
    \  # collagen mass per unit tissue mass in normal pancreas\n\n    # Tumor tissue mass corresponding to reference resectable\
    \ tumor volume\n    tumor_mass = (tumor_vol.to('centimeter**3') * tissue_density).to('gram')\n\n    # Convert normal pancreas\
    \ collagen content to a mass fraction (g collagen / g tissue)\n    normal_collagen_frac = normal_collagen.to('gram/gram')\n\
    \n    # Expected ECM (collagen-dominated) mass in a normal pancreas volume equal to the reference tumor volume\n    normal_ecm_mass\
    \ = (tumor_mass * normal_collagen_frac).to('milligram')\n\n    ecm_mass = ecm.to('milligram')\n\n    fold_change = (ecm_mass\
    \ / normal_ecm_mass).to('dimensionless')\n\n    return fold_change"
  constants:
  - biological_basis: 'From curated reference DB entry ''normal_pancreas_collagen'': collagen content of normal human pancreas
      is 5 micrograms of collagen per milligram of wet tissue (5 µg/mg). Used here as collagen mass fraction in normal pancreas
      to compute the expected ECM mass for a tumor-sized volume of normal pancreas.'
    name: normal_pancreas_collagen
    reference_db_name: normal_pancreas_collagen
    reference_db_names: null
    source_tag: null
    source_type: reference_db
    units: microgram / milligram
    value: 5.0
  - biological_basis: 'From curated reference DB entry ''pdac_tumor_volume_resectable'': typical primary tumor volume at surgical
      resection for resectable PDAC is approximately 10 mL. Used as a reference volume to map model ECM mass to a clinically
      relevant tumor size.'
    name: pdac_tumor_volume_resectable
    reference_db_name: pdac_tumor_volume_resectable
    reference_db_names: null
    source_tag: null
    source_type: reference_db
    units: milliliter
    value: 10.0
  - biological_basis: Pancreas physical density reported as 1.04 g/cm^3 in ICRU soft-tissue data, as summarized in Table 1
      of Noblet et al., "A new tissue segmentation method to calculate 3D dose in small animal radiation therapy" (Radiat
      Oncol 13:32, 2018). This density converts the reference pancreatic tumor volume into tissue mass for applying the normal
      pancreas collagen mass fraction.
    name: pancreas_tissue_density
    reference_db_name: null
    reference_db_names: null
    source_tag: Noblet2018_TissueSegmentation
    source_type: literature
    units: gram / centimeter**3
    value: 1.04
  experimental_denominator: null
  inputs: []
  mapping_rationale: The observable computes the ratio of modeled ECM mass in the PDAC tumor compartment (V_T.ECM) to the
    ECM mass that would be present if the same tissue volume had the collagen content of normal pancreas. Collagen I dominates
    PDAC desmoplasia, so the tumor-to-normal collagen fraction is used as a proxy for total ECM fold-change, calibrated against
    SHG/TPEF-measured collagen area fraction in human pancreatic head PDAC versus normal pancreas.
  model_denominator_species: null
  species:
  - V_T.ECM
  support: positive_unbounded
  units: dimensionless
  unmodeled_denominator_components: The experimental measurement is based on collagen area fraction (pixel density) in 2D
    optical sections, whereas the model tracks total ECM mass (collagen plus other ECM components) in a 3D tumor volume. We
    assume collagen fraction is proportional to total ECM fraction and that section thickness and cellularity are comparable
    between tumor and normal pancreas, but residual geometric differences are not explicitly modeled.
