empirical_data:
  assumptions:
  - description: Number of Monte Carlo samples used to propagate uncertainty from normal and tumor collagen pixel densities
      into the fold-change distribution.
    name: n_mc_samples
    rationale: 100,000 samples provide stable estimates of the median and 95% confidence interval for the tumor-to-normal
      collagen ratio while keeping computation tractable.
    units: dimensionless
    value: 100000.0
  ci95:
  - - 6.07304
    - 16.00077
  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n\n    rng = np.random.default_rng(42)\n\
    \n    mean_norm = inputs['d_collagen_normal_mean']\n    sd_norm = inputs['d_collagen_normal_sd']\n    mean_tum = inputs['d_collagen_tumor_mean']\n\
    \    sd_tum = inputs['d_collagen_tumor_sd']\n\n    def lognormal_params(mean_q, sd_q):\n        mean = mean_q.magnitude\n\
    \        sd = sd_q.magnitude\n        variance = sd ** 2\n        sigma2 = np.log(1.0 + variance / (mean ** 2))\n    \
    \    sigma = np.sqrt(sigma2)\n        mu = np.log(mean) - sigma2 / 2.0\n        return mu, sigma\n\n    mu_n, sigma_n\
    \ = lognormal_params(mean_norm, sd_norm)\n    mu_t, sigma_t = lognormal_params(mean_tum, sd_tum)\n\n    n_samples = int(inputs['n_mc_samples'].magnitude)\n\
    \n    samples_normal = rng.lognormal(mu_n, sigma_n, n_samples) * mean_norm.units\n    samples_tumor = rng.lognormal(mu_t,\
    \ sigma_t, n_samples) * mean_tum.units\n\n    ratio_samples = samples_tumor / samples_normal\n\n    median_obs = np.median(ratio_samples)\n\
    \    ci95_lower = np.percentile(ratio_samples, 2.5)\n    ci95_upper = np.percentile(ratio_samples, 97.5)\n\n    return\
    \ {\n        'median_obs': median_obs,\n        'ci95_lower': ci95_lower,\n        'ci95_upper': ci95_upper,\n    }"
