- doi_or_url: 10.1186/s13014-018-0971-8
  first_author: Noblet
  source_tag: Noblet2018_TissueSegmentation
  title: A new tissue segmentation method to calculate 3D dose in small animal radiation therapy
  year: 2018
source_relevance: null
study_interpretation: Xu et al. (2017) used label-free multiphoton microscopy on fresh frozen pancreatic neck margin specimens
  from 8 patients undergoing pancreaticoduodenectomy for ductal adenocarcinoma in the pancreatic head. Second harmonic generation
  (SHG) and two-photon excited fluorescence (TPEF) signals were used to visualize collagen fibers and tissue architecture.
  They quantified the pixel density of collagen (D_collagen = A_collagen / A_total) in regions classified as normal pancreatic
  tissue versus ductal adenocarcinoma. The mean pixel density was 2.09 ± 0.26 in normal pancreas and 20.85 ± 4.50 in PDAC
  (n = 8 for each), indicating a roughly 10-fold increase in collagen content in tumor relative to normal tissue. We interpret
  D_collagen as proportional to collagen (and thus ECM) volume and mass fraction, and use the tumor-to-normal ratio as a calibration
  target for ECM accumulation in human PDAC. The observable maps model ECM mass (V_T.ECM) to an ECM fold-change relative to
  normal pancreas by dividing by the ECM mass that would be present in an equivalent tissue volume with normal pancreas collagen
  content, using curated reference values for normal collagen content and pancreatic tissue density.
