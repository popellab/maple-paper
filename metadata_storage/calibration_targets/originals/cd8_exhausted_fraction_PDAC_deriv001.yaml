empirical_data:
  assumptions:
  - description: Number of Monte Carlo samples used to approximate the sampling distribution of the PD-1+ CD8+ fraction from
      the reported mean and SEM.
    name: n_mc_samples
    rationale: 10,000 samples is a standard choice that provides stable estimates of median and 95% confidence intervals for
      a single-parameter distribution without excessive computational cost.
    units: dimensionless
    value: 10000.0
  ci95:
  - - 0.25622453
    - 0.97633259
  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    rng = np.random.default_rng(42)\n\
    \    mean = inputs['mean_pd1_pos_cd8_tumor']  # dimensionless fraction\n    sem = inputs['sem_pd1_pos_cd8_tumor']\n  \
    \  n_patients = int(inputs['n_patients_flow_pd1'].magnitude)\n\n    # Convert SEM to SD\n    sd = sem * np.sqrt(n_patients)\n\
    \n    # Infer Beta distribution parameters from mean and SD for a fraction on [0,1]\n    m = mean.magnitude\n    s = sd.magnitude\n\
    \    var = s ** 2\n    # Avoid division by zero or invalid variance\n    if var <= 0.0:\n        alpha = m * 100.0\n \
    \       beta = (1.0 - m) * 100.0\n    else:\n        common = m * (1.0 - m) / var - 1.0\n        alpha = m * common\n\
    \        beta = (1.0 - m) * common\n        alpha = max(alpha, 1e-3)\n        beta = max(beta, 1e-3)\n\n    samples =\
    \ rng.beta(alpha, beta, 10000) * mean.units\n    median_obs = np.median(samples)\n    ci95_lower = np.percentile(samples,\
    \ 2.5)\n    ci95_upper = np.percentile(samples, 97.5)\n    return {\n        'median_obs': median_obs,\n        'ci95_lower':\
    \ ci95_lower,\n        'ci95_upper': ci95_upper,\n    }\n"
