key_assumptions:
- PD-1 expression on tumor-infiltrating CD8+ T cells is treated as a proxy for the exhausted or dysfunctional CD8 subset represented
  by V_T.CD8_exh, even though Shibuya et al. show that many PD-1+ cells can still produce IFN-γ after strong in vitro stimulation.
- The PD-1 flow cytometry analysis in Figure 5C is assumed to include both neoadjuvant-treated and untreated patients, as
  the authors do not report separate PD-1 statistics by treatment status; this mixed population is used as an approximate
  baseline for resectable PDAC tumors.
- The mean PD-1+ fraction (70%) and its SEM (5%) for tumor-infiltrating CD8+ T cells are visually estimated from the mean±SEM
  plot in Figure 5C using the 0–100% y-axis; true values may differ slightly but are expected to be within a few percentage
  points.
- Sample size for the PD-1 flow cytometry subset (n≈15) is inferred by counting individual data points in the tumor CD8+ group
  in Figure 5C, since the exact n is not explicitly stated in the text or tables; this introduces uncertainty into the SEM-to-SD
  conversion.
- A Beta distribution is used to represent uncertainty in the true population fraction of PD-1+ CD8+ tumor-infiltrating T
  cells, with parameters inferred from the approximate mean and SD derived from the visually estimated SEM and sample size;
  this assumes that patient-to-patient variability in PD-1+ fraction is well-approximated by a continuous distribution on
  [0,1].
key_study_limitations:
- All patients were treated at a single academic center, and the flow cytometry analyses were performed on a subset of the
  40 surgical cases; generalizability to broader PDAC populations is uncertain.
- The PD-1+ fractions and SEM are extracted manually from Figure 5C rather than from tabulated numeric data, introducing additional
  measurement uncertainty beyond sampling variability.
- The flow cytometry cohort combines patients who received multimodal neoadjuvant therapy with those who were treatment-naive
  at resection, but PD-1 expression was not stratified by treatment status; prior therapy may alter PD-1 expression on TILs.
- PD-1 alone is an imperfect marker of T cell exhaustion; some PD-1+ CD8+ T cells in these tumors remain capable of robust
  IFN-γ production, so using PD-1+ fraction as a stand-in for fully exhausted CD8 T cells may overestimate the truly dysfunctional
  subset.
observable:
  aggregation: null
  code: "def compute_observable(time, species_dict, constants, ureg):\n    import numpy as np\n    # V_T.CD8: functional (non-exhausted)\
    \ CD8 T cells in tumor (cells)\n    # V_T.CD8_exh: exhausted/dysfunctional CD8 T cells in tumor (cells)\n    cd8_eff =\
    \ species_dict['V_T.CD8']\n    cd8_exh = species_dict['V_T.CD8_exh']\n    total_cd8 = cd8_eff + cd8_exh\n    # Compute\
    \ fraction of exhausted CD8 T cells among all CD8 lineage cells\n    # Avoid division by zero by returning 0 where total_cd8\
    \ == 0\n    frac_array = np.where(total_cd8.magnitude > 0.0,\n                          (cd8_exh / total_cd8).magnitude,\n\
    \                          0.0)\n    return frac_array * ureg.dimensionless\n"
  constants: []
  experimental_denominator: CD8+ tumor-infiltrating T cells (live CD3+CD8+ lymphocytes in single-cell suspensions from primary
    PDAC tumors).
  inputs: []
  mapping_rationale: Shibuya et al. (2014) measured the percentage of tumor-infiltrating CD8+ T cells that express the co-inhibitory
    receptor PD-1 by multiparameter flow cytometry on single-cell suspensions of resected human PDAC tumors. In the QSP model,
    exhausted or dysfunctional CD8 T cells in the tumor are represented explicitly as V_T.CD8_exh, while functional effector
    or memory CD8 T cells are represented as V_T.CD8. The experimental observable is the percentage of CD8+ T cells that are
    PD-1 positive in the tumor, and this is mapped to the model quantity V_T.CD8_exh / (V_T.CD8 + V_T.CD8_exh), assuming that
    PD-1 expression identifies the exhausted or dysfunctional subset captured by V_T.CD8_exh.
  model_denominator_species:
  - V_T.CD8
  - V_T.CD8_exh
  species:
  - V_T.CD8
  - V_T.CD8_exh
  support: unit_interval
  units: dimensionless
  unmodeled_denominator_components: None; the experimental denominator is all CD3+CD8+ T cells in the tumor, which are represented
    in the model as the sum of functional (V_T.CD8) and exhausted (V_T.CD8_exh) CD8 T cells.
primary_data_source:
  doi: 10.1371/journal.pone.0096565
  first_author: Shibuya
  source_tag: Shibuya2014_PDA_TIL
  title: Pancreatic ductal adenocarcinoma contains an effector and regulatory immune cell infiltrate that is altered by multimodal
    neoadjuvant treatment
  year: 2014
scenario:
  description: Baseline immune state in primary PDAC tumors at the time of surgical resection. Patients had resectable or
    borderline/locally advanced pancreatic ductal adenocarcinoma; approximately half received multimodal neoadjuvant therapy
    (GTX chemotherapy plus chemoradiotherapy) prior to surgery, while the remainder underwent upfront resection without prior
    systemic therapy. Tumor tissue and peripheral blood were collected intraoperatively at resection, single-cell suspensions
    prepared from tumors, and multiparameter flow cytometry performed to quantify PD-1 expression on tumor-infiltrating CD4+
    and CD8+ T cells.
  interventions:
  - intervention_description: 'For the neoadjuvant-therapy subgroup: three cycles of gemcitabine 750 mg/m^2 IV, docetaxel
      30 mg/m^2 IV, and capecitabine 750 mg/m^2 orally (GTX regimen), followed within 14 days by chemoradiotherapy consisting
      of 300 cGy × 10 fractions of intensity-modulated radiation therapy with concurrent oxaliplatin 60 mg/m^2 IV and capecitabine
      650 mg/m^2 orally; primary tumor resection performed 2–6 weeks after completion of chemoradiotherapy, with blood and
      tumor collected at surgery.'
  - intervention_description: 'For the no-therapy subgroup: no systemic anticancer therapy prior to surgery (treatment-naive
      at the time of resection); patients underwent primary pancreatic resection (pancreaticoduodenectomy, distal pancreatectomy,
      or total pancreatectomy), and blood plus tumor tissue were collected intraoperatively.'
secondary_data_sources: []
source_relevance: null
study_interpretation: This study provides a quantitative characterization of the adaptive immune infiltrate in human pancreatic
  ductal adenocarcinoma using both immunohistochemistry and multiparameter flow cytometry on fresh surgical specimens. For
  the present calibration target, the key result is that a large majority of tumor-infiltrating CD8+ T cells express the inhibitory
  receptor PD-1, whereas only a minority of circulating CD8+ T cells in matched peripheral blood are PD-1+. PD-1 expression
  was measured on live CD3+CD8+ lymphocytes from enzymatically digested primary PDAC tumors resected at surgery and from paired
  peripheral blood mononuclear cells. The flow cytometry gating ensured that the numerator (PD-1+ cells) and denominator (total
  CD8+ T cells) are defined within the same compartment (tumor) and analysis level (single-cell flow cytometry). Although
  the authors demonstrate that many PD-1+ TILs retain IFN-γ production capacity after PMA/ionomycin stimulation, in the QSP
  model PD-1 expression is used as a proxy for an exhausted/dysfunctional CD8 subset (V_T.CD8_exh), so the experimental PD-1+
  fraction is mapped onto the model fraction of exhausted CD8 T cells at the time of tumor resection.
