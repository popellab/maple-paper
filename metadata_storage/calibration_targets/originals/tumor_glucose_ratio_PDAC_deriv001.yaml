source_relevance: null
study_interpretation: Battini et al. used HR-MAS 1H NMR spectroscopy on resected pancreatic tissues to quantify absolute metabolite
  concentrations (nmol/mg) in pancreatic adenocarcinoma (PA) tumors and normal pancreatic parenchyma (PP). For the subgroup
  without neoadjuvant chemotherapy (treatment-naive at surgery), Table 2 reports mean ± SD glucose concentrations for PP (n
  = 9) and PA (n = 44). These measurements reflect steady-state tissue metabolism in resectable PDAC at the time of surgery.
  For QSP calibration, we construct a dimensionless tumor-to-normal glucose ratio by modeling PP and PA glucose as lognormal
  distributions fit to the reported means and SDs, then sampling their ratio. The resulting median and 95% CI constrain the
  relative tumor glucose level, informing the parameter k_glc_tumor that controls tumor glucose utilization in the metabolism
  module.
