scenario:
  description: Chemo-naive patients with resectable pancreatic ductal adenocarcinoma underwent pancreaticoduodenectomy (cephalic
    duodeno-pancreatectomy). During surgery, tissue samples of the primary tumor (PA) and, when available, adjacent normal
    pancreatic parenchyma (PP) were collected, snap frozen, and analyzed ex vivo by HR-MAS 1H NMR to quantify metabolite concentrations
    including glucose and lactate in nmol/mg tissue.
  interventions:
  - intervention_description: Surgical resection of primary pancreatic adenocarcinoma in patients without prior neoadjuvant
      chemotherapy, with intraoperative collection of tumor tissue and matched normal pancreatic parenchyma for ex vivo HR-MAS
      1H NMR metabolomics.
