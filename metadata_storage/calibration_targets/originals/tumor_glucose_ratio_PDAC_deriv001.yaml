empirical_data:
  assumptions:
  - description: Number of Monte Carlo samples used to approximate the distribution of the tumor-to-normal glucose ratio from
      the reported group-level means and SDs for PA and PP glucose concentrations.
    name: n_mc_samples
    rationale: A sample size of 200,000 draws provides stable estimates of the median and 95% CI for the ratio distribution
      with Monte Carlo error well below 1% for the summary statistics used in calibration.
    units: dimensionless
    value: 200000.0
  ci95:
  - - 0.16733131080721594
    - 5.048594066755652
  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n\n    # Literature-derived mean and\
    \ SD for glucose concentration (nmol/mg)\n    mean_pp = inputs['pp_glc_mean']\n    sd_pp = inputs['pp_glc_sd']\n    mean_pa\
    \ = inputs['pa_glc_mean']\n    sd_pa = inputs['pa_glc_sd']\n\n    # Number of Monte Carlo samples (modeling assumption)\n\
    \    n_samples = 200000\n    rng = np.random.default_rng(123)\n\n    # Convert mean/SD of a positive, right-skewed variable\
    \ into lognormal\n    # parameters for PP (normal pancreas) and PA (tumor)\n    mu_pp = np.log(mean_pp.magnitude ** 2\
    \ / np.sqrt(mean_pp.magnitude ** 2 + sd_pp.magnitude ** 2))\n    sigma_pp = np.sqrt(np.log(1.0 + (sd_pp.magnitude ** 2)\
    \ / (mean_pp.magnitude ** 2)))\n\n    mu_pa = np.log(mean_pa.magnitude ** 2 / np.sqrt(mean_pa.magnitude ** 2 + sd_pa.magnitude\
    \ ** 2))\n    sigma_pa = np.sqrt(np.log(1.0 + (sd_pa.magnitude ** 2) / (mean_pa.magnitude ** 2)))\n\n    # Sample lognormal\
    \ distributions for PP and PA glucose (nmol/mg)\n    samples_pp = rng.lognormal(mu_pp, sigma_pp, n_samples) * mean_pp.units\n\
    \    samples_pa = rng.lognormal(mu_pa, sigma_pa, n_samples) * mean_pa.units\n\n    # Compute tumor-to-normal glucose ratio;\
    \ units cancel to dimensionless\n    ratio_samples = samples_pa / samples_pp\n\n    median_obs = np.median(ratio_samples)\n\
    \    ci95_lower = np.percentile(ratio_samples, 2.5)\n    ci95_upper = np.percentile(ratio_samples, 97.5)\n\n    return\
    \ {\n        'median_obs': median_obs,\n        'ci95_lower': ci95_lower,\n        'ci95_upper': ci95_upper,\n    }"
