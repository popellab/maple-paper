key_assumptions:
- Glucose concentrations in both PP and PA (nmol/mg tissue) are modeled as lognormal distributions rather than normal, reflecting
  that metabolite concentrations are strictly positive and often right-skewed; this avoids negative sampled values and better
  matches biochemical variability.
- The ± values reported in Table 2 are interpreted as standard deviations (SD), not standard errors, based on the explicit
  statement 'Continuous variables are expressed as mean ± standard deviation (SD).' in the Results section.
- Within-patient pairing between PA and PP glucose measurements is not available; the tumor-to-normal glucose ratio distribution
  is therefore approximated by independently sampling from the group-level lognormal distributions for PA (n = 44) and PP
  (n = 9).
- The algebraic variable `glc` in the metabolism module is treated as a dimensionless tumor glucose level scaled to a normal
  reference, so it can be directly matched to the empirical tumor-to-normal ratio without additional unit conversions.
- The chemo-naive subgroup (PA and PP without neoadjuvant chemotherapy) is assumed to best match the model context of treatment-naive,
  resectable PDAC, whereas patients who received neoadjuvant chemotherapy are excluded from this calibration target.
key_study_limitations:
- Normal pancreatic parenchyma (PP) samples without neoadjuvant chemotherapy were available for only 9 patients, which limits
  the precision of the estimated normal glucose distribution and may underrepresent inter-patient variability.
- The tumor and normal tissue samples, while often collected from the same surgical specimen, are not reported as paired data
  with individual-level glucose values, so correlation between tumor and normal metabolism within patients cannot be captured
  explicitly.
- HR-MAS NMR quantification depends on sample handling, normalization by tissue weight, and calibration against an external
  lactate standard; systematic scaling errors in nmol/mg may affect both PP and PA measurements, though these should partially
  cancel in the ratio.
- The analyzed tissue pieces may not fully capture intra-tumoral heterogeneity or spatial gradients in glucose associated
  with hypoxia and perfusion differences within PDAC tumors.
- The QSP model does not explicitly include systemic glucose homeostasis or a separate normal pancreas compartment, so mapping
  ex vivo tissue metabolite levels onto the single-compartment tumor glucose variable `glc` omits potential contributions
  from endocrine regulation and regional metabolic differences.
observable:
  aggregation: null
  code: "def compute_observable(time, species_dict, constants, ureg):\n    \"\"\"Tumor glucose level as a dimensionless ratio.\n\
    \n    In the metabolism module, the algebraic variable `glc` represents\n    tumor glucose level scaled to a normal reference.\
    \ Because `glc` is\n    already defined as a dimensionless quantity (relative to normal\n    pancreas glucose), it can\
    \ be compared directly to the empirical\n    tumor-to-normal glucose ratio distribution derived from Battini\n    et al.\
    \ 2017.\n    \"\"\"\n    glc_tumor = species_dict['glc']\n    return glc_tumor.to('dimensionless')\n"
  constants: []
  experimental_denominator: null
  inputs: []
  mapping_rationale: Battini et al. measured absolute glucose concentrations in nmol/mg tissue for chemo-naive pancreatic
    adenocarcinoma (PA) tumors and normal pancreatic parenchyma (PP) using HR-MAS 1H NMR. From these data we derive a distribution
    for the tumor-to-normal glucose ratio. In the QSP model, the algebraic variable `glc` is implemented as a dimensionless
    tumor glucose level scaled to a normal reference (glc_normal). Therefore, `glc` can be used directly as the observable
    corresponding to the literature-derived tumor-to-normal glucose ratio without additional conversion factors.
  model_denominator_species: null
