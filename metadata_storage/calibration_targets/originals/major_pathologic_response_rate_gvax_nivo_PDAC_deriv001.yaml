study_interpretation: This calibration target captures the major pathologic response (MPR) rate in patients with borderline
  resectable pancreatic ductal adenocarcinoma (PDAC) treated with neoadjuvant chemotherapy followed by GVAX pancreas vaccine
  with low-dose cyclophosphamide, nivolumab, and stereotactic body radiation therapy (SBRT), as reported for the phase II
  trial NCT03161379. The Clin Cancer Research article by Agarwal et al. reports that 31 patients with borderline resectable
  PDAC were enrolled, 18 received at least one dose of combined immunotherapy, and 14 underwent definitive surgical resection
  after neoadjuvant therapy. A subsequent review article summarizing this trial reports a 35% major pathologic response rate,
  defined as <10% residual viable tumor, with a median overall survival of 20.4 months. We interpret this as approximately
  5 of 14 resected patients achieving MPR. In the QSP model, we represent MPR at the individual-patient level as the condition
  that the viable tumor burden in the primary tumor compartment (V_T.C1) at the time of resection is ≤10% of the baseline
  viable tumor burden before neoadjuvant therapy; aggregating across virtual patients yields a response rate directly comparable
  to the clinical MPR rate.
