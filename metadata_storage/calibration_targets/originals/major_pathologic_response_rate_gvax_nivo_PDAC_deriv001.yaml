empirical_data:
  assumptions:
  - description: Number of Monte Carlo samples used to propagate binomial sampling uncertainty in the major pathologic response
      rate.
    name: n_mc_samples
    rationale: 100,000 samples provide stable estimates of the median and 95% CI of the response-rate distribution with Monte
      Carlo error much smaller than the sampling uncertainty from n=14 patients.
    units: dimensionless
    value: 100000.0
  ci95:
  - - 0.1627792288018486
    - 0.6165227396635887
  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n\n    rng = np.random.default_rng(42)\n\
    \n    # Reported MPR rate in percent (e.g., 35 %) and number of resected patients\n    mpr_pct = inputs['mpr_rate_percent']\
    \  # Quantity with 'percent' units\n    n_resected = inputs['n_resected']     # dimensionless Quantity\n    n_mc_samples\
    \ = int(inputs['n_mc_samples'].magnitude)\n\n    # Convert percent to dimensionless proportion (e.g., 0.35)\n    p_hat\
    \ = mpr_pct.to('dimensionless').magnitude\n    n = int(n_resected.magnitude)\n\n    # Infer integer responder count k\
    \ from p_hat and n\n    k = int(round(p_hat * n))\n\n    # Beta posterior with uniform prior: Beta(k+1, n-k+1)\n    a\
    \ = k + 1\n    b = n - k + 1\n\n    samples = rng.beta(a, b, n_mc_samples) * ureg.dimensionless\n\n    median_obs = np.median(samples)\n\
    \    ci95_lower = np.percentile(samples, 2.5)\n    ci95_upper = np.percentile(samples, 97.5)\n\n    return {\n       \
    \ 'median_obs': median_obs,\n        'ci95_lower': ci95_lower,\n        'ci95_upper': ci95_upper,\n    }"
