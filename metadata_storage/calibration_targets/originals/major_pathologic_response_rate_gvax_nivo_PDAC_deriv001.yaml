key_assumptions:
- Major pathologic response (MPR) is assumed to correspond to <10% residual viable tumor cells in the resected primary PDAC
  specimen, consistent with contemporary definitions of MPR for neoadjuvant-treated pancreatic cancer. We map this to the
  model as a final viable tumor burden in the primary tumor compartment (V_T.C1) that is less than or equal to 10% of the
  baseline pre-treatment viable tumor burden.
- The reported 35% major pathologic response rate for NCT03161379 is interpreted as applying to the 14 patients who underwent
  definitive surgical resection, yielding an inferred responder count of approximately 5 (5/14 ≈ 35.7%). Because the publication
  accessible in this environment does not tabulate the exact MPR numerator, we infer k = 5 responders by rounding p_hat ×
  n and propagate this minor rounding uncertainty through the Beta distribution used in the Monte Carlo sampling.
- The sample size for the MPR endpoint is taken as n = 14 (resected patients with pathologic assessment), even though 31 patients
  were enrolled in the trial; patients who did not undergo resection are not included in the denominator for MPR because pathologic
  response could not be assessed without surgical specimens.
- Uncertainty in the true MPR proportion is modeled using a Beta(k+1, n−k+1) posterior distribution with a uniform prior,
  which is a standard conjugate-binomial approach. This assumes independent Bernoulli outcomes across patients and does not
  account for potential center-level clustering or other sources of overdispersion beyond binomial sampling error.
- We assume that the residual viable tumor fraction measured histologically at resection reflects the minimum tumor burden
  achieved during neoadjuvant therapy (i.e., there is no substantial regrowth between end of therapy and surgery), so that
  comparing the final simulated viable tumor burden in V_T.C1 to baseline is a reasonable approximation of the clinical MPR
  definition.
key_study_limitations:
- The exact number of patients achieving major pathologic response (numerator for the 35% rate) is not explicitly tabulated
  in the accessible summaries of the primary trial publication; we infer the numerator from the reported percentage (35%)
  and the known number of resected patients (n = 14), introducing small rounding uncertainty.
- The 35% major pathologic response rate is extracted from a secondary review article that summarizes the results of the NCT03161379
  trial rather than directly from the Clin Cancer Research full text, which is not accessible in this environment. Nonetheless,
  both sources describe the same patient cohort and treatment regimen.
- The trial population consists of borderline resectable PDAC patients treated at specialized centers under a specific neoadjuvant
  chemo-immunoradiotherapy protocol; generalizability of the MPR rate to other PDAC stages, institutions, or treatment regimens
  (e.g., chemotherapy-only neoadjuvant approaches) is limited.
- Pathologic assessment of residual viable tumor percentage is subject to inter-observer variability and potential sampling
  bias within the resected specimen; these sources of measurement error are not explicitly modeled in the current calibration
  target.
observable:
  aggregation:
    rationale: Major pathologic response is a population-level endpoint defined as the proportion of patients whose resected
      primary tumor shows <10% residual viable tumor after neoadjuvant therapy. To connect this to the QSP model, we evaluate
      for each virtual patient whether the final simulated viable tumor burden in the primary tumor compartment (V_T.C1) is
      less than or equal to 0.10 times the baseline viable tumor burden, and then aggregate across patients as a response
      rate.
    threshold_code: "def classify_patient(time, species_dict, constants, ureg):\n    \"\"\"Classify a virtual patient as achieving\
      \ major pathologic response (MPR).\n\n    MPR is defined as <10% residual viable tumor at resection. We approximate\n\
      \    resection as occurring at the final simulated time point and compare the\n    viable tumor cell count at that time\
      \ to the baseline value.\n    \"\"\"\n    tumor = species_dict['V_T.C1']\n    baseline = tumor[0]\n    fraction = (tumor\
      \ / baseline).to('dimensionless')\n    residual_fraction = fraction[-1]\n    return residual_fraction.magnitude <= 0.10\n"
    time_point: null
    time_unit: null
    type: response_rate
  code: "def compute_observable(time, species_dict, constants, ureg):\n    \"\"\"Compute per-patient residual viable tumor\
    \ fraction over time.\n\n    Major pathologic response (MPR) is defined as <10% residual viable tumor\n    at resection.\
    \ We approximate this by the ratio of viable tumor cells at\n    resection to the baseline viable tumor cell count in\
    \ the primary tumor\n    compartment (V_T.C1).\n    \"\"\"\n    tumor = species_dict['V_T.C1']  # viable cancer cells\
    \ over time\n    baseline = tumor[0]\n    # Fraction of baseline viable tumor remaining at each time point\n    fraction\
    \ = (tumor / baseline).to('dimensionless')\n    return fraction\n"
  constants: []
  experimental_denominator: Baseline viable tumor burden in the primary pancreatic tumor (pre-treatment viable tumor cells).
  inputs: []
  mapping_rationale: Clinical major pathologic response (MPR) after neoadjuvant therapy is defined as <10% residual viable
    tumor in the resected primary PDAC specimen. In the QSP model, we map this to the fraction of viable cancer cells remaining
    in the primary tumor compartment (V_T.C1) at the time of surgical resection relative to the baseline viable tumor burden
    before neoadjuvant therapy.
  model_denominator_species:
  - V_T.C1
  species:
  - V_T.C1
  support: unit_interval
  units: dimensionless
  unmodeled_denominator_components: None. Both baseline and residual tumor viability are represented by the modeled viable
    cancer-cell population V_T.C1 in the primary tumor compartment.
