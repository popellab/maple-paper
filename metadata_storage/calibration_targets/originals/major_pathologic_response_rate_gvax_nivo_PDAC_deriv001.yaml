  doi: 10.1158/1078-0432.CCR-24-3403
  first_author: Agarwal
  source_tag: Agarwal2025_GVAXNivoSBRT
  title: A Phase II Study of Neoadjuvant GVAX and Cyclophosphamide Combined with Nivolumab and SBRT Followed by Surgery in
    Borderline Resectable Pancreatic Adenocarcinoma
  year: 2025
scenario:
  description: Borderline resectable pancreatic ductal adenocarcinoma treated with neoadjuvant chemotherapy followed by GVAX/cyclophosphamide/nivolumab
    and stereotactic body radiation therapy (SBRT), then definitive surgical resection of the primary tumor.
  interventions:
  - intervention_description: Neoadjuvant systemic chemotherapy with modified FOLFIRINOX or gemcitabine plus nab-paclitaxel
      per institutional standards for borderline resectable PDAC, initiated after diagnosis and completed before immunotherapy
      and SBRT.
  - intervention_description: Two cycles of combination immunotherapy consisting of low-dose cyclophosphamide, nivolumab 240
      mg IV, and GVAX pancreas vaccine. The first cycle is started 4–6 weeks after completion of neoadjuvant chemotherapy;
      nivolumab is administered one day before GVAX, and cyclophosphamide is given per protocol prior to vaccination.
  - intervention_description: Stereotactic body radiation therapy (SBRT) to the pancreatic tumor, delivered as 6.6 Gy per
      fraction over 5 consecutive days (total 33 Gy) starting during the second cycle of immunotherapy (3 weeks after the
      first immunotherapy cycle).
  - intervention_description: Definitive surgical resection of the primary pancreatic tumor (e.g., pancreaticoduodenectomy
      or distal pancreatectomy with vascular reconstruction as needed) performed after completion of the second immunotherapy
      cycle and SBRT, with pathologic assessment of residual viable tumor percentage in the resected specimen.
