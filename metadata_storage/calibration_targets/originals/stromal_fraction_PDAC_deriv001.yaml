  - description: Number of Monte Carlo samples used to construct the calibration target distribution from the reported median
      TSP (degenerate distribution centered at the median).
    name: n_mc_samples
    rationale: 10,000 samples is a standard choice that provides numerically stable sample medians and quantiles while keeping
      computation inexpensive; here all samples are set to the reported median, so this mainly follows the standard Monte
      Carlo template.
    units: dimensionless
    value: 10000.0
  ci95:
  - - 0.661
    - 0.661
  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n\n    # Reported median tumor stroma\
    \ percentage (TSP, % of tumor area occupied by stroma)\n    median_percent = inputs['tsp_median_percent']  # Pint Quantity\
    \ with 'percent' units\n    n_mc_samples = int(inputs['n_mc_samples'].magnitude)\n\n    # Convert percent to dimensionless\
    \ fraction [0, 1]\n    median_frac = median_percent.to('dimensionless')\n\n    # Construct a degenerate empirical distribution\
    \ concentrated at the reported median.\n    # This preserves the reported central tendency exactly while keeping the MC\
    \ interface.\n    samples = np.full(n_mc_samples, median_frac.magnitude) * median_frac.units\n\n    median_obs = np.median(samples)\n\
    \    ci95_lower = np.percentile(samples, 2.5)\n    ci95_upper = np.percentile(samples, 97.5)\n\n    return {\n       \
    \ 'median_obs': median_obs,\n        'ci95_lower': ci95_lower,\n        'ci95_upper': ci95_upper,\n    }\n"
