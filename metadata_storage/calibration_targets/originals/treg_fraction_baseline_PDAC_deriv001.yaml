key_assumptions:
- The reported "average" Foxp3+ T cell density of 48.5 cells/mm^2 is treated as the central tendency (approximated as the
  median) of the population distribution for calibration, assuming that mean and median are similar for this cohort-level
  summary.
- Foxp3+ cells identified by single-marker IHC are interpreted as regulatory T cells (Tregs), acknowledging that transient
  Foxp3 expression in activated conventional CD4+ T cells may introduce some contamination but is standard for Treg quantification
  in FFPE tissues.
- Tumor cross-sectional area for mapping model outputs to IHC-derived densities is approximated as cancer cell count (V_T.C1)
  times average PDAC cancer-cell cross-sectional area from the reference database, effectively neglecting stromal and acellular
  components and assuming cancer cells dominate the tumor cross-sectional geometry.
- Patients are treated as systemically treatment-naive at the time of tissue sampling because the study does not report any
  neoadjuvant chemotherapy or radiotherapy; chemotherapy was administered to 80% of patients only upon recurrence after surgery.
- Because the study does not report variance (SD/SEM) for Foxp3+ T cell density, a coefficient of variation of 1.0 (100%)
  is assumed to construct a lognormal uncertainty distribution, consistent with typical variability observed for immune cell
  densities in solid tumors.
key_study_limitations:
- Single-center retrospective cohort from a Japanese institution (n=85), which may limit generalizability to broader PDAC
  populations and different treatment settings.
- Foxp3+ T cell density was measured on 10 random high-power fields per tumor, which may not fully capture spatial heterogeneity
  of Treg infiltration within the entire tumor mass.
- The paper reports only a single average Foxp3+ T cell density (48.5 cells/mm^2) without SD, SEM, or IQR, requiring an assumed
  coefficient of variation for uncertainty quantification.
- Single-marker Foxp3 IHC cannot fully distinguish suppressive Tregs from transiently Foxp3-expressing effector CD4+ T cells,
  potentially biasing the estimated Treg density.
- Some patients had AJCC stage III disease, and detailed information on any neoadjuvant therapy is not provided; while the
  cohort is described as R0-resected, unreported preoperative treatments could modestly alter the immune infiltrate in a subset
  of patients.
observable:
  aggregation: null
  code: "def compute_observable(time, species_dict, constants, ureg):\n    # Compute Foxp3+ regulatory T cell density in the\
    \ primary tumor compartment\n    # as Treg cell count divided by tumor cross-sectional area.\n    # Tumor area is approximated\
    \ as cancer cell count times average PDAC cancer-cell cross-sectional area.\n\n    treg = species_dict['V_T.Treg']   \
    \        # cells\n    cancer_cells = species_dict['V_T.C1']     # cells\n\n    area_per_cancer_cell = constants['area_per_cancer_cell']\
    \  # mm^2/cell\n\n    # Tumor cross-sectional area in mm^2\n    tumor_area = cancer_cells * area_per_cancer_cell  # (cell)\
    \ * (mm^2/cell) = mm^2\n\n    # Treg density in cells/mm^2\n    density = (treg / tumor_area).to('cell / millimeter**2')\n\
    \    return density"
  constants:
  - biological_basis: PDAC cancer-cell cross-sectional area taken directly from the curated reference value 'pdac_cancer_cell_cross_section',
      which is derived from an average PDAC cancer cell diameter of approximately 17 micrometers assuming a circular cross-section
      (area = pi * r^2).
    name: area_per_cancer_cell
    reference_db_name: pdac_cancer_cell_cross_section
    reference_db_names: null
    source_tag: null
    source_type: reference_db
    units: millimeter**2 / cell
    value: 0.000227
  inputs: []
  mapping_rationale: The paper quantifies Foxp3+ regulatory T cell density as the number of Foxp3+ cells per mm^2 of tumor
    area in formalin-fixed, paraffin-embedded PDAC resection specimens, counted over 10 random tumor fields at 400x magnification.
    In the QSP model, V_T.Treg represents the total number of Treg cells in the tumor compartment and V_T.C1 represents the
    total number of cancer cells. Approximating tumor cross-sectional area as cancer cell count times average PDAC cancer-cell
    cross-sectional area (from the reference database) allows us to compute a model-predicted Treg density (cells/mm^2) that
    is directly comparable to the IHC-derived density reported in the study.
  species:
  - V_T.Treg
  - V_T.C1
  support: positive
  units: cell / millimeter**2
