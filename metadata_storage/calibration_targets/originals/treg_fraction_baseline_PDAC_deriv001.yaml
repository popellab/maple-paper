study_interpretation: Kiryu et al. (BMC Cancer 2021) analyzed immune-cell infiltrates in the tumor microenvironment of 85
  patients with pancreatic ductal adenocarcinoma who underwent R0 surgical resection. Formalin-fixed, paraffin-embedded primary
  tumor specimens were sectioned at 4 micrometers and stained by immunohistochemistry for CD3, CD4, CD8, PD-1, and Foxp3.
  For Foxp3+ regulatory T cells, the authors counted immunolabeled cells in 10 random tumor areas at 400x magnification and
  expressed results as cell counts per mm^2 of tumor area. They report that the average Foxp3+ T cell density across these
  tumor fields was 48.5 cells/mm^2 and used the median cell counts/mm^2 to dichotomize patients into high- and low-density
  groups for survival analysis. All patients had resectable PDAC treated with upfront R0 resection, and 80% received chemotherapy
  only after recurrence, so the measured Foxp3+ densities represent untreated baseline tumors at the time of surgery.
