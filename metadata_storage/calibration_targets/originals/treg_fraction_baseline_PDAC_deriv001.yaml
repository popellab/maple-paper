empirical_data:
  assumptions:
  - description: Assumed coefficient of variation for Foxp3+ regulatory T cell density in PDAC tumor tissue used to construct
      a lognormal distribution around the reported central value.
    name: assumed_cv_treg_density
    rationale: The study reports only a single average Foxp3+ T cell density (48.5 cells/mm^2) without any dispersion measure.
      Published immune cell densities in solid tumors commonly show coefficients of variation on the order of 50–200%. We
      therefore assume CV=1.0 (100%) as a conservative, order-of-magnitude representation of biological variability when deriving
      uncertainty for this calibration target.
    units: dimensionless
    value: 1.0
  ci95:
  - - 9.49
    - 247.99
  distribution_code: "def derive_distribution(inputs, ureg):\n    import math\n\n    # Reported central tendency for Foxp3+\
    \ T cell density (treated as median)\n    median_val = inputs['treg_density_median']  # Pint Quantity, cell/mm^2\n\n \
    \   # Assumed coefficient of variation (dimensionless Quantity)\n    cv = inputs['assumed_cv_treg_density']\n\n    # For\
    \ a lognormal distribution with median m and CV, we can compute sigma in log-space as:\n    # CV^2 = exp(sigma^2) - 1\
    \  =>  sigma = sqrt(log(1 + CV^2))\n    sigma = math.sqrt(math.log(1.0 + cv.magnitude**2))\n\n    # The median in linear\
    \ space is simply m\n    m = median_val.magnitude\n\n    # 95% CI bounds for a lognormal with given median and sigma\n\
    \    # Using standard normal quantiles z = ±1.96\n    z = 1.96\n    lower_mag = m * math.exp(-z * sigma)\n    upper_mag\
    \ = m * math.exp(z * sigma)\n\n    lower = lower_mag * median_val.units\n    upper = upper_mag * median_val.units\n\n\
    \    return {\n        'median_obs': median_val,\n        'ci95_lower': lower,\n        'ci95_upper': upper,\n    }"
  index_type: null
  index_unit: null
  index_values: null
