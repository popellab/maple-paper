empirical_data:
  assumptions:
  - description: Number of Monte Carlo samples drawn from the beta distribution for the PD-1+ CD4+ fraction to estimate median
      and 95% CI.
    name: n_mc_samples
    rationale: 100,000 samples provide stable estimates of median and quantiles for the beta distribution while remaining
      computationally inexpensive.
    units: dimensionless
    value: 100000.0
  ci95:
  - - 0.36783151096214367
    - 0.9788846598876484
  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    rng = np.random.default_rng(42)\n\
    \    mean_frac = inputs['mean_frac_pd1_cd4_tumor']\n    sem_frac = inputs['sem_frac_pd1_cd4_tumor']\n    n_patients =\
    \ inputs['n_patients_pd1_flow']\n    # Convert SEM to SD using n\n    sd_frac = sem_frac * np.sqrt(n_patients.magnitude)\n\
    \    mean_mag = mean_frac.magnitude\n    sd_mag = sd_frac.magnitude\n    var_mag = sd_mag ** 2\n    # Fit a beta distribution\
    \ matching mean and variance on [0, 1]\n    mean_var_ratio = mean_mag * (1.0 - mean_mag) / var_mag\n    alpha = mean_mag\
    \ * (mean_var_ratio - 1.0)\n    beta_param = (1.0 - mean_mag) * (mean_var_ratio - 1.0)\n    samples_np = rng.beta(alpha,\
    \ beta_param, 100000)\n    samples = samples_np * ureg.dimensionless\n    return {\n        'median_obs': np.median(samples),\n\
    \        'ci95_lower': np.percentile(samples, 2.5),\n        'ci95_upper': np.percentile(samples, 97.5),\n    }"
