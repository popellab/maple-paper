  - description: Number of Monte Carlo samples used to sample a lognormal distribution for tumor volume doubling time based
      on the reported mean and SD.
    name: n_mc_samples
    rationale: 100,000 samples provide stable (<1%) Monte Carlo error for median and 95% CI estimates of a moderately skewed
      lognormal distribution.
    units: dimensionless
    value: 100000.0
  ci95:
