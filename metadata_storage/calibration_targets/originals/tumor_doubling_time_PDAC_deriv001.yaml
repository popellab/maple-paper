    - 481.6597553258588
  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    mean_vdt = inputs['mean_vdt'].to('day')\n\
    \    sd_vdt = inputs['sd_vdt'].to('day')\n    n_mc = int(inputs['n_mc_samples'].magnitude)\n    m = mean_vdt.magnitude\n\
    \    s = sd_vdt.magnitude\n    # Convert mean and SD on linear scale to lognormal parameters\n    sigma2 = np.log(1.0\
    \ + (s**2) / (m**2))\n    sigma = np.sqrt(sigma2)\n    mu = np.log(m) - sigma2 / 2.0\n    rng = np.random.default_rng(42)\n\
    \    samples = rng.lognormal(mu, sigma, n_mc) * ureg.day\n    median_obs = np.median(samples)\n    ci95_lower = np.percentile(samples,\
    \ 2.5)\n    ci95_upper = np.percentile(samples, 97.5)\n    return {\n        'median_obs': median_obs,\n        'ci95_lower':\
    \ ci95_lower,\n        'ci95_upper': ci95_upper,\n    }\n"
