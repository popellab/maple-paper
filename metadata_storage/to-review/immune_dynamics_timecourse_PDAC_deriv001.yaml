study_interpretation: |
  Yang et al. 2022 performed comprehensive CyTOF-based immune profiling across five developmental stages of PDAC in KPC mice (Normal → ADM → PanIN → Early-stage Tumor → Late-stage Tumor), revealing a two-stage immunosuppression model. The submodel uses the actual mechanistic structure from the QSPIO-PDAC model: (1) Treg and CD8 T cell trafficking both depend on cancer cell burden via a Hill function, but CD8s are additionally blocked by CXCL12-mediated exclusion while Tregs are not - this differential exclusion explains the transient Treg peak at ADM; (2) MDSC recruitment is driven by CCL2 chemokine production which scales with tumor burden; (3) M2→M1 macrophage polarization depends on IFNg from CD8 T cells, so as CD8s get excluded by CXCL12, IFNg drops and M2/Arg-1+ macrophages dominate. This mechanistic coupling through the shared CXCL12 exclusion factor enables joint identifiability of q_Treg_T_in, k_MDSC_rec, and k_M1_pol from the stage-stratified immune profiling data.

key_assumptions:
- |
  The five pathological stages (Normal, ADM, PanIN, ES Tumor, LS Tumor) can be mapped to a normalized tumor burden B in [0,1], representing the effective cancer cell density that drives immune cell recruitment.
- |
  CXCL12-mediated T cell exclusion increases with tumor burden and affects CD8+ effector T cells but NOT regulatory T cells, consistent with the differential rate laws in the QSPIO-PDAC model (q_CD8_T_in has a (1-H_CXCL12_Texcl) term while q_Treg_T_in does not).
- |
  CCL2 chemokine production scales with tumor burden and drives MDSC recruitment via a Michaelis-Menten term, as specified in the QSPIO-PDAC model reaction for MDSC influx.
- |
  IFNg production is proportional to tumor-infiltrating CD8+ T cell density; as CXCL12 exclusion reduces CD8 infiltration, IFNg drops, reducing the M2→M1 polarization rate governed by k_M1_pol.
- |
  At each developmental stage, immune cell fractions reflect a quasi-steady-state balance between influx/polarization and death/efflux rates.

key_study_limitations:
- |
  The exact timing of each developmental stage varies between individual KPC mice due to stochastic Trp53 loss, introducing uncertainty in the mapping from pathological stage to tumor burden.
- |
  Sample sizes per stage are relatively low (total n=22 mice across 5 stages), limiting the precision of percentage estimates at each stage.
- |
  The CyTOF analysis provides percentages of immune cell subsets but not absolute cell numbers, so the model constrains ratios of trafficking/polarization rates rather than absolute magnitudes.
- |
  The CXCL12 exclusion Hill function parameters (K_excl) are not directly measured and must be fixed or marginalized over; only the shape of the exclusion curve is constrained by the differential Treg/CD8 patterns.
- |
  Mouse-to-human translation introduces additional uncertainty, particularly for CXCL12 exclusion dynamics which may differ between species.

