calibration:
  parameters:
  - name: N_IL2_CD4
    units: dimensionless
    prior:
      distribution: normal
      mu: 8.0
      sigma: 2.0
      lower:
      upper:
      rationale: |
        Centered on approximately eight generations, matching the maximum resolvable divisions ("divisions 8+") for naive CD4+ T cells stimulated with anti-CD3, IL-2, and IL-4 in Gett and Hodgkin 1998. A relatively wide sigma of 2 divisions allows for unresolved additional divisions beyond the CFSE detection limit, differences between mouse and human CD4 T cells, and context-dependent modulation by other signals (antigen, co-stimulation, other cytokines).

  forward_model:
    independent_variable:
    state_variables:
    type: algebraic
    formula: N_IL2_CD4 = max_divisions_cd4_antiCD3_IL2_IL4
    code: |
      def compute(params, inputs, ureg):
          """Forward model: N_IL2_CD4 is directly the max divisions."""
          N = params['N_IL2_CD4']
          return N * ureg.dimensionless
    code_julia: |
      function compute(params, inputs)
          N = params["N_IL2_CD4"]
          return N
      end
    data_rationale: |
      Gett and Hodgkin (1998) tracked division of naive murine CD4+ T cells labeled with CFSE and stimulated with plate-bound anti-CD3, IL-2 (100 U/ml), and IL-4 (100 U/ml). Under these conditions, cells progressed through multiple synchronous divisions, and the authors reported that divisions beyond seven cycles were indistinguishable and were grouped as "divisions 8+" due to the CFSE detection limit. This provides a direct experimental estimate of the maximum number of cell generations achieved by strongly IL-2-supported naive CD4+ T cells in vitro.
    submodel_rationale: |
      In the full QSPIO-PDAC model, N_IL2_CD4 represents a maximum number of activated CD4 T cell generations driven by IL-2 (a division-destiny-like cap). The Gett and Hodgkin system provides naive CD4+ T cells with strong TCR stimulation plus exogenous IL-2 and IL-4, resulting in repeated symmetric divisions until proliferation slows. Since the key outcome is the maximum division number rather than detailed time-course dynamics, a direct mapping of the experimentally observed maximal division index to N_IL2_CD4 is mechanistically consistent. The division-destiny framework used conceptually in the QSP model directly parallels the division limit inferred from CFSE peaks in this experiment.

  error_model:
  - name: N_IL2_CD4_estimate
    units: dimensionless
    uses_inputs:
    - max_divisions_cd4_antiCD3_IL2_IL4
    - assumed_cv
    sample_size: 5
    sample_size_rationale: |
