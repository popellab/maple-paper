study_interpretation: |
  Gett and Hodgkin (1998) used CFSE-labeled naive murine CD4+ T cells stimulated with plate-bound anti-CD3, IL-2, and IL-4 in APC-free cultures to quantify how many times T cells divide and how cytokine secretion relates to division number. They showed that cells can progress through at least seven to eight well-resolved divisions under these IL-2-supplemented conditions, with late divisions (5–8) still actively cycling and viable. The CFSE assay has a practical detection limit of seven to eight division cycles due to autofluorescence, beyond which further divisions cannot be resolved and are grouped as "8+". In the context of the QSPIO-PDAC model, this provides an experimental anchor for the scale of IL-2-supported CD4+ T cell division destiny: activated naive CD4+ T cells in a strong IL-2 environment can realistically achieve on the order of 7–10 generations before proliferation slows and cells differentiate or die. Mapping this observed maximal division index to the N_IL2_CD4 parameter captures the mechanistic role of IL-2 as a driver of repeated CD4 T cell divisions while acknowledging that additional signals (TCR, IL-4, co-stimulation) also contribute.

key_assumptions:
- |
  N_IL2_CD4 in the full QSP model can be reasonably interpreted as the approximate maximum number of CD4+ T cell divisions achievable under IL-2-supported activation, i.e., a division-destiny-like cap on generations.
- |
  The CFSE-based detection limit of seven to eight division cycles in Gett and Hodgkin (1998) is close to the true biological division destiny for naive CD4+ T cells under strong anti-CD3, IL-2, and IL-4 stimulation; any additional undetected divisions are modest and are captured by the broad prior and uncertainty model.
- |
  The contribution of IL-4 to division destiny in this culture is secondary to its role as a differentiation factor; its quantitative impact on the maximum number of divisions is assumed to be small relative to the effect of IL-2 and TCR signaling, and is therefore absorbed into the effective N_IL2_CD4 parameter.
- |
  Division destiny properties measured in naive murine CD4+ T cells ex vivo are assumed to be qualitatively similar in human CD4+ T cells relevant to PDAC, after accounting for inter-species and context differences via wide priors.
- |
  The maximal number of generations induced by IL-2 does not strongly depend on antigen specificity or clone, but is mainly governed by generic signaling and intrinsic division programs, consistent with the division destiny literature.

key_study_limitations:
- |
  The primary data are from murine B10.BR naive CD4+ T cells in vitro, not from human CD4+ T cells or from PDAC tumor-draining lymph nodes or tumor microenvironments. Translational uncertainty is significant.
- |
  The culture conditions include strong plate-bound anti-CD3 and high-dose IL-4, in addition to IL-2, so the observed division limit reflects the combined effect of TCR, IL-2 and IL-4 rather than IL-2 alone. We approximate this combined limit as an effective IL-2-driven division destiny for use in the QSP model.
- |
  The CFSE assay has an intrinsic limit of resolution at seven to eight divisions; any additional divisions beyond this cannot be distinguished and are grouped into an "8+" bin. Thus, the measurement provides a lower bound on the true maximal division number.
- |
  The experiment tracks naive CD4+ T cells; effector or memory CD4+ T cells, or cells within an inflammatory tumor microenvironment, may have different division destinies under IL-2 stimulation.
- |
  Time-course information on mean division number (e.g., MDN vs time) is described qualitatively but not reported as explicit numeric values in the text, preventing calibration of division rate constants or more detailed dynamic submodels from this single study.

