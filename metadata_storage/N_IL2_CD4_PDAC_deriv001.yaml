    observation_code: |
      def derive_observation(inputs, sample_size, ureg):
          """
          Derive observation from CFSE division tracking.

          The forward model predicts max divisions directly, so we return
          the observed max divisions with SD based on assumed CV.
          """
          max_div = inputs['max_divisions_cd4_antiCD3_IL2_IL4'].magnitude
          cv = inputs['assumed_cv'].magnitude
          sd = cv * max_div  # ~2 divisions for max_div=8, CV=0.25
          observed_value = max_div * ureg.dimensionless

          return {
              'value': observed_value,
              'sd': sd,  # dimensional for normal likelihood
              'sd_uncertain': False,  # SD derived from assumed CV
              'n': sample_size,
          }
    likelihood:
      distribution: normal
      rationale: |
        We treat the experimental proxy (max_divisions_cd4_antiCD3_IL2_IL4) as a noisy observation of the latent division-destiny parameter N_IL2_CD4 with approximately two divisions of experimental and biological scatter based on 25% CV.

  identifiability_notes: |
    This calibration uses a single in vitro proxy measurement of the maximum resolvable division number for naive murine CD4+ T cells under strong anti-CD3, IL-2 and IL-4 stimulation. As a result, N_IL2_CD4 is only weakly constrained: (1) the true biological division destiny may exceed the CFSE detection limit of 7-8 cycles; (2) IL-4 and strong TCR signals also contribute to division destiny but are not decomposed from the IL-2 contribution; and (3) the translation from naive murine CD4+ T cells in vitro to human tumor-infiltrating or lymph-node-resident CD4+ T cells in PDAC is uncertain. The prior on N_IL2_CD4 is therefore deliberately broad, and this submodel should be viewed as providing an order-of-magnitude anchor for the maximum number of IL-2-supported divisions rather than a tightly identified parameter. Additional data (e.g., quantitative division-destiny analyses with IL-2 titrations in CD4+ T cells, or human primary CD4+ T cell division tracking under clinically relevant cytokine conditions) would be required for sharper identification.
