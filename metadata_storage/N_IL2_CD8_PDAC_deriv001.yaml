  identifiability_notes: |
    This submodel constrains N_IL2_CD8 through two independent observations of fold-increase in OT-I memory CD8 T cells (40x at day 10, 70x at day 30). While both observations constrain the same parameter, they provide somewhat redundant information since the forward model (2^N) predicts a single fold-increase value. The day 10 observation (40x ± 15) provides tighter constraint than day 30 (70x ± 34). The model cannot distinguish IL-2 effects on proliferation vs. survival. N_IL2_CD8 may be correlated in the full QSP model with other parameters controlling CD8 survival, contraction, and baseline division destiny from TCR and costimulation signals.
