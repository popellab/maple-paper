calibration:
  parameters:
  - name: N_IL2_CD8
    units: dimensionless
    prior:
      distribution: normal
      mu: 5.0
      sigma: 2.0
      lower: 0.0
      upper: 15.0
      rationale: |
        Wide prior for maximum number of IL-2-driven CD8 T cell generations, centered around ~5 divisions with generous uncertainty to accommodate different experimental systems and potential species differences.
  state_variables:
  model:
    data_rationale: |
      Castro et al. 2012 quantified that transient high-affinity IL-2 receptor stimulation via IL-2/anti-IL-2 complexes led to a 40- to 70-fold increase in antigen-specific OT-I CD8 memory T cell numbers at 10 and 30 days post-priming compared with peptide/LPS alone. This fold-increase acts as a proxy for the cumulative IL-2-driven proliferation and survival advantage acquired during priming.
    submodel_rationale: |
      In the full QSPIO-PDAC model, N_IL2_CD8 represents the maximum number of CD8 T cell generations attributable to IL-2 signaling (division destiny style cap). Assuming that extra IL-2-driven divisions amplify T cell numbers approximately as 2^N in the expansion phase, the additional IL-2-specific generations can be estimated as N_IL2_CD8 = log2(fold_increase_due_to_IL2). Using fold expansion of OT-I memory CD8 T cells under IL-2/anti-IL-2 complex treatment thus provides a mechanistic proxy for this division cap.
    type: direct_conversion
    formula: N_IL2_CD8 = log2(fold_increase_IL2_memory)
  independent_variable:
  measurements:
  - name: N_IL2_CD8_estimate_from_OTI_memory_fold
    observable:
    units: dimensionless
    uses_inputs:
    - fold_increase_memory_day10_min
    - fold_increase_memory_day30_max
    evaluation_points:
    - 0.0
    sample_size: 3
    sample_size_rationale: |
      Castro et al. report data as mean +/- SE from 3-9 mice per time point; we conservatively take n=3 as the effective sample size for the 40- to 70-fold increase in OT-I memory cells.
    distribution_code: |
      def derive_distribution(inputs, ureg):
          import numpy as np
          # Extract lower and upper reported fold-changes in OT-I memory cells
          f_low = inputs['fold_increase_memory_day10_min'].magnitude
          f_high = inputs['fold_increase_memory_day30_max'].magnitude

          # Treat f_low and f_high as approximate 95 percent interval bounds
          # for a lognormal distribution of the IL-2-driven fold increase.
          mu_log = 0.5 * (np.log(f_low) + np.log(f_high))
          sigma_log = (np.log(f_high) - np.log(f_low)) / (2.0 * 1.96)

          # Sample fold-increase values on the original scale
          fold_samples = np.random.lognormal(mean=mu_log, sigma=sigma_log, size=10000)

          # Map fold increase to additional IL-2-driven generations
          # assuming each division doubles cell number: fold = 2^N.
          N_samples = np.log2(fold_samples)

          return {
              'median': float(np.median(N_samples)),
              'ci95_lower': float(np.percentile(N_samples, 2.5)),
              'ci95_upper': float(np.percentile(N_samples, 97.5)),
          }
    likelihood:
      distribution: normal
      rationale: |
        We treat the derived distribution over N_IL2_CD8 as a summary observation on the maximum IL-2-driven CD8 division generations; a normal likelihood on N_IL2_CD8 in the calibration will be matched to this derived median and CI.
  identifiability_notes: |
    This submodel constrains N_IL2_CD8 primarily through a single proxy observable (fold-change in OT-I memory CD8 T cells with vs. without IL-2 complexes). As such, it provides an order-of-magnitude estimate for the maximum IL-2-driven generations but cannot distinguish IL-2 effects on proliferation vs. survival. N_IL2_CD8 may be correlated in the full QSP model with other parameters controlling CD8 survival, contraction, and baseline division destiny from TCR and costimulation signals. Additional in vitro CFSE/CTV division destiny data under graded IL-2 would improve identifiability and separation of IL-2-specific division effects from survival effects.
