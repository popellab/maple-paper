calibration:
  parameters:
  - name: N_IL2_CD8
    units: dimensionless
    prior:
      distribution: normal
      mu: 5.0
      sigma: 2.0
      lower: 0.0
      upper: 15.0
      rationale: |
        Wide prior for maximum number of IL-2-driven CD8 T cell generations, centered around ~5 divisions with generous uncertainty to accommodate different experimental systems and potential species differences.

  forward_model:
    independent_variable:
    state_variables:
    type: algebraic
    formula: N_IL2_CD8 = log2(fold_increase_IL2_memory)
    code: |
      def compute(params, inputs, ureg):
          """Forward model: given N_IL2_CD8, predict fold increase."""
          import numpy as np
          N = params['N_IL2_CD8']
          fold_increase = 2.0 ** N
          return fold_increase * ureg.dimensionless
    code_julia: |
      function compute(params, inputs)
          N = params["N_IL2_CD8"]
          fold_increase = 2.0 ^ N
          return fold_increase
      end
    data_rationale: |
      Castro et al. 2012 quantified that transient high-affinity IL-2 receptor stimulation via IL-2/anti-IL-2 complexes led to a 40- to 70-fold increase in antigen-specific OT-I CD8 memory T cell numbers at 10 and 30 days post-priming compared with peptide/LPS alone. This fold-increase acts as a proxy for the cumulative IL-2-driven proliferation and survival advantage acquired during priming.
    submodel_rationale: |
      In the full QSPIO-PDAC model, N_IL2_CD8 represents the maximum number of CD8 T cell generations attributable to IL-2 signaling (division destiny style cap). Assuming that extra IL-2-driven divisions amplify T cell numbers approximately as 2^N in the expansion phase, the additional IL-2-specific generations can be estimated as N_IL2_CD8 = log2(fold_increase_due_to_IL2). Using fold expansion of OT-I memory CD8 T cells under IL-2/anti-IL-2 complex treatment thus provides a mechanistic proxy for this division cap.

  error_model:
  - name: N_IL2_CD8_from_day10_fold_increase
    units: dimensionless
    uses_inputs:
    - fold_increase_memory_day10
    - fold_increase_memory_day10_sem
    sample_size: 6
    sample_size_rationale: |
      Castro et al. report data as mean ± SE from 3-9 mice per time point; using n=6 as midpoint.
    observation_code: |
      def derive_observation(inputs, sample_size, ureg):
          """
          Derive observation from day 10 fold expansion data.

          The forward model predicts fold increase (2^N), so we compare against
          the observed fold increase at day 10 with its estimated uncertainty.
          """
          observed_value = inputs['fold_increase_memory_day10'].magnitude * ureg.dimensionless
          sem = inputs['fold_increase_memory_day10_sem'].magnitude

          return {
              'value': observed_value,
              'sd': sem,
              'sd_uncertain': True,  # estimated from figure digitization
              'n': sample_size,
          }
    likelihood:
      distribution: normal
      rationale: |
        Normal likelihood on fold-increase. The forward model predicts 2^N_IL2_CD8,
        which is compared against the observed 40-fold increase at day 10.

