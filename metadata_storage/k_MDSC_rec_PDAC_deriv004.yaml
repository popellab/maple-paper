calibration:
  parameters:
  - name: k_MDSC_rec
    units: cell / (milliliter * day)
    prior:
      distribution: lognormal
      mu: 15.4
      sigma: 1.0
      lower:
      upper:
      rationale: |
        Centered on a back-of-the-envelope estimate from the increase in splenic MDSC fraction from 2% (0.02) to 29% (0.29) over 27 days in Panc02-bearing mice, assuming a typical splenocyte density of 5e8 cell/mL. Wide sigma (1.0 in log-space) allows ~10-fold variability to account for model and translation uncertainty.
  forward_model:
    data_rationale: |
      The study reports baseline and day-27 percentages of CD11b+Gr1+ MDSC among splenocytes in Panc02 tumor-bearing mice. Interpreting the net increase in MDSC fraction over 27 days as being driven predominantly by tumor-induced recruitment from bone marrow, we can relate the recruitment rate per volume (k_MDSC_rec) to the observed change in fraction via a simple accumulation model.
    submodel_rationale: |
      In the full QSPIO-PDAC model, k_MDSC_rec controls the source term null -> V_T.MDSC with units cell/(mL*day). Here we construct a surrogate compartment (spleen) where MDSC are produced by a constant influx term with rate k_MDSC_rec per unit volume and negligible loss over the 27-day window. Assuming a roughly constant splenocyte density, the change in MDSC fraction is proportional to k_MDSC_rec * time divided by the parent cell density, preserving the same mechanistic role of k_MDSC_rec as a volumetric recruitment rate.
    independent_variable:
    state_variables:
    type: algebraic
    formula: f_MDSC(t_obs) = f0 + k_MDSC_rec * t_obs / rho_spleen
    code: |
      def compute(params, inputs):
          # k_MDSC_rec: recruitment rate into the spleen surrogate compartment
          k_rec = params['k_MDSC_rec']  # cell / (milliliter * day)
          f0 = inputs['mdsc_fraction_baseline']  # dimensionless fraction at day 0
          t = inputs['observation_time_day27']   # time from tumor implantation to observation (day)
          rho = inputs['spleen_cell_density']    # parent splenocyte density (cell/milliliter)
          # Predicted MDSC fraction at time t assuming linear accumulation: f = f0 + (k_rec * t / rho)
          return f0 + (k_rec * t / rho)
    code_julia: |
      function compute(params, inputs)
          # k_MDSC_rec: recruitment rate into the spleen surrogate compartment (cell/(milliliter*day))
          k_rec = params["k_MDSC_rec"]
          f0 = inputs["mdsc_fraction_baseline"]
          t = inputs["observation_time_day27"]
          rho = inputs["spleen_cell_density"]
          # Predicted MDSC fraction at time t assuming linear accumulation
          return f0 + (k_rec * t / rho)
      end
  error_model:
  - name: mdsc_fraction_day27_measurement
    observable:
    units: dimensionless
    uses_inputs:
    - mdsc_fraction_day27
    - mdsc_fraction_day27_cv
    evaluation_points:
    sample_size: 4
    sample_size_rationale: |
      Figure 2a legend states that spleens (n = 4 per group) were collected from naive and Panc02 tumor-bearing mice at each time point including day 27.
    observation_code: |
      def derive_observation(inputs, sample_size):
          # Observed MDSC fraction at day 27 (dimensionless)
          f = inputs['mdsc_fraction_day27']
          # Assumed coefficient of variation for between-mouse variability
          cv = inputs['mdsc_fraction_day27_cv']
          return {
              'value': f,
              'sd': cv,
              'sd_uncertain': True,
              'n': int(sample_size) if sample_size is not None else None,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        MDSC fractions are positive and can span orders of magnitude between animals; a lognormal likelihood on the fraction with an assumed coefficient of variation captures multiplicative biological variability.
  identifiability_notes: |
    With a single quantitative time point (day 27) and a known baseline fraction, this algebraic model identifies only the combination k_MDSC_rec / spleen_cell_density under the assumption of linear accumulation. We fix spleen_cell_density based on physiological considerations to recover k_MDSC_rec in volumetric units, which introduces additional structural uncertainty. The inferred k_MDSC_rec is further a surrogate for tumor-driven systemic recruitment into spleen rather than direct tumor infiltration, so the posterior should be interpreted as an order-of-magnitude constraint and used with a broad prior when mapped onto tumor-compartment recruitment in the full QSP model.

source_relevance:
  indication_match: exact
  indication_match_justification: |
    The primary data are from a syngeneic murine Panc02 pancreatic ductal adenocarcinoma model, which is a standard transplantable PDAC model derived from chemically induced pancreatic ductal tumors in C57BL/6 mice. Although tumors are implanted subcutaneously rather than orthotopically, the tumor-induced expansion of CD11b+Gr1+ MDSC reflects the same PDAC-driven myelopoiesis and immunosuppressive biology captured in the QSPIO-PDAC model.
  species_source: mouse
  species_target: human
  source_quality: primary_animal_in_vivo
  perturbation_type: pathological_state
  perturbation_relevance:
  tme_compatibility: moderate
  tme_compatibility_notes: |
    Panc02 tumors are subcutaneous and lack the full desmoplastic and hypovascular TME of human PDAC or KPC orthotopic models. However, Panc02-bearing mice show robust systemic expansion of CD11b+Gr1+ MDSC driven by inflammatory cytokines such as IL-6 and MCP-1, which mechanistically overlap with MDSC recruitment cues in PDAC. We therefore expect systemic MDSC recruitment rates to be within an order of magnitude of those in true pancreatic tumors but allow for significant quantitative uncertainty.
