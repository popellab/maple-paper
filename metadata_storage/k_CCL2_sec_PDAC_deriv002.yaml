    type: algebraic
    formula: |
      k_CCL2_sec = (MCP1_pg_per_ml_per_1e6cells * 1e-12 g/pg / MW_CCL2_g_per_mol * 1e9 nmol/mol) / (1e6 cells * 1 day)
    code: |
      def compute(params, inputs, ureg):
          """Forward model: given k_CCL2_sec, predict MCP-1 secretion."""
          import numpy as np
          k = params['k_CCL2_sec']  # nmol/cell/day
          MW = 8700.0  # g/mol
          mcp1_pg = k * 1e6 * 1.0 / (1e-12 / MW * 1e9)
          return mcp1_pg * ureg('pg/milliliter')
    code_julia: |
      function compute(params, inputs)
          k = params["k_CCL2_sec"]
          MW = 8700.0
          mcp1_pg = k * 1e6 * 1.0 / (1e-12 / MW * 1e9)
          return mcp1_pg  # pg/mL per 1e6 cells
