    The source study quantifies constitutive MCP-1 (CCL2) secretion by human myelomonocytic leukemia cell lines rather than pancreatic ductal adenocarcinoma (PDAC) cells. CCL2 is a broadly expressed chemokine whose per-cell secretion rates in leukocytes and tumor cells are expected to be of similar order of magnitude when activated by inflammatory cues, so these data can provide a mechanistic scale for chemokine secretion. However, differences in lineage (myeloid leukemia vs epithelial PDAC), oncogenic drivers, and microenvironmental stimuli mean that the absolute rate in PDAC tumor cells may differ by at least an order of magnitude, so the estimate is used as a proxy with inflated uncertainty.
