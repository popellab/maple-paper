study_interpretation: |
  Steube1999 demonstrates that human myelomonocytic leukemia cell lines constitutively secrete MCP-1 (CCL2) into culture supernatants at levels ranging from 440 to 1400 pg/ml per 10^6 cells over approximately 24 h, with much higher levels under strong pharmacologic stimulation. By converting this range into a per-cell, per-day molar secretion rate, we obtain an order-of-magnitude estimate for k_CCL2_sec, the tumor-cell CCL2 secretion rate used in the PDAC QSP model to drive monocyte and MDSC recruitment. Because the QSP model represents CCL2 production as a per-cancer-cell source term in a well-mixed tumor compartment, these in vitro measurements map naturally onto k_CCL2_sec when degradation is neglected over the 24 h assay window. The resulting distribution informs a biologically plausible scale and variability for CCL2 secretion in the absence of PDAC-specific quantitative secretion data.

key_assumptions:
- |
  The reported range 440 to 1400 pg/ml MCP-1 per million cells refers to the amount accumulated in culture supernatant over approximately 24 h under unstimulated, near-physiologic conditions.
- |
  Each measurement is interpreted as mass of CCL2 secreted by 10^6 cells into 1 ml of medium, so 440 to 1400 pg/ml per 10^6 cells is equivalent to 440 to 1400 pg per 10^6 cells per day.
- |
  Extracellular degradation or uptake of CCL2 during the 24 h assay is negligible compared with secretion, so accumulated mass reflects the integral of the secretion rate.
- |
  The molar mass of human CCL2 (MCP-1) is approximated as 8.7 kDa for converting pg to nmol; isoform and post-translational modification differences are ignored.
- |
  The variability in secretion across the four leukemia cell lines is modeled as arising from a lognormal distribution whose 95 percent interval spans 440 to 1400 pg/ml per 10^6 cells.
- |
  Per-cell secretion rates in myelomonocytic leukemia lines are assumed to be within an order of magnitude of those in PDAC cancer cells and stromal cells under basal inflammatory stimulation, justifying their use as a proxy scale for k_CCL2_sec.

key_study_limitations:
- |
  The study was performed in leukemia cell lines, not pancreatic ductal adenocarcinoma cells, so lineage-specific regulatory mechanisms of CCL2 expression are not captured.
- |
  Experiments were conducted in 2D monoculture with standard serum-containing medium, lacking the complex PDAC tumor microenvironment, including cancer-associated fibroblasts, extracellular matrix, hypoxia, and immune cell interactions that can strongly modulate CCL2 secretion.
- |
  The abstract reports only a range (440 to 1400 pg/ml per 10^6 cells) and a single upper bound for stimulated secretion (> 80 ng/ml), without full distributional statistics or detailed time-course information, so the temporal interpretation as 24 h and the lognormal fit introduce additional uncertainty.
- |
  The volume of culture medium per 10^6 cells is not explicitly stated and is assumed to be approximately 1 ml; deviations from this assumption would scale the inferred per-cell secretion rate.
- |
  Post-translational processing, binding to extracellular matrix components, and potential receptor-mediated uptake of CCL2 are not characterized in this assay but could affect effective chemokine availability in vivo.

