    data_rationale: |
      Steube1999 measured constitutive MCP-1 (CCL2) secretion by several human myelomonocytic leukemia cell lines using ELISA, reporting that culture supernatants contained 440 to 1400 pg/ml MCP-1 per 10^6 cells, and that the highest stimulated level exceeded 80 ng/ml within 24 h. These measurements correspond to mass of CCL2 secreted per cell over approximately 1 day in a well-mixed medium, which can be analytically converted into a per-cell, per-day secretion rate.
    submodel_rationale: |
      In the full QSP PDAC model, tumor CCL2 dynamics in the tumor compartment V_T follow d(V_T.CCL2)/dt = k_CCL2_sec * C_total - k_CCL2_deg * V_T.CCL2. In an in vitro setting without appreciable extracellular degradation or clearance, the increase in CCL2 concentration over 24 h reflects the production term alone. Therefore, the measured mass of CCL2 secreted per 10^6 cells per 24 h can be converted directly into k_CCL2_sec (nanomole per cell per day), assuming a representative distribution volume per cell. This preserves the mechanistic usage of k_CCL2_sec as a per-cell secretion rate driving accumulation of CCL2 in a well-mixed compartment.

  error_model:
  - name: k_CCL2_sec_from_LeukemiaCellLines
    units: pg/milliliter
    uses_inputs:
    - mcp1_constitutive_min_pg_per_ml_per_millioncells
    - mcp1_constitutive_max_pg_per_ml_per_millioncells
    sample_size: 4
    sample_size_rationale: |
      Four human myelomonocytic leukemia cell lines (HL-60, ML-2, MONO-MAC-6, MUTZ-3) were assayed for constitutive MCP-1 secretion; the reported range 440 to 1400 pg/ml per 10^6 cells reflects variability across these lines.
    observation_code: |
      def derive_observation(inputs, sample_size, ureg):
          """
          Derive observation (point estimate + uncertainty) from literature data.

          The reported range 440-1400 pg/mL is interpreted as a 95% CI for a
          lognormal distribution. We compute:
          - value: geometric mean as the point estimate
          - sd: log-scale standard deviation for lognormal likelihood
          """
          import numpy as np

          min_pg = inputs['mcp1_constitutive_min_pg_per_ml_per_millioncells'].magnitude
          max_pg = inputs['mcp1_constitutive_max_pg_per_ml_per_millioncells'].magnitude

          # Point estimate: geometric mean for lognormal data
          observed_value = np.sqrt(min_pg * max_pg) * ureg('pg/milliliter')

          # Uncertainty: derive log-scale SD from the range (assumed 95% CI)
          log_min = np.log(min_pg)
          log_max = np.log(max_pg)
          sigma = (log_max - log_min) / (2.0 * 1.96)

          return {
              'value': observed_value,
              'sd': sigma,  # dimensionless for lognormal likelihood
              'sd_uncertain': False,  # SD computed from reported range
              'n': sample_size,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        Chemokine secretion rates are positive and typically span orders of magnitude across cell lines, making a lognormal likelihood appropriate. The variability across the four leukemia lines is treated as observational plus biological heterogeneity.

  identifiability_notes: |
    This submodel analytically converts an experimentally measured CCL2 (MCP-1) secretion range per 10^6 cells per 24 h into a per-cell, per-day secretion rate k_CCL2_sec. Given the direct proportionality between secreted mass and k_CCL2_sec under the assumption of negligible extracellular degradation over 24 h, k_CCL2_sec is structurally identifiable from these data alone within the context of the in vitro system. However, translation to the in vivo PDAC tumor microenvironment introduces substantial uncertainty due to differences in cell type (myelomonocytic leukemia vs pancreatic cancer cells), stromal and immune contributions to CCL2, and possible feedback regulation, so the inferred value should be treated as providing an order-of-magnitude constraint rather than a precise estimate.

