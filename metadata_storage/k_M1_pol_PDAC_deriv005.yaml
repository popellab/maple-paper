calibration:
  parameters:
  - name: k_M1_pol
    units: 1/day
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 3.4
      lower:
      upper:
      rationale: |
        Wide prior centered at 1/day to cover plausible macrophage polarization rates (approximately 0.01–10 1/day) given limited translational relevance of DLBCL TAM data to PDAC. Sigma set to 3.4 to accommodate the 30x estimated translation uncertainty fold.
  - name: k_M2_pol
    units: 1/day
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 3.4
      lower:
      upper:
      rationale: |
        Wide prior for reverse M1→M2 polarization rate; only the ratio k_M1_pol/k_M2_pol is informed by this target, so a broad prior avoids biasing the inferred ratio.
  forward_model:
    data_rationale: |
      The study quantifies canonical M1 (CD86+CD163−) and canonical M2 (CD86−CD163+) tumor-associated macrophages as percentages of CD68+ TAMs in human DLBCL biopsies. At steady state, the observed fraction ratio M1:M2 primarily reflects the balance of M2→M1 versus M1→M2 polarization rates, assuming comparable recruitment and death rates across phenotypes.
    submodel_rationale: |
      In the full PDAC QSP model, k_M1_pol governs V_T.Mac_M2 → V_T.Mac_M1 polarization, while k_M2_pol governs the reverse M1→M2 transition. Under quasi-steady polarization dynamics with similar net loss and recruitment across phenotypes, the steady-state M1:M2 abundance ratio scales approximately with k_M1_pol/k_M2_pol. The SteadyStateRatio model therefore maps the canonical M1:M2 TAM ratio onto the polarization rate ratio, while acknowledging substantial uncertainty due to indication and TME differences.
    independent_variable:
    state_variables:
    unit_conversion_factor: '1.0'
    type: steady_state_ratio
    rate_numerator: k_M1_pol
    rate_denominator: k_M2_pol
    drive_numerator: '1.0'
    drive_denominator: '1.0'
  error_model:
  - name: m1_m2_ratio_dlbcl
    observable:
    units: dimensionless
    uses_inputs:
    - m1_fraction_mean
    - m1_fraction_sd
    - m2_fraction_mean
    - m2_fraction_sd
    evaluation_points:
    sample_size: 3
    sample_size_rationale: |
      Canonical M1 and M2 TAM fractions were quantified in 3 primary DLBCL cases; data are reported as mean ± SD across these patients.
    observation_code: |
      def derive_observation(inputs, sample_size):
          import numpy as np
          m1 = inputs['m1_fraction_mean']
          m1_sd = inputs['m1_fraction_sd']
          m2 = inputs['m2_fraction_mean']
          m2_sd = inputs['m2_fraction_sd']
          # Mean M1:M2 ratio
          ratio_mean = m1 / m2
          # Propagate relative SD assuming independent errors
          rel_sd_m1 = m1_sd / m1
          rel_sd_m2 = m2_sd / m2
          cv_ratio = float(np.sqrt(rel_sd_m1**2 + rel_sd_m2**2))
          return {
              'value': ratio_mean,
              'sd': cv_ratio,
              'sd_uncertain': False,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        The M1:M2 ratio is positive and expected to exhibit multiplicative inter-patient variability; a lognormal likelihood is appropriate.
  identifiability_notes: |
    This target constrains primarily the ratio k_M1_pol/k_M2_pol via the observed canonical M1:M2 TAM fraction in DLBCL. Absolute magnitudes of k_M1_pol and k_M2_pol remain weakly identified and must be informed by other PDAC-specific targets (e.g., pharmacologic polarization assays, macrophage turnover data). The presence of a large noncanonical M1M2 TAM subset means that the canonical M1 and M2 fractions only approximate the pure Mac_M1 and Mac_M2 pools of the PDAC QSP model; we treat this as an additional source of model discrepancy captured via the large translation-uncertainty factor in source_relevance.

source_relevance:
  indication_match: proxy
  indication_match_justification: |
    The primary data quantify canonical M1 and M2 TAM fractions in human DLBCL biopsies using CD68, CD86, and CD163 as markers. These measurements inform the intrinsic balance between M1- and M2-like polarization states in a human tumor microenvironment, which is mechanistically related to the M2→M1 polarization process encoded by k_M1_pol. However, DLBCL arises in lymphoid tissue with a highly different stromal architecture, vasculature, and cytokine milieu than PDAC, so the absolute M1:M2 ratio and the degree of mixed M1M2 phenotypes may differ by orders of magnitude. We therefore use this source only to weakly inform the plausible order-of-one magnitude for the polarization rate ratio, with a large translation-uncertainty factor.
  species_source: human
  species_target: human
  source_quality: primary_human_clinical
  perturbation_type: pathological_state
  perturbation_relevance:
  tme_compatibility: low
  tme_compatibility_notes: |
    DLBCL lesions are lymphoid-organ tumors with relatively permissive immune infiltration and limited desmoplastic stroma, in contrast to the dense, hypoxic, and T cell–excluded PDAC microenvironment. TAM ontogeny, exposure to stromal cues, and cytokine gradients (e.g., IL-10, TGFbeta, IFNg, IL-12) are therefore substantially different. As a result, the canonical M1:M2 fraction measured in DLBCL likely overestimates the M1 contribution relative to PDAC and should be treated as a very uncertain proxy for PDAC TAM polarization balance.
  estimated_translation_uncertainty_fold: 30.0
  validation_warnings: []
