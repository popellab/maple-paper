study_interpretation: |
  Yates et al. used the synthetic peptide RP-182 to engage the mannose receptor CD206 on murine M2-polarized bone marrow-derived macrophages and demonstrated rapid acquisition of M1-associated markers and functions. Within 30 minutes of RP-182 exposure, the fraction of CD11b+F4/80+Gr1- macrophages co-expressing CD86 and CD206 increased from about 10% in vehicle-treated controls to nearly 88%, indicating very fast induction of M1-associated costimulatory molecules in an initially M2-enriched population. This behavior is well described by a first-order M2-to-M1 conversion driven by a strong activating signal and is mechanistically analogous to the Mac_M2 -> Mac_M1 reaction in the QSP PDAC model under saturating IL-12/IFNg. We therefore use these data to constrain the intrinsic polarization rate constant k_M1_pol under maximal activation, recognizing that tumor-context effective rates will be lower because the cytokine-dependent Hill term multiplying k_M1_pol is <1 in most PDAC settings. Human PDAC ex vivo TAM phenotyping data (e.g., Gu et al. 2023; Ino et al. 2013) indicate that M2-like macrophages (CD163+, CD206+) are numerically dominant over M1-like (CD86+, HLA-DR+) TAMs in primary tumors, consistent with a PDAC microenvironment in which the effective M2-promoting influences (captured in the full QSP model by k_M2_pol and immunosuppressive cytokines) outweigh the effective M1-promoting drive encoded by k_M1_pol.

key_assumptions:
- |
  CD86+CD206+ double-positive macrophages 30 minutes after RP-182 exposure are treated as M1-like cells for the purpose of estimating the rapid M2-to-M1 polarization rate, even though they retain CD206 expression and may represent a transitional phenotype.
- |
  The baseline 10.3% CD86+CD206+ fraction in vehicle-treated M2 macrophages reflects incomplete M2 polarization and is used as the initial M1-like fraction f0 in the first-order conversion model.
- |
  RP-182 is assumed to provide a near-saturating M1-promoting signal such that the cytokine-dependent Hill term in the full QSP model is effectively 1, making the measured rate directly informative for k_M1_pol.
- |
  Measurement variability in the reported fractions is not explicitly reported; a 10% coefficient of variation is assumed to capture combined technical and biological noise for the 30-minute time point.
- |
  Intrinsic signaling and transcriptional kinetics of M2-to-M1 repolarization are assumed to be similar between murine bone marrow-derived M2 macrophages and human PDAC TAMs, with cross-species and context differences captured by the large translation uncertainty factor.
- |
  Later time points (e.g., 24 h) in the RP-182 study are influenced by apoptosis of M2 macrophages and are not used directly to estimate k_M1_pol, which is interpreted as a short-timescale signaling-driven polarization rate rather than a long-term net population turnover rate.

key_study_limitations:
- |
  Data are from murine bone marrow-derived M2 macrophages in vitro, not from tumor-associated macrophages in a PDAC model or human monocyte-derived macrophages, introducing substantial translational uncertainty.
- |
  The M1-like phenotype is inferred from CD86 expression; cells remain CD206+ at early time points and may not fully correspond to the Mac_M1 compartment in the QSP model.
- |
  Only a single early time point (30 min) with explicit quantitative fractions is used for calibration; the assumed error model (10% CV) is heuristic.
- |
  RP-182 is a non-physiologic pharmacologic agonist of CD206 that additionally induces apoptosis of M2 macrophages over 24-48 hours, which may not reflect typical cytokine-driven repolarization dynamics in PDAC.
- |
  Human PDAC TAM phenotyping data used for contextualization (e.g., Gu et al. 2023, Ino et al. 2013) provide steady-state M1/M2 ratios but do not report repolarization kinetics, limiting direct linkage between tumor data and k_M1_pol in this submodel.

