calibration:
  parameters:
  - name: k_M1_pol
    units: 1/day
    prior:
      distribution: lognormal
      mu: 4.605
      sigma: 1.0
      lower:
      upper:
      rationale: |
        RP-182 data imply a very rapid M2-to-M1-like polarization with an effective rate on the order of 10^2 per day (half-time ~10 min) under strong CD206 activation. We center the prior at exp(4.605) ~ 100/day with one log-unit SD to allow ~10-fold uncertainty in either direction and additional flexibility for translation to PDAC TAMs.
  forward_model:
    data_rationale: |
      Yates et al. quantified the fraction of IL-4/IL-13-polarized murine bone marrow-derived M2 macrophages that became CD86+CD206+ within 30 min after addition of RP-182, reporting an increase in the double-positive fraction from 10.3% in vehicle-treated controls to 87.8% with RP-182. This provides a direct measurement of the timescale over which strong M1-promoting stimulation can reprogram M2 macrophages toward an M1-like phenotype.
    submodel_rationale: |
      In the full QSP PDAC model, k_M1_pol appears in a first-order conversion term V_T.Mac_M2 -> V_T.Mac_M1, multiplied by a cytokine-dependent Hill function of IL-12 and IFNg. Under saturating M1-promoting signals (e.g., high IFNg/IL-12 or strong CD206 activation by RP-182), this Hill term approaches 1 and the effective polarization rate reduces to k_M1_pol * V_T.Mac_M2. The algebraic model assumes this saturated first-order Mac_M2 -> Mac_M1 conversion and relates k_M1_pol to the observed gain of CD86 expression over 30 min in M2 macrophages.
    independent_variable:
    state_variables:
    type: algebraic
    formula: |
      fraction_CD86pos(t) = 1 - (1 - f0) * exp(-k_M1_pol * t) where f0 is the baseline CD86+ fraction in M2-polarized macrophages and t is time in days.
    code: |
      def compute(params, inputs):
          import numpy as np
          k = params['k_M1_pol']
          # Stimulation time in days (stored directly in inputs)
          t = inputs['rp182_t_30min']
          # Baseline CD86+ fraction in vehicle-treated M2 macrophages
          f0 = inputs['rp182_cd86pos_cd206pos_frac_vehicle']
          frac = 1.0 - (1.0 - f0) * np.exp(-k * t)
          return frac
    code_julia: |
      function compute(params::Dict, inputs::Dict)
          k = params["k_M1_pol"]
          # Stimulation time in days (stored directly in inputs)
          t = inputs["rp182_t_30min"]
          f0 = inputs["rp182_cd86pos_cd206pos_frac_vehicle"]
          frac = 1.0 - (1.0 - f0) * exp(-k * t)
          return frac
      end
  error_model:
  - name: rp182_cd86pos_frac_30min
    observable:
    units: dimensionless
    uses_inputs:
    - rp182_cd86pos_cd206pos_frac_30min
    - rp182_cd86pos_cd206pos_frac_vehicle
    - rp182_cd86pos_frac_cv
    - rp182_t_30min
    evaluation_points:
    sample_size: 3
    sample_size_rationale: |
      Yates et al. report that flow cytometry data are representative of three independent experiments conducted in triplicate; we treat n=3 biological replicates as the effective sample size for the fraction of CD86+CD206+ cells at 30 minutes.
    observation_code: |
      def derive_observation(inputs, sample_size):
          frac = inputs['rp182_cd86pos_cd206pos_frac_30min']
          cv = inputs['rp182_cd86pos_frac_cv']
          sd = frac * cv
          return {
              'value': frac,
              'sd': sd,
          }
    likelihood:
      distribution: normal
      rationale: |
        The observable is a cell fraction bounded between 0 and 1 and close to 1 in this experiment. Given the moderate assumed coefficient of variation and lack of strong skewness information, a normal likelihood on the linear scale is an adequate approximation for measurement noise around the mean fraction of CD86+CD206+ cells at 30 minutes.
  identifiability_notes: |
    This target uses a single early time point (30 min) for the fraction of CD86+CD206+ M2 macrophages under a very strong activating stimulus. Under the assumed first-order repolarization model with known baseline fraction, this single measurement is mathematically sufficient to identify k_M1_pol in the in vitro mouse system, but uncertainty remains due to the assumed measurement CV and potential deviations from simple first-order kinetics (e.g., multi-step signaling, cell-to-cell heterogeneity). Translation of this intrinsic rate constant from murine bone marrow-derived M2 macrophages under pharmacologic CD206 activation to human PDAC tumor-associated macrophages under cytokine-driven polarization introduces additional 1–2 orders of magnitude uncertainty reflected in the wide prior and large translation uncertainty factor. The model intentionally ignores slower apoptotic loss of M2 cells at later times (>24 h) under RP-182 treatment, so k_M1_pol should be interpreted as an upper bound for rapid signaling-driven M2-to-M1 phenotype conversion rather than a net population turnover rate in tumors.

source_relevance:
  indication_match: proxy
  indication_match_justification: |
    The primary data come from murine bone marrow-derived macrophages polarized to an M2-like phenotype in vitro and rapidly reprogrammed toward an M1-like state by the synthetic peptide RP-182, which engages the mannose receptor CD206. These cells are not pancreatic tumor-associated macrophages and are studied outside the pancreatic tumor microenvironment. However, the measured timescale of CD86 acquisition after a strong M1-promoting signal primarily reflects cell-intrinsic signaling and transcriptional kinetics in M2 macrophages. We therefore use these data as a mechanistic proxy for the maximal M2-to-M1 polarization rate (k_M1_pol) under saturating activation, with additional uncertainty to account for species (mouse vs human), tissue context (bone marrow-derived vs PDAC TAM), and the pharmacologic nature of the stimulus.
  species_source: mouse
  species_target: human
  source_quality: primary_animal_in_vitro
  perturbation_type: pharmacological
  perturbation_relevance: |
    RP-182 is a synthetic amphipathic peptide agonist of the mannose receptor CD206 that selectively binds M2-like macrophages and reprograms them toward an M1-like phenotype, ultimately inducing apoptosis of M2 cells. This represents a near-maximal pharmacologic drive toward M2-to-M1-like repolarization and cell clearance, not a physiologic IFNg/IL-12 signal. We therefore interpret the inferred k_M1_pol as an upper bound on the intrinsic polarization rate under saturating M1-promoting conditions; effective rates in PDAC tumors, where cytokine levels and receptor engagement are lower, will typically be smaller.
  tme_compatibility: low
  tme_compatibility_notes: |
    Experiments were performed on isolated M2-polarized macrophages in 2D culture without the dense desmoplastic stroma, hypoxia, immunosuppressive cytokines (IL-10, TGFbeta), and metabolic constraints characteristic of the PDAC tumor microenvironment. These PDAC-specific features likely slow M2-to-M1 reprogramming and bias macrophages toward an M2 phenotype compared with the in vitro system used here.
  estimated_translation_uncertainty_fold: 30.0
  validation_warnings:
