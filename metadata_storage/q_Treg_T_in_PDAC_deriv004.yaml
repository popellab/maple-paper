calibration:
  parameters:
  - name: q_Treg_T_in
    units: 1/(centimeter^3*minute)
    prior:
      distribution: lognormal
      mu: -7.0
      sigma: 2.0
      lower:
      upper:
      rationale: |
        Wide prior over several orders of magnitude (approximately 10^-9 to 10^-3 1/(cm^3*min)) to encompass plausible Treg extravasation rates that link peripheral blood Treg levels to intratumoral Treg densities in PDAC.
  - name: k_Treg_death
    units: 1/day
    prior:
      distribution: lognormal
      mu: -2.3
      sigma: 1.0
      lower:
      upper:
      rationale: |
        Effective loss rate of tumor-infiltrating Treg (death, egress, or differentiation). Centered at ~0.1/day (half-life ~7 days), reflecting that Tregs are relatively long-lived in the immunosuppressive PDAC TME. Range ~0.01-1.0 per day.
  forward_model:
    data_rationale: |
      Jiang2014 reports mean density of FOXP3+ lymphocytes per high-power field in human PDAC resections. The raw measurement (cells/HPF) can be converted to cells/mm^2 using the reported HPF area, which is the natural unit for IHC density data. Under the assumption that intratumoral FOXP3+ lymphocyte density in established PDAC is approximately at a quasi-steady state between blood influx and local loss, a steady-state density model links the extravasation rate q_Treg_T_in, the circulating Treg source pool, and an effective Treg loss rate to the observed tumor Treg density in cells/mm^2.
    submodel_rationale: |
      In the full QSPIO-PDAC model, q_Treg_T_in controls extravasation of circulating Th and Treg cells into the tumor compartment with a flux V_T * q_Treg_T_in * V_C.Treg * (C_total^2/(C_total^2+Kc_rec)). For macroscopic, established tumors where C_total >> sqrt(Kc_rec), the recruitment Hill term is near unity and tumor volume changes slowly relative to cellular trafficking. Under these conditions, tumor Treg density can be approximated as a steady-state balance between q_Treg_T_in-mediated influx from blood and an effective loss rate k_Treg_death. The section_volume_factor converts from volumetric density (cells/cm^3) to areal density (cells/mm^2) as measured by IHC. Tregs are not subject to CXCL12-mediated exclusion (exclusion_fraction=0.0), unlike CD8+ T cells.
    independent_variable:
    state_variables:
    type: steady_state_density
    target_rate: q_Treg_T_in
    unit_conversion_factor: "1440.0"
    source_pool:
      reference_ref: circulating_treg_count_pdac
    loss_rate: k_Treg_death
    section_volume_factor:
      reference_ref: ihc_section_volume_5um
    recruitment_efficiency: "1.0"
    exclusion_fraction: "0.0"
  error_model:
  - name: foxp3_tumor_density_jiang2014
    observable:
    units: cell / millimeter**2
    uses_inputs:
    - foxp3_density_tumor_mean_per_hpf
    - foxp3_density_tumor_sd_per_hpf
    - hpf_area
    evaluation_points:
    sample_size: 50
    sample_size_rationale: |
      Jiang2014 analyzed FOXP3+ lymphocyte density in primary pancreatic cancer tissue from 50 patients who underwent radical resection of pancreatic head adenocarcinoma.
    observation_code: |
      def derive_observation(inputs, sample_size, ureg):
          import numpy as np
          mean_per_hpf = inputs['foxp3_density_tumor_mean_per_hpf'].magnitude
          sd_per_hpf = inputs['foxp3_density_tumor_sd_per_hpf'].magnitude
          hpf_area_mm2 = inputs['hpf_area'].to('millimeter**2').magnitude
          mean_per_mm2 = mean_per_hpf / hpf_area_mm2
          sd_per_mm2 = sd_per_hpf / hpf_area_mm2
          cv = sd_per_mm2 / mean_per_mm2
          sigma_log = np.sqrt(np.log(1 + cv**2))
          return {
              'value': mean_per_mm2 * ureg('cell / millimeter**2'),
              'sd': sigma_log,
              'sd_uncertain': True,
              'n': sample_size,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        Tumor-infiltrating lymphocyte densities are positive and typically span orders of magnitude across patients. Modeling measurement noise and biological variability on a log scale via a lognormal likelihood is appropriate. The coefficient of variation derived from Jiang2014 (SD/mean in cells per high-power field) is converted to a log-scale SD.
  identifiability_notes: |
    With a single PDAC intratumoral FOXP3+ density measurement, the steady-state model constrains the ratio q_Treg_T_in / k_Treg_death given the reference circulating Treg count. Consequently, q_Treg_T_in and k_Treg_death are correlated in the posterior. The prior on k_Treg_death (centered at 0.1/day) provides scale separation. Additional longitudinal data on tumor-infiltrating Treg kinetics would be required to identify q_Treg_T_in and k_Treg_death separately. The submodel nonetheless anchors q_Treg_T_in to order-of-magnitude consistency between peripheral Treg levels and observed PDAC FOXP3+ cell densities.

