study_interpretation: |
  Hong2015 demonstrates that in established subcutaneous B16 and LLC tumors, approximately 8-17 percent of viable cells are CD11b+/Gr1+ myeloid-derived suppressor cells, and that this fraction is modulated by pericyte coverage and IL-6-driven hypoxia. Assuming that by two weeks after inoculation the intratumoral MDSC population has reached a quasi-steady state where recruitment balances death, and using literature estimates that MDSCs in the tumor microenvironment have a lifespan of about one to two days, we can back-calculate the implied MDSC recruitment rate into tumor tissue. This provides a physiologically grounded scale for k_MDSC_rec in the QSP PDAC model, capturing chemokine-driven influx into the tumor microenvironment under conditions of high myeloid inflammation.

key_assumptions:
- |
  The 8.1% +/-2.4 CD11b+/Gr1+ fraction in control B16 tumors at two weeks reflects a steady-state balance between MDSC recruitment and death, with net growth approximately zero on this timescale.
- |
  Tumor cellularity is approximated as 10^9 cells per milliliter, based on the common log cell kill assumption that a 1 gram tumor contains about 10^9 cells, and assuming tissue density near 1 g/mL.
- |
  Chemotactic drivers in the B16 model (including IL-6 and other cytokines) produce effectively saturating recruitment, such that the CCL2-dependent factor and IL-6 enhancement term in the full model can be treated as approximately 1 in this reference condition.
- |
  Additional clearance of MDSCs through dead-cell clearance pathways in the full model is neglected relative to simple first-order death, so that k_MDSC_rec * V_T ≈ k_MDSC_death * M_ss.
- |
  MDSC half-life of 1.5 days is taken as a representative value within the 1-2 day range reported for M-MDSC and G-MDSC in tumors and blood, and is assumed similar in melanoma and PDAC contexts.
- |
  Mouse B16 and LLC tumor models are used as surrogates for PDAC with respect to MDSC recruitment dynamics, assuming that chemokine-driven myeloid trafficking scales similarly across solid tumors after accounting for tumor cellularity.

key_study_limitations:
- |
  Primary data are from melanoma and lung carcinoma models, not PDAC; PDAC has a denser desmoplastic stroma that may alter absolute recruitment rates.
- |
  Only a single time point (two weeks after inoculation) is used, so dynamic information about approach to steady state is unavailable; the steady-state assumption may be imperfect.
- |
  Tumor cell density is not measured in Hong2015 and is approximated from generic log cell kill arguments; true cellularity may vary by at least an order of magnitude across tumors and models.
- |
  The contribution of CCL2 specifically is not isolated in the pericyte-deficient model, and IL-6 is a dominant modulator; thus, the calibrated k_MDSC_rec should be interpreted as an effective baseline recruitment rate under saturating chemoattractant rather than a CCL2-specific parameter.
- |
  The MDSC lifespan estimate is based on a review summarizing multiple tumor types and compartments (blood and tumor) rather than a direct measurement in this exact model, introducing additional uncertainty.
- |
  MDSCs are identified as CD11b+/Gr1+ cells without subset separation (M-MDSC vs PMN-MDSC), whereas the QSP model may represent MDSCs as a composite population.

