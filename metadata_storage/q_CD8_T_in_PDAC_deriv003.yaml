study_interpretation: |
  Masugi et al. quantified CD8+ T cell densities in whole sections of resected human PDAC using multiplex immunohistochemistry and image analysis, reporting mean and distributional statistics for the tumor center, tumor margin, and whole tumor. The tumor center showed relatively low CD8+ density compared with the invasive margin, reflecting T cell exclusion from the tumor core in most patients. We use the mean CD8+ density in the tumor center as a direct constraint on the quasi-steady-state intratumoral CD8+ population predicted by the QSP model under baseline (treatment-naive) conditions. Under a steady-state balance between influx from blood, driven by q_CD8_T_in, and loss by death/exhaustion/egress, the intratumoral CD8+ density is proportional to q_CD8_T_in. The proportionality is decomposed into mechanistic components: circulating CD8+ count (from the reference database), IHC section volume factor, an effective loss rate (sampled), and recruitment efficiency/exclusion terms. Cross-tissue reference values from CRC and melanoma provide context.

key_assumptions:
- |
  Resected human PDAC tumors are approximated as being in a quasi-steady state with respect to intratumoral effector CD8+ T cells at the time of surgery (no recent large perturbations in trafficking).
- |
  The mechanistic recruitment term q_CD8_T_in * V_T * V_C.CD8 * (C_total^2/(C_total^2+Kc_rec)) * (1 - H_CXCL12_Texcl) can be decomposed at steady state into: density = q_CD8_T_in * source_pool * recruitment_efficiency * (1 - exclusion_fraction) / loss_rate * section_volume_factor, where each component has a mechanistic interpretation and an independent source.
- |
  Circulating CD8+ T cell count (~2e9 cells) comes from the reference database; IHC section volume factor (4e-6 cm^3/mm^2) is standard for 4-um sections; recruitment efficiency is approximated as 1.0 (saturated for macroscopic PDAC); exclusion fraction is sampled with a Uniform(0.7, 0.99) prior reflecting substantial CXCL12-mediated T cell exclusion in the PDAC tumor center, consistent with the large density difference between tumor center and invasive margin in Masugi 2019.
- |
  CD8+ IHC counts in the tumor center predominantly reflect effector and effector-memory CD8+ cells relevant for antitumor activity, and non-tumor-specific CD8+ subpopulations do not dominate the signal.
- |
  Heterogeneity of CD8+ density across the tumor is reasonably summarized by the reported mean and interquartile range for the tumor center; we approximate measurement variability using a lognormal likelihood with SD inferred from the IQR assuming approximate normality on the linear scale.

key_study_limitations:
- |
  The PDAC data are cross-sectional at resection and do not provide time-resolved infiltration or clearance kinetics, so the inferred q_CD8_T_in is sensitive to assumptions about intratumoral CD8+ loss rates.
- |
  CD8+ density is measured per unit area (cells/mm2) in histologic sections, whereas the QSP model is formulated in terms of cell numbers per tumor volume; we approximate the volumetric-to-areal conversion within the scale factor rather than modeling section thickness explicitly.
- |
  The cohort represents resectable PDAC, which may differ in immune infiltration from unresectable or metastatic disease modeled in some QSP applications.
- |
  Multiplex IHC and automated image analysis reduce but do not eliminate technical variability in cell detection and segmentation, contributing to additional noise beyond the reported distribution across patients.
- |
  Auxiliary KPC mouse data on CD8+ infiltration kinetics and human melanoma/CRC CD8+ densities are used qualitatively for mechanistic context and prior setting but not directly linked in the algebraic forward model, so cross-species and cross-tissue translation remains approximate.

