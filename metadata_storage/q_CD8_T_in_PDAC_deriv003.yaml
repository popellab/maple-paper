calibration:
  parameters:
  - name: q_CD8_T_in
    units: 1 / (centimeter**3 * minute)
    prior:
      distribution: lognormal
      mu: -9.0
      sigma: 2.5
      lower:
      upper:
      rationale: |
        With sampled exclusion_fraction ~ Uniform(0.7, 0.99), the effective (1-excl) factor ranges from 0.01 to 0.3, requiring q_CD8_T_in to compensate. exp(-9.0) ~ 1.2e-4 with typical exclusion 0.9 and k_death=1/day gives CD8 density ~ 170 cells/mm2. Wide sigma=2.5 accommodates the additional uncertainty from sampled exclusion.
  - name: k_CD8_death
    units: 1/day
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 1.0
      lower:
      upper:
      rationale: |
        Centered at 1/day (intratumoral CD8+ T cell half-life ~1 day due to exhaustion, apoptosis, and egress). Range ~0.1-10 per day.
  - name: cd8_exclusion_fraction
    units: dimensionless
    prior:
      distribution: uniform
      lower: 0.7
      upper: 0.99
      rationale: |
        CXCL12-mediated T cell exclusion in PDAC tumor center. Lower bound 0.7 reflects moderate exclusion (tumor center density ~30% of margin); upper bound 0.99 reflects near-complete exclusion seen in some cold tumors. Masugi2019 tumor center mean (166.9) vs invasive margin suggests substantial exclusion. Sampling this parameter allows the data to inform the degree of exclusion rather than fixing it.
  forward_model:
    data_rationale: |
      The PDAC study reports a static snapshot of intratumoral CD8+ T cell density by IHC (cells/mm2) in resected tumors rather than time-resolved trafficking. At baseline, intratumoral effector CD8+ counts can be approximated as a quasi-steady state between influx from blood and loss (death/exhaustion/egress), making a steady-state density model appropriate.
    submodel_rationale: |
      In the full QSP model, the influx of CD8+ T cells into tumor is q_CD8_T_in * V_T * V_C.CD8 * (C_total^2/(C_total^2+Kc_rec)) * (1 - H_CXCL12_Texcl), and intratumoral CD8+ T cells are removed via death and exhaustion. The steady-state density model decomposes this into: density = q_CD8_T_in * source_pool * recruitment_efficiency * (1 - exclusion_fraction) / loss_rate * section_volume_factor. Each component is independently sourced: circulating CD8+ count from the reference database, section geometry from standard IHC. The exclusion fraction is sampled with a Uniform(0.7, 0.99) prior, allowing the data to inform the degree of CXCL12-mediated T cell exclusion in the tumor center rather than fixing it at an assumed value.
    independent_variable:
    state_variables:
    type: steady_state_density
    target_rate: q_CD8_T_in
    unit_conversion_factor: "1440.0"
    source_pool:
      reference_ref: circulating_cd8_count
    loss_rate: k_CD8_death
    section_volume_factor:
      reference_ref: ihc_section_volume_4um
    recruitment_efficiency: "1.0"
    exclusion_fraction: cd8_exclusion_fraction
  error_model:
  - name: pdac_cd8_center_density
    observable:
    units: cell / millimeter**2
    uses_inputs:
    - pdac_cd8_center_mean
    - pdac_cd8_center_q1
    - pdac_cd8_center_q3
    - pdac_cd8_center_n
    - iqr_to_sd_factor
    evaluation_points:
    sample_size: 214
    sample_size_rationale: |
      214 resected PDAC specimens with whole-tissue multiplex IHC quantification of CD8+ cell density.
    observation_code: |
      def derive_observation(inputs, sample_size, ureg):
          mean = inputs['pdac_cd8_center_mean']
          q1 = inputs['pdac_cd8_center_q1']
          q3 = inputs['pdac_cd8_center_q3']
          factor = inputs['iqr_to_sd_factor']
          iqr = (q3 - q1).to(mean.units)
          sd = iqr / factor
          cv = sd.magnitude / mean.magnitude
          n = int(inputs['pdac_cd8_center_n'].magnitude)
          return {
              'value': mean,
              'sd': cv,
              'sd_uncertain': True,
              'n': n,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        CD8+ T cell densities are positive, right-skewed across patients, and vary over orders of magnitude; a lognormal likelihood on density is appropriate.
  identifiability_notes: |
    Three sampled parameters (q_CD8_T_in, k_CD8_death, cd8_exclusion_fraction) from one observation. The data constrains the product q_CD8_T_in * (1 - cd8_exclusion_fraction) / k_CD8_death. The prior on k_CD8_death (centered at 1/day) provides scale separation between q and k. The Uniform(0.7, 0.99) prior on exclusion_fraction allows the data to inform the degree of T cell exclusion rather than fixing it at an assumed value. Because (1-excl) enters multiplicatively with q, the posterior will show a negative correlation between q_CD8_T_in and (1 - cd8_exclusion_fraction). This is expected and preferable to fixing exclusion at a potentially wrong value, which would bias q_CD8_T_in.

