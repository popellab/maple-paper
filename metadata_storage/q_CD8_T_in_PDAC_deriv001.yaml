calibration:
  parameters:
  - name: q_CD8_T_in
    units: 1 / (centimeter**3 * minute)
    prior:
      distribution: lognormal
      mu: -20.1
      sigma: 2.5
      lower:
      upper:
      rationale: |
        Very wide prior over CD8 T cell extravasation rate into tumor, centered near the median value (~2e-9 1/(cm^3*min)) obtained from the analytical conversion of Boissonnas et al. EG7 OT1 infiltration data and De Boer et al. CD8 effector half-life data, to match the derived measurement scale while still allowing several orders of magnitude of uncertainty.
  state_variables:
  model:
    data_rationale: |
      Boissonnas et al. (2007) report an absolute mean density of 327 +/- 50 OT1 CD8 T cells per mm^2 in EG7 thymoma sections at day 6 after adoptive transfer of 10^7 naive OT1-GFP cells into mice bearing 500-1,000 mm^3 tumors. Combined with section thickness (5 um) and tumor volume, these data provide an estimate of the total number of tumor-infiltrating OT1 cells (N_Tumor) at a late time point. Independent work by De Boer et al. (2003) provides an in vivo half-life of ~41 h for CD8 effector T cell contraction, which informs the effective first-order loss rate k_CD8_death. Assuming approximate steady state between influx and first-order loss at day 6, we can analytically derive the extravasation rate coefficient q_CD8_T_in from N_Tumor, k_CD8_death, tumor volume, and the circulating OT1 pool CD8_C.
    submodel_rationale: |
      In the full QSPIO-PDAC model, the CD8 T cell extravasation parameter q_CD8_T_in appears in the flux term from the central compartment to the tumor: rate_in = q_CD8_T_in * V_T * V_C.CD8 * f(C_total, CXCL12). For an established, highly permissive EG7 tumor without strong CXCL12-mediated exclusion and with large cancer cell burden, f(C_total, CXCL12) is expected to be near 1, so the main dependence is on tumor volume V_T and circulating CD8 pool V_C.CD8. At late times when tumor-infiltrating OT1 numbers have equilibrated under a balance of constant influx and first-order loss with rate k_CD8_death, the steady-state relation N_Tumor ≈ (q_CD8_T_in * V_T * CD8_C) / k_CD8_death holds. Rearranging, q_CD8_T_in ≈ k_CD8_death * N_Tumor / (V_T * CD8_C). The direct_conversion submodel encodes this analytical relationship and uses literature-derived distributions for N_Tumor, V_T, CD8_C (approximated by the 10^7 transferred OT1 cells), and k_CD8_death to construct an empirical distribution for q_CD8_T_in that is consistent with the EG7 trafficking data.
    type: direct_conversion
    formula: q_CD8_T_in = k_CD8_death * N_Tumor / (V_T * CD8_C)
  independent_variable:
  measurements:
  - name: q_CD8_T_in_derived
    observable:
    units: 1 / (centimeter**3 * minute)
    uses_inputs:
    - OT1_density_day6
    - OT1_density_day6_sd
    - section_thickness_um
    - EG7_tumor_volume_min
    - EG7_tumor_volume_max
    - OT1_injected
    - CD8_eff_half_life
    - CD8_eff_half_life_sd
    evaluation_points: []
    sample_size: 1
    sample_size_rationale: |
      Analytical conversion of pooled literature values into an implied distribution for q_CD8_T_in; treated as a single composite measurement.
    distribution_code: |
      def derive_distribution(inputs, ureg):
          import numpy as np

          def _val(name):
              v = inputs[name]
              return float(getattr(v, 'magnitude', v))

          # OT1 density in EG7 at day 6 (cells per mm^2)
          d_mean = _val('OT1_density_day6')
          d_sd = _val('OT1_density_day6_sd')

          # Lognormal approximation for positive densities
          mu_log = np.log(d_mean**2 / np.sqrt(d_mean**2 + d_sd**2))
          sigma_log = np.sqrt(np.log(1.0 + (d_sd**2) / (d_mean**2)))
          d_samples = np.random.lognormal(mu_log, sigma_log, 20000)

          # Section thickness (5 um) and tumor volume range (500-1000 mm^3)
          thickness = _val('section_thickness_um')  # micrometer, treated consistently
          V_min = _val('EG7_tumor_volume_min')      # mm^3
          V_max = _val('EG7_tumor_volume_max')      # mm^3
          V_samples = np.random.uniform(V_min, V_max, 20000)

          # Convert 2D density to 3D density and then to total intratumoral OT1 count
          rho_samples = d_samples / thickness       # cells per (mm^3) up to a constant factor
          N_tumor_samples = rho_samples * V_samples # total cells, up to consistent units

          # CD8 effector half-life (hours) from De Boer et al. (2003)
          t_half_mean = _val('CD8_eff_half_life')
          t_half_sd = _val('CD8_eff_half_life_sd')

          # Lognormal distribution for half-life
          mu_h = np.log(t_half_mean**2 / np.sqrt(t_half_mean**2 + t_half_sd**2))
          sigma_h = np.sqrt(np.log(1.0 + (t_half_sd**2) / (t_half_mean**2)))
          t_half_samples_h = np.random.lognormal(mu_h, sigma_h, 20000)  # hours

          # Convert half-life to per-minute loss rate k = ln(2) / (t_half * 60)
          k_samples = np.log(2.0) / (t_half_samples_h * 60.0)

          # Circulating OT1 pool approximated by number injected
          CD8_C = _val('OT1_injected')

          # Representative tumor volume per sample; use V_samples (same as used for N_tumor)
          V_T_samples = V_samples

          # Analytical relation q = k * N_Tumor / (V_T * CD8_C)
          q_samples = k_samples * N_tumor_samples / (V_T_samples * CD8_C + 1e-12)

          # Filter out any non-positive or extreme values for numerical robustness
          q_samples = q_samples[np.isfinite(q_samples) & (q_samples > 0)]

          return {
              'median': float(np.median(q_samples)),
              'ci95_lower': float(np.percentile(q_samples, 2.5)),
              'ci95_upper': float(np.percentile(q_samples, 97.5)),
          }
    likelihood:
      distribution: lognormal
      rationale: |
        The analytically derived q_CD8_T_in distribution is positive and spans orders of magnitude because it combines uncertainty in density measurements, tumor volume, and CD8 effector half-life. A lognormal likelihood on q_CD8_T_in is therefore appropriate when using this derived distribution as a calibration target.
  identifiability_notes: |
    Because this is a direct analytical conversion rather than an ODE fit, q_CD8_T_in is effectively determined (up to uncertainty) by the combination of Boissonnas EG7 trafficking data, De Boer CD8 half-life data, and simple geometric and steady-state assumptions. The resulting distribution for q_CD8_T_in captures uncertainty from tumor-to-tumor variability, tumor volume, and CD8 effector survival, but does not separately identify additional processes such as local proliferation or spatial heterogeneity. In the full QSP model, this submodel should be combined with other trafficking- and efficacy-related submodels to refine the prior on q_CD8_T_in and propagate its uncertainty into PDAC simulations.
