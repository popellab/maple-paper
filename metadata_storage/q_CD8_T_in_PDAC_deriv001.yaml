study_interpretation: |
  Boissonnas et al. (2007) provide quantitative data on the accumulation of adoptively transferred OT1 CD8 T cells within established subcutaneous EG7 thymomas in C57BL/6 mice, including an absolute late-phase density of 327 +/- 50 OT1 cells per mm^2 at day 6 in 500-1,000 mm^3 tumors after transfer of 10^7 naive OT1-GFP cells. These data, combined with section thickness and tumor volume, imply a characteristic scale for the total tumor-infiltrating OT1 population. De Boer et al. (2003) report an in vivo CD8 effector contraction half-life of ~41 h, which we use to approximate the first-order loss rate of tumor-infiltrating CD8 T cells. Assuming an approximate steady state between constant influx and first-order loss at day 6, we analytically map these measurements to an effective CD8 extravasation rate coefficient q_CD8_T_in via the same mechanistic structure used in the full QSPIO-PDAC model (flux proportional to V_T * V_C.CD8). This yields an empirically grounded distribution for q_CD8_T_in in a permissive solid tumor setting, which can serve as a prior for PDAC calibration (with additional downscaling to account for T cell exclusion in PDAC).

key_assumptions:
- |
  EG7 thymoma is used as a proxy for solid tumors such as PDAC with respect to CD8 T cell trafficking, assuming that the basic process of effector CD8 T cell extravasation across tumor vasculature and accumulation in the tumor stroma is qualitatively similar.
- |
  The CXCL12-mediated T cell exclusion term and cancer-cell-dependent recruitment modulation in the full QSP model are approximated as unity for the Boissonnas EG7 model, reflecting that EG7 is highly permissive to CTL infiltration compared with the CXCL12-high, T cell-excluded PDAC microenvironment.
- |
  The circulating OT1 CD8 T cell pool (V_C.CD8) is approximated by the 10^7 transferred naive OT1 cells, assuming that this scale remains representative of the effective circulating OT1 pool driving tumor infiltration during the late phase.
- |
  Local proliferation of OT1 cells within the tumor and secondary lymphoid organs is not modeled explicitly; instead, its net effect on intratumoral numbers is partially absorbed into the effective extravasation rate q_CD8_T_in and the use of De Boer CD8 effector half-life data.
- |
  Tumor volume during the day 6 measurement is represented by a uniform distribution between the reported 500 and 1,000 mm^3 values at adoptive transfer, acknowledging geometric uncertainty without detailed longitudinal volume data.
- |
  The 2D OT1 density reported per mm^2 in 5 um sections is converted to a 3D density by dividing by section thickness, assuming relatively homogeneous distribution of infiltrating CTL within the analyzed tumor regions.
- |
  Measurement variability across tumors is represented by a lognormal distribution fitted to the reported mean and SD of OT1 density; uncertainty in CD8 effector half-life is represented by an assumed lognormal SD of 10 h around the reported 41 h mean.

key_study_limitations:
- |
  The experimental system uses an antigen-transgenic OT1/OVA thymoma model with very high precursor frequency and strong antigen expression, which likely overestimates CD8 T cell infiltration compared with spontaneous human PDAC lesions.
- |
  Intratumoral OT1 numbers in EG7 reflect both trafficking and local proliferation; treating the late time point as an approximate steady state between influx and first-order loss neglects explicit proliferative dynamics and may bias q_CD8_T_in upward.
- |
  EG7 thymomas are subcutaneous and relatively well vascularized, whereas PDAC tumors are typically desmoplastic with abnormal vasculature and strong chemokine barriers (e.g., CXCL12), so q_CD8_T_in values inferred here may represent an upper bound for PDAC and require downscaling when integrated into the full QSP PDAC model.
- |
  The CD8 effector half-life estimate from De Boer et al. (LCMV infection) may differ from the true survival of tumor-infiltrating CTL in EG7 or PDAC; this uncertainty is only coarsely represented by the assumed SD on half-life.
- |
  Tumor volumes at the exact time of the day 6 OT1 density measurements are not provided; we approximate them using the reported 500-1,000 mm^3 range at adoptive transfer, introducing geometric uncertainty handled heuristically via uniform sampling.
- |
  Absolute units for density-to-count conversion (mm vs um) are handled in a simplified manner in the distribution code; in practice, unit-consistent implementation in the QSP toolchain should refine these conversions.

