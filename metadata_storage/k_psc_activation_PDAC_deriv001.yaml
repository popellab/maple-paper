calibration:
  parameters:
  - name: k_psc_activation
    units: 1/day
    prior:
      distribution: lognormal
      mu: -0.693
      sigma: 1.0
      lower:
      upper:
      rationale: |
        Centre on ~0.5/day corresponding to an activation timescale of ~2 days (48 h) as observed for primary rat PSCs on plastic, but allow ~10-fold uncertainty to account for species and context differences between in vitro culture and PDAC tumour stroma.
  state_variables:
  model:
    data_rationale: |
      Apte et al. 1998 report that primary rat pancreatic stellate cells cultured on plastic are negative for alpha-smooth muscle actin (alpha-SMA) at 24 h but positive at 48 h, indicating that the quiescent-to-activated transition occurs on a timescale of order 2 days under strong activation conditions in vitro.
    submodel_rationale: |
      In the full QSPIO-PDAC model, the rate of quiescent PSC activation to myofibroblast-like activated PSCs (CAF phenotype) in the tumour compartment is governed by k_psc_activation multiplied by saturable TGFbetab- and PDGF-dependent Hill terms. In early primary cultures, PSC activation on plastic is driven by autocrine/paracrine cytokines and mechanical cues that are expected to produce near-saturating activation signals. Under this assumption, the in vitro activation timescale (~48 h) approximates the inverse of k_psc_activation in the full model when the TGFbetab and PDGF Hill terms are near 1.
    type: direct_conversion
    formula: t_activation = 1 / k_psc_activation
  independent_variable:
  measurements:
  - name: psc_activation_time_constraint
    observable:
    units: hour
    uses_inputs:
    - psc_activation_time_48h
    evaluation_points:
    - 0.0
    sample_size: 1
    sample_size_rationale: |
      Single primary culture timing estimate for onset of alpha-SMA positivity from Apte 1998 Gut.
    distribution_code: |
      def derive_distribution(inputs, ureg):
          import numpy as np
          # Observed activation time (onset of alpha-SMA positivity)
          t_obs = inputs['psc_activation_time_48h']
          # Convert to days for consistency with k_psc_activation units
          t_days = t_obs.to('day').magnitude
          # Assume a 25% coefficient of variation on activation time (not reported in the paper)
          cv = 0.25
          sigma = np.sqrt(np.log(1.0 + cv**2))
          mu = np.log(t_days) - 0.5 * sigma**2
          # Draw a lognormal distribution for activation time
          t_samples = np.random.lognormal(mu, sigma, 10000)
          # Map to implied k_psc_activation samples via t_activation = 1 / k
          k_samples = 1.0 / t_samples
          return {
              'median': float(np.median(k_samples)),
              'ci95_lower': float(np.percentile(k_samples, 2.5)),
              'ci95_upper': float(np.percentile(k_samples, 97.5)),
          }
    likelihood:
      distribution: lognormal
      rationale: |
        Activation time is positive and likely subject to multiplicative biological and experimental variability; we therefore represent uncertainty in the observed ~48 h activation time with a lognormal distribution over t_activation, which is then mapped to k_psc_activation via t_activation = 1/k_psc_activation.
  identifiability_notes: |
    This submodel provides only an order-of-magnitude constraint on k_psc_activation based on a single qualitative timing observation (onset of alpha-SMA positivity at ~48 h). The inferred k_psc_activation conflates effects of TGFbetab, PDGF, mechanical cues, and other stimuli present during primary culture and should be interpreted as an effective activation rate under strong profibrotic signaling. Additional time-course data quantifying the fraction of PSCs that are alpha-SMA+ over multiple time points, ideally under defined TGFbetab and PDGF concentrations and in human PSCs, would be required for tighter and more mechanistically specific identification.
