calibration:
  parameters:
  - name: q_Treg_T_in
    units: 1/(centimeter^3*minute)
    prior:
      distribution: lognormal
      mu: -8.52
      sigma: 1.0
      lower:
      upper:
      rationale: |
        Center prior at the value implied by PDAC patient tumor vs blood Treg enrichment (~3-fold) combined with human Treg turnover (doubling time ~8 days). The sigma of 1.0 accounts for inter-patient variability (population SD in Treg fractions is ~27% CV for TIL and ~17% CV for PBMC based on SEM-to-SD conversion), modeling simplifications, and uncertainty in mapping steady-state enrichment to a trafficking rate.

  forward_model:
    independent_variable:
    state_variables:
    type: algebraic
    formula: |
      q_Treg_T_in = (PDAC_TIL_Treg_fraction_mean / PBMC_Treg_fraction_mean) * (ln(2) / Treg_doubling_time_mean) / (1 centimeter**3)
    code: |
      def compute(params, inputs, ureg):
          """Forward model: given q_Treg_T_in, predict tumor Treg fraction."""
          import numpy as np
          def _val(x):
              return getattr(x, 'magnitude', x)
          q = params['q_Treg_T_in']
          t_doubling = _val(inputs['Treg_doubling_time_mean'])
          f_pbmc = _val(inputs['PBMC_Treg_fraction_mean'])
          k_per_day = np.log(2) / t_doubling
          k_per_min = k_per_day / (24.0 * 60.0)
          V_ref = 1.0
          ratio = q * V_ref / k_per_min
          f_tumor = ratio * f_pbmc
          return f_tumor * ureg.dimensionless
    code_julia: |
      function compute(params, inputs)
          q = params["q_Treg_T_in"]
          t_doubling = inputs["Treg_doubling_time_mean"]
          k_per_day = log(2) / t_doubling
          k_per_min = k_per_day / (24.0 * 60.0)
          V_ref = 1.0
          ratio = q * V_ref / k_per_min
          return ratio
      end
    data_rationale: |
      Tang et al. provide paired measurements of regulatory T cell (Treg) fractions in peripheral blood and PDAC tumor-infiltrating lymphocytes across 45 patients, which constrains the steady-state enrichment of Tregs in tumor relative to blood. Vukmanovic-Stejic et al. provide an in vivo doubling time for human CD4+CD25hiFoxp3+ Tregs, characterizing their peripheral turnover rate. Assuming that in resectable PDAC the intratumoral Treg pool is near steady state, these data together constrain the net influx rate required to maintain the observed intratumoral Treg fraction against turnover.
    submodel_rationale: |
      In the full QSPIO-PDAC model, q_Treg_T_in multiplies tumor volume, central-compartment Treg number, and a cancer-burden dependent recruitment term (C_total^2/(C_total^2+Kc_rec)) to give the flux of Tregs (and Th cells) from blood into tumor. For established PDAC lesions at surgical resection, tumor burden is high so C_total>>sqrt(Kc_rec) and the recruitment term is effectively 1. The central Treg pool and tumor volume change slowly compared to trafficking, allowing their product to be treated as approximately constant over the timescale of Treg turnover. Under these conditions, the tumor Treg pool obeys a first-order balance between a constant influx proportional to q_Treg_T_in and a first-order loss due to death/turnover. The direct_conversion model analytically maps the observed steady-state tumor-to-blood Treg ratio and an externally measured Treg turnover rate to an effective q_Treg_T_in that is mechanistically consistent with the full trafficking term in the saturated, steady-state limit.

  error_model:
  - name: q_Treg_T_in_derived
    observable:
    units: dimensionless
    uses_inputs:
    - PDAC_TIL_Treg_fraction_mean
    - PDAC_TIL_Treg_fraction_sem
    - PBMC_Treg_fraction_mean
    - PBMC_Treg_fraction_sem
    - Treg_doubling_time_mean
    - n_patients
    sample_size: 45
    sample_size_rationale: |
      Tang et al. report flow cytometry data from 45 PDAC patients with paired PBMC and tumor TIL measurements. The Treg turnover estimate is based on 8 healthy donors, but is treated as a fixed auxiliary parameter here.
    measurement_error_code: |
      def derive_error(inputs, sample_size, ureg):
          """
          Measurement error for q_Treg_T_in derived from PDAC Treg enrichment.

          SD propagated from Treg fraction SEMs through the ratio calculation.
          """
          import numpy as np
          f_tumor = inputs['PDAC_TIL_Treg_fraction_mean'].magnitude
          sem_tumor = inputs['PDAC_TIL_Treg_fraction_sem'].magnitude
          f_pbmc = inputs['PBMC_Treg_fraction_mean'].magnitude
          sem_pbmc = inputs['PBMC_Treg_fraction_sem'].magnitude
          n_patients = int(inputs['n_patients'].magnitude)
          sd_tumor = sem_tumor * np.sqrt(n_patients)
          sd_pbmc = sem_pbmc * np.sqrt(n_patients)
          # Propagate error through ratio using delta method approximation
          cv_tumor = sd_tumor / f_tumor
          cv_pbmc = sd_pbmc / f_pbmc
          cv_ratio = np.sqrt(cv_tumor**2 + cv_pbmc**2)
          sigma_log = np.sqrt(np.log(1 + cv_ratio**2))
          return {
              'sd': sigma_log * ureg.dimensionless,
              'sd_uncertain': False,
              'n': sample_size if sample_size else n_patients,
          }
    distribution_code: |
      def derive_distribution(inputs, ureg):
          import numpy as np
          # Extract means and SEMs for Treg fractions
          f_tumor = inputs['PDAC_TIL_Treg_fraction_mean'].magnitude
          sem_tumor = inputs['PDAC_TIL_Treg_fraction_sem'].magnitude
          f_pbmc = inputs['PBMC_Treg_fraction_mean'].magnitude
          sem_pbmc = inputs['PBMC_Treg_fraction_sem'].magnitude
          # Doubling time for human peripheral blood Tregs (days)
          t_doubling_days = inputs['Treg_doubling_time_mean'].to('day').magnitude

          # Convert SEM to SD: SD = SEM × sqrt(n)
          n_patients = int(inputs['n_patients'].magnitude)
          sd_tumor = sem_tumor * np.sqrt(n_patients)
          sd_pbmc = sem_pbmc * np.sqrt(n_patients)

          n_samples = 10000
          tumor_samples = np.random.normal(f_tumor, sd_tumor, n_samples)
          pbmc_samples = np.random.normal(f_pbmc, sd_pbmc, n_samples)
          # Prevent non-physical negative fractions
          tumor_samples = np.clip(tumor_samples, 1e-6, None)
          pbmc_samples = np.clip(pbmc_samples, 1e-6, None)

          ratio_samples = tumor_samples / pbmc_samples

          # First-order turnover rate from doubling time
          k_per_day = np.log(2.0) / t_doubling_days
          k_per_min = k_per_day / (24.0 * 60.0)

          # Reference tumor volume of 1 cm^3 to recover units 1/(cm^3*min)
          V_ref = 1.0

          q_samples = ratio_samples * k_per_min / V_ref

          return {
              'median': float(np.median(q_samples)),
              'ci95_lower': float(np.percentile(q_samples, 2.5)),
              'ci95_upper': float(np.percentile(q_samples, 97.5)),
          }
    likelihood:
      distribution: lognormal
      rationale: |
        The derived q_Treg_T_in distribution represents uncertainty in mapping from measured tumor vs blood Treg enrichment and Treg turnover into an effective extravasation rate. A lognormal likelihood is appropriate for this positive, multiplicative quantity.

  identifiability_notes: |
    This submodel constrains q_Treg_T_in primarily through the steady-state ratio of intratumoral to peripheral Treg fractions and an external estimate of peripheral Treg turnover. Under the saturated-recruitment, quasi-steady-state assumptions, q_Treg_T_in is effectively proportional to the product of the tumor-to-blood Treg enrichment ratio and the Treg turnover rate. Because we treat the Treg doubling time as fixed rather than inferring it jointly, q_Treg_T_in is identifiable in this reduced model up to the modeling assumptions about equal Treg fractions tracking relative concentrations. If k_Treg_death or the effective tumor volume scale were also free, only the combination q_Treg_T_in/k_Treg_death (per unit tumor volume) would be identifiable; additional dynamic data on Treg accumulation or independent estimates of Treg death in PDAC tumors would be needed to disentangle these effects.

