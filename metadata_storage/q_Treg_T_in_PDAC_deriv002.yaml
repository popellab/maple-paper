study_interpretation: |
  Tang et al. demonstrate that in human PDAC, regulatory T cells are markedly enriched within tumor-infiltrating lymphocytes compared to both normal pancreatic tissue and peripheral blood, with mean Treg fractions of approximately 17.8% of CD4+ T cells in TILs versus 5.8% in PBMCs. This roughly three-fold enrichment, together with the observation that peripheral Treg frequencies are similar in PDAC patients and healthy controls, indicates a strong net recruitment and/or retention of Tregs into the PDAC tumor microenvironment. Vukmanovic-Stejic et al. show that human CD4+CD25hiFoxp3+ Tregs in peripheral blood have a rapid in vivo turnover with a doubling time of about 8 days, implying substantial ongoing proliferation and death. Assuming that resectable PDAC tumors are in a quasi-steady state with respect to Treg numbers, the intratumoral Treg pool must be replenished at a rate that balances this turnover while maintaining a three-fold higher fraction than in blood. The submodel therefore interprets the PDAC tumor-to-blood Treg enrichment as arising from a constant influx proportional to q_Treg_T_in acting against a first-order Treg loss rate set by the turnover timescale, and uses a direct analytical mapping to derive an effective distribution for q_Treg_T_in consistent with these observations.

key_assumptions:
- |
  Resected PDAC tumors in Tang et al. represent a quasi-steady state for intratumoral Treg numbers, such that net Treg influx balances death and egress over the timescale of days to weeks.
- |
  The PDAC tumor burden at resection is sufficiently large that the cancer-cell-dependent recruitment term C_total^2/(C_total^2+Kc_rec) in the full QSP model is effectively saturated (approximately 1), so it can be treated as constant in this submodel.
- |
  Treg fractions among CD4+ T cells in PBMCs and in tumor-infiltrating lymphocytes can be used as proxies for relative Treg concentrations in blood versus tumor, i.e. differences in total CD4+ T cell density between compartments are second-order for estimating the Treg enrichment ratio.
- |
  Peripheral blood Treg turnover kinetics (doubling time ~8 days) measured in healthy donors are representative of systemic Treg turnover in PDAC patients and provide an appropriate timescale for Treg loss in the absence of tumor-specific effects.
- |
  Other tumor-local mechanisms that affect intratumoral Treg abundance (CCR5/CCL5-dependent recruitment, local Th-to-Treg conversion, differential survival) are implicitly lumped into the effective extravasation rate q_Treg_T_in in this reduced model.
- |
  A reference tumor volume of 1 cm^3 is used implicitly to translate from a dimensionless enrichment ratio and a turnover rate (1/day) to q_Treg_T_in units of 1/(cm^3*minute); variation in actual lesion size is absorbed into parameter uncertainty.

key_study_limitations:
- |
  Tang et al. provide cross-sectional data at the time of surgery rather than time-resolved kinetics of Treg accumulation, so the mapping to a dynamic trafficking rate relies on a steady-state assumption rather than directly measured time courses.
- |
  The use of Treg turnover data from healthy volunteers (Vukmanovic-Stejic et al.) neglects potential changes in Treg survival or proliferation induced by cancer, chronic inflammation, or therapies in PDAC patients.
- |
  Flow cytometry reports percentages of Tregs among CD4+ T cells rather than absolute Treg concentrations per unit tissue volume, so the conversion from fraction enrichment to an extravasation rate assumes that CD4+ T cell densities in blood and tumor are comparable up to a compartment-independent scaling factor.
- |
  Intratumoral Treg abundance in PDAC reflects the combined effects of trafficking, local proliferation, conversion of conventional CD4+ T cells to Tregs, and differential survival; the present submodel attributes the excess tumor Treg fraction primarily to trafficking via q_Treg_T_in, potentially overestimating its contribution relative to in situ generation.
- |
  Heterogeneity in PDAC stromal architecture, vascularization, and local chemokine gradients across patients is not captured; a single effective q_Treg_T_in is inferred from population-averaged data.

