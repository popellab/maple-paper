calibration:
  parameters:
  - name: n_CD8_clones
    units: dimensionless
    prior:
      distribution: lognormal
      mu: 3.9
      sigma: 1.0
      lower:
      upper:
      rationale: |
        Center the prior around ~50 clones, comparable to the reported average number of non-synonymous mutations per PDAC tumor (about 52), with a wide log-space sigma to allow for order-of-magnitude uncertainty in how many mutations generate distinct tumor-reactive CD8 T cell clones.
  forward_model:
    data_rationale: |
      The paper reports the average number of non-synonymous coding mutations per primary resectable PDAC tumor. Each such mutation can in principle generate at least one distinct neoantigenic peptide and thus potentially one distinct tumor-specific CD8 T cell clone.
    submodel_rationale: |
      In the full QSPIO-PDAC model, n_CD8_clones multiplies antigen production from dying cancer cells and scales T cell activation rates, effectively representing the number of distinct tumor-specific CD8 T cell clones (or antigen specificities) that can respond to tumor antigen P1. Assuming approximately one immunogenic CD8 T cell clone per non-synonymous mutation provides a mechanistic link between somatic mutational load and the effective number of tumor-reactive clones.
    independent_variable:
    state_variables:
    type: algebraic
    formula: nonsyn_mutations = n_CD8_clones
    code: |
      def compute(params, inputs, ureg):
          n_clones = params['n_CD8_clones']
          return n_clones * ureg('dimensionless')
    code_julia: |
      function compute(params, inputs)
          return params["n_CD8_clones"]
      end
  error_model:
  - name: nonsyn_mutation_count
    observable:
    units: dimensionless
    uses_inputs:
    - nonsyn_mutations_mean
    - nonsyn_mutations_sd
    evaluation_points:
    sample_size:
    sample_size_rationale: |
      The exact cohort size for the 52±15 estimate is not given in the discussion text; the value likely summarizes whole-exome data across a moderate PDAC patient cohort. We therefore leave sample_size unspecified and encode uncertainty via the reported SD.
    observation_code: |
      def derive_observation(inputs, sample_size, ureg):
          mean = inputs['nonsyn_mutations_mean']
          sd = inputs['nonsyn_mutations_sd']
          cv = sd.magnitude / mean.magnitude
          return {
              'value': mean,
              'sd': cv,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        Mutation counts are positive and vary over roughly a log-normal-like range across tumors. The reported SD is converted to a coefficient of variation (CV) for a lognormal likelihood.
  identifiability_notes: |
    This algebraic submodel has a single parameter (n_CD8_clones) and a single observational constraint (distribution of non-synonymous mutation counts per tumor). Under the assumption that each non-synonymous mutation effectively corresponds to one potential tumor-specific CD8 T cell clone, the parameter is structurally identifiable: the posterior for n_CD8_clones will closely track the observed mutational load distribution. However, biological uncertainties in the mapping from mutations to immunogenic CD8 T cell clones (e.g., peptide processing, HLA binding, thymic tolerance, and T cell priming efficiency) are absorbed into the relatively wide prior on n_CD8_clones and into the source_relevance translation uncertainty, rather than modeled explicitly as separate parameters.

