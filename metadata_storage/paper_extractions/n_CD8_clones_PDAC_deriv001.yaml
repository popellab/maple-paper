study_interpretation: |
  Poschke et al. analyzed T cell infiltrates, TCR repertoires, and mutational landscapes in primary resectable PDAC. In the discussion they note that, consistent with earlier genomic studies, primary PDAC tumors harbor on the order of 52±15 non-synonymous mutations per tumor, plus a small number of insertions/deletions. In the QSPIO-PDAC model, n_CD8_clones scales both antigen production and the number of tumor-specific CD8 clones that can be activated. Interpreting each non-synonymous mutation as capable of producing at least one distinct potential CD8-recognized neoepitope allows us to link the experimentally measured mutational load to the effective number of tumor-reactive CD8 T cell clones represented by n_CD8_clones. This provides a disease- and species-matched anchor for the magnitude of n_CD8_clones, with wide uncertainty to reflect imperfect correspondence between somatic mutations and functional T cell responses.

key_assumptions:
- |
  Each non-synonymous somatic mutation in PDAC can, on average, generate approximately one distinct antigenic peptide that could be recognized by at least one CD8 T cell clone, so that the typical number of potential neoantigens is of the same order as the reported non-synonymous mutation count.
- |
  The effective number of tumor-reactive CD8 T cell clones represented by n_CD8_clones in the QSP model is proportional to the number of potential neoantigens, and other sources of tumor antigens (e.g., overexpressed self-antigens) contribute comparatively less to the magnitude of n_CD8_clones in PDAC.
- |
  Inter-patient variability in PDAC mutational load (52±15 mutations per tumor) is a reasonable proxy for variability in the effective number of tumor-reactive clones at the population level, after marginalizing over differences in HLA type and antigen processing.
- |
  The additional 4–6 small indels per tumor contribute relatively modestly to the total pool of distinct immunogenic CD8 epitopes compared with the non-synonymous SNVs, and can be neglected at the current level of model granularity.
- |
  Selection, tolerance, and priming inefficiencies (which reduce the number of functional tumor-reactive CD8 clones below the raw number of mutations) are absorbed into the prior and translation-uncertainty on n_CD8_clones, rather than modeled explicitly with additional parameters.

key_study_limitations:
- |
  The 52±15 non-synonymous mutation estimate is summarized in the discussion as "data not shown" and likely reflects a specific exome-sequenced cohort; detailed cohort characteristics and exact sample size are not provided in the quoted text.
- |
  Not every non-synonymous mutation yields a processed, MHC class I-presented peptide that is recognized by CD8 T cells; in many tumors, only a small subset of mutations is immunogenic, so equating mutation count with clone count likely overestimates the true number of tumor-reactive clones.
- |
  Conversely, non-mutated overexpressed self-antigens and cancer-testis antigens can also elicit CD8 responses, so focusing solely on non-synonymous mutations may underestimate the total antigenic landscape.
- |
  The mapping from mutations to functional CD8 T cell clones depends on patient-specific HLA alleles and immune history, which are not captured in this aggregated mutational load statistic.
- |
  Poschke et al. studied resectable primary PDAC; mutational landscapes and corresponding antigenic repertoires may differ in metastatic or heavily pretreated disease settings that the QSP model might also be used to simulate.

