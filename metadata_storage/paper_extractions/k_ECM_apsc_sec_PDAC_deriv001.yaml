calibration:
  parameters:
  - name: k_ECM_apsc_sec
    units: mg/(cell*day)
    prior:
      distribution: lognormal
      mu: -20.5
      sigma: 1.5
      lower:
      upper:
      rationale: |
        Centered so that exp(mu) is on the order of 10^-9 mg/(cell*day), matching the approximate per-cell type I procollagen secretion rate of fibroblasts inferred from ~100000 molecules/hour and MW 300 kDa. Sigma = 1.5 provides a wide prior (several orders of magnitude) to accommodate uncertainty in extrapolating from NIH3T3 fibroblasts to activated pancreatic stellate cells (aPSCs) in PDAC.
  forward_model:
    data_rationale: |
      The calibration data provide an estimate of the per-cell secretion rate of type I procollagen in fibroblasts, reported as approximately 100000 procollagen molecules per hour per cell. Converting molecules to mass using the molecular weight of type I collagen and Avogadro's constant yields an estimated collagen production rate on the order of 10^-9 mg per cell per day. This is used as a proxy for ECM secretion by activated stellate or myofibroblast-like cells under strong profibrotic signaling.
    submodel_rationale: |
      In the full QSPIO-PDAC model, ECM production by activated PSCs in the tumor compartment is represented as: rate = k_ECM_apsc_sec * ((ECM_max - ECM_level)/ECM_max) * V_T.aPSC * (V_T.TGFb / (TGFb_50 + V_T.TGFb)). Under conditions of low ECM relative to ECM_max and saturating TGFbeta signaling (TGFb >> TGFb_50), the bracketed factors approach unity and the per-cell secretion rate is approximately k_ECM_apsc_sec. The algebraic submodel captures this limiting regime and directly links k_ECM_apsc_sec to an experimentally informed per-cell ECM secretion rate. It is thus a mechanistically consistent restriction of the full model, appropriate for calibrating k_ECM_apsc_sec from in vitro fibroblast secretion data.
    independent_variable:
    state_variables:
    type: algebraic
    formula: ecm_secretion_rate_per_cell = k_ECM_apsc_sec
    code: |
      def compute(params, inputs, ureg):
          # Forward model predicts per-cell ECM secretion rate under
          # conditions where ECM is far below ECM_max and profibrotic
          # signals (e.g., TGFbeta) are saturating, so that
          # (ECM_max - ECM_level)/ECM_max ~ 1 and
          # TGFbeta/(TGFbeta_50 + TGFbeta) ~ 1.
          #
          # In this limit, the full QSP model production term
          #   k_ECM_apsc_sec * ((ECM_max-ECM_level)/ECM_max)
          #   * aPSC * (TGFbeta/(TGFbeta_50 + TGFbeta))
          # reduces, on a per-cell basis, to k_ECM_apsc_sec.
          k = params['k_ECM_apsc_sec']
          return k * ureg('mg/(cell*day)')
    code_julia: |
      function compute(params, inputs)
          # Julia forward model with the same rationale:
          # per-cell ECM secretion rate equals k_ECM_apsc_sec
          # in the low-ECM, saturating-TGFbeta limit.
          return params["k_ECM_apsc_sec"]
      end
  error_model:
  - name: ecm_secretion_rate_from_fibroblasts
    observable:
    units: mg/(cell*day)
    uses_inputs:
    - fibroblast_collagen_molecules_per_hour_mean
    - avogadro_constant
    - collagen_typeI_molecular_weight
    - hours_per_day
    - assumed_cv_collagen_rate
    evaluation_points:
    sample_size:
    sample_size_rationale: |
      The original study reports an approximate secretion rate derived from quantitative proteomics; an explicit n is not provided in the text. We therefore treat the measurement as a single summary estimate with wide uncertainty encoded via an assumed coefficient of variation.
    observation_code: |
      def derive_observation(inputs, sample_size, ureg):
          import numpy as np

          # Extract literature inputs
          rate = inputs['fibroblast_collagen_molecules_per_hour_mean']
          avog = inputs['avogadro_constant']
          mw = inputs['collagen_typeI_molecular_weight']
          hours_per_day = inputs['hours_per_day']
          cv_input = inputs['assumed_cv_collagen_rate']

          # Convert molecules/(cell*hour) to mg/(cell*day)
          molecules_per_hour = rate.magnitude
          avog_value = avog.magnitude        # molecules per mole
          mw_value = mw.magnitude            # grams per mole
          hours_value = hours_per_day.magnitude

          # grams per day per cell:
          # (molecules/hour/cell) / (molecules/mole) * (grams/mole) * (hours/day)
          g_per_day_per_cell = (
              molecules_per_hour / avog_value * mw_value * hours_value
          )

          value = g_per_day_per_cell * ureg('g/(cell*day)')
          value = value.to('mg/(cell*day)')

          # Use an assumed coefficient of variation to represent
          # combined experimental and translation uncertainty.
          cv = cv_input.magnitude

          return {
              'value': value,
              'sd': cv,
              'sd_uncertain': True,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        Per-cell secretion rates are strictly positive and expected to vary over orders of magnitude across cell types and conditions. A lognormal likelihood with SD given by a coefficient of variation of 1.0 (order-of-magnitude uncertainty) captures this multiplicative variability and the substantial translation uncertainty when using fibroblast data as a proxy for aPSCs.
  identifiability_notes: |
    This submodel includes a single parameter, k_ECM_apsc_sec, and a single algebraic observable equal to k_ECM_apsc_sec under specified limiting conditions. Given a single literature-derived estimate of per-cell collagen secretion, k_ECM_apsc_sec is formally identifiable within the assumed lognormal error structure. However, biological identifiability is limited by: (i) use of NIH3T3 fibroblasts rather than human aPSCs; (ii) restriction to type I collagen rather than total ECM mass; (iii) assumptions about saturating profibrotic signaling and low ECM levels. These issues are represented by a wide likelihood (high CV) and a conservative translation_uncertainty_fold in source_relevance. Additional PSC-specific quantitative secretion data (human aPSCs under defined TGFbeta levels, with absolute ECM mass measurements) would substantially sharpen k_ECM_apsc_sec.

source_relevance:
  indication_match: proxy
  indication_match_justification: |
    The calibration uses NIH3T3 fibroblast collagen I secretion data as a mechanistic proxy for extracellular matrix production by activated pancreatic stellate cells (aPSCs) in PDAC. Both cell types are myofibroblast-like stromal cells that synthesize large amounts of fibrillar collagen and other ECM components, but they differ in tissue of origin, activation context, and exposure to PDAC-specific cytokine and growth factor milieus. We therefore expect similar order-of-magnitude per-cell ECM secretion rates but allow for substantial (multi-fold) deviations.
  species_source: mouse
  species_target: human
  source_quality: primary_animal_in_vitro
  perturbation_type: physiological_baseline
  perturbation_relevance:
  tme_compatibility: low
  tme_compatibility_notes: |
    The secretion data are obtained from NIH3T3 fibroblasts cultured on rigid 2D plastic under standard conditions, without the dense desmoplastic stroma, hypoxia, and complex cytokine gradients present in PDAC tumors. PDAC aPSCs in vivo experience strong profibrotic cues (e.g., TGFbeta, PDGF, inflammatory cytokines) and mechanical feedback from existing ECM, which can modulate secretion rates. Consequently, we expect potentially order-of-magnitude differences between in vitro fibroblast secretion and in situ aPSC ECM production in PDAC.
  estimated_translation_uncertainty_fold: 10.0
  validation_warnings: []
