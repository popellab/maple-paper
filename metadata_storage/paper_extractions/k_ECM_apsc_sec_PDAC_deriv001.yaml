study_interpretation: |
  The Pickard2025 study quantifies the constitutive secretion rate of type I procollagen by NIH3T3 fibroblasts using CRISPR-tagged collagen and quantitative imaging/proteomics, concluding that fibroblasts secrete approximately 100000 procollagen I molecules per hour per cell, corresponding to turnover of the intracellular procollagen pool on a timescale of a few hours. Converting this molecular flux to mass-per-cell-per-day yields an ECM-production-like rate on the order of 10^-9 mg/(cell*day) for type I collagen. Since activated pancreatic stellate cells (aPSCs) are highly fibrogenic myofibroblast-like cells and a major source of collagenous ECM in PDAC, we use this fibroblast secretion rate as a proxy to inform the PDAC model parameter k_ECM_apsc_sec, with wide uncertainty to account for species, cell type, and microenvironmental differences. PSC-focused reviews and studies consistently report that activated PSCs produce large amounts of collagen I, III, fibronectin, and laminin, supporting the use of a fibroblast-based collagen secretion rate as a mechanistically reasonable starting point for ECM production by aPSCs.

key_assumptions:
- |
  Type I collagen dominates the mass of fibrillar ECM produced by activated fibroblast-like cells, so the per-cell mass flux of type I procollagen provides a reasonable proxy for total ECM secretion by aPSCs.
- |
  Under strongly profibrotic conditions in vivo (e.g., high TGFbeta), the effective TGFbeta activation factor TGFb/(TGFb_50 + TGFb) in the full model approaches 1, and tumor ECM levels in the local microenvironment can be approximated as low relative to ECM_max for purposes of estimating the intrinsic per-cell secretion rate, so that the production term per cell reduces to k_ECM_apsc_sec.
- |
  The order-of-magnitude of per-cell ECM secretion by NIH3T3 fibroblasts and by human aPSCs in PDAC is similar, although the exact value may differ by up to an order of magnitude; this is captured by the wide lognormal likelihood (CV = 1.0) and the translation_uncertainty_fold of 10.
- |
  The molecular weight of type I collagen can be approximated as 300000 g/mol for converting molecules to mass; heterogeneity in posttranslational modifications and crosslinking does not strongly affect this conversion at the level of precision needed for the QSP model.

key_study_limitations:
- |
  The primary quantitative secretion data are from mouse NIH3T3 fibroblasts, not human pancreatic stellate cells, so both species and cell-type extrapolations are required.
- |
  The reported secretion rate pertains specifically to type I procollagen and does not directly account for other ECM components (collagen III, fibronectin, laminin, hyaluronan) that contribute to the PDAC desmoplastic stroma.
- |
  The experiments are performed in 2D culture on rigid plastic under relatively simple media conditions, lacking the mechanical and biochemical complexity of the PDAC tumor microenvironment, which can modulate ECM production.
- |
  The 100000 molecules/hour estimate is reported as an approximate value without explicit confidence intervals or replicate counts; measurement noise and biological variability are therefore treated implicitly via an assumed coefficient of variation rather than directly derived statistical uncertainty.

