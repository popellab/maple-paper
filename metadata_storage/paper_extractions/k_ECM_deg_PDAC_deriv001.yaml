study_interpretation: |
  Decaris et al. 2015 used in vivo heavy-water labeling and LC–MS/MS proteomics to quantify fractional synthesis rates (FSRs) of hepatic proteins, including type I and III collagens, in human subjects with chronic liver disease. The reported collagen FSRs of 0.2–0.6% per day correspond to first-order turnover rate constants with half-lives of roughly 120–350 days. Because the QSPIO-PDAC model represents ECM degradation as a first-order loss process, these hepatic collagen FSRs provide a mechanistically appropriate, quantitative estimate of an effective collagen degradation rate constant under a fibrotic yet dynamically remodeling state. We use this as a proxy constraint on k_ECM_deg, acknowledging that PDAC stroma is likely to remodel faster than hepatic scar but should remain within the same broad order-of-magnitude range.

key_assumptions:
- |
  Hepatic type I and III collagen FSRs (0.2–0.6% per day) measured in chronic liver disease are interpreted as first-order turnover rate constants at or near steady state, so that fractional synthesis approximates fractional degradation.
- |
  The dominant mass contribution to the QSPIO-PDAC ECM species is fibrillar collagen (type I/III), so hepatic collagen turnover is a reasonable proxy for bulk ECM degradation despite additional components such as hyaluronan and fibronectin.
- |
  Organ- and disease-specific differences between liver fibrosis and PDAC desmoplastic stroma (cell types, vascularization, mechanical stress) are captured by a broad lognormal prior on k_ECM_deg and an explicit 10-fold translation-uncertainty factor, rather than by attempting detailed allometric or mechanobiological scaling.
- |
  The reported range 0.2–0.6% per day is treated as an approximate 95% interval for collagen FSR across subjects in Decaris et al., allowing reconstruction of a mean and standard deviation under a normal approximation for use in the lognormal likelihood.
- |
  Potential heterogeneity of collagen kinetic pools (fast vs slow turnover fractions) is lumped into a single effective turnover rate constant that governs the macroscale ECM mass in the QSP model.

key_study_limitations:
- |
  The source population consists of eight subjects with heterogeneous chronic liver diseases (primarily chronic hepatitis C), not PDAC patients, introducing organ- and etiology-specific biases.
- |
  Collagen turnover in liver scar tissue may be slower than in actively remodeling PDAC desmoplastic stroma, so hepatic FSRs could underestimate k_ECM_deg in pancreatic tumors.
- |
  The published FSR range (0.2–0.6% per day) summarizes subject-level variability but does not provide explicit means and standard deviations for each subject, requiring an approximate reconstruction of measurement uncertainty.
- |
  Collagen turnover is measured specifically for hepatic type I and III collagens; contributions from other ECM components (e.g., hyaluronan, fibronectin) to the lumped QSP ECM species are not directly quantified.
- |
  The heavy-water labeling approach captures the turnover of the actively remodeling collagen pool; very long-lived, highly cross-linked collagen fractions may not be fully represented but may still contribute to mechanical stiffness in PDAC tumors.

