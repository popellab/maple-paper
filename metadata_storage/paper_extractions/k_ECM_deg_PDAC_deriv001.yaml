calibration:
  parameters:
  - name: k_ECM_deg
    units: 1/day
    prior:
      distribution: lognormal
      mu: -5.521460917862246
      sigma: 1.6094379124341003
      lower:
      upper:
      rationale: |
        Center of prior (exp(mu) ≈ 0.004 1/day) chosen to match mid-range hepatic collagen turnover rates (0.2–0.6% per day) measured by Decaris et al. 2015 in human fibrotic liver, interpreted as first-order rate constants. Wide lognormal sigma (ln 5 ≈ 1.61) allows ~5-fold variability around this value to account for organ-specific and disease-specific differences between hepatic scar tissue and PDAC desmoplastic ECM.
  forward_model:
    data_rationale: |
      Decaris et al. (2015) report first-order fractional synthesis rates (FSRs) for hepatic type I and III collagen (0.2–0.6% per day) obtained by fitting a mono-exponential rise-to-plateau model to heavy-water labeling data. These FSRs are directly interpretable as first-order turnover rate constants for collagen in vivo.
    submodel_rationale: |
      In the full QSPIO-PDAC model, tumor ECM (dominated by fibrillar collagens) is degraded via a first-order process V_T.ECM -> null with rate k_ECM_deg * ECM. Under steady-state conditions, the fractional synthesis rate (FSR) of collagen equals the first-order degradation rate constant. Therefore, hepatic collagen FSR measurements can be treated as direct observations of an effective ECM degradation rate constant and mapped algebraically to k_ECM_deg in the tumor compartment.
    independent_variable:
    state_variables:
    type: algebraic
    formula: FSR = k_ECM_deg
    code: |
      def compute(params, inputs, ureg):
          # Forward model: predicted fractional collagen turnover rate (per day)
          # equals the ECM degradation rate constant k_ECM_deg used in the
          # QSP model reaction V_T.ECM -> null with rate k_ECM_deg * ECM.
          k = params['k_ECM_deg']  # 1/day
          return k * ureg('1/day')
    code_julia: |
      function compute(params, inputs)
          # Forward model: predicted fractional collagen turnover rate (per day)
          # equals the ECM degradation rate constant k_ECM_deg.
          return params["k_ECM_deg"]
      end
  error_model:
  - name: hepatic_collagen_fsr_measurement
    observable:
    units: 1/day
    uses_inputs:
    - hepatic_collagen_fsr_low
    - hepatic_collagen_fsr_high
    evaluation_points:
    sample_size: 8
    sample_size_rationale: |
      Eight human subjects with chronic liver disease completed heavy-water labeling and liver biopsy for kinetic analysis; collagen type I and III FSRs across these subjects ranged from 0.2–0.6% per day.
    observation_code: |
      def derive_observation(inputs, sample_size, ureg):
          # Use the reported range of hepatic collagen FSRs (low, high)
          # to construct an approximate mean and uncertainty.
          low = inputs['hepatic_collagen_fsr_low']   # 1/day
          high = inputs['hepatic_collagen_fsr_high'] # 1/day
          mean = (low + high) / 2.0
          # Treat the reported range as an approximate 95% interval
          # and back-calculate the SD under a normal approximation.
          sd_linear = (high - low) / (2.0 * 1.96)
          # For a lognormal likelihood, we pass the coefficient of variation (CV)
          # as the dimensionless uncertainty parameter.
          cv = sd_linear.magnitude / mean.magnitude
          return {
              'value': mean,
              'sd': cv,
              'sd_uncertain': True,
              'n': int(sample_size) if sample_size is not None else None,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        k_ECM_deg is a positive rate constant expected to vary over orders of magnitude across tissues. Collagen turnover measurements are strictly positive, and the approximate 3-fold range (0.2–0.6% per day) is more naturally modeled on a log scale. We therefore use a lognormal likelihood parameterized by the observed mean FSR and its coefficient of variation.
  identifiability_notes: |
    This submodel uses a single effective measurement (hepatic collagen FSR summarized by a mean and approximate uncertainty) to constrain a single parameter, k_ECM_deg. Within the algebraic model FSR = k_ECM_deg, the parameter is locally identifiable given the observation. However, substantial uncertainty remains due to cross-organ translation (liver vs pancreas), disease-context differences (chronic viral hepatitis vs PDAC), and possible heterogeneity of kinetic pools (fast vs slow collagen fractions) that are lumped into a single effective rate constant. The wide lognormal prior on k_ECM_deg and the explicit translation-uncertainty metadata should be considered when integrating this target with other ECM-related calibration targets (e.g., PSC-driven ECM secretion, hyaluronan dynamics).

source_relevance:
  indication_match: proxy
  indication_match_justification: |
    The primary data source measures hepatic type I and III collagen turnover rates in human subjects with chronic fibrotic liver disease (mostly chronic hepatitis C). The QSPIO-PDAC model requires an ECM degradation rate for desmoplastic stroma in pancreatic ductal adenocarcinoma. Both contexts involve fibrotic interstitial collagen remodeled by fibroblast-like cells and matrix metalloproteinases, but the organ (liver vs pancreas), stromal architecture, and mechanical environment differ substantially. We therefore treat hepatic collagen turnover as a mechanistic proxy for PDAC ECM turnover rather than a direct match, expecting at least order-of-magnitude variability between organs.
  species_source: human
  species_target: human
  source_quality: primary_human_clinical
  perturbation_type: pathological_state
  perturbation_relevance:
  tme_compatibility: low
  tme_compatibility_notes: |
    Hepatic scar tissue in chronic viral hepatitis differs from PDAC desmoplastic stroma in cell composition (hepatic stellate cells, hepatocytes, Kupffer cells vs pancreatic stellate cells, cancer cells, tumor-associated macrophages), vascular structure, and mechanical loading. PDAC tumors exhibit extreme desmoplasia with high interstitial pressure and dense collagen-hyaluronan networks that may accelerate local collagen turnover relative to liver, whereas advanced cirrhotic liver scar can be more static. These differences motivate treating hepatic collagen FSRs as an order-of-magnitude proxy with at least ~10-fold translation uncertainty.
  estimated_translation_uncertainty_fold: 10.0
