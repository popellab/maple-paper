study_interpretation: |
  Zheng et al. demonstrate that fully polarised mouse M2 macrophages (generated with M-CSF plus IL-4) can be transformed towards an M1-like, IL-12p70-producing state after stimulation with 10 ng/ml LPS. Supernatants collected 48 h after LPS stimulation show IL-12p70 levels approximately 20-fold higher in previously M2 macrophages than in previously M1 macrophages, indicating robust M2 to M1 repolarisation under strong TLR4 stimulation. We interpret the 48 h stimulation period required to reveal this phenotype as an approximate characteristic timescale for M2 to M1 repolarisation under maximal pro-inflammatory conditions. By relating this timescale to the first-order rate constant k_M1_pol via t_repol ≈ 1/k_M1_pol, the study provides a coarse but mechanistically aligned constraint on the magnitude of k_M1_pol in the QSPIO-PDAC model.

key_assumptions:
- |
  LPS-induced M2 to M1 switching in mouse bone marrow-derived macrophages shares a similar intrinsic timescale with IL-12/IFNg-driven M2 to M1 repolarisation of tumour-associated macrophages in PDAC.
- |
  The 48 h LPS stimulation interval used for ELISA readouts corresponds to an order-of-magnitude estimate of the characteristic repolarisation time (i.e., by 48 h, the majority of susceptible M2 cells capable of switching have done so).
- |
  Per-cell IL-12p70 production after repolarisation is comparable between previously M1 and previously M2 macrophages, so the strong differential IL-12p70 signal in previously M2 cultures mainly reflects more efficient M2 to M1 switching rather than radically different secretion per cell.
- |
  Other processes affecting macrophage numbers (proliferation, death, migration) are negligible over the 48 h in vitro stimulation window relative to phenotype switching.
- |
  Translation from mouse in vitro BMDM to human PDAC TAMs introduces at least ~30-fold uncertainty in k_M1_pol, which is captured in the prior and source_relevance assessment.

key_study_limitations:
- |
  The experiment is performed in mouse BMDM cultured on plastic with LPS stimulation, which differs substantially from human PDAC tumour microenvironments lacking bacterial products and containing complex stromal and cancer-cell derived cues.
- |
  Only a single stimulation duration (48 h) is used for the key comparison of IL-12p70 between previously M1 and M2 macrophages, so the true time course and half-time of M2 to M1 switching are not directly measured.
- |
  IL-12p70 concentrations are reported graphically, and the text only provides a fold-change (20-fold higher in M2 vs M1), limiting the ability to link absolute cytokine levels to macrophage numbers.
- |
  The study does not quantify the fraction of cells that change phenotype at the single-cell level (e.g., via flow cytometry for M1 vs M2 markers), so the mapping between IL-12p70 output and the underlying M1/M2 cell counts is indirect.
- |
  The stimuli (GM-CSF, M-CSF, IL-4, LPS) and mouse strain may lead to macrophage phenotypes that differ from human PDAC TAMs, particularly in terms of TLR4 expression and responsiveness.

