calibration:
  parameters:
  - name: k_M1_pol
    units: 1/day
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 2.0
      lower:
      upper:
      rationale: |
        Very weakly informative prior centered at 1/day, spanning several orders of magnitude (approximately 0.02–50/day) to allow for substantial uncertainty in M2 to M1 repolarisation rates across species and tumour microenvironments.
  forward_model:
    data_rationale: |
      Zheng et al. quantify M2 to M1 phenotype switching by measuring IL-12p70 production 48 h after LPS stimulation of fully polarised M2 macrophages. This provides an approximate characteristic timescale for M2 to M1 repolarisation under strong pro-inflammatory stimulation.
    submodel_rationale: |
      In the full QSPIO-PDAC model, k_M1_pol is a first-order rate constant governing M2 to M1 macrophage polarisation in the tumour compartment, modulated by IL-12 and IFNg through a Hill-type term. Under saturating pro-inflammatory stimulation (e.g., strong TLR4 and Th1 cytokine signals), this modulation term approaches 1, so the characteristic timescale of polarisation is approximately the inverse of k_M1_pol. The algebraic submodel t_repol = 1/k_M1_pol captures this relationship without explicitly modelling cytokine dynamics.
    independent_variable:
    state_variables:
    type: algebraic
    formula: t_repol_hr = (1 / k_M1_pol) * hours_per_day
    code: |
      def compute(params, inputs, ureg):
          # params['k_M1_pol]: polarisation rate constant (1/day)
          # inputs['hours_per_day]: conversion factor (24 hour/day)
          k = params['k_M1_pol']
          hours_per_day = inputs['hours_per_day']  # Quantity with units hour/day
          # Characteristic time in days is 1/k; convert to hours using hours_per_day
          t_day = (1.0 / k) * ureg('day')
          return t_day * hours_per_day
    code_julia: |
      function compute(params, inputs)
          # params["k_M1_pol"]: polarisation rate constant (1/day)
          # inputs["hours_per_day"]: conversion factor with units hour/day
          k = params["k_M1_pol"]
          hours_per_day = inputs["hours_per_day"]
          t_day = 1.0 / k
          return t_day * hours_per_day
      end
  error_model:
  - name: t_repol_observation
    observable:
    units: hour
    uses_inputs:
    - t_repol_mean
    - t_repol_sd
    evaluation_points:
    sample_size: 3
    sample_size_rationale: |
      Zheng et al. state that results are representative of three independent experiments; n=3 is used as an approximate sample size for the repolarisation assay.
    observation_code: |
      def derive_observation(inputs, sample_size, ureg):
          # Observed characteristic M2->M1 repolarisation time under LPS stimulation
          t_mean = inputs['t_repol_mean']  # Quantity with units hour
          t_sd = inputs['t_repol_sd']      # Quantity with units hour (assumed)
          # For a lognormal likelihood, represent uncertainty as coefficient of variation (dimensionless)
          cv = t_sd.magnitude / t_mean.magnitude
          return {
              'value': t_mean,
              'sd': cv,
              'sd_uncertain': True,
              'n': sample_size,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        Repolarisation times are positive and likely span orders of magnitude across contexts; a lognormal likelihood on time with SD specified as a coefficient of variation is appropriate.
  identifiability_notes: |
    Only a single, indirect timescale measurement (48 h LPS-induced M2 to M1 switching in mouse bone marrow-derived macrophages) constrains k_M1_pol through the relationship t_repol ≈ 1/k_M1_pol. As a result, k_M1_pol will be only weakly identified and highly correlated with assumptions about what fraction of repolarisation is achieved by 48 h and how well LPS-mediated switching reflects IL-12/IFNg-driven polarisation in human PDAC tumours. The wide lognormal prior is essential to capture these uncertainties. Additional in vivo data on TAM phenotype dynamics under therapies that modulate IL-12/IFNg (e.g., GM-CSF-secreting vaccines or checkpoint blockade) would be required to more tightly constrain k_M1_pol in the full model.

source_relevance:
  indication_match: proxy
  indication_match_justification: |
    The source study uses mouse bone marrow-derived macrophages polarized to M1 or M2 in vitro and restimulated with bacterial LPS. This is a mechanistic proxy for tumour-associated macrophage (TAM) repolarisation in human PDAC, which occurs in a cytokine-rich but LPS-free tumour microenvironment. The data primarily inform an upper-bound timescale for M2 to M1 switching under strong pro-inflammatory cues rather than PDAC-specific kinetics.
  species_source: mouse
  species_target: human
  source_quality: primary_animal_in_vitro
  perturbation_type: pharmacological
  perturbation_relevance: |
    LPS stimulation provides a strong, non-physiological TLR4 signal that likely drives faster and more complete M2 to M1 repolarisation than would occur in human PDAC tumours exposed to endogenous IL-12 and IFNg. Thus the inferred k_M1_pol should be interpreted as approximating a maximal repolarisation rate under strong pro-inflammatory stimulation, with substantial downscaling uncertainty when translated to the PDAC microenvironment.
  tme_compatibility: low
  tme_compatibility_notes: |
    The experiment uses isolated mouse BMDM cultured on plastic in serum-containing medium, lacking the dense extracellular matrix, hypoxia, cancer cells, stellate cells, and complex chemokine gradients that characterise PDAC tumours. TAM repolarisation in PDAC is expected to be slower and potentially less complete than in this simplified system.
  estimated_translation_uncertainty_fold: 30.0
  validation_warnings:
