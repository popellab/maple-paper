calibration:
  parameters:
  - name: k_C1_growth
    units: 1/day
    prior:
      distribution: lognormal
      mu: -5.25
      sigma: 1.0
      lower:
      upper:
      rationale: |
        Prior centered on net growth rate corresponding to TVDT approximately 132 days from Ahn2017, with sigma=1 (natural log) allowing about 7-fold variability around the mean to cover observed interpatient heterogeneity and cross-study differences.
  forward_model:
    data_rationale: |
      Ahn2017 reports tumor volume doubling times (VDTs) for untreated primary PDAC lesions measured by serial CT, which directly constrain net tumor growth rate.
    submodel_rationale: |
      In the full QSPIO-PDAC model, viable cancer cells C1 grow logistically with rate k_C1_growth: dC1/dt = k_C1_growth * C1 * (1 - C_total/C_max). For tumors far from carrying capacity (C_total << C_max), growth is approximately exponential with intrinsic rate k_C1_growth, giving TVDT = ln(2)/k_C1_growth. The algebraic submodel uses this analytical relationship to infer k_C1_growth from clinical VDT data, consistent with the mechanistic usage of k_C1_growth in the full model.
    independent_variable:
    state_variables:
    type: algebraic
    formula: tvdt = ln(2) / k_C1_growth
    code: |
      def compute(params, inputs, ureg):
          import numpy as np
          k = params['k_C1_growth']
          return np.log(2) / k * ureg('day')
    code_julia: |
      function compute(params, inputs)
          return log(2) / params["k_C1_growth"]
      end
  error_model:
  - name: tvdt_pdac_ahn2017
    observable:
    units: day
    uses_inputs:
    - tvdt_mean_ahn2017
    - tvdt_sd_ahn2017
    evaluation_points:
    sample_size: 100
    sample_size_rationale: Number of PDAC patients included in the Ahn2017 cohort.
    observation_code: |
      def derive_observation(inputs, sample_size, ureg):
          tvdt = inputs['tvdt_mean_ahn2017']
          tvdt_sd = inputs['tvdt_sd_ahn2017']
          cv = tvdt_sd.magnitude / tvdt.magnitude
          return {
              'value': tvdt,
              'sd': cv,
              'sd_uncertain': False,
              'n': sample_size,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        Tumor volume doubling times are positive and show multiplicative interpatient variability; a lognormal observation model is appropriate.
  identifiability_notes: |
    With a single clinical TVDT measurement, k_C1_growth is identifiable as the net tumor-level growth rate under the assumption that tumors are far from carrying capacity and that other loss processes (baseline apoptosis, immune-mediated killing) are relatively small over the observation window. This submodel constrains k_C1_growth as an effective net proliferation rate; it does not permit separation of proliferation from death processes, which must be handled via independent data or priors for k_C1_death and immune killing parameters.

