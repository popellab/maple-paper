study_interpretation: |
  Serial CT imaging in Ahn2017 quantified tumor volume doubling times for untreated primary PDAC across 100 patients, reporting a mean VDT of 132.3 days with SD 132.1 days. We interpret this as the net macroscopic growth rate of PDAC lesions in vivo, integrating cancer cell proliferation, baseline cell loss, and stromal contributions. Under the assumption that tumors are well below their carrying capacity during the observation window, this net growth rate can be mapped to the intrinsic logistic growth rate k_C1_growth in the QSPIO-PDAC model via the relationship TVDT = ln(2)/k_C1_growth.

key_assumptions:
- |
  Tumor volume measured by CT is proportional to the total number of viable cancer cells C1 in the PDAC lesion, despite contributions from stroma and necrotic regions.
- |
  During the CT follow-up interval, primary PDAC lesions are far from their carrying capacity (C_total << C_max), so logistic growth reduces to approximate exponential growth with rate k_C1_growth.
- |
  Baseline apoptosis and immune-mediated killing are modest relative to proliferation in these untreated patients; thus the observed net tumor growth rate primarily reflects k_C1_growth.
- |
  Population-averaged VDT from Ahn2017 is representative of typical PDAC growth dynamics for the virtual patient cohort modeled in QSPIO-PDAC, acknowledging substantial interpatient heterogeneity.

key_study_limitations:
- |
  CT-derived tumor volumes include both cancer and stromal components; PDAC is highly desmoplastic, so the measured VDT may under- or overestimate the true proliferation rate of cancer cells alone.
- |
  Ahn2017 reports a very wide range of VDTs (20.0 to 976.8 days), indicating strong interpatient and tumor-size-dependent heterogeneity; using the cohort mean to calibrate k_C1_growth neglects this variability.
- |
  The analysis provides net tumor growth under real-patient conditions, where occult metastases, hypoxia, and variable immune infiltration may alter effective growth rates relative to an idealized, spatially homogeneous tumor compartment in the QSPIO-PDAC model.
- |
  The study cohort is from a single geographic region (Korean centers) and may not fully capture demographic or biological variability in broader PDAC populations.

