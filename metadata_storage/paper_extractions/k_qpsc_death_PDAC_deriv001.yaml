      The abstract reports a single mean +/- SD over multiple seeding densities; the effective number of independent cultures contributing to the summary is not reported, so we treat the reported SD as an empirical population SD without explicit n.
    observation_code: |
      def derive_observation(inputs, sample_size, ureg):
          t = inputs['fibroblast_lifespan_mean']
          t_sd = inputs['fibroblast_lifespan_sd']
          cv = t_sd.magnitude / t.magnitude
          return {
