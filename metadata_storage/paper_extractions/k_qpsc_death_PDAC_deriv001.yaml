study_interpretation: |
  Weissman-Shomer and Fry (1975) quantified the pattern of division, ageing, and death of cultured chick embryo fibroblasts across a wide range of seeding densities and reported that the calendar lifespan of these cultures was consistently 57 +/- 3 days. We interpret this lifespan as an effective mean survival time for quiescent, fibroblast-like stromal cells under baseline conditions without strong exogenous death stimuli. Because quiescent pancreatic stellate cells in normal pancreas share key features with fibroblasts (vitamin A storage, low proliferative capacity, extracellular matrix homeostasis), this lifespan provides an approximate constraint on the intrinsic death rate of qPSC encoded by k_qpsc_death in the QSPIO-PDAC model, acknowledging that additional tumor-dependent clearance processes are handled separately by k_cell_clear in the full model.

key_assumptions:
- |
  Quiescent pancreatic stellate cells and fibroblasts share similar baseline survival kinetics as long-lived mesenchymal stromal cells, so fibroblast lifespan can be used as an order-of-magnitude proxy for qPSC death rate.
- |
  The reported 57 +/- 3 day lifespan of chick embryo fibroblast cultures can be interpreted as the mean survival time of individual cells under an effective first-order death process, implying mean lifetime 1 / k_qpsc_death.
- |
  Tumor-dependent qPSC clearance terms in the full QSP model (e.g., k_cell_clear mediated processes and activation to aPSC) are treated separately from k_qpsc_death and are not constrained by this submodel.
- |
  In vitro fibroblast lifespan under normoxic culture conditions approximates physiological stromal cell longevity better than data from highly proliferative or transformed cell lines.

key_study_limitations:
- |
  The data are from embryonic chick fibroblasts rather than adult human pancreatic stellate cells, introducing cross-species and cell-type translation uncertainty.
- |
  Lifespan is measured in vitro under culture conditions that may not fully recapitulate in vivo stromal homeostasis or exposure to immune and mechanical cues.
- |
  The abstract reports a single mean +/- 3 days without a clear statement of sample size or whether the error represents SD or SEM; we treat it as an empirical SD but this may mischaracterize measurement uncertainty.
- |
  Fibroblast cultures in the study undergo both proliferation and senescence; mapping the culture lifespan directly to an individual-cell death rate assumes effective first-order loss that may oversimplify underlying cell cycle dynamics.

