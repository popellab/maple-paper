      rationale: |
        Center prior on inverse of fibroblast lifespan (~1/57 day^-1) with one-log10-wide uncertainty to allow for species and cell-type differences between chick embryonic fibroblasts and human pancreatic stellate cells.
  forward_model:
    data_rationale: |
      The primary data source reports the mean calendar lifespan (57 +/- 3 days) of cultured chick embryo fibroblasts under baseline conditions, which we interpret as the mean survival time of quiescent fibroblast-like stromal cells.
    submodel_rationale: |
      In the full QSPIO-PDAC model, quiescent pancreatic stellate cells (qPSC) are removed by a first-order death process V_T.qPSC -> null with rate k_qpsc_death * qPSC, in parallel with other clearance mechanisms. Under a pure first-order death process, the expected lifetime of an individual cell is 1 / k_qpsc_death. We therefore use the measured fibroblast lifespan as a proxy constraint on 1 / k_qpsc_death, ignoring tumor-dependent clearance and activation for this submodel so that we can calibrate the intrinsic death rate.
    independent_variable:
    state_variables:
    type: algebraic
    formula: t_life = 1 / k_qpsc_death
    code: |
      def compute(params, inputs, ureg):
          k = params['k_qpsc_death']
          return (1 / k) * ureg('day')
    code_julia: |
      function compute(params, inputs)
          return 1.0 / params["k_qpsc_death"]
      end
  error_model:
  - name: fibroblast_lifespan_measurement
    observable:
    units: day
    uses_inputs:
