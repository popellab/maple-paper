    likelihood:
      distribution: lognormal
      rationale: |
        Cell lifespans are positive quantities and biological time-to-event data are typically right-skewed; a lognormal likelihood using the coefficient of variation is appropriate.
  identifiability_notes: |
    This algebraic submodel has a single parameter (k_qpsc_death) and a single independent measurement (mean fibroblast lifespan). Under the assumption of first-order death, k_qpsc_death is structurally identifiable from this measurement alone. However, practical identifiability is limited by experimental uncertainty in the lifespan estimate and by substantial translation uncertainty between chick embryo fibroblasts in vitro and human quiescent pancreatic stellate cells in vivo within a PDAC tumor microenvironment.

