calibration:
  parameters:
  - name: k_ECM_qpsc_sec
    units: mg/(cell*day)
    prior:
      distribution: lognormal
      mu: -24.4
      sigma: 2.0
      lower:
      upper:
      rationale: |
        Centered on proxy estimate from quiescent human dermal fibroblast collagen I secretion (~2.5 ng/well over 48 h at 5 x 10^4 cells/well), converted to ~2.5 x 10^-11 mg/(cell*day), with wide uncertainty (sigma=2) to account for organ (skin vs pancreas), cell-type (fibroblast vs PSC), and ECM-composition differences.
  forward_model:
    data_rationale: |
      Simplified early-time integration of the full PDAC ECM production term for quiescent stromal cells, under conditions with negligible ECM saturation and degradation.
    submodel_rationale: |
      Maps directly onto d(ECM)/dt = k_ECM_qpsc_sec * qPSC in the low-ECM, low-modulation limit, allowing calibration of k_ECM_qpsc_sec from a single 48 h accumulation measurement.
    independent_variable:
    state_variables:
    type: algebraic
    formula: ECM_48h = k_ECM_qpsc_sec * N_cells * t_obs
    code: |
      def compute(params, inputs, ureg):
          k = params['k_ECM_qpsc_sec']  # mg/(cell*day)
          N_cells = inputs['nhdf_cells_per_well']  # cells per well
          t_days = 2.0  # 48 h = 2 days (encoded in model, see main answer)
          ecm_mass = k * N_cells * t_days * ureg('mg')
          return ecm_mass
    code_julia: |
      function compute(params::Dict, inputs::Dict)
          k = params["k_ECM_qpsc_sec"]  # mg/(cell*day)
          N = inputs["nhdf_cells_per_well"]  # cells per well
          t_days = 2.0  # 48 h = 2 days (encoded in model, see main answer)
          ecm_mass_mg = k * N * t_days
          return ecm_mass_mg
      end
  error_model: []
  identifiability_notes: |
    With fixed cell number and observation time, a single ECM mass measurement after 48 h uniquely constrains k_ECM_qpsc_sec within the assumed lognormal error model; remaining uncertainty is dominated by biological translation from dermal fibroblasts to pancreatic stellate cells.

source_relevance:
  indication_match: proxy
  indication_match_justification: |
    Normal human dermal fibroblasts are used as a mechanistic proxy for quiescent pancreatic stellate cells: both are fibroblast-like mesenchymal cells that maintain basement membrane ECM under homeostatic conditions, but they reside in different organs (skin vs pancreas) and microenvironments. We therefore treat this dataset as providing only an order-of-magnitude baseline for per-cell ECM secretion.
