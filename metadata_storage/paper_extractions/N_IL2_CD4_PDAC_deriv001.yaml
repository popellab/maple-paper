study_interpretation: |
  Bajénoff et al. 2002 tracked naive CD4+ T cells in vivo after a single antigenic stimulus and showed that they execute a programmed burst of proliferation comprising at least seven divisions in the absence of further antigen or cytokine signals, after which proliferation ceases. This defines an intrinsic upper bound on the number of divisions encoded during priming. Gett & Hodgkin 1998 used CFSE labeling of naive CD4+ T cells stimulated with plate-bound anti-CD3 plus exogenous IL-2 (with or without IL-4) and resolved CFSE peaks corresponding to divisions up to 7, with a pooled 8+ peak and viable cells present in divisions 5-8. Together, these studies support the concept that naive CD4+ T cells have a programmed division destiny of roughly 7-8 generations under strong TCR and IL-2 signaling, with later divisions increasingly affected by nutrient depletion and cell death rather than faster cycling. We therefore interpret N_IL2_CD4 in the QSP model as this programmed division cap, translated to human tumor-primed CD4+ effector T cells.

key_assumptions:
- |
  The programmed number of divisions after strong TCR plus IL-2 signaling in murine naive CD4+ T cells is representative of the maximal IL-2-supported division potential of human activated CD4 Th cells in PDAC, up to a moderate (~3-fold) uncertainty.
- |
  The phrase "at least seven cycles of division" in Bajénoff et al. 2002 reflects a central value of approximately seven divisions, with possible variation of ±1-2 generations across experiments and clones; we encode this via an assumed SD rather than a hard lower bound.
- |
  In Gett & Hodgkin 1998, the presence of cells in divisions 5-8 and the existence of an 8+ CFSE peak indicate that a nontrivial fraction of cells reach eight or more divisions under IL-2-containing conditions; we approximate this as an effective maximum of eight generations with moderate uncertainty.
- |
  Environmental limitations in vitro (e.g., cytokine and nutrient depletion by day 4-5) do not drastically under-estimate the intrinsic division destiny; any bias is partly absorbed into the wide prior and assumed SDs.
- |
  Differences between naive and tumor-primed effector CD4+ T cells (e.g., prior activation history, epigenetic state) may shift the effective division cap by one or two generations, but are unlikely to change it by an order of magnitude, justifying a single shared parameter N_IL2_CD4 with a relatively broad prior.

key_study_limitations:
- |
  Both key data sources are in mice, not humans, introducing cross-species uncertainty in the absolute number of programmed divisions.
- |
  CFSE-based division tracking cannot resolve generations beyond 7-8 cycles, so very late divisions are pooled into an 8+ peak and not individually quantified.
- |
  The in vitro cultures in Gett & Hodgkin 1998 include IL-4 in addition to IL-2 and anti-CD3, which may slightly alter survival and differentiation, although division kinetics were similar with or without IL-4 in their system.
- |
  Bajénoff et al. 2002 provide a textual statement of "at least seven" divisions rather than a full quantitative distribution, so our use of a normal SD around seven divisions is an informed approximation.
- |
  Neither study captures the chronic antigen exposure, suppressive cytokines, and metabolic stress characteristic of the PDAC tumor microenvironment, which may lower the effective in vivo division cap for tumor-infiltrating Th cells.

