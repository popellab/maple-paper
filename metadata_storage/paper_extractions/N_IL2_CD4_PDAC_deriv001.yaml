calibration:
  parameters:
  - name: N_IL2_CD4
    units: dimensionless
    prior:
      distribution: lognormal
      mu: 1.95
      sigma: 0.5
      lower:
      upper:
      rationale: |
        Naive and early effector CD4+ T cells typically undergo on the order of 6-8 programmed divisions after priming under IL-2-containing conditions. A lognormal prior centered at exp(1.95)≈7 divisions with a multiplicative SD of exp(0.5)≈1.6 allows for plausible values from ~3 to >12 generations while favoring the 6-8 range indicated by mouse CFSE and in vivo proliferation studies.
  forward_model:
    data_rationale: |
      Both Bajénoff et al. 2002 and Gett & Hodgkin 1998 report how many division cycles naive CD4+ T cells can complete after activation under IL-2-containing conditions, using CFSE dilution to track division number. These experiments constrain the effective maximum number of CD4+ T cell generations in response to IL-2-supported activation.
    submodel_rationale: |
      In the full QSPIO-PDAC model, N_IL2_CD4 defines the maximum number of IL-2-driven divisions an activated CD4 T cell can undergo before proliferation is capped. Since the experimental readouts are the observed maximal division numbers, an algebraic submodel that identifies N_IL2_CD4 directly with the experimental division cap (n_max) preserves the mechanistic role of this parameter as a hard limit on IL-2-supported clonal expansion.
    independent_variable:
    state_variables:
    type: algebraic
    formula: n_max = N_IL2_CD4
    code: |
      def compute(params, inputs, ureg):
          # N_IL2_CD4 directly represents the maximal number of IL-2-supported CD4 T cell divisions
          return params['N_IL2_CD4'] * ureg.dimensionless
    code_julia: |
      function compute(params, inputs)
          # N_IL2_CD4 directly represents the maximal number of IL-2-supported CD4 T cell divisions
          return params["N_IL2_CD4"]
      end
  error_model:
  - name: n_divisions_Bajenoff2002
    observable:
    units: dimensionless
    uses_inputs:
    - n_divisions_programmed_CD4_mean
    - n_divisions_programmed_CD4_sd
    evaluation_points:
    sample_size:
    sample_size_rationale: |
      The abstract reports that proliferation can proceed for at least seven cycles of division but does not specify replicate number. We therefore treat the reported seven divisions as a single-study estimate with an assumed SD capturing textual uncertainty rather than sampling error.
    observation_code: |
      def derive_observation(inputs, sample_size, ureg):
          mean = inputs['n_divisions_programmed_CD4_mean']
          sd = inputs['n_divisions_programmed_CD4_sd']
          return {
              'value': mean.to(ureg.dimensionless),
              'sd': sd.magnitude,
              'sd_uncertain': True,
          }
    likelihood:
      distribution: normal
      rationale: |
        The observable is an approximate division count (around 7) inferred from text. A normal likelihood on the absolute division number with a moderately large SD reflects symmetric uncertainty around this central value and allows the inference to reconcile this study with other division-count measurements.
  - name: n_divisions_Gett1998
    observable:
    units: dimensionless
    uses_inputs:
    - n_divisions_CFSE_IL2_IL4_mean
    - n_divisions_CFSE_IL2_IL4_sd
    evaluation_points:
    sample_size:
    sample_size_rationale: |
      Gett & Hodgkin 1998 report CFSE peaks resolvable up to division 7 with a pooled 8+ peak and describe cells present in divisions 5-8. Exact replicate number and distribution within the 8+ peak are not reported, so we encode this as an approximate point estimate with an assumed SD.
    observation_code: |
      def derive_observation(inputs, sample_size, ureg):
          mean = inputs['n_divisions_CFSE_IL2_IL4_mean']
          sd = inputs['n_divisions_CFSE_IL2_IL4_sd']
          return {
              'value': mean.to(ureg.dimensionless),
              'sd': sd.magnitude,
              'sd_uncertain': True,
          }
    likelihood:
      distribution: normal
      rationale: |
        The measurement corresponds to the highest clearly resolvable CFSE generations (division 8+). A normal likelihood on the division number, with SD reflecting pooling of generations beyond 7, captures uncertainty without imposing a strong skew.
  identifiability_notes: |
    This submodel infers a single parameter, N_IL2_CD4, from two independent division-count measurements: (1) an in vivo programmed proliferation experiment reporting that naive CD4+ T cells can divide for at least seven cycles after priming before proliferation stops, and (2) an in vitro CFSE study of naive CD4+ T cells stimulated with anti-CD3, IL-2, and IL-4 that clearly resolves divisions up to an 8+ peak. Because both observables are direct measurements of the same conceptual quantity (maximal programmed division number) and have comparable scales, N_IL2_CD4 is well constrained around 7-8 generations. Remaining uncertainty is dominated by cross-species translation (mouse to human), differences between naive versus tumor-primed effector CD4 T cells, and the fact that CFSE methods cannot fully resolve divisions beyond 7 cycles, so true biological maxima may exceed the measured values by 1-2 generations.

source_relevance:
  indication_match: proxy
  indication_match_justification: |
    The source studies use naive murine CD4+ T cells from healthy mice stimulated with anti-CD3 in vitro or in short-term in vivo priming models, whereas the QSPIO-PDAC model describes activated effector Th cells in human pancreatic cancer. We use these mouse naive CD4+ division data as a mechanistic proxy because the programmed number of divisions after TCR/IL-2 signaling is largely determined by intrinsic cell-cycle control and appears similar across contexts, but tumor-specific immunosuppression, chronic antigen exposure, and human-mouse differences could shift the effective division cap by a few generations.
