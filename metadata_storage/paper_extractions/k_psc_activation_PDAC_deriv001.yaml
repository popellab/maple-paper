study_interpretation: |
  Apte et al. (1998) show that freshly isolated rat pancreatic stellate cells, initially alpha-SMA-negative, become alpha-SMA-positive within 48 h when cultured on plastic. This qualitative time course is interpreted as the intrinsic timescale for transition from quiescent vitamin A storing PSCs to myofibroblast-like activated PSCs under strong activating stimuli. Assuming first-order kinetics and negligible proliferation or death over 48 h, these data constrain the activation rate constant k_psc_activation used for the qPSC to aPSC reaction in the PDAC QSP model, in the limit of saturating profibrogenic signals such as PDGF and TGFbeta.

key_assumptions:
- |
  Alpha-SMA positivity is treated as a binary marker of PSC activation, so the fraction of alpha-SMA-positive cells approximates the fraction of activated PSCs in the culture.
- |
  PSC proliferation and death are negligible over the first 48 h after isolation, so changes in alpha-SMA positivity primarily reflect state transitions rather than net growth or loss of PSCs.
- |
  Culture on rigid plastic with serum produces near-saturating activation signals, so the effective in vitro activation rate approximates the intrinsic k_psc_activation parameter in the tumor model under strong TGFbeta and PDGF stimulation.
- |
  Qualitative descriptions of alpha-SMA staining at 24 h (negative) and 48 h (positive) are translated into approximate fractions (about 5 percent and 95 percent) with large assumed uncertainty for use in quantitative calibration.
- |
  Rat PSC activation kinetics are assumed to be broadly similar in scale to human PSCs, with additional uncertainty captured in the translation uncertainty factor.

key_study_limitations:
- |
  Alpha-SMA staining was reported qualitatively without explicit quantitative fractions or replicate counts, so activation fractions at 24 h and 48 h are inferred rather than directly measured.
- |
  The in vitro culture system, rat PSCs on plastic in serum, differs substantially from the human PDAC tumor microenvironment, which includes cancer cells, immune cells, hypoxia, and complex extracellular matrix architecture.
- |
  Species differences between rat and human PSCs are not directly accounted for beyond an overall translation uncertainty factor.
- |
  Only two qualitative time points, 24 h and 48 h, are available, limiting the ability to detect deviations from simple first-order activation kinetics.

