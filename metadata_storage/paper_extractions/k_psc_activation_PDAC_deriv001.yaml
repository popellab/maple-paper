calibration:
  parameters:
  - name: k_psc_activation
    units: 1/day
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 1.5
      lower:
      upper:
      rationale: |
        PSC cultures on plastic convert from alpha-SMA-negative to alpha-SMA-positive over about 2 days; prior centered at 1/day with wide uncertainty spanning roughly 0.1 to 10 per day.
  forward_model:
    data_rationale: |
      Rat pancreatic stellate cells isolated from normal pancreas and cultured on plastic are alpha-SMA-negative at 24 h and alpha-SMA-positive at 48 h, providing a characteristic time scale for quiescent-to-activated transition under strong mechanical and serum-derived stimulation.
    submodel_rationale: |
      Submodel represents first-order transition from quiescent PSCs (qPSC) to activated PSCs (aPSC) with rate constant k_psc_activation, matching the full PDAC QSP model qPSC to aPSC reaction in the limit of saturating PDGF and TGFbeta and neglecting proliferation and death over the first 48 h.
    independent_variable:
      name: time
      units: day
      span:
      - 0.0
      - 2.0
      rationale:
    state_variables:
    - name: qPSC
      units: cell
      initial_condition:
        value: 1.0
        rationale: |
          Total PSC pool normalized to 1 at t=0; all cells are quiescent immediately after isolation.
    - name: aPSC
      units: cell
      initial_condition:
        value: 0.0
        rationale: No activated PSCs immediately after isolation.
    type: two_state
    forward_rate: k_psc_activation
  error_model:
  - name: psc_activation_fraction_24h
    observable:
      type: custom
      state_variables:
      - qPSC
      - aPSC
      rationale:
      code: |
        def compute(t, y, y_start):
            qPSC, aPSC = y
            return aPSC / (qPSC + aPSC)
    units: dimensionless
    uses_inputs:
    - psc_activation_fraction_24h_mean
    - psc_activation_fraction_24h_sd
    evaluation_points:
    - 1.0
    sample_size: 1
    sample_size_rationale: |
      Original study reports only qualitative staining; this is treated as a single effective observation with large assumed uncertainty.
    observation_code: |
      def derive_observation(inputs, sample_size, ureg):
          mean = inputs['psc_activation_fraction_24h_mean']
          sd = inputs['psc_activation_fraction_24h_sd']
          return {
              'value': mean,
              'sd': sd.magnitude,
              'sd_uncertain': True,
          }
    likelihood:
      distribution: normal
      rationale: |
        Measured quantity is a fraction between 0 and 1; given the qualitative nature of the data, a normal likelihood with moderate SD is an adequate approximation.
  - name: psc_activation_fraction_48h
    observable:
      type: custom
      state_variables:
      - qPSC
      - aPSC
      rationale:
      code: |
        def compute(t, y, y_start):
            qPSC, aPSC = y
            return aPSC / (qPSC + aPSC)
    units: dimensionless
    uses_inputs:
    - psc_activation_fraction_48h_mean
    - psc_activation_fraction_48h_sd
    evaluation_points:
    - 2.0
    sample_size: 1
    sample_size_rationale: |
      Original study reports only qualitative staining; this is treated as a single effective observation with large assumed uncertainty.
    observation_code: |
      def derive_observation(inputs, sample_size, ureg):
          mean = inputs['psc_activation_fraction_48h_mean']
          sd = inputs['psc_activation_fraction_48h_sd']
          return {
              'value': mean,
              'sd': sd.magnitude,
              'sd_uncertain': True,
          }
    likelihood:
      distribution: normal
      rationale: |
        Measured quantity is a fraction between 0 and 1; given the qualitative nature of the data, a normal likelihood with moderate SD is an adequate approximation.
  identifiability_notes: |
    With a single first-order transition and two time-point measurements (24 h and 48 h fractions of alpha-SMA-positive cells), k_psc_activation is structurally identifiable under the assumption of negligible PSC proliferation and death over 48 h. However, the observations are qualitative and in vitro, so practical and translational uncertainties remain large.

