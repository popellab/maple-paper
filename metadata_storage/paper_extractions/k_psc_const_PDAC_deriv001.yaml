study_interpretation: |
  Wright2020 provides quantitative histology of human pancreases from non-diabetic donors, including average pancreas weight and total acinar cell number, allowing estimation of acinar cell density per milliliter of pancreas. Using ICRU soft-tissue density for pancreas to convert weight to volume yields an acinar cell density of order 1-2 x 10^9 cells/mL. Independent morphometric analyses of desmin-stained PSCs in normal rat pancreas, summarized by Apte and co-workers and by later reviews, indicate that PSCs comprise roughly 4-7% of total parenchymal cells in the healthy pancreas. Acinar cells make up approximately 80% of pancreatic parenchyma, so combining these fractions implies that PSCs represent on the order of several percent of the cells at a density near 1 x 10^8 cells/mL. This density corresponds directly to the constitutive PSC density parameter k_psc_const in the full QSPIO-PDAC model, because the null -> qPSC recruitment term drives quiescent PSC density toward k_psc_const in the absence of tumor or strong perturbations. The submodel therefore uses this composite literature estimate of PSC density in normal pancreas to inform a lognormal prior and likelihood for k_psc_const.

key_assumptions:
- |
  Non-diabetic human donor pancreases in Wright2020 are representative of normal adult human pancreatic architecture and cell densities in the population modeled by QSPIO-PDAC.
- |
  Tissue density of human pancreas is adequately described by the ICRU soft-tissue value of 1.04 g/mL, allowing conversion from pancreas weight to volume without large systematic bias.
- |
  Acinar cells constitute approximately 80% of pancreatic parenchymal cells in humans, so total parenchymal cell density can be estimated by dividing acinar cell density by this fraction.
- |
  Morphometric data indicating that PSCs comprise 4-7% of parenchymal cells in normal rat pancreas are applicable as a proxy for human PSC fractions, up to a modest cross-species uncertainty factor captured in the prior and likelihood.
- |
  Quiescent PSCs dominate the PSC population in normal pancreas, so the PSC fraction from morphometry primarily reflects quiescent PSCs consistent with the qPSC compartment in the QSP model.
- |
  In the absence of tumor, the PSC compartment is at steady state such that the resident quiescent PSC density equals the constitutive density parameter k_psc_const used in the null -> qPSC recruitment term.
- |
  An assumed coefficient of variation of 1.0 (100 percent) for PSC density reasonably captures combined uncertainties from donor variability, cross-species translation of PSC fractions, regional heterogeneity, and methodological differences across studies.

key_study_limitations:
- |
  PSC fraction (4-7% of parenchymal cells) is derived from morphometric studies in rat pancreas summarized in a book chapter, not from a single primary human morphometric data set, introducing cross-species and source-to-source variability.
- |
  Acinar cells in Wright2020 were quantified in pancreases from non-diabetic organ donors; subtle differences in exocrine architecture between these donors and PDAC patients (for example due to age, subclinical inflammation, or metabolic status) may affect true PSC densities.
- |
  Pancreatic tissue composition and PSC content may vary regionally within the gland (head, body, tail), whereas the QSP model uses a single effective PSC density parameter for the tumor-bearing region.
- |
  The calculation treats acinar cells as a fixed 80% of parenchymal cells based on textbook-level summaries, which may not hold exactly across individuals or in the presence of mild pathology.
- |
  No direct human data were found that report PSC counts per unit volume in normal pancreas; instead, PSC density is inferred indirectly from PSC fractions and total parenchymal cell density, necessitating a relatively wide assumed coefficient of variation.
- |
  The algebraic submodel does not explicitly represent dynamic PSC recruitment, activation, or death, and therefore cannot constrain k_psc_encounter or k_qpsc_death; it assumes that the steady-state relationship between k_psc_const and observed PSC density holds in the relevant physiological context.

