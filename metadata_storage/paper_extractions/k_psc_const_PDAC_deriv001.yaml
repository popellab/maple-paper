calibration:
  parameters:
  - name: k_psc_const
    units: cell / milliliter
    prior:
      distribution: lognormal
      mu: 18.4
      sigma: 1.1
      lower:
      upper:
      rationale: |
        k_psc_const is the constitutive density of quiescent pancreatic stellate cells (PSCs) in pancreatic tissue. Combining human acinar cell counts (about 1.2 x 10^11 acinar cells per 85.7 g pancreas in non-diabetic donors) with pancreas density (1.04 g/mL) and a PSC fraction of 4-7% of parenchymal cells yields an estimated PSC density of order 1 x 10^8 cells/mL. We place a lognormal prior centered on this value with sigma = 1.1 in log-space to allow roughly 3-fold uncertainty due to cross-species translation and regional heterogeneity.
  forward_model:
    data_rationale: |
      Literature provides estimates of PSC fraction among parenchymal cells in normal pancreas and total parenchymal cell density derived from human acinar cell counts and pancreas volume. In the full QSP model, k_psc_const is defined as the constitutive PSC density in pancreatic tissue; therefore, the measured PSC density in normal pancreas can be mapped directly to this parameter without simulating time dynamics.
    submodel_rationale: |
      In the full QSPIO-PDAC model, recruitment of resident quiescent PSCs into the tumor compartment is represented by the reaction null -> V_T.qPSC with rate k_psc_encounter * V_T * ((k_psc_const - (V_T.qPSC/V_T))/k_psc_const). When tumor volume V_T is approximately constant and other sources/sinks are small, this term drives the PSC density V_T.qPSC/V_T toward the constant k_psc_const. Thus, at steady state in a normal pancreas without tumor, the resident quiescent PSC density equals k_psc_const. Our algebraic submodel therefore identifies the observable PSC density in normal pancreas directly with k_psc_const, preserving the mechanistic role of k_psc_const as the carrying capacity (constitutive density) for quiescent PSCs.
    independent_variable:
    state_variables:
    type: algebraic
    formula: psc_density = k_psc_const
    code: |
      def compute(params, inputs, ureg):
          k = params['k_psc_const']
          return k * ureg('cell / milliliter')
    code_julia: |
      function compute(params, inputs)
          return params["k_psc_const"]
      end
  error_model:
  - name: psc_density_normal_pancreas
    observable:
    units: cell / milliliter
    uses_inputs:
    - acinar_cells_per_pancreas_mean
    - pancreas_weight_nd_mean
    - pancreas_density_mean
    - fraction_acinar_parenchyma_mean
    - psc_fraction_parenchyma_mean
    - assumed_cv_psc_density
    evaluation_points:
    sample_size: 11
    sample_size_rationale: |
      Effective sample size taken as the number of non-diabetic human donors (n = 11) in Wright2020 used to estimate acinar cell counts and pancreas weight. PSC fraction data are derived from rat morphometry and reviews and are treated as additional uncertainty captured in the assumed coefficient of variation.
    observation_code: |
      def derive_observation(inputs, sample_size, ureg):
          # Human acinar cell count per pancreas
          acinar_cells = inputs['acinar_cells_per_pancreas_mean']  # cell
          # Human pancreas weight for non-diabetic donors
          pancreas_weight = inputs['pancreas_weight_nd_mean']      # gram
          # Physical density of pancreas tissue (ICRU soft-tissue reference)
          density = inputs['pancreas_density_mean']                # gram / milliliter
          # Fraction of parenchymal cells that are acinar cells
          frac_acinar = inputs['fraction_acinar_parenchyma_mean']  # dimensionless
          # Fraction of parenchymal cells that are PSCs
          psc_frac = inputs['psc_fraction_parenchyma_mean']        # dimensionless
          # Assumed coefficient of variation for PSC density (lognormal SD)
          cv_assumed = inputs['assumed_cv_psc_density']            # dimensionless

          # Convert pancreas weight to volume using tissue density
          pancreas_volume = pancreas_weight / density              # milliliter
          # Acinar cell density (cells per milliliter)
          acinar_density = acinar_cells / pancreas_volume          # cell / milliliter
          # Total parenchymal cell density, assuming acinar cells make up frac_acinar of parenchymal cells
          total_parenchymal_density = acinar_density / frac_acinar # cell / milliliter
          # PSC density from PSC fraction of parenchymal cells
          psc_density = total_parenchymal_density * psc_frac       # cell / milliliter

          return {
              'value': psc_density.to('cell / milliliter'),
              'sd': cv_assumed.magnitude,
              'sd_uncertain': True,
              'n': sample_size,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        PSC density is strictly positive and constructed from multiplicative components (cell counts, tissue density, and cell-type fractions), so a lognormal likelihood with coefficient of variation specified by an assumed_cv_psc_density captures multiplicative biological and translation variability.
  identifiability_notes: |
    With an algebraic forward model psc_density = k_psc_const and a single measurement of PSC density in normal pancreas, k_psc_const is identifiable up to the uncertainty specified by the likelihood. The submodel does not constrain k_psc_encounter or PSC death/activation rates; it assumes that in the absence of tumor, the PSC compartment is at steady state and that the measured quiescent PSC density equals the carrying capacity parameter k_psc_const. Additional data on regional PSC densities in human pancreas or direct PSC counts in PDAC-adjacent normal tissue could refine this estimate and reduce reliance on cross-species morphometry and assumed variability.

source_relevance:
  indication_match: related
  indication_match_justification: |
    The QSPIO-PDAC model targets pancreatic ductal adenocarcinoma, whereas the primary quantitative data for this target come from histological measurements in normal human pancreas (non-diabetic donors) and morphometry in normal rat pancreas. These sources describe the baseline quiescent PSC pool and overall parenchymal cell composition in healthy pancreas, which is mechanistically relevant as the constitutive PSC density that tumor cells initially encounter as they invade pancreatic tissue, but does not capture the expanded, activated PSC population in established PDAC stroma.
  species_source: human_and_rat
  species_target: human
  source_quality: primary_human_clinical
  perturbation_type: physiological_baseline
  perturbation_relevance:
  tme_compatibility: moderate
  tme_compatibility_notes: |
    Baseline PSC density and cell-type fractions are derived from healthy pancreas, whereas PDAC tumors develop in a fibrotic, highly desmoplastic stroma with expanded activated PSCs and altered extracellular matrix. Because k_psc_const represents the resident quiescent PSC population in normal pancreas that tumor cells encounter as they grow into surrounding tissue, healthy-organ measurements are an appropriate starting point, but actual PSC densities in PDAC-adjacent tissue may differ by several fold due to chronic inflammation, fibrosis, and patient-to-patient variability.
  estimated_translation_uncertainty_fold: 3.0
  validation_warnings:
