study_interpretation: |
  Tomala2009 demonstrate that sustained, high-intensity IL-2 receptor signaling delivered via IL-2/anti-IL-2 immunocomplexes can expand activated naive CD8+ T cells more than 1000-fold in vivo after six doses. Assuming each cell division approximately doubles cell number and that net death during the expansion burst is limited, this fold-expansion implies on the order of 10 effective generations (log2(1000) ~ 10). We therefore use these data to calibrate N_IL2_CD8 as an effective maximum number of IL-2-driven CD8 T cell divisions achievable under strong IL-2 exposure, recognizing that this captures both true mitotic events and any systematic deviations from idealized doubling.

key_assumptions:
- |
  Each effective IL-2-driven generation approximately doubles CD8 T cell number, so total fold expansion can be approximated as 2 ** N_IL2_CD8.
- |
  Net cell death during the main IL-2-driven proliferative burst is relatively small compared to proliferation, so it can be neglected when mapping fold expansion to number of effective generations.
- |
  The pharmacologic IL-2/anti-IL-2 immunocomplex regimen in mice approximates a near-maximal IL-2R signaling scenario that is suitable for constraining the upper bound of N_IL2_CD8 in the human PDAC model.
- |
  Intrinsic IL-2-driven proliferative capacity of CD8 T cells (in generations) is broadly conserved between mice and humans, allowing mouse in vivo data to inform a human QSP model with a moderate translation uncertainty factor.
- |
  Biological and experimental variability in reported fold-expansion can be reasonably summarized by an assumed coefficient of variation (here 30 percent) in the absence of detailed dispersion and sample size reporting.

key_study_limitations:
- |
  Data are from mouse models with IL-2/anti-IL-2 immunocomplexes, not from human PDAC patients or human CD8 T cells in vitro.
- |
  IL-2 is presented as a long-acting immunocomplex at pharmacologic doses, which may exaggerate expansion relative to clinical IL-2 exposure or endogenous IL-2 produced in PDAC tumors.
- |
  The abstract reports fold-expansion qualitatively as several hundred-fold and more than 1000-fold, without precise point estimates, variance, or sample sizes, so the effective fold expansion and its uncertainty must be approximated.
- |
  The mapping from fold expansion to number of generations assumes idealized doubling and negligible death; in reality, division and death are concurrent, so N_IL2_CD8 inferred here should be viewed as an effective parameter rather than a literal division count.
- |
  Tumor microenvironmental factors in PDAC (desmoplasia, myeloid suppression, T cell exclusion) are not captured in the Tomala2009 models and could limit IL-2-driven expansion in patients relative to these mouse experiments.

