source_relevance:
  indication_match: proxy
  indication_match_justification: |
    The Tomala2009 study investigates IL-2/anti-IL-2 immunocomplex-driven expansion of activated naive CD8+ T cells in mouse tumor models (non-PDAC). We use these data as a proxy to constrain the maximal IL-2-driven proliferative potential of CD8 T cells in a human PDAC QSP model. Although the tumor type and species differ, the underlying process of IL-2 receptor-mediated clonal expansion of CD8 T cells is largely cell-intrinsic and mechanistically similar across solid tumor settings, so the data are informative but require translation uncertainty.
  species_source: mouse
  species_target: human
  source_quality: primary_animal_in_vivo
  perturbation_type: pharmacological
  perturbation_relevance: |
    IL-2 is delivered as long-acting IL-2/anti-IL-2 immunocomplexes at pharmacologic doses, which strongly amplify IL-2R signaling and extend IL-2 half-life. As a result, the observed greater than 1000-fold CD8 T cell expansion likely represents an upper bound on IL-2-driven proliferative capacity under highly favorable conditions. In the PDAC QSP model, N_IL2_CD8 should therefore be interpreted as a maximal or near-maximal number of IL-2-driven generations achievable under strong IL-2 exposure, with typical in-tumor expansion expected to be lower.
  tme_compatibility: moderate
  tme_compatibility_notes: |
    The Tomala2009 models use transplantable tumor systems in immunocompetent mice, which provide an inflamed but not strongly desmoplastic microenvironment. PDAC tumors are more fibrotic and immunosuppressed. However, the parameter N_IL2_CD8 reflects intrinsic CD8 T cell proliferative capacity under IL-2 rather than trafficking or stromal constraints, so tumor microenvironment differences are expected to introduce only moderate uncertainty.
  estimated_translation_uncertainty_fold: 5.0
  validation_warnings: []
