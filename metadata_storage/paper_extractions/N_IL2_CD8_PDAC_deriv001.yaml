  forward_model:
    data_rationale: |
      Tomala2009 report that IL-2/anti-IL-2 immunocomplexes expand activated naive CD8+ T cells more than 1000-fold after six doses in vivo, providing a strong constraint on the maximum clonal expansion achievable under sustained, strong IL-2 receptor signaling.
    submodel_rationale: |
      In the full QSPIO-PDAC model, N_IL2_CD8 represents the maximum number of activated CD8 T cell generations achievable due to IL-2 stimulation. Under the simplifying assumption that each division approximately doubles cell number and that death is negligible during the expansion burst, the total fold expansion is approximated as 2 ** N_IL2_CD8. The Tomala2009 data therefore constrain N_IL2_CD8 via the observed maximum fold expansion under strong IL-2R signaling.
    independent_variable:
