    formula: fold_expansion = 2 ** N_IL2_CD8
    code: |
      def compute(params, inputs, ureg):
          import numpy as np
          N = params['N_IL2_CD8']
          # Under pure proliferative expansion with negligible death, each generation doubles cell number
          fold = (2 ** N) * 1.0
          return fold * ureg.dimensionless
