study_interpretation: |
  Bayne et al. quantified Gr-1+ CD11b+ myeloid-derived suppressor cells in the KPC mouse model of pancreatic ductal adenocarcinoma and found that they comprise approximately 20%-30% of all CD45+ leukocytes in pancreatic tumors and spleens. Interpreting established KPC tumors as being at quasi-steady state with respect to MDSC turnover, this high fraction reflects the balance between chemokine-driven recruitment into the tumor and first-order loss (death and clearance). Literature describing MDSCs as short-lived cells with a lifespan of about one to two days in blood and tumor microenvironments further constrains the loss rate. Together, these data imply a substantial continuous recruitment flux to maintain the observed MDSC burden, providing an order-of-magnitude constraint on k_MDSC_rec in the PDAC QSP model.

key_assumptions:
- |
  KPC tumors analyzed in Bayne et al. represent a quasi-steady state for intratumoral MDSC numbers, so that recruitment approximately balances death and clearance.
- |
  The fraction of CD45+ leukocytes that are Gr-1+ CD11b+ cells (20%-30%) in KPC pancreatic tumors is representative of established PDAC tumors used as baseline in the QSP model.
- |
  Chemokine-dependent modulation of MDSC recruitment via CCL2 and IL-6 is near-saturated in established PDAC and can be absorbed into the prior on k_MDSC_rec in this steady-state submodel.
- |
  Total CD45+ leukocyte density per milliliter of PDAC tumor (L_leukocyte_T) is relatively stable across tumors and can be represented by a broad lognormal prior centered around 1e7 cells/mL.
- |
  The additional first-order clearance term for MDSCs present in the full QSP model can be lumped with intrinsic death into an effective loss rate k_MDSC_death for the purpose of this calibration.

key_study_limitations:
- |
  Bayne et al. report MDSC frequencies as percentages of leukocytes but do not provide absolute counts per tumor volume, requiring introduction of an assumed leukocyte density parameter.
- |
  Only a single cross-sectional time point for intratumoral MDSCs is available, so recruitment and death rates cannot be independently identified without informative priors.
- |
  Gr-1+ CD11b+ cells in the KPC model include heterogeneous immature myeloid subsets (monocytic and granulocytic MDSCs), whereas the QSP model aggregates them into a single MDSC compartment.
- |
  Mouse-to-human species differences in myeloid biology and chemokine receptor expression introduce at least a few-fold uncertainty when translating recruitment rates to human PDAC.
- |
  Non-chemokine mechanisms (e.g., local proliferation of myeloid cells in the tumor) are not disentangled and are effectively absorbed into the recruitment parameter.

