calibration:
  parameters:
  - name: k_MDSC_rec
    units: cell/(milliliter*day)
    prior:
      distribution: lognormal
      mu: 13.8
      sigma: 1.0
      lower:
      upper:
      rationale: |
        Centered around 1e6 cell/(mL*day), roughly the recruitment flux needed to maintain ~2-3 x 10^6 MDSCs per mL with a 1-2 day lifespan in PDAC tumors, with 10-fold uncertainty to reflect cross-species and TME variability.
  - name: k_MDSC_death
    units: 1/day
    prior:
      distribution: lognormal
      mu: -0.77
      sigma: 0.5
      lower:
      upper:
      rationale: |
        Derived from MDSC lifespan of approximately 1-2 days in blood and tumors. A midpoint lifespan of ~1.5 days corresponds to k ~ ln(2)/1.5 ~ 0.46 1/day. Moderate uncertainty reflects variation across contexts and experimental systems.
  - name: L_leukocyte_T
    units: cell/milliliter
    prior:
      distribution: lognormal
      mu: 16.1
      sigma: 1.0
      lower:
      upper:
      rationale: |
        Effective CD45+ leukocyte density in PDAC tumor tissue. Prior centered at 1e7 cells/mL, with an order-of-magnitude uncertainty to cover plausible ranges in desmoplastic solid tumors. This is needed to convert an observed MDSC fraction into an absolute MDSC density.
  forward_model:
    data_rationale: |
      Bayne et al. (KPC PDAC model) report that Gr-1+ CD11b+ cells comprise 20%-30% of all CD45+ leukocytes in established pancreatic tumors, but only at a single time point. Interpreting these tumors as being at quasi-steady state with respect to MDSC turnover, the steady-state MDSC fraction constrains the ratio of recruitment to loss rates.
    submodel_rationale: |
      In the full QSP PDAC model, intratumoral MDSCs are generated via a source term null -> V_T.MDSC with rate k_MDSC_rec * V_T * (V_T.CCL2 / (V_T.CCL2 + CCL2_50)) * (1 + H_IL6_MDSC) and are removed by first-order death and additional clearance. Under baseline PDAC conditions with high chemokine levels, we assume the chemokine-dependent modulation is near-saturated and absorb it into the prior for k_MDSC_rec. At steady state, recruitment balances first-order loss, so that the MDSC density per tumor volume is k_MDSC_rec / k_MDSC_death (up to chemokine modulation). Dividing by the CD45+ leukocyte density L_leukocyte_T yields the observable fraction of leukocytes that are MDSCs. This algebraic submodel captures that steady-state balance while preserving the mechanistic role of k_MDSC_rec as a source-term coefficient.
    independent_variable:
    state_variables:
    type: algebraic
    formula: f_MDSC = k_MDSC_rec / (k_MDSC_death * L_leukocyte_T)
    code: |
      def compute(params, inputs, ureg):
          # params:
          #   k_MDSC_rec   [cell/(mL*day)]
          #   k_MDSC_death [1/day]
          #   L_leukocyte_T[cell/mL]
          k_rec = params['k_MDSC_rec']
          k_death = params['k_MDSC_death']
          L = params['L_leukocyte_T']
          f = k_rec / (k_death * L)
          return f * ureg('dimensionless')
    code_julia: |
      function compute(params, inputs)
          k_rec   = params["k_MDSC_rec"]
          k_death = params["k_MDSC_death"]
          L       = params["L_leukocyte_T"]
          f = k_rec / (k_death * L)
          return f
      end
  error_model:
  - name: mdsc_fraction_tumor_measurement
    observable:
      type: identity
      state_variables: []
      rationale:
      code:
    units: dimensionless
    uses_inputs:
    - mdsc_fraction_tumor_ci95_low
    - mdsc_fraction_tumor_ci95_high
    evaluation_points:
    sample_size: 13
    sample_size_rationale: |
      Number of KPC pancreata analyzed for tumor-associated Gr-1+ CD11b+ MDSCs in the PDA group (n=13 pancreata reported).
    observation_code: |
      def derive_observation(inputs, sample_size, ureg):
          import numpy as np
          low = inputs['mdsc_fraction_tumor_ci95_low']   # dimensionless
          high = inputs['mdsc_fraction_tumor_ci95_high'] # dimensionless

          L = low.magnitude
          U = high.magnitude

          # Interpret 20%-30% as an approximate 95% interval for the
          # between-mouse variability in MDSC fraction.
          sigma_log = (np.log(U) - np.log(L)) / (2.0 * 1.96)

          # Use the geometric mean as central estimate of the fraction
          mean_val = np.sqrt(L * U) * ureg('dimensionless')

          return {
              'value': mean_val,
              'sd': sigma_log,       # log-space SD for lognormal likelihood
              'sd_uncertain': False,
              'n': sample_size,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        MDSC fractions are positive and bounded between 0 and 1. Across mice, inter-tumoral variability in these fractions is plausibly closer to lognormal than normal due to multiplicative biological sources of variation.
  identifiability_notes: |
    This submodel primarily constrains the combination k_MDSC_rec / (k_MDSC_death * L_leukocyte_T) through the observed steady-state MDSC fraction in KPC PDAC tumors. With only a single cross-sectional measurement, k_MDSC_rec is not strictly identifiable without informative priors on k_MDSC_death (from MDSC lifespan) and L_leukocyte_T (tumor leukocyte density). The posterior for k_MDSC_rec will therefore remain broad and correlated with both k_MDSC_death and L_leukocyte_T, and this calibration should be interpreted as providing an order-of-magnitude constraint rather than a precise estimate. Longitudinal data on intratumoral MDSC accumulation or absolute counts of MDSCs and CD45+ cells per gram of tumor would be required for stronger identifiability.

