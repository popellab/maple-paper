study_interpretation: |
  Ahn et al. quantified the natural history of untreated pancreatic ductal adenocarcinoma using serial multidetector CT in 100 patients. At the initial CT (prior to any oncologic therapy), primary tumours had diameters ranging from 1.0 to 6.2 cm with a mean of 2.9 cm and SD of 1.3 cm. These data provide a direct estimate of typical pre-treatment PDAC tumour size at clinical presentation, which can be used to set the initial_tumour_diameter parameter in the QSPIO-PDAC model as a population-level baseline for tumour burden.

key_assumptions:
- |
  The reported "+/- 1.3 cm" around the mean diameter in Ahn et al. represents the standard deviation of patient-level tumour diameters rather than SEM.
- |
  Maximum axial CT tumour diameter in the clinical study corresponds to the effective tumour diameter used to initialize tumour volume in the QSPIO-PDAC model (i.e., tumour shape differences are neglected).
- |
  The distribution of pre-treatment tumour diameters in the Korean cohort of Ahn et al. is representative, up to modest demographic differences, of the PDAC populations for which the QSPIO-PDAC model will be applied.

key_study_limitations:
- |
  Single-center retrospective cohort with potential selection bias toward patients with adequate imaging and follow-up.
- |
  Study includes a mix of stages and anatomical locations; tumour size distributions may differ between resectable, borderline, locally advanced, and metastatic PDAC, which are not separated in this calibration.
- |
  CT-derived maximum diameter does not capture microscopic extension or multifocal disease; true biological tumour burden may be somewhat larger than the radiologic measurement.

