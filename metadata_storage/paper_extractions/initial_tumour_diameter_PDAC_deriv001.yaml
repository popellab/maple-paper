calibration:
  parameters:
  - name: initial_tumour_diameter
    units: centimeter
    prior:
      distribution: lognormal
      mu: 0.97
      sigma: 0.43
      lower:
      upper:
      rationale: |
        Prior centered on mean pre-treatment PDAC tumour diameter (2.9 cm) from Ahn et al. 2016 with moderate dispersion to cover observed inter-patient variability and other clinical cohorts.
  forward_model:
    data_rationale: |
      Clinical CT study by Ahn et al. reports pre-treatment primary tumour diameters in untreated PDAC patients at initial imaging, providing a direct constraint on the initial tumour diameter parameter.
    submodel_rationale: |
      In the full QSPIO-PDAC model, initial_tumour_diameter sets the baseline tumour burden from which growth, immune interactions, and treatment responses evolve. Here we calibrate this parameter directly to match the clinical distribution of pre-treatment PDAC tumour diameters.
    independent_variable:
    state_variables:
    type: algebraic
    formula: d_init_observed = initial_tumour_diameter
    code: |
      def compute(params, inputs, ureg):
          d = params['initial_tumour_diameter']
          return d * ureg('centimeter')
    code_julia: |
      function compute(params, inputs)
          return params["initial_tumour_diameter"]
      end
  error_model:
  - name: initial_tumour_diameter_measurement
    observable:
    units: centimeter
    uses_inputs:
    - initial_tumour_diameter_mean_ahn2017
    - initial_tumour_diameter_sd_ahn2017
    - initial_tumour_diameter_n_ahn2017
    evaluation_points:
    sample_size: 100
    sample_size_rationale: Number of PDAC patients included in Ahn et al. CT cohort.
    observation_code: |
      def derive_observation(inputs, sample_size, ureg):
          mean = inputs['initial_tumour_diameter_mean_ahn2017']
          sd = inputs['initial_tumour_diameter_sd_ahn2017']
          n = int(inputs['initial_tumour_diameter_n_ahn2017'].magnitude)
          # Use coefficient of variation as log-space SD for lognormal likelihood
          cv = sd.magnitude / mean.magnitude
          return {
              'value': mean,
              'sd': cv,
              'sd_uncertain': False,
              'n': n,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        Tumour diameters are positive and inter-patient variability in anatomical measures is typically right-skewed; a lognormal likelihood captures this behaviour.
  identifiability_notes: |
    This submodel includes a single parameter, initial_tumour_diameter, which is directly mapped to the observed pre-treatment tumour diameter distribution. Given the lognormal prior and one high-quality clinical measurement (mean and SD over 100 patients), the parameter is well constrained at the population level. The model does not distinguish subgroups by stage or resectability; any heterogeneity across clinical presentations is absorbed into the prior and likelihood dispersion.

