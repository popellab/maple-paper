calibration:
  parameters:
  - name: n_Treg_clones
    units: dimensionless
    prior:
      distribution: lognormal
      mu: 8.94
      sigma: 1.0
      lower:
      upper:
      rationale: |
        Centered on the mouse estimate of minimal Treg TCRbeta diversity required to maintain tolerance (~7.6e3 clonotypes), with ~1 log-unit uncertainty to allow for species and indication translation and for the fact that the human PDAC setting may require different clonal diversity.
  forward_model:
    data_rationale: |
      Yu et al. quantified the number of unique productive TCRbeta clonotypes in Foxp3+ Tregs in a mouse IL-2Rbeta-/- autoimmunity model using deep sequencing, and identified the minimal repertoire size compatible with control of polyclonal autoreactive T cells.
    submodel_rationale: |
      In the full QSPIO-PDAC model, n_Treg_clones is a dimensionless factor representing the number of self-antigen-specific Treg clonotypes, scaling both the rate of Treg activation and the amount of self-antigen P0 generated per dying cancer cell. In this submodel, we identify n_Treg_clones directly with the minimal number of distinct Treg TCRbeta clonotypes required to maintain tolerance, providing an order-of-magnitude calibration for this clonal multiplicity factor.
    independent_variable:
    state_variables:
    type: algebraic
    formula: N_min_clonotypes = n_Treg_clones
    code: |
      def compute(params, inputs, ureg):
          n_clones = params['n_Treg_clones']
          # n_Treg_clones represents the effective number of distinct
          # self-antigen-specific Treg clonotypes contributing to tolerance.
          # The observable in this submodel is the minimal clonotype count
          # inferred from deep sequencing.
          return n_clones * ureg('dimensionless')
    code_julia: |
      function compute(params, inputs)
          # n_Treg_clones represents the effective number of distinct
          # self-antigen-specific Treg clonotypes contributing to tolerance.
          return params["n_Treg_clones"]
      end
  error_model:
  - name: treg_clone_count_min_mouse
    observable:
    units: dimensionless
    uses_inputs:
    - treg_clonotypes_min_mean
    - treg_clonotypes_min_sem
    - treg_clonotypes_min_n
    evaluation_points:
    sample_size: 4
    sample_size_rationale: |
      Number of primary recipients inferred from related spectratyping experiment in the same paper.
    observation_code: |
      def derive_observation(inputs, sample_size, ureg):
          import numpy as np
          mean = inputs['treg_clonotypes_min_mean']  # Quantity
          sem = inputs['treg_clonotypes_min_sem']    # Quantity
          n = int(inputs['treg_clonotypes_min_n'].magnitude)

          # Convert SEM to SD: SD = SEM * sqrt(n)
          sd_linear = sem.magnitude * np.sqrt(n)

          # For a lognormal likelihood, use coefficient of variation (CV)
          # as the scale parameter in log-space.
          cv = sd_linear / mean.magnitude

          return {
              'value': mean,          # Pint Quantity, dimensionless
              'sd': cv,               # dimensionless CV for lognormal
              'sd_uncertain': True,   # SD derived from SEM and inferred n
              'n': n,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        Clonotype counts are strictly positive and multiplicative variability (fold-changes) is more appropriate than additive noise on the absolute scale for repertoire size measurements.
  identifiability_notes: |
    The algebraic submodel has a single parameter (n_Treg_clones) and a single direct observation (minimal Treg clonotype count in mice), so it is structurally identifiable within the context of the mouse experiment. However, translation to the human PDAC setting is highly uncertain (documented in source_relevance), so the calibrated value should be interpreted as an order-of-magnitude anchor for the clonal multiplicity factor rather than a precise human PDAC estimate.

source_relevance:
  indication_match: proxy
  indication_match_justification: |
    The primary data are from a murine IL-2Rbeta-/- autoimmunity model, not from PDAC. The quantified minimal Treg TCRbeta clonotype diversity reflects systemic self-tolerance requirements rather than tumor-specific immune regulation. We use this as a mechanistic proxy for the number of distinct self-antigen-specific Treg clones that can participate in tolerance, acknowledging that the clonal diversity needed in human PDAC may differ substantially due to species, tissue, and disease context.
  species_source: mouse
  species_target: human
  source_quality: primary_animal_in_vivo
  perturbation_type: pathological_state
  perturbation_relevance: |
    IL-2Rbeta-/- mice lack functional endogenous Tregs, and tolerance is restored by adoptive transfer of wild-type Tregs. The estimated minimal clonotype number therefore reflects a lower bound in a perturbed system. In unperturbed human PDAC, the effective number of relevant Treg clones may be higher; we treat the mouse estimate as an approximate lower bound on n_Treg_clones.
  tme_compatibility: low
  tme_compatibility_notes: |
    The experiment measures systemic tolerance in lymphoid organs and multiple non-tumor tissues in autoimmune-prone mice, whereas the QSP model targets a desmoplastic, T cell-excluded PDAC tumor microenvironment with distinct stromal architecture and antigenic landscape. Treg clonal requirements in PDAC may differ by at least an order of magnitude.
  estimated_translation_uncertainty_fold: 10.0
  validation_warnings: []
