study_interpretation: |
  Yu et al. used an IL-2Rbeta-/- mouse model rescued with wild-type Foxp3+ Tregs to progressively restrict the Treg TCRbeta repertoire and assess when tolerance fails. Deep sequencing of TCRbeta in Tregs from primary recipients that remained autoimmune-free showed an average of 7608 +/- 1321 unique productive clonotypes. The authors interpret this as the minimal Treg TCRbeta diversity required to suppress polyclonal autoreactive T cells, corresponding to approximately 18% of the full Treg repertoire (~42,225 clonotypes) observed in normal mice. In the submodel, we map n_Treg_clones directly to this minimal clonotype count, treating it as an approximate lower bound for the number of distinct self-antigen-specific Treg clones needed for effective tolerance.

key_assumptions:
- |
  n_Treg_clones in the QSPIO-PDAC model is interpreted as the effective number of distinct self-antigen-specific Treg clonotypes contributing to tolerance and tumor-related regulation.
- |
  The minimal Treg TCRbeta clonotype number required to prevent autoimmunity in IL-2Rbeta-/- mice provides an order-of-magnitude lower bound on the clonal diversity needed for self-tolerance in humans.
- |
  Treg functional specificity is well approximated by TCRbeta clonotype counts; alpha-chain diversity and paired alpha/beta diversity are not modeled explicitly.
- |
  The reported +/-1321 value for 7608 clonotypes is treated as SEM and converted to SD using an inferred sample size of n=4 primary recipients.
- |
  Systemic tolerance requirements captured in the IL-2Rbeta-/- model are assumed to be qualitatively relevant to the balance of effector and regulatory clones in PDAC, but with at least an order-of-magnitude translation uncertainty.
- |
  We equate n_Treg_clones with the minimal required clonotype number, recognizing that the full repertoire in unperturbed hosts is larger (~4.2e4 clonotypes in this mouse study).

key_study_limitations:
- Mouse in vivo model (C57BL/6 IL-2Rbeta-/-) rather than human PDAC patients.
- |
  Pathological state with genetic disruption of IL-2 signaling; tolerance may be restored under non-physiological conditions.
- |
  Clonotype counts are derived from TCRbeta sequencing only and do not fully capture paired alpha/beta diversity.
- |
  Tissue and antigen context (systemic autoimmunity) differ from the PDAC tumor microenvironment.
- |
  Sample size for deep sequencing of primary recipients is inferred (n~4) from related spectratyping experiments, not explicitly reported for clonotype counts.

