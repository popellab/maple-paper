study_interpretation: |
  Iredale et al. (1998) demonstrate that spontaneous resolution of experimental rat liver fibrosis is accompanied by a marked (12-fold) decline in activated hepatic stellate cell (HSC) numbers over 28 days, with clear evidence of HSC apoptosis. This supports a picture in which activated stellate cells, although apoptosis-resistant during ongoing injury, can undergo substantial first-order apoptosis once pro-survival stimuli are withdrawn and matrix remodeling is permitted. Assuming that activated pancreatic stellate cells (aPSCs) in PDAC share similar intrinsic apoptosis machinery and first-order death kinetics, this 12-fold reduction over 28 days provides a mechanistic constraint on the order of magnitude of k_apsc_death when translated with appropriate uncertainty.

key_assumptions:
- |
  Activated hepatic stellate cells (HSCs) and activated pancreatic stellate cells (aPSCs) share similar intrinsic susceptibility to apoptosis and die via approximately first-order kinetics once survival cues are withdrawn.
- |
  The 12-fold reduction in alpha-SMA-positive HSCs over 28 days primarily reflects net apoptosis of activated stellate cells, with negligible contribution from phenotypic reversion or migration.
- |
  Exponential (first-order) decay is an adequate approximation for the decline in activated HSCs over the reported recovery period.
- |
  The assumed coefficient of variation (30%) reasonably captures experimental and inter-animal variability in the reported fold-reduction, in the absence of published error bars.
- |
  Pathological liver fibrosis resolution provides an upper-bound scenario for stellate cell death rates; actual aPSC death rates in PDAC may be lower, which is accommodated by wide priors and translation uncertainty.

key_study_limitations:
- |
  Data are from rat hepatic stellate cells in liver fibrosis, not from human pancreatic stellate cells in PDAC; cross-species and cross-organ extrapolations introduce substantial uncertainty.
- |
  The 12-fold reduction in activated HSCs is reported without explicit variance or sample size, requiring an assumed coefficient of variation for calibration.
- |
  The measured decline reflects a recovery phase after removal of fibrogenic insult, which may feature enhanced pro-apoptotic signaling compared with the chronic PDAC microenvironment.
- |
  The analysis is based on histological quantification of alpha-SMA-positive cells, which may be influenced by changes in marker expression as well as absolute cell number.

