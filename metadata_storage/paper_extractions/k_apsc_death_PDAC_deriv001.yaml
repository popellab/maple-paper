calibration:
  parameters:
  - name: k_apsc_death
    units: 1/day
    prior:
      distribution: lognormal
      mu: -2.3
      sigma: 1.0
      lower:
      upper:
      rationale: |
        Centered around ~0.1 1/day (approximate fibroblast/stellate cell death rates) with 10-fold uncertainty to accommodate cross-species and cross-organ translation as well as experimental uncertainty in HSC apoptosis kinetics.
  forward_model:
    data_rationale: |
      Iredale et al. (1998) report that activated hepatic stellate cell (HSC) numbers decline 12-fold over 28 days during spontaneous resolution of rat liver fibrosis, consistent with approximately first-order apoptosis-driven loss of activated stellate cells.
    submodel_rationale: |
      In the full QSPIO-PDAC model, k_apsc_death parameterizes first-order death of activated pancreatic stellate cells (aPSCs) via V_T.aPSC -> null with rate k_apsc_death * aPSC. Activated hepatic stellate cells (HSCs) in liver fibrosis are closely related myofibroblast-like stellate cells. Assuming first-order death dynamics, the fold-reduction in HSCs over a fixed time interval is fold_reduction = N(0)/N(t) = exp(k_apsc_death * t). We use this relationship as a proxy submodel to constrain k_apsc_death.
    independent_variable:
    state_variables:
    type: algebraic
    formula: fold_reduction = N(0)/N(t) = exp(k_apsc_death * t_recovery)
    code: |
      def compute(params, inputs, ureg): import numpy as np; k = params['k_apsc_death']; t_days = inputs['recovery_duration_28d']; return np.exp(k * t_days) * ureg.dimensionless
    code_julia: |
      function compute(params, inputs) k = params["k_apsc_death"]; t = inputs["recovery_duration_28d"]; return exp(k * t); end
  error_model:
  - name: hsc_fold_reduction_measurement
    observable:
    units: dimensionless
    uses_inputs:
    - hsc_fold_reduction_28d
    - assumed_fold_reduction_cv
    evaluation_points:
    sample_size:
    sample_size_rationale: |
      Iredale et al. (1998) do not report explicit n alongside the 12-fold reduction; we treat this as a representative group-level estimate and encode additional uncertainty via an assumed coefficient of variation.
    observation_code: |
      def derive_observation(inputs, sample_size, ureg): mean_fold = inputs['hsc_fold_reduction_28d']; cv = inputs['assumed_fold_reduction_cv'].magnitude; return {'value': mean_fold * ureg.dimensionless, 'sd': cv, 'sd_uncertain': True}
    likelihood:
      distribution: lognormal
      rationale: |
        Fold-changes are positive and typically right-skewed; a lognormal likelihood with CV from assumed_fold_reduction_cv is appropriate.
  identifiability_notes: |
    Within this submodel, there is a single algebraic relationship between k_apsc_death and the observed fold-reduction over a fixed interval, so k_apsc_death is structurally identifiable from the HSC data alone. However, practical identifiability is limited by (1) the absence of explicit variance or sample size in Iredale et al. (1998), (2) use of hepatic rather than pancreatic stellate cells, (3) rat-to-human translation, and (4) modeling a resolution phase (enhanced apoptosis) rather than steady-state PDAC stroma. These issues are captured via a wide prior and large translation uncertainty in the source_relevance block, and k_apsc_death should be further informed by PDAC-specific stromal dynamics if available.

source_relevance:
  indication_match: proxy
  indication_match_justification: |
    The data are from activated hepatic stellate cells (HSCs) in rat liver fibrosis resolving after carbon tetrachloride injury, whereas the QSPIO-PDAC model targets activated pancreatic stellate cells (aPSCs) in human PDAC. HSCs and PSCs are both vitamin A-storing stellate cells that become myofibroblast-like upon activation and drive organ fibrosis, and PSC biology has historically been extrapolated from HSC studies. However, the liver and pancreatic tumor microenvironments differ in vascular structure, immune context, and mechanics, so HSC apoptosis kinetics are treated only as a mechanistic proxy for aPSC death rates.
  species_source: rat
  species_target: human
  source_quality: primary_animal_in_vivo
  perturbation_type: pathological_state
  perturbation_relevance:
  tme_compatibility: moderate
  tme_compatibility_notes: |
    Both liver fibrosis and PDAC stroma feature dense collagen-rich extracellular matrix produced by activated stellate cells, but PDAC additionally exhibits extreme desmoplasia and T cell exclusion driven by PSC-cancer interactions. These differences may alter survival signaling to stellate cells; we therefore treat hepatic stellate cell apoptosis kinetics as only moderately representative of PDAC aPSC death.
