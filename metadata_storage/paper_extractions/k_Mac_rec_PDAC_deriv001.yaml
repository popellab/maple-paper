calibration:
  parameters:
  - name: k_Mac_rec
    units: cell/(milliliter*day)
    prior:
      distribution: lognormal
      mu: 15.0
      sigma: 2.0
      lower:
      upper:
      rationale: |
        Centered to match typical PDAC TAM densities (~1e8 cell/mL) assuming residence time ~30 days, with wide uncertainty over several orders of magnitude.
  forward_model:
    data_rationale: |
      Chen2015 quantified CD68+ tumor-associated macrophage counts per high-power field in human PDAC resections. At steady state, the product of recruitment rate and effective residence time should match the observed macrophage density per tumor volume.
    submodel_rationale: |
      In the full QSPIO-PDAC model, k_Mac_rec controls CCL2-driven recruitment of circulating monocytes/macrophages into the tumor (source term for V_T.Mac_M1). Under desmoplastic PDAC conditions with chronically elevated CCL2, recruitment can be approximated as near-maximal and balanced by loss processes. A simple algebraic steady-state relation (density = recruitment rate * residence time) captures the net effect of this source term on TAM abundance without explicitly modeling all death and polarization reactions.
    independent_variable:
    state_variables:
    type: algebraic
    formula: rho_Mac = k_Mac_rec * tau_mac_tumor
    code: |
      def compute(params, inputs, ureg):
          k = params['k_Mac_rec']  # numeric value corresponding to cell/(mL*day) in model context
          tau_raw = inputs['tau_mac_tumor']  # may be a float or a Pint Quantity
          if hasattr(tau_raw, 'to'):
              tau_days = tau_raw.to('day').magnitude
          else:
              tau_days = tau_raw
          # Steady-state macrophage density per tumor volume (cell/mL)
          return (k * tau_days) * ureg('cell/milliliter')
    code_julia: |
      function compute(params, inputs)
          # params["k_Mac_rec"] has units cell/(mL*day) in the full QSP model.
          # tau_mac_tumor is an effective residence time in days (passed as a scalar here).
          k = params["k_Mac_rec"]
          tau = inputs["tau_mac_tumor"]
          return k * tau
      end
  error_model:
  - name: mac_density_per_volume
    observable:
      type: identity
      state_variables: []
      rationale:
      code:
    units: cell/milliliter
    uses_inputs:
    - mac_density_per_volume_mean
    - mac_cd68_periph_cv_assumed
    evaluation_points:
    sample_size: 70
    sample_size_rationale: |
      PDAC cohort size in Chen2015 after excluding patients lost to follow-up (70 tumor specimens).
    observation_code: |
      def derive_observation(inputs, sample_size, ureg):
          mean_density = inputs['mac_density_per_volume_mean']
          cv = inputs['mac_cd68_periph_cv_assumed'].magnitude
          return {
              'value': mean_density.to('cell/milliliter'),
              'sd': cv,
              'sd_uncertain': True,
              'n': int(sample_size),
          }
    likelihood:
      distribution: lognormal
      rationale: |
        Macrophage densities are positive and expected to be approximately log-normally distributed across patients; CV is uncertain and treated as a hyper-parameter via sd_uncertain.
  identifiability_notes: |
    This algebraic submodel uses a single steady-state constraint (macrophage density) to infer a single parameter (k_Mac_rec), given a fixed effective residence time tau_mac_tumor. Under these assumptions, k_Mac_rec is structurally identifiable from the data. However, the biological interpretation is coarse-grained: (1) the measurement is pan-macrophage (CD68+) rather than specifically V_T.Mac_M1; (2) the residence time is inferred from non-tumor macrophage kinetics, introducing substantial translation uncertainty; and (3) CCL2 is assumed near-saturating in PDAC so that the recruitment term effectively operates at its maximal rate. As a result, k_Mac_rec should be viewed as an effective parameter capturing net monocyte/macrophage influx required to sustain observed TAM densities, rather than a pure biophysical rate constant. Additional time-course data (e.g., TAM depletion and recovery after CCR2 or CSF1R blockade) would be needed to independently constrain recruitment and loss processes.

