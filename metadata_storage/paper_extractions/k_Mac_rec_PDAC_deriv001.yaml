study_interpretation: |
  Chen2015 quantified CD68+ and CD163+ tumor-associated macrophages in central and peritumoural regions of human PDAC and chronic pancreatitis tissues by immunohistochemistry. PDAC samples showed substantially higher macrophage densities than chronic pancreatitis, with particularly dense CD68+ and CD163+ infiltrates in the peritumoural stroma. These data support the view that TAMs are a dominant leukocyte population in PDAC and provide semi-quantitative estimates of their abundance per histological high-power field. By combining the reported median peritumoural CD68+ count (71.5 cells per 400x HPF) with section thickness and an assumed HPF area, we infer an approximate 3D TAM density. Under a steady-state assumption where recruitment balances loss, this density constrains the product of recruitment rate and macrophage residence time, providing an effective estimate for the maximal CCL2-driven recruitment rate parameter k_Mac_rec in the QSPIO-PDAC model.

key_assumptions:
- |
  TAMs quantified by CD68 immunohistochemistry are representative of the total macrophage population corresponding to V_T.Mac_M1 + V_T.Mac_M2 in the QSPIO-PDAC model, even though the experimental assay does not distinguish activation or polarization state.
- |
  Peritumoural CD68+ counts (group C in Chen2015) are taken as more representative of the viable, perfused tumor-stroma interface that governs ongoing monocyte recruitment, compared with central tumor regions that may be necrotic or poorly vascularized.
- |
  The PDAC tumor microenvironment is in a quasi-steady state with respect to macrophage abundance on the timescale of months, so that net recruitment approximately balances net loss (death, egress, or differentiation), allowing a steady-state algebraic relation between recruitment rate and density.
- |
  CCL2 levels are chronically elevated and effectively near-saturating in PDAC, so that the CCL2-dependent factor V_T.CCL2/(V_T.CCL2 + CCL2_50) in the full QSP model is approximated as unity for baseline tumors when mapping to k_Mac_rec.
- |
  An effective macrophage residence time in PDAC tumors of roughly 30 days is assumed, guided by macrophage longevity studies in non-tumor tissues and acknowledging that tumor-associated macrophages may have altered turnover.
- |
  High-power field area at 400x magnification is approximated from typical microscope geometry (field number), since it is not explicitly reported; this geometric factor is treated as an assumed auxiliary input rather than a precisely measured quantity.
- |
  Inter-patient variability in TAM density is summarized by an assumed coefficient of variation (50%), reflecting substantial biological heterogeneity; this uncertainty is propagated via a lognormal likelihood with sd_uncertain set to True.

key_study_limitations:
- |
  Chen2015 reports 2D counts of CD68+ cells per high-power field rather than absolute 3D cell densities, requiring geometric assumptions (field area, section thickness) to infer volumetric densities.
- |
  The study is cross-sectional and lacks time-course data on macrophage accumulation or depletion, so the inferred recruitment rate relies on a steady-state assumption and an externally informed residence time rather than direct kinetic measurements.
- |
  CD68 is a pan-macrophage marker that does not distinguish M1 vs M2 phenotypes; PDAC TAMs are known to be predominantly M2-like, so mapping from total CD68+ cells to the specific V_T.Mac_M1 compartment requires additional modeling assumptions about polarization dynamics.
- |
  Patients in Chen2015 received heterogeneous clinical management, and details of prior systemic therapy are not fully standardized, which may influence TAM densities in ways not captured by the model.
- |
  Sampling bias and spatial heterogeneity in macrophage distribution (central vs peripheral, stromal vs intratumoural) limit the precision with which a single scalar density can represent the entire tumor compartment in the QSP model.

