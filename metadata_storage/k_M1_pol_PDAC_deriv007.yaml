study_interpretation: |
  Herwig et al. used CD68/CD163 dual immunolabeling to distinguish M1-like (CD68+CD163-) and M2-like (CD68+CD163+) tumor-associated macrophages in uveal melanomas and reported that tumors with a high-risk (class 2) gene-expression profile had an approximate M2/M1 ratio of 2, compared to ~1 in low-risk (class 1) tumors. This indicates that progression to a more aggressive phenotype is associated with a two-fold enrichment of M2-like TAMs relative to M1-like TAMs in vivo, in the absence of exogenous pharmacologic manipulation. In the QSP PDAC model, the steady-state balance between M1 and M2 macrophages in tumor tissue is governed primarily by the opposing polarization rates k_M1_pol (M2->M1) and k_M2_pol (M1->M2), with recruitment and death processes affecting both phenotypes similarly. Interpreting the observed M2/M1 ratio of ~2 in aggressive tumors as reflecting a similar net M2 bias in advanced PDAC, we map this ratio onto the dimensionless quantity k_M2_pol/k_M1_pol using the steady_state_ratio submodel. This provides an in vivo constraint on the relative strength of M1-to-M2 vs M2-to-M1 polarization in a highly malignant tumor microenvironment.

key_assumptions:
- |
  MHC and chemokine landscapes that shape macrophage polarization in uveal melanoma and PDAC are similar enough that the order-of-magnitude M2/M1 bias carries over between indications.
- |
  Recruitment and death rates of M1 and M2 tumor-associated macrophages are comparable in the tumor compartment, so that the observed M2/M1 density ratio primarily reflects polarization dynamics rather than differential survival.
- |
  CD68+CD163- and CD68+CD163+ macrophages in uveal melanoma correspond functionally to M1-like and M2-like TAMs, respectively, analogous to the Mac_M1 and Mac_M2 populations in the PDAC QSP model.
- |
  Aggressive class 2 uveal melanomas are used as a proxy for advanced PDAC with respect to the degree of M2 bias; less aggressive class 1 tumors (M2/M1~1) are more analogous to earlier-stage or less immunosuppressive disease.
- |
  A coefficient of variation of 25% reasonably captures measurement and inter-tumor variability in the reported approximate ratios ("approximately 1" and "approximately 2") in the absence of explicit SD/SEM values.

key_study_limitations:
- |
  Indication mismatch: uveal melanoma arises in the immune-privileged eye and lacks the dense desmoplastic stroma characteristic of PDAC, so macrophage trafficking and polarization cues may differ substantially.
- |
  The study reports approximate M2/M1 ratios ("~1" and "~2") without full quantitative distributions, requiring an assumed coefficient of variation to represent uncertainty.
- |
  Only static, cross-sectional measurements are available; no time-course data or fate-mapping are provided, so polarization rates are inferred under a steady-state assumption rather than from dynamic kinetics.
- |
  M1 and M2 definitions are based on CD68/CD163 markers, which only approximate functional polarization states and may not align perfectly with the Mac_M1/Mac_M2 compartments in the QSP model.
- |
  Sample size is modest (n=20 tumors), and the cohort is specific to uveal melanoma with class 1/2 gene-expression profiling, which may not reflect broader solid-tumor biology.

