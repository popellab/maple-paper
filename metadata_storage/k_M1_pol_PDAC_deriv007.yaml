      rationale: |
        The M2/M1 ratio is positive and likely approximately log-normally distributed across tumors. We encode measurement and biological variability via an assumed coefficient of variation.
  identifiability_notes: |
    This target constrains primarily the ratio k_M2_pol/k_M1_pol via the observed steady-state M2/M1 macrophage ratio. Without additional dynamic data (e.g., time courses or fate-mapping), the absolute magnitudes of k_M1_pol and k_M2_pol remain only weakly identified and will be dominated by their priors and by other calibration targets that involve macrophage turnover timescales. The assumption that recruitment and death rates cancel in the ratio is critical; deviations from this (e.g., differential survival of M1 vs M2) would bias the inferred polarization-rate ratio. Cross-indication use of uveal melanoma data for a PDAC model introduces substantial translation uncertainty, so posterior inferences for k_M1_pol should be interpreted as order-of-magnitude guidance rather than precise estimates.

source_relevance:
  indication_match: proxy
  indication_match_justification: |
    The primary data come from human uveal melanoma, an aggressive solid tumor with abundant tumor-associated macrophages, whereas the QSP model targets pancreatic ductal adenocarcinoma (PDAC). Both tumors exhibit immunosuppressive microenvironments with M2-skewed TAM populations, but anatomical site, stromal composition, and local cytokine milieus differ substantially. We therefore treat the uveal melanoma M2/M1 ratio as a mechanistic proxy for the degree of M2 bias in a highly malignant solid tumor, not as a PDAC-specific quantitative measurement.
