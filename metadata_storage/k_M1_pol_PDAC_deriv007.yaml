      mu: -1.2
      sigma: 1.0
      lower:
      upper:
      rationale: |
        Same weakly-informative prior as k_M1_pol; the steady-state M2/M1 ratio data primarily constrain the ratio k_M2_pol/k_M1_pol, not their absolute magnitudes.
  forward_model:
    data_rationale: |
      Herwig et al. quantified the ratio of M2 (CD68+CD163+) to M1 (CD68+CD163-) tumor-associated macrophages in human uveal melanomas and reported that aggressive class 2 tumors have an M2/M1 ratio of approximately 2. This provides an in vivo steady-state measure of how strongly macrophages are biased toward the M2 phenotype in an aggressive solid tumor microenvironment without exogenous pharmacologic manipulation.
    submodel_rationale: |
      In the full QSP PDAC model, M1 and M2 macrophages interconvert via polarization reactions governed by k_M1_pol (M2->M1) and k_M2_pol (M1->M2), while sharing similar recruitment and death processes. Under quasi-steady-state conditions where recruitment and loss affect both phenotypes similarly, the M2/M1 density ratio is approximately proportional to k_M2_pol/k_M1_pol. The steady_state_ratio submodel captures this mechanistic dependence by setting the numerator rate to k_M2_pol (driving M2) and the denominator rate to k_M1_pol (driving M1), with drive factors set to 1.0 to represent an averaged cytokine milieu.
    independent_variable:
    state_variables:
    unit_conversion_factor: '1.0'
    type: steady_state_ratio
    rate_numerator: k_M2_pol
    rate_denominator: k_M1_pol
    drive_numerator: '1.0'
    drive_denominator: '1.0'
