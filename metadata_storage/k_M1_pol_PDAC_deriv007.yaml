calibration:
  parameters:
  - name: k_M1_pol
    units: 1/day
    prior:
      distribution: lognormal
      mu: -1.2
      sigma: 1.0
      lower:
      upper:
      rationale: |
        Centered at ~0.3 1/day (half-life ~2.3 days) as a plausible in vivo macrophage polarization timescale, with a wide (1 log10) uncertainty to accommodate cross-indication translation from uveal melanoma to PDAC.
  - name: k_M2_pol
    units: 1/day
    prior:
