calibration:
  parameters:
  - name: q_CD8_T_in
    units: 1/(centimeter^3*minute)
    prior:
      distribution: lognormal
      mu: -8.0
      sigma: 3.40
      lower:
      upper:
      rationale: |
        Wide prior for CD8 T cell extravasation rate per tumor volume, centered on order 1e-4 1/(cm^3*min). This is consistent with an effective infiltration half-time of several days for a 1 cm^3 tumor, as inferred from Yorty2007 kinetics. Sigma of 3.40 (ln(30)) reflects the 30-fold estimated translation uncertainty to accommodate cross-species (mouse to human) and cross-indication (brain tumor to PDAC) translation.

  forward_model:
    independent_variable:
    state_variables:
    type: algebraic
    formula: |
      q_CD8_T_in = (3.0 / t_peak) / V_ref, where t_peak ~ time to near-maximal tumor-site CD8+ T cell accumulation (5-7 days) and V_ref = 1 cm^3
    code: |
      def compute(params, inputs):
          """Forward model: given q_CD8_T_in, predict peak accumulation time."""
          import numpy as np
          def _val(x):
              return getattr(x, 'magnitude', x)
          q = params['q_CD8_T_in']
          V_ref = _val(inputs['reference_tumor_volume'])  # cm^3
          k_in_per_min = q * V_ref
          t_peak_min = 3.0 / k_in_per_min
          t_peak_days = t_peak_min / (24.0 * 60.0)
          return t_peak_days
    code_julia: |
      function compute(params, inputs)
          q = params["q_CD8_T_in"]
          V_ref = inputs["reference_tumor_volume"]
          k_in_per_min = q * V_ref
          t_peak_min = 3.0 / k_in_per_min
          t_peak_days = t_peak_min / (24.0 * 60.0)
          return t_peak_days  # days
      end
    data_rationale: |
      Yorty2007 reports that after adoptive transfer of Tag-immune CD8+ T cells into SV11 mice with advanced choroid plexus tumors, the frequency of tumor-specific CD8+ T cells in the brain peaks within 5-7 days. This time-to-peak accumulation reflects the characteristic timescale for trafficking and expansion of circulating effector CD8+ T cells into the tumor site. Approximating the peak time as the time to ~95% of the asymptotic tumor-infiltrating CD8+ population yields a direct relationship between the observed peak time window and the effective first-order recruitment rate constant.
    submodel_rationale: |
      In the full QSP model, CD8+ T cell influx from the central compartment into tumor is modeled by the reaction V_C.CD8 -> V_T.CD8 with rate q_CD8_T_in * V_T * V_C.CD8 * (C_total^2/(C_total^2+Kc_rec)) * (1-H_CXCL12_Texcl). For a given tumor and immune context (fixed C_total, Kc_rec, and CXCL12-mediated exclusion), this flux can be approximated as first-order in circulating CD8+ T cells with an effective rate constant k_in = q_CD8_T_in * V_T * f_context, where f_context combines the recruitment and exclusion Hill terms. In the Yorty2007 system, adoptively transferred effector CD8+ T cells experience strong homing and minimal exclusion, so f_context is approximated as ~1. Under these assumptions, the timescale for buildup of tumor-site CD8+ T cells is governed primarily by k_in, allowing us to relate the observed time to near-maximal accumulation (t_peak) to q_CD8_T_in via k_in ~ 3/t_peak (time to ~95% of asymptotic level for a first-order approach) and k_in = q_CD8_T_in * V_ref. Choosing V_ref = 1 cm^3 yields q_CD8_T_in = 3/(t_peak * V_ref), which preserves the mechanistic dependence on tumor volume used in the full model while collapsing other modulatory factors into the experimental context.

  error_model:
  - name: q_CD8_T_in_from_tpeak
    units: day
    uses_inputs:
    - t_peak_immune_lower
    - t_peak_immune_upper
    sample_size: 1
    sample_size_rationale: |
      Yorty2007 reports a single characteristic peak time window (5-7 days) for tumor-site accumulation of Tag-specific CD8+ T cells after transfer of a high dose of immune donor cells; no explicit n is given for this summary statement, so we treat it as one aggregated measurement with broad uncertainty captured by the 5-7 day range.
    observation_code: |
      def derive_observation(inputs, sample_size):
          """
          Derive observation from peak CD8+ T cell accumulation time.

          The forward model predicts t_peak (days), so we provide the geometric
          mean of the reported 5-7 day range with uncertainty from that range.
          """
          import numpy as np

          def _val(x):
              return getattr(x, 'magnitude', x)

          t_lo = _val(inputs['t_peak_immune_lower'])  # days
          t_hi = _val(inputs['t_peak_immune_upper'])  # days

          # Point estimate: geometric mean of the time range
          t_geomean = np.sqrt(t_lo * t_hi)
          observed_value = t_geomean

          # Log-scale SD from the range (treat as ~95% CI)
          sigma_log = (np.log(t_hi) - np.log(t_lo)) / (2.0 * 1.96)

          return {
              'value': observed_value,
              'sd': sigma_log,  # dimensionless for lognormal likelihood
              'sd_uncertain': False,  # derived from reported range
              'n': sample_size,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        q_CD8_T_in is positive and expected to vary over orders of magnitude across tumor types and species. We therefore use a lognormal likelihood anchored on the median and 95% CI derived from the time-to-peak window, treating this as a relatively weak, multiplicative constraint on the parameter.

  identifiability_notes: |
    This submodel constrains only the combination q_CD8_T_in * V_T * f_context, inferred indirectly from the time required for tumor-specific CD8+ T cells to accumulate near their maximal level in the tumor. By assuming a reference tumor volume (1 cm^3) and f_context ~ 1 for strongly activated, homing-competent effector T cells in the SV11 model, we obtain an approximate distribution for q_CD8_T_in. However, q_CD8_T_in will remain only weakly identified due to: (1) uncertainty in the mapping from peak time to an effective first-order rate constant; (2) lack of explicit tumor volume measurements in the source study; and (3) biological differences between SV11 brain tumors in mice and human PDAC (including vasculature, stromal density, and chemokine fields). Additional data that simultaneously quantify circulating and tumor-infiltrating CD8+ T cell numbers over time in PDAC or closely related models, with known tumor volumes and CXCL12/ECM status, would be required for tighter identification.

source_relevance:
  indication_match: proxy
  indication_match_justification: |
    The source study (Yorty2007) investigates adoptive transfer of Tag-specific CD8+ T cells into SV11 transgenic mice bearing spontaneous choroid plexus tumors in the brain. The QSPIO-PDAC model targets human pancreatic ductal adenocarcinoma, a distinct organ and disease context. We use the SV11 data only as a mechanistic proxy for the timescale of CD8+ effector T cell trafficking from blood to a solid tumor site under conditions of strong antigen recognition and homing receptor expression. Because brain tumors and PDAC differ substantially in vasculature, stromal architecture, chemokine fields, and immune exclusion, we expect at least an order-of-magnitude translation uncertainty when mapping this trafficking timescale to PDAC.
  species_source: mouse
  species_target: human
  source_quality: primary_animal_in_vivo
  perturbation_type: pharmacological
  perturbation_relevance: |
    The SV11 system includes whole-body irradiation and high-dose adoptive transfer of primed CD8+ T cells, which enhance T cell priming, homing receptor expression, and niche availability. As a result, the observed 5-7 day time-to-peak may represent a lower bound (faster-than-physiologic) on CD8+ T cell accumulation kinetics in untreated tumors. In the QSP PDAC model, we therefore treat the resulting q_CD8_T_in estimate as an upper-bound-leaning constraint, and combine it with a broad prior to allow substantially slower effective trafficking in non-irradiated, immunosuppressed PDAC.
  tme_compatibility: low
  tme_compatibility_notes: |
    SV11 choroid plexus tumors arise in the brain and likely face blood-brain barrier and parenchymal constraints that differ markedly from the dense desmoplastic stroma, hypoxia, and CXCL12-rich exclusion zones characteristic of PDAC. Although both are solid tumors, the vascular permeability, stromal composition, and chemokine landscapes are not directly comparable. We therefore anticipate large differences in effective CD8+ T cell extravasation rates between SV11 brain tumors and human PDAC and model this as high (>=10-fold) translation uncertainty.
  estimated_translation_uncertainty_fold: 30.0
