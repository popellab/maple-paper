    formula: n_CD8_clones = total_TR_clonotypes_Meng2023 / n_PDAC_tumors_Meng2023
    code: |
      def compute(params, inputs, ureg):
          """Forward model: given n_CD8_clones, predict total clonotypes."""
          n_clones = params['n_CD8_clones']
          n_tumors_input = inputs['n_PDAC_tumors_Meng2023']
