study_interpretation: |
  Meng et al. 2023 provide a PDAC-specific quantification of tumor-reactive CD8 T cell receptor clonotypes by combining single-cell transcriptomics with functional validation of TCRs against autologous tumor cells. They report 93 tumor-reactive TCR clonotypes across 3 genetically unstable and 6 genetically stable human PDAC tumors, indicating that individual tumors harbor multiple distinct tumor-reactive CD8 T cell clones. Treating these functionally validated clonotypes as independent tumor-specific CD8 T cell clones, the data imply an average on the order of 10 tumor-reactive CD8 T cell clones per PDAC tumor. In the QSPIO-PDAC model, this informs the parameter n_CD8_clones, which scales both the production of recognizable tumor antigen P1 and the rate of antigen-specific CD8 and Th activation in the tumor-draining lymph node.

key_assumptions:
- |
  Each functionally validated tumor-reactive TCR clonotype in Meng et al. 2023 corresponds to one effective tumor-specific CD8 T cell clone in the QSP model, and polyclonal responses to the same epitope are not explicitly distinguished.
- |
  The 9 PDAC tumors analyzed by Meng et al. (3 genetically unstable and 6 genetically stable) are representative of the broader PDAC population modeled in QSPIO-PDAC, despite known heterogeneity in mutational burden and immune infiltration.
- |
  Tumor-reactive CD8 T cell clones identified ex vivo from resected tumors reflect the steady-state number of functional tumor-specific clones participating in the in vivo response, ignoring potential loss or gain of clones during processing and culture.
- |
  Clonotypes that were not recovered or not functionally tested in Meng et al. 2023 contribute a relatively small fraction of effective tumor-reactive CD8 clones compared with the identified set, so that the mean number of identified tumor-reactive clonotypes per tumor provides a lower-bound but still informative estimate for n_CD8_clones.
- |
  The mapping between tumor-reactive CD8 clonotypes and the model antigen P1 is many-to-one: we treat n_CD8_clones as the number of distinct effective clones recognizing one or more immunodominant tumor antigens aggregated into P1, without resolving individual epitope specificities.

key_study_limitations:
- |
  Meng et al. 2023 profiled only 9 PDAC tumors, and the number of tumor-reactive clonotypes per tumor is not reported explicitly; instead, the total of 93 tumor-reactive clonotypes across all tumors is used to derive an average, which may underestimate inter-patient variability.
- |
  Detection of tumor-reactive clonotypes depends on T cell viability, capture efficiency during single-cell sequencing, and the panel of functional assays used; low-frequency or weakly reactive clones are likely undercounted, so the inferred n_CD8_clones should be interpreted as a lower bound.
- |
  The dataset distinguishes genetically unstable from genetically stable PDAC tumors, with higher frequencies of tumor-reactive clones in unstable tumors; this submodel uses a single average value and does not capture genotype-dependent variation in n_CD8_clones.
- |
  The experimental definition of tumor reactivity (TCR-mediated recognition of autologous tumor cells in vitro) may not perfectly match in vivo efficacy, as it does not account for factors such as T cell exhaustion, metabolic constraints, or spatial exclusion by stroma.

