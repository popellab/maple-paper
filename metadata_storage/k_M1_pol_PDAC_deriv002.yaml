calibration:
  parameters:
  - name: k_M1_pol
    units: 1/day
    prior:
      distribution: lognormal
      mu: -0.6931471805599453
      sigma: 1.61
      lower:
      upper:
      rationale: |
        k_M1_pol is a positive first-order polarization rate. Mouse in vitro data suggest a characteristic M2-to-M1 repolarization time on the order of 1–2 days, corresponding to k in the 0.3–0.7 1/day range. A lognormal prior with median ~0.5 1/day (mu=ln(0.5)) and sigma of 1.61 (ln(5)) reflects the 5-fold estimated translation uncertainty for cross-species/context translation from mouse in vitro to human PDAC.

  forward_model:
    independent_variable:
    state_variables:
    type: algebraic
    formula: k_M1_pol = ln(2) / t_half_M2_to_M1
    code: |
      def compute(params, inputs):
          """Forward model: given k_M1_pol, predict repolarization half-time in hours."""
          import numpy as np
          k = params['k_M1_pol']  # 1/day
          t_half_days = np.log(2) / k
          t_half_h = t_half_days * 24.0
          return t_half_h
    code_julia: |
      function compute(params, inputs)
          k = params["k_M1_pol"]
          t_half_days = log(2) / k
          return t_half_days  # days
      end
    data_rationale: |
      Hörhold et al. measured the time course of M2-like murine macrophages reprogrammed toward an M1-like phenotype after siRNA knockdown of key transcription factors. They report that by 24 h the cytokine profile has already shifted to an M1-like pattern, with maximal changes in M1/M2 marker gene expression at 24–48 h. This provides an approximate characteristic time scale for M2-to-M1 repolarization, but not a full cell-count time course, so using an effective half-time is appropriate.
    submodel_rationale: |
      In the full QSPIO-PDAC model, M2-to-M1 polarization in the tumor compartment is modeled as a first-order transition: d(Mac_M2)/dt = -k_M1_pol * Mac_M2 * H(IL12, IFNg), d(Mac_M1)/dt = +k_M1_pol * Mac_M2 * H(IL12, IFNg), where H(IL12, IFNg) is a Hill-type function that approaches 1 when IL-12 and/or IFNg are high. Under saturating IL-12/IFNg, this reduces to a simple first-order process with effective half-time t_half = ln(2)/k_M1_pol. The direct_conversion submodel explicitly encodes this relationship, allowing us to infer k_M1_pol from an estimated half-time of M2-to-M1 repolarization under strong pro-inflammatory drive.

  error_model:
  - name: k_M1_pol_from_M2_repolarization_horhold2020
    units: day
    uses_inputs:
    - m2_to_m1_repol_time_low
    - m2_to_m1_repol_time_high
    sample_size: 2
    sample_size_rationale: |
      Hörhold et al. report biological duplicate experiments for gene expression and cytokine secretion (two biological replicates with technical replicates). We treat n=2 biological replicates as the effective sample size for the repolarization time scale.
    observation_code: |
      def derive_observation(inputs, sample_size):
          """
          Derive observation from repolarization timescale range.

          The forward model predicts half-time in days, so we return
          the geometric mean of the range with log-scale SD from the range.
          """
          import numpy as np
          # Convert to days manually
          low_d = inputs['m2_to_m1_repol_time_low']
          high_d = inputs['m2_to_m1_repol_time_high']

          # Geometric mean as point estimate
          t_half_days = np.sqrt(low_d * high_d)
          observed_value = t_half_days

          # Log-scale SD from the range (treat as ~95% CI)
          sigma_log = (np.log(high_d) - np.log(low_d)) / (2.0 * 1.96)

          return {
              'value': observed_value,
              'sd': sigma_log,  # dimensionless for lognormal likelihood
              'sd_uncertain': False,  # SD derived from reported range
              'n': sample_size,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        k_M1_pol is positive and expected to vary approximately log-normally across experiments and biological contexts. The derived distribution over k_M1_pol from the reported 24–48 h repolarization window is used to parameterize a lognormal observation model for Bayesian calibration.

  identifiability_notes: |
    This target provides a single effective constraint on the magnitude of k_M1_pol under strong pro-inflammatory drive (saturating IL-12/IFNg conditions, where the Hill term in the full model is near 1). Because the data are indirect (based on transcriptional and cytokine reprogramming rather than direct counts of M1 vs M2 macrophages) and come from murine peritoneal macrophages in vitro, the resulting posterior for k_M1_pol should remain relatively broad and may be correlated with the IL12_50 and IFNg_50 parameters that modulate the effective polarization rate in vivo. Additional in vivo tumor-associated macrophage data (e.g., time-resolved changes in M1/M2 markers after cytokine or checkpoint therapy) would be needed to more tightly identify k_M1_pol and disentangle it from context-dependent cytokine levels and other macrophage fluxes (recruitment, death, M1-to-M2 polarization).

source_relevance:
  indication_match: proxy
  indication_match_justification: |
    The target QSP model describes human pancreatic ductal adenocarcinoma (PDAC) tumor-associated macrophages, whereas Hörhold et al. study murine peritoneal exudate macrophages polarized and reprogrammed in vitro without a tumor present. We use these data purely to constrain the intrinsic time scale of M2-to-M1 phenotypic switching under strong pro-inflammatory drive, which is largely governed by cell-intrinsic signaling and gene-regulatory processes that are expected to be similar across tissues and indications. However, differences in species (mouse vs human), macrophage ontogeny, and the absence of a desmoplastic PDAC tumor microenvironment introduce substantial uncertainty in mapping this rate directly to human PDAC TAMs.
  species_source: mouse
  species_target: human
  source_quality: primary_animal_in_vitro
  perturbation_type: genetic_perturbation
  perturbation_relevance: |
    Repolarization was induced by siRNA-mediated knockdown of four transcription factors (E2f1, Myc, Pparg, Stat6) in IL-4-polarized M2-like macrophages, rather than by IL-12/IFNg stimulation. We assume that the time required for coordinated transcriptional and cytokine reprogramming under this strong synthetic perturbation is comparable to or slightly faster than physiologic M2-to-M1 repolarization driven by high IL-12/IFNg in tumors. Thus, the inferred k_M1_pol should be interpreted as an approximate upper bound on the intrinsic polarization rate under maximally pro-inflammatory conditions and may overestimate rates in human PDAC TAMs.
  tme_compatibility: moderate
  tme_compatibility_notes: |
    Experiments were performed in 2D culture of murine peritoneal macrophages without stromal barriers, hypoxia, or chronic suppressive cytokines characteristic of PDAC. These conditions likely allow somewhat faster polarization than in the dense, immunosuppressive PDAC tumor microenvironment, but the measured time scale mainly reflects intracellular signaling and gene-regulatory processes that should not differ by orders of magnitude across TMEs.
  estimated_translation_uncertainty_fold: 5.0
  validation_warnings:
