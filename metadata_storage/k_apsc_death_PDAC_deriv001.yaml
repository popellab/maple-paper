study_interpretation: |
  The Estaras et al. study quantifies how pharmacologic melatonin and the ER-stress inducer thapsigargin reduce the viability of activated rat PSCs under 1% O2 hypoxia. The reported 86.77% (+/-1.15%) viability after 48 h with 1 mM melatonin, relative to 100% in hypoxia alone, constrains the timescale of PSC loss under strong pro-apoptotic, hypoxic conditions. Approximating this decline as first-order death of activated PSCs yields an effective death rate of ~0.071 1/day, which is used to center the prior for k_apsc_death in the QSPIO-PDAC model, with wide uncertainty to account for species differences and for the pharmacologic nature of the stimulus.

key_assumptions:
- |
  Activated rat PSCs under 1% O2 hypoxia with 1 mM melatonin experience net loss of viable cells that can be approximated by a single first-order death process over the first 48 h, with negligible contributions from continued proliferation or additional activation during this window.
- |
  Normalized crystal-violet absorbance (% of hypoxic control) is proportional to the fraction of viable PSCs, so that the 86.77% viability readout corresponds directly to aPSC_norm(t=48 h) in the decay model.
- |
  The death rate of activated rat PSCs under pharmacologic melatonin in hypoxia provides an upper-bound scale for the baseline death rate of activated PSCs (cancer-associated fibroblasts) in human PDAC tumors, justifying centering the prior for k_apsc_death near the inferred value but with broad uncertainty.
- |
  Other loss mechanisms in the full QSP model (e.g., aPSC proliferation, activation from qPSC, and cell clearance terms that depend on cancer burden) are either slow or balanced under the specific in vitro conditions and can be neglected in this isolated death submodel.
- |
  Differences between rat neonatal PSCs in 2D culture and human PDAC-associated PSCs in vivo (age, matrix stiffness, cytokine milieu) primarily affect the magnitude, not the qualitative first-order nature, of the death process.

key_study_limitations:
- |
  The PSCs are primary cells from Wistar rat pups, not human PDAC-associated PSCs; cross-species and developmental-stage differences in apoptosis sensitivity and proliferation may mean that in vivo human CAF death rates are lower than those inferred here.
- |
  Melatonin at 1 mM is a supraphysiologic, pharmacologic concentration chosen to elicit robust effects and may overestimate death rates achievable in tumors; accordingly, the inferred k_apsc_death should be treated as an upper-bound scale rather than an exact basal death rate.
- |
  The viability assay is based on crystal violet staining (absorbance at 590 nm) normalized to hypoxic controls, which measures attached cell biomass rather than direct live/dead counts and may underestimate early apoptosis if apoptotic cells remain adherent.
- |
  Only a single time point (48 h) under the selected melatonin concentration is used, so the model cannot test for deviations from pure first-order kinetics (e.g., time-varying death rates, lag phases) or explicitly separate concurrent proliferation from death.
- |
  The cultures are hypoxic (1% O2) 2D monolayers on plastic with high serum, which differ from the 3D, ECM-rich, mechanically stiff PDAC stroma; mechanical and matrix cues known to influence PSC survival are not represented.

