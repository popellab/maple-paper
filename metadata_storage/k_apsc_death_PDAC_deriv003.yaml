calibration:
  parameters:
  - name: k_apsc_death
    units: 1/day
    prior:
      distribution: lognormal
      mu: -3.26
      sigma: 1.5
      lower:
      upper:
      rationale: |
        Centered on hepatic stellate cell apoptosis rate inferred from a fivefold decrease in activated HSC over 42 days during resolution of biliary fibrosis in rats (Issa2001), with wide variance (sigma=1.5) to reflect cross-species and cross-tissue translation to activated pancreatic stellate cells in PDAC.
  forward_model:
    data_rationale: |
      Issa2001 quantified a fivefold decrease in the number of alpha-SMA positive activated hepatic stellate cells over 42 days during resolution of biliary fibrosis. This is naturally described by first-order loss of an activated stellate cell population.
    submodel_rationale: |
      In the full QSPIO-PDAC model, k_apsc_death multiplies the activated pancreatic stellate cell (aPSC) population in a first-order death term (V_T.aPSC -> null with rate k_apsc_death*V_T.aPSC). Activated hepatic stellate cells (HSCs) in liver fibrosis are myofibroblast-like and mechanistically analogous to activated PSCs in PDAC stroma, so we use their apoptosis-driven clearance as a proxy submodel with identical first-order kinetics.
    independent_variable:
      name: time
      units: day
      span:
      - 0.0
      - 42.0
      rationale:
    state_variables:
    - name: activated_stellate_cells
      units: cell
      initial_condition:
        value: 1.0
        rationale: |
          Population is normalized to 1 at the time of biliodigestive anastomosis; only the relative fivefold decline over 42 days constrains k_apsc_death.
    type: first_order_decay
    rate_constant: k_apsc_death
  error_model:
  - name: hsc_fraction_42d
    observable:
      type: identity
      state_variables:
      - activated_stellate_cells
      rationale:
      code:
    units: dimensionless
    uses_inputs:
