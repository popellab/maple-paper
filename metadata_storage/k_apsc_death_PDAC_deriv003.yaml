      rationale: |
        We treat the surviving fraction of activated stellate cells at 42 days as a positive quantity with multiplicative (fold-change) uncertainty; a lognormal likelihood with coefficient of variation given by assumed_cv_hsc_fold is appropriate.
  identifiability_notes: |
    With a normalized initial condition and a single measurement of the surviving fraction of activated stellate cells at 42 days, the first-order decay model uniquely constrains k_apsc_death under the assumption that loss is dominated by apoptosis. However, the biological interpretation is approximate: the fivefold decrease in alpha-SMA+ cells may reflect both apoptosis and loss of activation, and translation from rat hepatic stellate cells in resolving biliary fibrosis to human pancreatic stellate cells in PDAC introduces at least an order-of-magnitude uncertainty in the inferred parameter.

source_relevance:
  indication_match: proxy
  indication_match_justification: |
    The primary data come from rat hepatic stellate cells in biliary fibrosis resolving after bile duct ligation and biliodigestive anastomosis (Issa2001). Activated hepatic stellate cells are myofibroblast-like, alpha-SMA positive stromal cells that are mechanistically similar to activated pancreatic stellate cells (aPSCs) and cancer-associated fibroblasts in PDAC, particularly in their role in ECM production and their clearance via apoptosis during fibrosis resolution. However, liver fibrosis resolution is biologically distinct from the chronically activated, tumor-associated stroma in PDAC; therefore, we use these data only as a mechanistic proxy for the intrinsic apoptosis-driven turnover rate of activated stellate cells, not as a direct quantitative match.
  species_source: rat
  species_target: human
  source_quality: primary_animal_in_vivo
  perturbation_type: pathological_state
  perturbation_relevance: |
    The experiment studies activated hepatic stellate cells during resolution of biliary fibrosis after surgical reversal of bile duct ligation. This context corresponds to a pro-resolution, pro-apoptotic environment and likely provides an upper bound on the intrinsic apoptosis rate of activated stellate cells. In PDAC, survival signals and persistent injury are expected to reduce effective apoptosis rates, so the inferred k_apsc_death should be interpreted as an approximate scale for first-order death rather than a precise value.
  tme_compatibility: low
  tme_compatibility_notes: |
    The liver fibrotic microenvironment during biliary obstruction and its resolution differs substantially from the desmoplastic PDAC stroma: liver architecture, perfusion, inflammatory milieu, and mechanical context all differ, and PDAC represents a non-resolving, tumor-driven fibrotic lesion. Myofibroblasts in PDAC are expected to be more apoptosis-resistant than in resolving biliary fibrosis. Accordingly, we apply at least an order-of-magnitude uncertainty to translation of the hepatic stellate cell apoptosis rate to activated pancreatic stellate cells in PDAC.
  estimated_translation_uncertainty_fold: 10.0
