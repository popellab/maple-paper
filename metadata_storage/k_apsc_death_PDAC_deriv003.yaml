    sample_size_rationale: |
      Issa2001 reports n=15 rats subjected to bile duct ligation, of which n=13 underwent biliodigestive anastomosis and were followed during recovery. Exact numbers per time point are not stated; we approximate n=13 for the overall fold-change measurement.
    observation_code: |
      def derive_observation(inputs, sample_size):
          fold_decrease = inputs['hsc_fold_decrease_mean']
          cv = inputs['assumed_cv_hsc_fold']
          # Observed surviving fraction of activated stellate cells at 42 days
          frac_42d = 1.0 / fold_decrease
          return {
