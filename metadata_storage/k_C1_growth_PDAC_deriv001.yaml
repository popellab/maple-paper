study_interpretation: |
  Serial CT imaging of untreated human PDAC provides direct measurements of primary tumor volume doubling times, capturing the net expansion of the tumor mass in vivo under natural disease progression. Interpreting these VDTs as arising from exponential tumor cell growth in the regime where carrying capacity limitations are not yet dominant allows analytic conversion to the per capita cancer cell growth rate k_C1_growth used in the QSPIO-PDAC model.

key_assumptions:
- |
  Tumor volume change measured on CT is proportional to the total number of viable cancer cells C1, i.e., changes in stromal and necrotic components do not dominate volume dynamics over the time window used to estimate VDT.
- |
  The exponential growth model used by Ahn et al. to compute VDT between two CT scans is appropriate for the size range studied, such that VDT meaningfully reflects an effective per capita growth rate.
- |
  Early- and mid-stage human PDAC lesions included in the study are in a regime where the logistic saturation factor (1 - C_total/C_max) in the full model is not yet strongly limiting, so that dC1/dt ~ k_C1_growth * C1 applies.
- |
  Host- and microenvironment-specific influences (e.g., desmoplasia, hypoxia) are effectively embedded in the clinically observed net growth rate and can be mapped onto k_C1_growth without explicit correction.
- |
  Inter-patient heterogeneity in VDT is represented statistically via a lognormal distribution, which is adequate for constructing a prior and likelihood for k_C1_growth.

key_study_limitations:
- |
  CT-derived tumor volumes include cancer cells, stroma, and necrosis; thus VDT reflects net mass expansion rather than pure cancer cell number dynamics, potentially biasing k_C1_growth relative to a cell-centric definition.
- |
  Only two or a few CT time points per patient are available, so individual VDT estimates may be noisy, and the published mean +/- SD aggregate the effects of measurement error and biological variability.
- |
  VDTs are reported for a heterogeneous cohort spanning a wide range of initial tumor sizes; growth kinetics may differ systematically between small and large tumors, whereas the submodel assumes a single effective growth rate.
- |
  The clinical cohort reflects untreated disease but not necessarily early micrometastatic stages; k_C1_growth inferred here may overestimate the proliferation rate of very small occult tumors.
- |
  This calibration target constrains net tumor growth and cannot by itself disentangle intrinsic proliferation from cell loss or immune-mediated killing, which must be informed by additional experimental or clinical data.

