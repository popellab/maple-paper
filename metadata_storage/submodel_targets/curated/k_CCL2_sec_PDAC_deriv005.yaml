calibration:
  parameters:
  - name: k_CCL2_sec
    units: nanomole / cell / day
    prior:
      distribution: lognormal
      mu: -20.0
      sigma: 1.0
      lower:
      upper:
      rationale: |
        Centered on a back-calculated per-cell CCL2 secretion rate needed to sustain the observed median plasma MCP-1 level (~0.06 nmol/L, equivalent to ~522 pg/mL) in advanced pancreatic cancer patients, assuming a typical tumor cell burden (~1e9 cells), blood volume of 5 L, and CCL2 half-life of 0.1 day, with a broad 10-fold uncertainty.
  - name: k_CCL2_deg
    units: 1 / day
    prior:
      distribution: lognormal
      mu: 1.94
      sigma: 0.3
      lower:
      upper:
      rationale: |
        Anchored to independent data on CCL2 plasma half-life (~0.1 day), corresponding to a first-order degradation rate k_CCL2_deg ≈ ln(2)/0.1 ≈ 6.9 day^-1, with a moderately tight prior (roughly 2-fold credible range) to reflect residual uncertainty and possible disease-related variation.
  forward_model:
    data_rationale: |
      Nixon et al. (CALGB 80303) report baseline plasma MCP-1 (CCL2) concentrations in 328 patients with advanced pancreatic adenocarcinoma receiving gemcitabine ± bevacizumab. The analyte table provides the median MCP-1 level (521.8 pg/mL) prior to systemic therapy. After conversion to nanomole per liter using the molecular weight of CCL2, this value can be interpreted as an approximate steady-state concentration reflecting the balance of tumor-driven CCL2 secretion and systemic clearance in this disease setting.
    submodel_rationale: |
      In the full QSPIO-PDAC model, CCL2 in the tumor compartment (V_T.CCL2) is generated by tumor cells via the reaction null -> V_T.CCL2 at rate k_CCL2_sec * C_total and removed via first-order degradation V_T.CCL2 -> null at rate k_CCL2_deg * V_T.CCL2. The submodel idealizes this by treating the systemic plasma compartment as the effective distribution volume for tumor-derived CCL2 and assuming quasi-steady-state, so that the observable plasma concentration (expressed in nanomole per liter) equals secretion_rate * tumor_cell_count / (clearance_rate * distribution_volume). This algebraic steady-state relationship preserves the same mechanistic dependence of CCL2 levels on k_CCL2_sec, tumor cell number, and k_CCL2_deg as in the full model, while collapsing spatial compartments into a single well-mixed space for calibration.
    independent_variable:
    state_variables:
    unit_conversion_factor: '1.0'
    type: steady_state_concentration
    secretion_rate: k_CCL2_sec
    source_count:
      reference_ref: pdac_total_tumor_cells
    clearance_rate: k_CCL2_deg
    distribution_volume:
      reference_ref: blood_volume
  error_model:
  - name: plasma_mcp1_advanced_pdac_median
    observable:
    units: nanomole / liter
    uses_inputs:
    - mcp1_plasma_median_advanced_pdac
    - mcp1_plasma_assumed_cv
    - mcp1_pgml_to_nmolL_factor
    evaluation_points:
    sample_size: 328
    sample_size_rationale: |
      Number of advanced pancreatic cancer patients with baseline EDTA plasma biomarker measurements in the CALGB 80303 correlative study (N=328).
    observation_code: |
      def derive_observation(inputs, sample_size):
          median_pgml = inputs['mcp1_plasma_median_advanced_pdac']
          factor = inputs['mcp1_pgml_to_nmolL_factor']
          cv_assumed = inputs['mcp1_plasma_assumed_cv']
          median_nmolL = median_pgml * factor
          # Use the converted median (nmol/L) as the central tendency; assume a 50% coefficient of variation
          # as a conservative estimate of inter-patient variability in plasma MCP-1.
          return {
              'value': median_nmolL,
              'sd': cv_assumed,
              'sd_uncertain': True,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        Plasma cytokine concentrations are strictly positive and typically right-skewed across patients; a lognormal likelihood with an assumed coefficient of variation captures this behavior when only median and range (but not SD/SEM) are reported. The observable is expressed in nanomole per liter to match the units implied by k_CCL2_sec.
  identifiability_notes: |
    With a single steady-state concentration measurement (converted to nanomole per liter), this target constrains primarily the ratio k_CCL2_sec * (pdac_total_tumor_cells) / (k_CCL2_deg * blood_volume). On its own, the dataset cannot uniquely identify both k_CCL2_sec and k_CCL2_deg. An informative prior on k_CCL2_deg derived from independent CCL2 half-life data anchors the clearance, making k_CCL2_sec the main parameter updated by this calibration. Uncertainty in tumor cell burden, distribution volume, and unit conversion is represented via reference values and the assumed CV; large systematic errors in these quantities will rescale the inferred k_CCL2_sec approximately linearly.

source_relevance:
  indication_match: exact
  indication_match_justification: |
    The study cohort consists of human patients with advanced pancreatic adenocarcinoma enrolled in a phase III trial (CALGB 80303). This directly matches the PDAC indication of the QSPIO-PDAC model, although disease stage is predominantly locally advanced or metastatic rather than resectable. As the model is intended to capture PDAC tumor–immune–stroma interactions across disease stages, these baseline plasma CCL2 levels in untreated advanced PDAC are considered indication-matched data.
