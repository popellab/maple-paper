study_interpretation: |
  Nixon et al. (Clin Cancer Res 2013; CALGB 80303) measured baseline plasma MCP-1 (CCL2) concentrations in 328 patients with advanced pancreatic adenocarcinoma using a standardized multiplex platform. Table 1 reports a median MCP-1 level of 521.8 pg/mL before systemic therapy. Using the known molecular weight of mature human CCL2, this value is converted to approximately 0.06 nmol/L, providing a steady-state concentration of CCL2 in the plasma compartment. Interpreting this as arising from continuous tumor-driven CCL2 secretion balanced by first-order systemic clearance allows the data to constrain the net production-to-clearance ratio for CCL2 in advanced PDAC. By combining this clinical observable with reference estimates for total PDAC tumor cell burden and blood volume, and by applying an informative prior on the CCL2 degradation rate derived from independent half-life measurements, the submodel maps the observed plasma MCP-1 level into an inferred per-cell secretion rate k_CCL2_sec that is mechanistically consistent with its role in the full QSPIO-PDAC tumor CCL2 generation reaction.

key_assumptions:
- |
  Baseline plasma MCP-1 in CALGB 80303 patients reflects an approximate steady-state between tumor (and tumor-associated stromal) CCL2 secretion and systemic clearance on the timescale of days, i.e., production and loss are roughly balanced at study entry.
- |
  Tumor tissue (primary and metastatic PDAC lesions) is the dominant net source of circulating MCP-1 in this cohort, so that other inflammatory sites contribute relatively modestly to the average plasma level and can be subsumed into an effective tumor-derived secretion rate.
- |
  The reference value pdac_total_tumor_cells (~1e9 cells for a 10 mL resectable PDAC tumor) provides a reasonable order-of-magnitude anchor for total viable tumor cell burden in advanced PDAC; deviations among individuals are absorbed into the assumed coefficient of variation and the lognormal likelihood.
- |
  The effective CCL2 distribution volume relevant for the measured plasma concentrations can be approximated by the central blood volume (reference blood_volume ~5 L), neglecting additional distribution into peripheral interstitial spaces or lymph, which would otherwise dilute concentrations.
- |
  CCL2 clearance kinetics in these patients can be adequately described by first-order degradation with a rate constant consistent with a plasma half-life of approximately 0.1 day; disease-related changes in clearance are captured by the prior uncertainty on k_CCL2_deg.
- |
  Because only the median and range of plasma MCP-1 are reported, a 50% coefficient of variation is assumed as a conservative estimate of inter-patient variability in CCL2 levels; this assumption is explicitly modeled via an auxiliary input and marked as uncertain in the likelihood specification.
- |
  Conversion from pg/mL to nmol/L using a fixed molecular weight for mature CCL2 is accurate enough for QSP calibration purposes; isoform heterogeneity and post-translational modifications are neglected.

key_study_limitations:
- |
  The CALGB 80303 cohort comprises patients with advanced (locally advanced/metastatic) PDAC, whereas the reference tumor cell count used in the model is based on resectable tumors; the relationship between cell burden and plasma CCL2 may differ between these settings.
- |
  Plasma MCP-1 integrates production from both primary and metastatic lesions as well as potentially from non-tumor tissues (e.g., adipose tissue, liver, systemic inflammation); the submodel attributes most of this to tumor, which may overestimate per-cell secretion if extra-tumoral sources are substantial.
- |
  Only a single baseline plasma measurement per patient is available, precluding direct assessment of temporal dynamics or confirmation of steady-state; transient fluctuations due to acute inflammation or sampling time relative to treatment are not captured.
- |
  The analyte table reports median, minimum, and maximum but not standard deviation or interquartile range for MCP-1; as a result, variability must be assumed rather than directly measured, introducing additional uncertainty handled via an assumed CV and sd_uncertain flag.
- |
  Patients were enrolled in a systemic therapy trial and may have heterogeneous performance status, comorbidities, and tumor burdens, all of which can influence inflammatory cytokine levels and clearance and are not explicitly modeled in this calibration target.
- |
  The conversion factor from pg/mL to nmol/L assumes a single molecular weight for mature CCL2 and does not account for potential assay cross-reactivity with related chemokines or modified forms of CCL2, which could slightly bias the effective concentration scale.

