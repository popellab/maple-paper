    Orthotopic Panc02 tumors reproduce many PDAC microenvironment features (desmoplasia, strong myeloid infiltration) but are still faster-growing, less heterogeneous, and less fibrotic than human PDAC or KPC GEMMs. MDSC recruitment levels and cell turnover may therefore differ by several-fold from human PDAC.
