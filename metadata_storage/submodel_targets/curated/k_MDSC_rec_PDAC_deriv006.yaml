  indication_match_justification: |
    The study uses an orthotopic syngeneic Panc02 pancreatic ductal adenocarcinoma model in immunocompetent C57Bl/6 mice, which recapitulates key features of human PDAC, including desmoplastic stroma and myeloid-rich immunosuppressive infiltrates. Thus the indication (PDAC) matches the QSPIO-PDAC model; remaining uncertainties arise from species (mouse vs human) and specific model differences rather than disease type.
