calibration:
  parameters:
  - name: k_MDSC_rec
    units: cell / (milliliter * day)
    prior:
      distribution: lognormal
      mu: 16.8
      sigma: 2.0
      lower:
      upper:
      rationale: |
        Wide lognormal prior (approximately 4–5 orders of magnitude) centered near the value implied by a ~0.17 MDSC fraction in established PDAC tumors assuming k_MDSC_death ~0.5/day and pdac_cd45_density_volumetric ~2.5e8 cell/mL.
  - name: k_MDSC_death
    units: 1 / day
    prior:
      distribution: lognormal
      mu: -0.693
      sigma: 0.7
      lower:
      upper:
      rationale: |
        Mouse tumor-infiltrating myeloid cells (including MDSC-like populations) typically have lifespans on the order of 1–3 days in vivo. Prior centered at 0.5/day (half-life ~1.4 days) with ~2-fold uncertainty.
  forward_model:
    data_rationale: |
      Chopra et al. (2013) report CD11b+GR-1+ (MDSC-like) cell densities per mm2 in orthotopic Panc02 pancreatic tumors one month after implantation. These tumors are large and established, so MDSC influx and loss can be approximated as quasi–steady state. Densities were converted to an approximate fraction of CD45+ leukocytes using a reference PDAC CD45+ density, providing a steady-state MDSC fraction target.
    submodel_rationale: |
      In the full QSPIO-PDAC model, intratumoral MDSC dynamics follow d(MDSC)/dt = k_MDSC_rec * V_T * f(CCL2,IL6) - k_MDSC_death * MDSC. For established tumors with roughly constant chemokine drive f(CCL2,IL6) and tumor volume V_T, the steady-state MDSC volumetric density is proportional to k_MDSC_rec / k_MDSC_death. The fraction of MDSC among total CD45+ leukocytes then satisfies fraction_MDSC ≈ k_MDSC_rec / (k_MDSC_death * parent_density). This is exactly the steady_state_fraction form with target_rate = k_MDSC_rec, loss_rate = k_MDSC_death, and parent_density given by PDAC CD45+ cell density.
    independent_variable:
    state_variables:
    unit_conversion_factor: '1.0'
    type: steady_state_fraction
    target_rate: k_MDSC_rec
    loss_rate: k_MDSC_death
    parent_density:
      reference_ref: pdac_cd45_density_volumetric
    drive_factor: '1.0'
  error_model:
  - name: mdsc_fraction_panc02_pancreas
    observable:
    units: dimensionless
    uses_inputs:
    - mdsc_fraction_panc02_pancreas_mean
    - mdsc_fraction_panc02_pancreas_sem
    evaluation_points:
    sample_size: 4
    sample_size_rationale: |
      Table 2 legend reports B6.WT n = 4 for immune cell density quantification in orthotopic Panc02 tumors at one month.
    observation_code: |
      def derive_observation(inputs, sample_size):
          import numpy as np
          mean = inputs['mdsc_fraction_panc02_pancreas_mean']
          sem = inputs['mdsc_fraction_panc02_pancreas_sem']
          n = int(sample_size)
          # Convert SEM to SD
          sd = sem * np.sqrt(n)
          # For lognormal likelihood, use coefficient of variation as SD parameter
          cv = sd / mean
          return {
              'value': mean,
              'sd': cv,
              'sd_uncertain': True,
              'n': n,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        Fractions are positive and typically right-skewed across animals; a lognormal likelihood with CV derived from SEM captures this.
  identifiability_notes: |
    This target primarily constrains the combination k_MDSC_rec / (k_MDSC_death * parent_density). With only a single steady-state fraction measurement from one tumor age (approximately day 30), k_MDSC_rec and k_MDSC_death are strongly correlated and not separately identifiable from this dataset alone. The prior on k_MDSC_death incorporates external knowledge of myeloid cell lifespans but residual non-identifiability remains; full identifiability of k_MDSC_rec will rely on additional submodels (e.g., systemic MDSC kinetics, depletion and recovery experiments, or independent constraints on k_MDSC_death). The conversion from density (cells/mm2) to fraction uses a reference PDAC CD45+ density, introducing additional systematic uncertainty, which is reflected in the wide prior on k_MDSC_rec and the elevated CV in the likelihood.

