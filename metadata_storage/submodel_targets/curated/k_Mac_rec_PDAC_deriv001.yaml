calibration:
  parameters:
  - name: k_Mac_rec
    units: cell/(milliliter*day)
    prior:
      distribution: lognormal
      mu: 13.89
      sigma: 1.5
      lower:
      upper:
      rationale: |
        Centered at the value implied by steady-state balance between M1 macrophage recruitment and death using Gu2023 CD86+ density (~59 cells/mm^2) and geometric-mean tissue macrophage half-life (~7.7 days). Sigma=1.5 accommodates uncertainty in HPF area, macrophage death rate, and the fraction of M1 vs total macrophages.
  - name: k_Mac_death
    units: 1/day
    prior:
      distribution: lognormal
      mu: -2.42
      sigma: 0.5
      lower:
      upper:
      rationale: |
        Macrophage death rate derived from generic tissue macrophage lifespan of 4-15 days (PhagocyteWiki). Geometric mean half-life sqrt(4*15) = 7.75 days gives k_death = ln(2)/7.75 = 0.089/day. Sigma=0.5 spans the reported range and accommodates uncertainty in TAM-specific turnover vs generic tissue macrophage estimates.
  forward_model:
    data_rationale: |
      Gu 2023 reports the mean number of CD86+ M1 macrophages per 400x high-power field in primary human PDAC tumors, which provides an estimate of steady-state M1 macrophage areal density (cells/mm^2) in the tumor microenvironment via division by the HPF area.
    submodel_rationale: |
      In the full QSP model, macrophage recruitment into the tumor is represented by k_Mac_rec * V_T * (CCL2/(CCL2 + CCL2_50)), and tumor macrophages are lost via first-order death with rate k_Mac_death. For established PDAC lesions with high CCL2 expression, CCL2 >> CCL2_50 so the chemokine term is approximated as 1. Because k_Mac_rec has units cell/(mL*day) and already encodes the cell production rate per unit tumor volume, the source_pool is set to "1.0" to avoid double-counting. At steady state, areal density = k_Mac_rec / k_Mac_death * section_volume_factor.
    independent_variable:
    state_variables:
    type: steady_state_density
    target_rate: k_Mac_rec
    unit_conversion_factor: "1.0"
    source_pool: "1.0"
    loss_rate: k_Mac_death
    section_volume_factor:
      reference_ref: ihc_section_volume_4um
    recruitment_efficiency: "1.0"
    exclusion_fraction: "0.0"
  error_model:
  - name: m1_density_primary_pdac_gu2023
    observable:
    units: cell / millimeter**2
    uses_inputs:
    - M1_per_HPF_primary_PDAC
    - M1_per_HPF_range_low
    - M1_per_HPF_range_high
    - HPF_area_400x_microscope
    sample_size: 42
    sample_size_rationale: |
      Number of primary PDAC tumors in which CD86+ M1 macrophages were quantified (Gu 2023, Table 2).
    observation_code: |
      def derive_observation(inputs, sample_size):
          """
          Derive observation from PDAC M1 macrophage density.

          The forward model predicts M1 macrophage areal density (cells/mm^2),
          so we convert counts per HPF to density and derive log-scale SD from
          the reported range of M1 counts across patients.
          """
          import numpy as np

          M1_mean = inputs['M1_per_HPF_primary_PDAC']  # cells/HPF
          M1_low = inputs['M1_per_HPF_range_low']      # cells/HPF
          M1_high = inputs['M1_per_HPF_range_high']     # cells/HPF
          hpf_area = inputs['HPF_area_400x_microscope']  # mm^2

          # Convert to areal density
          density_mean = M1_mean / hpf_area   # cells/mm^2
          density_low = M1_low / hpf_area
          density_high = M1_high / hpf_area

          observed_value = density_mean

          # Log-scale SD from reported range (treat as approximate 95% CI)
          sigma_log = (np.log(density_high) - np.log(density_low)) / (2.0 * 1.96)

          return {
              'value': observed_value,
              'sd': sigma_log,
              'sd_uncertain': True,
              'n': sample_size,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        Patient-to-patient M1 macrophage densities are positive and span more than an order of magnitude (range 2-31.2 cells/HPF). A lognormal likelihood captures this multiplicative inter-patient heterogeneity.

  identifiability_notes: |
    Two sampled parameters (k_Mac_rec, k_Mac_death) from one observation. The data constrain the ratio k_Mac_rec / k_Mac_death via the steady-state density. The prior on k_Mac_death (centered at ~0.089/day from 4-15 day half-life range) provides scale separation. Note that CD86+ IHC captures M1-polarized macrophages specifically, while the QSP model's k_Mac_rec drives total M1 recruitment; the inferred k_Mac_rec is therefore specific to the M1 compartment.