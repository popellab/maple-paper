study_interpretation: |
  Chen et al. provide quantitative immunohistochemical counts of CD68+ tumor-associated macrophages in central and peritumoral regions of human PDAC, showing substantially higher macrophage infiltration in PDAC than in chronic pancreatitis and enrichment at the tumor periphery. By combining the reported median peripheral CD68+ counts per 400x high-power field, the section thickness, and a standard HPF area, we estimate a typical TAM density on the order of 1e8 cells per mL of peritumoral PDAC tissue. Assuming that macrophage numbers are in quasi-steady state over weeks and that CCL2-driven recruitment is near saturation in PDAC, this steady-state density constrains the ratio of macrophage recruitment to effective loss rate. Fixing an effective TAM residence time based on macrophage self-renewal literature then allows us to infer a plausible magnitude for k_Mac_rec consistent with the full QSP model reaction null -> V_T.Mac_M1.

key_assumptions:
- |
  PDAC tumors in this surgical cohort are in quasi-steady state with respect to TAM numbers over the timescale of interest (weeks), so that recruitment approximately balances effective loss (death, egress, and net polarization out of the counted pool).
- |
  CD68 immunostaining captures the majority of tumor-associated macrophages (both M1- and M2-like) relevant to the QSPIO-PDAC Mac_M1/Mac_M2 compartments, and non-macrophage CD68+ cells are negligible.
- |
  The standard 400x high-power field area for an FN22 microscope (approximately 0.237 mm^2) is a reasonable approximation for the Olympus CX-40 system used in the study, enabling conversion from counts per HPF to volumetric density.
- |
  The 3 μm section thickness reported by Chen et al. can be used directly to estimate the imaged tissue volume for each HPF, with minimal bias from partial-volume effects.
- |
  An effective TAM residence time of roughly 30 days is a reasonable order-of-magnitude for tumor-associated macrophages in PDAC, given that tissue-resident macrophages are long-lived and TAM populations can be maintained by self-renewal; this timescale is encoded as an assumed_value and may differ between patients.
- |
  CCL2 levels in established human PDAC are sufficiently high that the CCL2/(CCL2 + CCL2_50) recruitment Hill term is near 1 at baseline, so the dependence of recruitment on CCL2 can be collapsed into a constant H_CCL2_PD ≈ 1 for this calibration step.
- |
  Local proliferation of TAMs and contributions from embryonically derived tissue-resident macrophages are effectively absorbed into the assumed residence time and do not require an explicit proliferation term in the submodel.

key_study_limitations:
- |
  The study reports macrophage counts as medians and ranges per high-power field rather than full distributions or per-volume densities; the conversion to volumetric density and the derivation of a coefficient of variation from the range introduce additional uncertainty.
- |
  The high-power field area of the Olympus CX-40 at 400x magnification is not explicitly reported and is approximated using a standard FN22 HPF area from microscopy application notes, which may differ modestly from the actual setup.
- |
  Only CD68 (pan-macrophage) and CD163 (M2 marker) are quantified; the data do not directly separate M1 vs M2 subsets, whereas the QSP model distinguishes Mac_M1 and Mac_M2. The submodel therefore calibrates total TAM recruitment rather than strictly M1 recruitment.
- |
  No temporal measurements of TAM dynamics (e.g., before and after CCR2/CSF1R blockade) are available in this cohort, so macrophage residence time is not directly constrained and must be assumed from external literature on macrophage self-renewal and lifespan.
- |
  Counts are based on three randomly selected hot-spot HPFs per region per tumor, which may over-represent areas of high infiltration relative to the whole tumor and bias density estimates upward.
- |
  Patients had resectable PDAC and variable prior clinical histories; although no specific TAM-targeting therapies were given, systemic inflammation or co-morbidities could influence macrophage infiltration compared with de novo tumors represented in the QSP model.

