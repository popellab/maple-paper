calibration:
  parameters:
  - name: k_Mac_rec
    units: cell/(milliliter*day)
    prior:
      distribution: lognormal
      mu: 14.66
      sigma: 1.5
      lower:
      upper:
      rationale: |
        Centered so that, for a representative TAM areal density of ~300 cells/mm^2 in peritumoral PDAC tissue and a sampled macrophage death rate (~0.023/day, half-life ~30 days), the implied recruitment rate k_Mac_rec ~ 2e6 cell/(mL*day). Wider sigma=1.5 accommodates uncertainty from sampled k_Mac_death and cross-tissue translation.
  - name: k_Mac_death
    units: 1/day
    prior:
      distribution: lognormal
      mu: -3.91
      sigma: 1.0
      lower:
      upper:
      rationale: |
        Macrophage death rate in the tumor compartment. exp(-3.91) ~ 0.02/day matches the model default (half-life ~35 days). Range spans ~10 to ~100 day half-lives with sigma=1.0. Tissue-resident macrophages are long-lived and self-renewing (Filiberti2022). Note that k_Mac_death applies equally to M1 and M2 in the full model (Reaction_209, Reaction_210).
  forward_model:
    data_rationale: |
      Chen et al. quantified CD68+ tumor-associated macrophages per high-power field in peritumoral regions of resected human PDAC using 3-um paraffin sections. This provides a cross-sectional estimate of steady-state TAM areal density (cells/mm^2) rather than volumetric density or time-course data. The steady-state density model converts between the model's volumetric recruitment rate and the observed areal density via the section volume factor.
    submodel_rationale: |
      In the full QSPIO-PDAC model, k_Mac_rec appears in the recruitment reaction null -> V_T.Mac_M1 with rate k_Mac_rec * V_T * (CCL2 / (CCL2 + CCL2_50)). Because k_Mac_rec has units cell/(mL*day) and already encodes the cell production rate per unit tumor volume, the source_pool is set to "1.0" to avoid double-counting. At steady state, areal density = k_Mac_rec / k_Mac_death * section_volume_factor. CCL2 is chronically elevated in PDAC (Sanford2013), so the Hill term is near 1 and absorbed into k_Mac_rec. Note: CD68+ staining captures total macrophages (M1+M2), while the QSP model's k_Mac_rec drives M1 recruitment specifically. The inferred k_Mac_rec therefore represents an upper bound on M1-specific recruitment.
    independent_variable:
    state_variables:
    type: steady_state_density
    target_rate: k_Mac_rec
    unit_conversion_factor: "1.0"
    source_pool: "1.0"
    loss_rate: k_Mac_death
    section_volume_factor:
      reference_ref: ihc_section_volume_3um
    recruitment_efficiency: "1.0"
    exclusion_fraction: "0.0"
  error_model:
  - name: tam_density_peritumor_cd68
    observable:
    units: cell / millimeter**2
    uses_inputs:
    - cd68_peri_median_per_hpf
    - cd68_peri_range_low_per_hpf
    - cd68_peri_range_high_per_hpf
    - hpf_area_mm2
    evaluation_points:
    sample_size: 70
    sample_size_rationale: |
      Seventy PDAC patients were included in the immunohistochemical analysis for CD68/CD163; for each case, counts from three random peripheral high-power fields were averaged.
    observation_code: |
      def derive_observation(inputs, sample_size):
          import numpy as np
          med = inputs['cd68_peri_median_per_hpf']      # cell
          low = inputs['cd68_peri_range_low_per_hpf']   # cell
          high = inputs['cd68_peri_range_high_per_hpf'] # cell
          hpf_area = inputs['hpf_area_mm2']             # millimeter**2

          # Convert counts per HPF to areal density (cells/mm^2)
          density_med = med / hpf_area
          density_low = low / hpf_area
          density_high = high / hpf_area

          med_val = density_med
          low_val = density_low
          high_val = density_high

          # Approximate SD from reported range assuming ~95% of observations between low and high
          sd_val = (high_val - low_val) / (2.0 * 1.96)
          cv = sd_val / med_val

          return {
              'value': density_med,
              'sd': cv,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        Patient-to-patient TAM densities are positive and span more than an order of magnitude (range in CD68+ counts per HPF). A lognormal likelihood on the macrophage areal density naturally captures this multiplicative heterogeneity; the SD parameter is implemented as a coefficient of variation estimated from the reported range.
  identifiability_notes: |
    Two sampled parameters (k_Mac_rec, k_Mac_death) from one observation. The data constrains the ratio k_Mac_rec / k_Mac_death. The prior on k_Mac_death (centered at ~0.05/day, half-life ~14 days) provides scale separation. Note that CD68+ IHC captures total macrophages (M1+M2), while k_Mac_rec in the QSP model drives M1 recruitment specifically. The inferred k_Mac_rec therefore represents total macrophage recruitment and may overestimate M1-specific recruitment if M2 macrophages dominate the CD68+ pool (as expected in PDAC).

