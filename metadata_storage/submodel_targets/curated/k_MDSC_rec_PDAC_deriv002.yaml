calibration:
  parameters:
  - name: k_MDSC_rec
    units: cell/(milliliter*day)
    prior:
      distribution: lognormal
      mu: 12.0
      sigma: 2.0
      lower:
      upper:
      rationale: |
        Centered on order-of-magnitude estimate from Oo2022 Transwell migration (approximately 1.6×10^5 cell/(mL*day) for high-CCL2 stroma), with wide sigma=2 to allow >2 orders-of-magnitude uncertainty due to cross-species and cross-indication translation and geometric assumptions about imaging volume.

  forward_model:
    independent_variable:
    state_variables:
    type: algebraic
    formula: |
      k_MDSC_rec = bm_cells_migrated_PDS1_9h_per_field / (imaging_volume_per_field * migration_time_days)
    code: |
      def compute(params, inputs):
          """Forward model: given k_MDSC_rec, predict migrated cells per field."""
          import numpy as np
          def _val(x):
              return getattr(x, 'magnitude', x)
          k_rec = params['k_MDSC_rec']
          V_eff = _val(inputs['imaging_volume_per_field'])
          t_hours = _val(inputs['migration_time_9h'])
          t_days = t_hours / 24.0
          migrated = k_rec * V_eff * t_days
          return migrated
    code_julia: |
      function compute(params, inputs)
          k_rec = params["k_MDSC_rec"]
          V_eff = inputs["imaging_volume_per_field"]
          t_hours = inputs["migration_time_9h"]
          t_days = t_hours / 24.0
          migrated = k_rec * V_eff * t_days
          return migrated  # cells
      end
    data_rationale: |
      Oo2022 quantified the number of bone marrow-derived cells migrating from an upper Transwell chamber into a lower chamber containing oral squamous cell carcinoma (HSC-2) cells plus high-CCL2 patient-derived stroma (PDS1). After 9 hours, an average of 610 cells per microscope field were present on the lower side of the membrane. Under these short-time, in vitro conditions, cell death and egress are negligible, so the accumulated migrated cells approximate the time-integrated recruitment flux driven primarily by stromal CCL2.
    submodel_rationale: |
      In the full QSP PDAC model, tumor MDSCs obey d(MDSC_T)/dt = k_MDSC_rec * V_T * (CCL2/(CCL2 + CCL2_50)) * (1 + H_IL6_MDSC) - death and clearance terms. In the Oo2022 Transwell assay, IL-6 is not experimentally manipulated and can be treated as baseline (H_IL6_MDSC ≈ 0), and PDS1 stroma produces high CCL2 such that CCL2 ≫ CCL2_50, so the Hill term approaches 1. Over 9 hours, MDSC death and clearance from the lower compartment are minimal. Under these assumptions, the governing equation reduces to dM/dt ≈ k_MDSC_rec * V_eff, giving M(9 h) ≈ k_MDSC_rec * V_eff * t. Using the observed migrated cell count per field as M(9 h) and an effective stromal volume per imaged field V_eff (imaging_volume_per_field), we can directly solve for k_MDSC_rec.

  error_model:
  - name: k_MDSC_rec_from_PDS1_Transwell
    units: cell
    uses_inputs:
    - bm_cells_migrated_PDS1_9h_per_field
    - migration_time_9h
    - imaging_volume_per_field
    - assumed_cv_migrated
    - imaging_volume_uncertainty_fold
    sample_size: 3
    sample_size_rationale: |
      Oo2022 reports Transwell migration data as mean ± SD over n = 3 independent experiments, with 5 fields per group.
    observation_code: |
      def derive_observation(inputs, sample_size):
          """
          Derive observation from Transwell migration data.

          The forward model predicts migrated cells per field, so we return
          the observed migrated cells with combined log-scale SD.
          """
          import numpy as np
          def _val(x):
              return getattr(x, 'magnitude', x)

          migrated_mean = _val(inputs['bm_cells_migrated_PDS1_9h_per_field'])
          cv_migrated = _val(inputs['assumed_cv_migrated'])
          fold_unc = _val(inputs['imaging_volume_uncertainty_fold'])

          observed_value = migrated_mean

          # Combine CV on migrated cells with geometric uncertainty on volume
          sigma_m = np.sqrt(np.log(1.0 + cv_migrated**2))
          sigma_V = np.log(fold_unc) / 1.96  # so that ~95% CI spans fold_unc
          sigma_combined = np.sqrt(sigma_m**2 + sigma_V**2)

          return {
              'value': observed_value,
              'sd': sigma_combined,  # dimensionless for lognormal likelihood
              'sd_uncertain': False,  # SD computed from assumed values
              'n': sample_size,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        k_MDSC_rec is strictly positive and expected to vary over orders of magnitude. The derived distribution from the Transwell assay is treated as an informative lognormal likelihood for this parameter, incorporating experimental variability and geometric uncertainty in the effective imaging volume.

  identifiability_notes: |
    This submodel constrains k_MDSC_rec under conditions of high stromal CCL2 and baseline IL-6, effectively providing an estimate of the maximal CCL2-driven MDSC recruitment rate. The absolute value of k_MDSC_rec depends on the assumed effective imaging volume per microscope field, which is uncertain by roughly an order of magnitude; this uncertainty is explicitly propagated in the distribution_code and reflected by a wide prior (sigma = 2 on the log scale). In the context of the full QSP PDAC model, k_MDSC_rec will be correlated with the CCL2_50 parameter and any IL-6-dependent modulation (H_IL6_MDSC). Additional in vivo PDAC data on MDSC accumulation kinetics and CCL2 levels would be needed to separately identify k_MDSC_rec, CCL2_50, and IL-6 effects.

source_relevance:
  indication_match: proxy
  indication_match_justification: |
    The primary data are from an oral squamous cell carcinoma (OSCC) stroma model in which patient-derived stromal fibroblasts (PDS1/PDS2) and an OSCC cell line (HSC-2) recruit murine bone marrow-derived CCR2+ MDSCs via CCL2. PDAC shares key mechanistic features with OSCC, including abundant cancer-associated fibroblasts, CCL2 secretion, and CCR2-dependent myeloid recruitment, but the tissue of origin, anatomical site, and degree of desmoplasia differ. Therefore, these data are used as a mechanistic proxy to inform the maximal CCL2-driven MDSC recruitment rate in PDAC, with substantial additional uncertainty for cross-indication and anatomical differences.
  species_source: mouse
  species_target: human
  source_quality: primary_animal_in_vitro
  perturbation_type: pathological_state
  perturbation_relevance:
  tme_compatibility: moderate
  tme_compatibility_notes: |
    Both OSCC and PDAC tumors display cancer-associated fibroblasts and chemokine-rich stroma that recruit myeloid cells, and CCL2/CCR2-dependent MDSC recruitment has been reported in multiple solid tumors. However, PDAC typically exhibits a denser, more hypoxic desmoplastic stroma and stronger T cell exclusion than OSCC. These differences likely alter absolute myeloid recruitment rates and spatial distribution, so the OSCC-derived k_MDSC_rec estimate is treated as an approximate upper bound for PDAC with at least one order-of-magnitude uncertainty.
  estimated_translation_uncertainty_fold: 10.0
  validation_warnings:
