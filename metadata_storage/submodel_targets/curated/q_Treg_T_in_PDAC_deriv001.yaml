study_interpretation: |
  Tremblay et al. 2017 used SPIO-labeled CD4+CD25+FoxP3+ regulatory T cells in a murine HPV-driven cervical cancer model and showed that labeled Tregs become MRI-detectable in tumors by 24 h after intravenous injection, with signal largely gone by 72 h. Interpreting the 24 h time-to-visibility as reflecting the characteristic time scale for Treg trafficking from blood into an established solid tumor provides an in vivo constraint on the effective extravasation rate. Under the saturated-recruitment approximation used in the full QSP model, this timing can be mapped to the composite rate q_Treg_T_in * V_T_ref, and thus to q_Treg_T_in when a reference tumor volume is specified.

key_assumptions:
- |
  Tumors in Tremblay et al. had established vasculature and sufficient cancer cell burden such that the recruitment term C_total^2 / (C_total^2 + Kc_rec) in the QSP model is effectively saturated and can be approximated as 1.
- |
  The 24 h time point at which MRI hypointensities from SPIO-labeled Tregs first become clearly visible corresponds in order-of-magnitude to the trafficking half-time for Treg extravasation into tumor, recognizing substantial uncertainty that is encoded as a broad lognormal distribution.
- |
  Differences between the HPV-driven cervical cancer model (subcutaneous or orthotopic) and human PDAC (including stromal density and chemokine milieu) primarily affect chemokine-specific recruitment pathways (captured separately in parameters like k_CCR5_Treg_rec and H_CCL5_Treg) rather than the baseline geometric extravasation scaling captured by q_Treg_T_in.
- |
  A reference tumor volume of 1 cm^3 is sufficient for mapping the effective first-order trafficking rate constant into the volumetric rate parameter q_Treg_T_in because only the product q_Treg_T_in * V_T enters the relevant flux term in the full model.
- |
  Clearance of SPIO-labeled Tregs and loss of MRI signal by 72 h reflect cell egress/death and label dilution rather than continued major changes in the extravasation rate; thus the early (<=24 h) phase dominates the constraint on q_Treg_T_in.

key_study_limitations:
- |
  The experimental system uses an HPV-induced cervical cancer model in mice rather than PDAC, so tumor vasculature, stromal architecture, and chemokine profiles differ substantially from pancreatic tumors; the mapping to PDAC is approximate.
- |
  The study involves adoptive transfer of ex vivo manipulated, SPIO-labeled Tregs, which may have altered homing or survival compared with endogenous tumor-infiltrating Tregs in untreated hosts.
- |
  MRI visibility of labeled cells provides only indirect information on cell numbers, and the abstract reports qualitative timing (24 h appearance, 72 h clearance) without a dense quantitative time course, forcing the use of heuristic assumptions to translate timing into a half-time.
- |
  Tumor volumes at the time of imaging are not explicitly reported in the abstract; the use of a 1 cm^3 reference volume is a modeling convenience rather than a measured quantity.
- |
  The parameter q_Treg_T_in is structurally confounded with tumor volume V_T and with other recruitment terms in the full QSP model, so this submodel provides only a weak, order-of-magnitude prior rather than a sharply identifiable estimate.

