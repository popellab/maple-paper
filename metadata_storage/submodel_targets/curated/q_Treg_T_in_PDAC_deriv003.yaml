study_interpretation: |
  Nummer et al. demonstrate that human PDAC tumors harbor higher densities of infiltrating Tregs than adjacent nonmalignant pancreas (120 versus 80 cells/mm^2) and that patient-derived Tregs adhere to and transmigrate through autologous tumor endothelium more efficiently than conventional CD4+ T cells (approximately 1.5-fold higher transmigrated cell numbers in vitro and increased accumulation in vivo). These findings support modeling PDAC tumor endothelium as selectively permissive to Treg extravasation. Voermans et al. quantify the kinetics of human CD34+ cell migration across bone marrow endothelium, showing that roughly 46% of cells cross the endothelial barrier within 4 h under SDF-1 stimulation. By combining the generic first-order migration kinetics from Voermans et al. with the PDAC-specific fold increase in Treg transmigration versus conventional CD4+ T cells from Nummer et al., we obtain an approximate first-order rate constant for Treg extravasation across tumor endothelium. Mapping this rate constant onto the structure of the QSP model, where q_Treg_T_in multiplies tumor volume and central Treg numbers in a first-order flux term, yields an order-of-magnitude calibration for q_Treg_T_in that is consistent with human PDAC biology while explicitly acknowledging substantial uncertainty.

key_assumptions:
- |
  Transendothelial migration of Tregs across PDAC tumor vasculature follows first-order kinetics with respect to circulating Treg numbers, as implied by the QSP model structure and by standard interpretations of transmigration assays.
- |
  The generic timescale for leukocyte transendothelial migration observed for human CD34+ progenitor cells across IL-1beta-stimulated bone marrow endothelium (approximately 46% crossing in 4 h) is a reasonable proxy for the intrinsic endothelial barrier crossing rate of T cells, modulo a PDAC-specific scaling factor captured by the observed 1.5-fold increase in Treg transmigration versus conventional CD4+ T cells.
- |
  The recruitment signal term C_total^2 / (C_total^2 + Kc_rec) in the full QSP model is near saturation for clinically detectable PDAC lesions, so it can be approximated as 1 when mapping the migration data to q_Treg_T_in, and CCR5-mediated recruitment (k_CCR5_Treg_rec) is treated as a separate contribution not explicitly resolved in this submodel.
- |
  A nominal tumor volume of 1 cm^3 is used to relate the per-tumor first-order homing rate constant to q_Treg_T_in, which is defined per unit tumor volume; within the full QSP model, this parameter will be further refined against longitudinal clinical data on tumor-infiltrating Tregs.

key_study_limitations:
- |
  The Voermans et al. CD34+ migration data are obtained in bone marrow endothelium under SDF-1 and IL-1beta stimulation and involve hematopoietic progenitors, not Tregs or PDAC tumor endothelium, making them a mechanistic proxy with potentially large quantitative differences from Treg migration in PDAC tumors.
- |
  Nummer et al. provide transmigrated cell counts and tissue densities but not explicit time courses for Treg accumulation in tumors, so we infer only an effective first-order rate constant rather than fully resolved trafficking dynamics (including recirculation, retention, and proliferation).
- |
  The transmigration assays and density measurements are performed under ex vivo or in vitro conditions (endothelial monolayers, spheroid adhesion assays, xenotransplant models), which may not capture the full complexity of in vivo PDAC vasculature (e.g., desmoplastic stiffness, hypoxia, heterogeneous perfusion).
- |
  Inter-patient variability in Treg frequencies, endothelial adhesion molecule expression, and tumor vascularization is not explicitly quantified in the available abstract-level data, so uncertainty in the inferred q_Treg_T_in is captured only heuristically via broad assumed coefficients of variation in the distribution code.

