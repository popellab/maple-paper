calibration:
  parameters:
  - name: q_Treg_T_in
    units: 1/(cm^3*minute)
    prior:
      distribution: lognormal
      mu: -5.34
      sigma: 1.61
      lower:
      upper:
      rationale: |
        Center of prior corresponds to an effective Treg extravasation rate constant of ~4.8e-3 1/min for a nominal 1 cm^3 tumor volume, derived from generic human CD34+ cell transendothelial migration fractions over 4 h combined with PDAC-specific data showing ~1.5-fold higher transmigration for Tregs vs conventional CD4+ T cells. Sigma of 1.61 (ln(5)) reflects the 5-fold estimated translation uncertainty due to use of proxy cell types, in vitro assays, and tumor-type differences.

  forward_model:
    independent_variable:
    state_variables:
    type: algebraic
    formula: |
      q_Treg_T_in = -ln(1 - f_Treg) / (migration_time_4h_hr * 60 * V_T_ref); here f_Treg is inferred from cd34_migration_fraction_4h scaled by the ratio treg_transmigration_treg_invitro_cells / treg_transmigration_conventional_invitro_cells, migration_time_4h_hr is in hours, and V_T_ref is a nominal tumor volume of 1 cm^3.
    code: |
      def compute(params, inputs):
          """Forward model: given q_Treg_T_in, predict migration fraction."""
          import numpy as np
          def _val(x):
              return getattr(x, 'magnitude', x)
          q = params['q_Treg_T_in']
          tau_hr = _val(inputs['migration_time_4h_hr'])
          tau_min = tau_hr * 60.0
          V_T_ref = 1.0
          k_in = q * V_T_ref
          f_treg = 1.0 - np.exp(-k_in * tau_min)
          return f_treg
    code_julia: |
      function compute(params, inputs)
          q = params["q_Treg_T_in"]
          tau_hr = inputs["migration_time_4h_hr"]
          tau_min = tau_hr * 60.0
          V_T_ref = 1.0
          k_in = q * V_T_ref
          f_treg = 1.0 - exp(-k_in * tau_min)
          return f_treg
      end
    data_rationale: |
      The key experimental data are (1) human CD34+ hematopoietic progenitor cells showing approximately 46% transendothelial migration across IL-1beta-stimulated human bone marrow endothelium after 4 h in response to SDF-1, and (2) human PDAC patient-derived Tregs exhibiting higher adhesion and transmigration across autologous tumor-derived endothelium than conventional CD4+ T cells, with 4976 versus 3332 transmigrated cells in vitro. These assays provide a fraction of circulating cells that cross an endothelial barrier over a defined time interval, which is naturally described by a first-order migration process.
    submodel_rationale: |
      In the full QSP PDAC model, q_Treg_T_in appears in flux terms of the form q_Treg_T_in * V_T * V_C.Treg * (C_total^2 / (C_total^2 + Kc_rec)), i.e., a first-order extravasation rate from the central compartment into the tumor that scales with tumor volume and a recruitment signal. If C_total is large (advanced tumor, recruitment term ~1) and tumor volume is set to a nominal 1 cm^3, the effective per-cell homing rate constant from blood to tumor is k_in = q_Treg_T_in * V_T. Assuming first-order kinetics, the fraction of blood Tregs that transmigrate in time tau is f_Treg = 1 - exp(-k_in * tau). Solving for q_Treg_T_in gives q_Treg_T_in = -ln(1 - f_Treg) / (tau * V_T). We estimate f_Treg by scaling the CD34+ migration fraction (0.46 over 4 h) by the observed 1.49-fold higher transmigration of Tregs vs conventional CD4+ T cells in PDAC endothelium, thereby obtaining an effective f_Treg, and then compute q_Treg_T_in via this analytical relation. This preserves the mechanistic role of q_Treg_T_in as a first-order extravasation coefficient while using simplified conditions (saturated recruitment signal, nominal tumor volume, neglect of CCR5-specific recruitment and back-flux).

  error_model:
  - name: q_Treg_T_in_derived_from_migration
    units: dimensionless
    uses_inputs:
    - cd34_migration_fraction_4h
    - treg_transmigration_conventional_invitro_cells
    - treg_transmigration_treg_invitro_cells
    - assumed_cv_migration_fraction
    - assumed_cv_transmigration_ratio
    - max_migration_fraction
    sample_size: 1
    sample_size_rationale: |
      The CD34+ migration fraction and PDAC Treg transmigration counts are summary values from in vitro assays; replicate numbers are not clearly specified in the abstracts, so we treat them as point estimates and reflect uncertainty via broad assumed coefficients of variation in the distribution code rather than explicit n.
    observation_code: |
      def derive_observation(inputs, sample_size):
          """
          Derive observation from transendothelial migration data.

          The forward model predicts Treg migration fraction, so we compute
          the effective f_Treg from CD34+ migration scaled by Treg/conventional ratio.
          """
          import numpy as np

          def _val(x):
              return getattr(x, 'magnitude', x)

          # Base CD34+ migration fraction
          f_hpc = _val(inputs['cd34_migration_fraction_4h'])

          # Treg/conventional CD4+ transmigration ratio
          n_conv = _val(inputs['treg_transmigration_conventional_invitro_cells'])
          n_treg = _val(inputs['treg_transmigration_treg_invitro_cells'])
          r = n_treg / n_conv

          # Effective Treg migration fraction (cap for numerical stability)
          max_f = _val(inputs['max_migration_fraction'])
          f_treg = min(f_hpc * r, max_f)
          observed_value = f_treg

          # Propagate CVs through the product
          cv_f = _val(inputs['assumed_cv_migration_fraction'])
          cv_r = _val(inputs['assumed_cv_transmigration_ratio'])
          cv_combined = np.sqrt(cv_f**2 + cv_r**2)
          sigma_log = np.sqrt(np.log(1 + cv_combined**2))

          return {
              'value': observed_value,
              'sd': sigma_log,  # dimensionless for lognormal likelihood
              'sd_uncertain': False,  # assumed CVs, treat as fixed
              'n': sample_size,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        We interpret the migration-derived distribution for q_Treg_T_in as pseudo-data on this rate constant. Because the underlying measurements are positive and likely multiplicatively distributed across experiments, a lognormal likelihood is appropriate. The median and 95% CI from derive_distribution are used to parameterize this likelihood.

  identifiability_notes: |
    Only a single effective data source (CD34+ transendothelial migration fraction scaled by PDAC-specific Treg versus conventional CD4+ transmigration ratio) directly informs q_Treg_T_in in this submodel, and both pieces of data are themselves proxies for true in vivo Treg extravasation into PDAC tumors. The resulting constraint on q_Treg_T_in is therefore weak and primarily order-of-magnitude, reflected in a broad prior and wide sampling distributions. In the full QSP model, q_Treg_T_in will be correlated with other trafficking parameters (e.g., CCR5-mediated recruitment k_CCR5_Treg_rec, central and peripheral Treg pool sizes, and Treg death/clearance rates). To improve identifiability, additional datasets with time-resolved in vivo Treg tumor infiltration (e.g., longitudinal imaging of labeled Tregs in PDAC or closely related solid tumors) and independent estimates of Treg residence times in tumors would be valuable.

source_relevance:
  indication_match: exact
  indication_match_justification: |
    The primary PDAC study (Nummer et al., J Natl Cancer Inst 2007, doi:10.1093/jnci/djm064) quantifies Treg infiltration into human pancreatic ductal adenocarcinoma tissue versus adjacent nonmalignant pancreas and measures adhesion and transmigration of patient-derived Tregs across autologous tumor endothelium. These data directly probe the endothelial mechanisms underlying selective Treg recruitment into PDAC tumors, which is exactly the biology represented by q_Treg_T_in in the QSP model. The CD34+ progenitor transendothelial migration study (Voermans et al., Stem Cells 2000, doi:10.1634/stemcells.18-6-435) provides generic human leukocyte transendothelial migration kinetics (46% crossing in 4 h) used only to set the overall timescale of endothelial transmigration; this is treated as a mechanistic proxy with large uncertainty.
  species_source: human
  species_target: human
  source_quality: primary_human_clinical
  perturbation_type: pathological_state
  perturbation_relevance: |
    Nummer et al. studied PDAC patients with established tumors, so measured Treg infiltration and transmigration reflect a pathological, immunosuppressive tumor microenvironment with upregulated addressins. These values likely represent upper-bound or high-end Treg recruitment efficiencies compared to early or micro-metastatic disease. Voermans et al. examined primary human CD34+ progenitors under IL-1beta-stimulated bone marrow endothelium, which models an inflamed but non-malignant endothelium; this is used only to fix the generic timescale of transendothelial migration and may underestimate or overestimate Treg migration in PDAC, motivating the broad uncertainty assumed in the distribution code.
  tme_compatibility: high
  tme_compatibility_notes: |
    The key Treg transmigration data come from human PDAC tumors and autologous tumor-derived endothelial cells, which closely match the intended PDAC tumor microenvironment in the QSP model, including tumor-induced upregulation of addressins (MAdCAM-1, VCAM-1, CD62-E, CD166) that mediate selective Treg homing. The additional CD34+ migration data are from bone marrow endothelium stimulated with IL-1beta, which differs from PDAC vasculature but mainly inform the time scale of endothelial migration and not PDAC-specific selectivity; this is handled via proxy status and wide uncertainty.
  estimated_translation_uncertainty_fold: 5.0
  validation_warnings: []
