  tme_compatibility_notes: |
    Data are from 2D monocultures of breast cancer cells lacking stromal and immune components, whereas PDAC tumors exhibit a dense desmoplastic stroma, hypoxia, and complex paracrine regulation. CCL2 secretion is partly tumor-cell intrinsic but can be strongly modulated by cytokines and stromal interactions, so per-cell secretion rates in PDAC in vivo could differ by several fold.
