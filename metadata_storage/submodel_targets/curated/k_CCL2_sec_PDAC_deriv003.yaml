study_interpretation: |
  Yoshimura 2023 compiles prior measurements of CCL2 production by human breast cancer cell lines. Nam et al. reported that MDA-MB-231 cells secrete approximately 30 ng CCL2 per 10^6 cells over 48 h, which, when converted using the CCL2 molecular weight, corresponds to a per-cell secretion rate on the order of 10^-9 nmol/cell/day. Because the QSP PDAC model represents CCL2 production as a zero-order flux proportional to tumor cell number, this in vitro measurement provides a mechanistically consistent estimate of the secretion rate parameter k_CCL2_sec, albeit in a different tumor type. The data therefore inform an order-of-magnitude prior for k_CCL2_sec that can be updated with PDAC-specific data.

key_assumptions:
- |
  Cumulative CCL2 measured in conditioned medium over 48 h reflects net secretion with negligible degradation, adsorption, or consumption during the assay window.
- |
  Cell number is approximately constant over the 48 h measurement period or appropriately normalized, so the reported value (ng/10^6 cells/48 h) can be interpreted as an average per-cell secretion rate.
- |
  The molecular weight of mature human CCL2 (8679 Da, 76 amino acids after signal peptide cleavage) is used for mass-to-mole conversion, consistent with ELISA kits calibrated against recombinant mature CCL2.
- |
  Tumor-cell-intrinsic machinery governing CCL2 transcription, translation, and secretion is broadly similar between triple-negative breast cancer cells and PDAC cells, so per-cell secretion rates are at least within an order of magnitude.
- |
  Differences between 2D in vitro culture and the PDAC tumor microenvironment (e.g., hypoxia, cytokine milieu, stromal contact) primarily modulate the effective secretion rate but do not change the underlying reaction stoichiometry represented by k_CCL2_sec.

key_study_limitations:
- |
  The quantitative CCL2 secretion values are drawn from a review article summarizing multiple primary studies rather than directly from the original Nam et al. publication; experimental details and replicate variability are not fully accessible.
- |
  The source tumor type is breast cancer, not PDAC, and CCL2 expression is known to vary across tumor types and even among cell lines of the same type, introducing substantial translation uncertainty.
- |
  Reported values are approximate ("approximately 30 ng/10^6 cells/48 h") without explicit measures of dispersion (e.g., SD or CI), limiting statistical characterization of measurement error.
- |
  Assay conditions (medium composition, cell density, passage number) are not standardized across studies and can influence chemokine secretion rates.
- |
  The conversion neglects potential CCL2 degradation or binding in the culture medium over 48 h, which could cause a modest underestimate of the true secretion rate.

