calibration:
  parameters:
  - name: k_CCL2_sec
    units: nanomole/cell/day
    prior:
      distribution: lognormal
      mu: -20.7
      sigma: 2.0
      lower:
      upper:
      rationale: |
        Wide prior centered near 10^-9 nmol/cell/day based on constitutive CCL2 secretion reported for human breast cancer cells (MDA-MB-231), inflated to account for inter-line variability and translation from breast cancer in vitro to PDAC in vivo tumor cells.

  forward_model:
    independent_variable:
    state_variables:
    type: batch_accumulation
    secretion_rate: k_CCL2_sec
    cell_count:
      input_ref: MDA_MB231_cell_count
    incubation_time:
      input_ref: MDA_MB231_time_interval_48h
    molecular_weight:
      reference_ref: ccl2_molecular_weight_mature
    medium_volume: "1.0"
    unit_conversion_factor: "0.041667"
    data_rationale: |
      Yoshimura 2023 summarizes Nam et al. measurements of cumulative CCL2 production by MDA-MB-231 breast cancer cells over 48 h, normalized per 10^6 cells. Under constant cell number and negligible degradation in conditioned medium, this directly determines the per-cell secretion rate.
    submodel_rationale: |
      In the full QSP PDAC model, tumor CCL2 dynamics in the tumor compartment follow d(CCL2)/dt = k_CCL2_sec * C_total - k_CCL2_deg * CCL2. The batch_accumulation model predicts ng from k_CCL2_sec (nmol/cell/day) using: predicted = k * cells * t_hours * MW * ucf / 1.0, where ucf = 0.041667 (= 1/24) converts hours to days. The ng conversion factor is 1.0 (nmol * g/mol * 1e-9 * 1e9 = 1.0). Molecular weight uses the mature CCL2 form (8679 Da) from the reference database.

  error_model:
  - name: k_CCL2_sec_observation
    observable:
    units: nanogram
    uses_inputs:
    - MDA_MB231_CCL2_mass_48h
    - assumed_cv
    sample_size: 3
    sample_size_rationale: |
      Nam et al. likely used triplicate cultures, but the review summarizing their data did not report n; we assume a typical n=3 for ELISA-based secretion assays.
    observation_code: |
      def derive_observation(inputs, sample_size):
          """
          Derive observation from breast cancer cell line CCL2 secretion data.

          The forward model predicts CCL2 mass secreted (ng), so we provide that
          as the observed value with uncertainty from assumed CV.
          """
          import numpy as np

          mass_ng = inputs['MDA_MB231_CCL2_mass_48h']
          cv = inputs['assumed_cv']

          # Point estimate: observed CCL2 mass
          observed_value = mass_ng

          # Log-scale SD from assumed CV
          sigma_log = np.sqrt(np.log(1 + cv**2))

          return {
              'value': observed_value,
              'sd': sigma_log,  # dimensionless for lognormal likelihood
              'sd_uncertain': False,  # assumed CV, treat as fixed
              'n': sample_size,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        Per-cell secretion rates are positive and typically vary over orders of magnitude across tumors and cell lines; a lognormal likelihood is appropriate for such scale parameters.

  identifiability_notes: |
    Given fixed molecular weight, cell count, and time interval, the algebraic conversion uniquely maps the measured cumulative CCL2 production to k_CCL2_sec; thus the parameter is structurally identifiable from this dataset. However, the experiment was performed in breast cancer cell lines rather than PDAC, and different studies report variable CCL2 levels even for the same line, so biological and experimental heterogeneity will introduce substantial practical uncertainty. When this submodel is embedded in the full PDAC QSP model, additional CCL2-related data (e.g., PDAC patient serum CCL2 levels vs. tumor burden or PDAC cell line secretion data) would further constrain k_CCL2_sec and help separate it from k_CCL2_deg.

source_relevance:
  indication_match: proxy
  indication_match_justification: |
    The quantitative secretion measurement comes from human triple-negative breast cancer cell line MDA-MB-231 rather than PDAC. We use this as a mechanistic proxy for tumor-cell-intrinsic CCL2 secretion because CCL2 is widely produced by many epithelial tumors, including PDAC, and is regulated by conserved pathways such as NF-kappaB. However, baseline secretion levels and regulation likely differ between breast and pancreatic tumors and between in vitro monolayers and in vivo PDAC lesions. We therefore treat this source as providing only an order-of-magnitude prior for k_CCL2_sec, not a PDAC-specific value.
