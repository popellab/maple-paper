study_interpretation: |
  Chang et al. quantify macrophage marker expression in human PDAC using pixel-based IHC for CD68 (pan-macrophage), CD163 (M2) and HLA-DR (M1-like). The ratio CD163:HLA-DR reflects the M2-to-M1 macrophage polarization balance in untreated resectable PDAC (ratio ~1.57, indicating M2-skewed). In the QSPIO-PDAC context, this ratio constrains k_M2_pol relative to k_M1_pol: at steady state, the M2:M1 ratio is proportional to k_M2_pol/k_M1_pol. Using the ratio rather than absolute pixel counts eliminates the need for an unidentifiable scaling factor mapping pixels to cell counts.

key_assumptions:
- |
  CD163 and HLA-DR pixel counts are proportional to M2 and M1 macrophage numbers respectively, so their ratio reflects the M2:M1 population ratio.
- |
  Pre-treatment PDAC samples approximate a steady state of macrophage polarization, so the CD163:HLA-DR ratio reflects a time-invariant balance determined by k_M2_pol and k_M1_pol.
- |
  By using the ratio of two markers quantified with the same method (ImageJ pixel counts per HPF), staining efficiency, section geometry, and overall TAM density cancel, eliminating the need for a scaling factor.
- |
  A coefficient of variation of 30% on the ratio is assumed to capture inter-patient heterogeneity, reflecting partial positive correlation between CD163 and HLA-DR across patients (which reduces ratio variance relative to individual marker variance).

key_study_limitations:
- |
  Macrophage abundance is reported as positive pixels/HPF rather than cell counts; using the CD163:HLA-DR ratio mitigates this but assumes both markers have similar per-cell staining intensity.
- |
  Cohort size (n=12) is modest, and IHC quantification does not separate intratumoral vs stromal subregions, whereas the QSP model aggregates both.
- |
  Study focuses on resectable PDAC, which may differ from metastatic or unresectable disease states sometimes simulated in QSPIO-PDAC.
- |
  Variance (SD/SEM) for individual marker pixel counts is not reported, so measurement uncertainty on the ratio is approximated via an assumed CV.

