calibration:
  parameters:
  - name: k_M2_pol
    units: 1/day
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 1.5
      lower:
      upper:
      rationale: |
        Centered at exp(0) = 1/day. M2 polarization rate in the PDAC TME; wide prior allows values from ~0.05 to ~20 per day.
  - name: k_M1_pol
    units: 1/day
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 1.5
      lower:
      upper:
      rationale: |
        Centered at exp(0) = 1/day. M1 polarization rate; only the ratio k_M2_pol/k_M1_pol is constrained by this data so priors on individual rates encode external knowledge about macrophage turnover timescales.
  forward_model:
    data_rationale: |
      Chang et al. quantified macrophage polarization markers in 12 resected human PDAC specimens by ImageJ-based positive pixels per HPF: CD163 (M2) = 7553 and HLA-DR (M1-like) = 4823. The ratio CD163:HLA-DR = 1.57 reflects the M2-skewed polarization balance in untreated PDAC. Using the ratio eliminates dependence on absolute pixel-to-cell conversion.
    submodel_rationale: |
      In the QSPIO-PDAC model, macrophages polarize between M1 and M2 states at rates k_M1_pol and k_M2_pol. At steady state, M2/M1 = k_M2_pol * drive_M2 / (k_M1_pol * drive_M1). Confounding factors (total TAM density, section geometry, staining efficiency) cancel in the ratio, making this observable commensurable with other targets constraining the same parameters.
    independent_variable:
    state_variables:
    type: steady_state_ratio
    rate_numerator: k_M2_pol
    rate_denominator: k_M1_pol
  error_model:
  - name: m2_m1_macrophage_ratio_Chang2022
    observable:
      type: identity
      state_variables: []
      rationale:
      code:
    units: dimensionless
    uses_inputs:
    - cd163_pixels_mean
    - hladr_pixels_mean
    - assumed_cv_m2m1_ratio
    - n_patients_cd40
    evaluation_points:
    sample_size: 12
    sample_size_rationale: |
      12 resected PDAC specimens with ImageJ-based IHC quantification.
    observation_code: |
      def derive_observation(inputs, sample_size):
          cd163 = inputs['cd163_pixels_mean']
          hladr = inputs['hladr_pixels_mean']
          ratio = cd163 / hladr
          cv = inputs['assumed_cv_m2m1_ratio']
          return {
              'value': ratio,
              'sd': cv,
              'sd_uncertain': True,
              'n': int(inputs['n_patients_cd40']),
          }
    likelihood:
      distribution: lognormal
      rationale: |
        Population ratios are positive and right-skewed; a lognormal likelihood with SD as CV is appropriate.
  identifiability_notes: |
    This submodel constrains the ratio k_M2_pol/k_M1_pol from the CD163:HLA-DR pixel ratio. Individual rates cannot be separately identified from this single ratio measurement. Broad lognormal priors on both rates encode external knowledge about macrophage polarization timescales, while the data constrains their ratio to ~1.57.

