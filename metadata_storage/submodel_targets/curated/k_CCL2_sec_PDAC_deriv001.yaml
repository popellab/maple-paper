calibration:
  parameters:
  - name: k_CCL2_sec
    units: nanomole/cell/day
    prior:
      distribution: lognormal
      mu: -20.64
      sigma: 2.5
      lower:
      upper:
      rationale: |
        PrSC (benign human prostate stromal cells) secreted 1,888±631 pg/mL MCP-1 over 48 h from 1×10^5 cells in a 24-well plate. Assuming 1 mL medium per well, negligible degradation, and MCP-1 molecular weight ≈8.7 kDa, this corresponds to an approximate secretion rate of 1.1×10^{-9} nmol/cell/day. A wide lognormal prior (σ=1.5) allows for uncertainty in medium volume, cross-tissue extrapolation from prostate stroma to PDAC tumor cells, and potential chemokine degradation.

  forward_model:
    independent_variable:
    state_variables:
    type: batch_accumulation
    secretion_rate: k_CCL2_sec
    cell_count:
      input_ref: n_cells_prsc
    incubation_time:
      input_ref: incubation_time_hours
    molecular_weight:
      reference_ref: ccl2_molecular_weight_mature
    medium_volume:
      input_ref: V_medium_ml
    unit_conversion_factor: "41.6667"
    data_rationale: |
      Fujita et al. reported a single 48 h time point measurement of MCP-1 (CCL2) concentration in conditioned medium from a known number of human prostate stromal cells (PrSC). Because only an end-point concentration is available and secretion can be approximated as linear with time, the per-cell secretion rate can be computed analytically from the measured concentration, assuming negligible degradation and a known medium volume.
    submodel_rationale: |
      In the full PDAC QSP model, tumor CCL2 dynamics are given by d(CCL2)/dt = k_CCL2_sec*C_total - k_CCL2_deg*CCL2. In the PrSC experiment, CCL2 accumulates in a fixed medium volume V over time t from N_cells secreting at rate k_CCL2_sec. Neglecting degradation, the final concentration C_meas satisfies C_meas*V = k_CCL2_sec*N_cells*t (up to unit conversions). The unit_conversion_factor of 41.6667 (= 1000/24) converts nmol to pg (factor 1000) and hours to days (factor 1/24) simultaneously.

  error_model:
  - name: derived_k_CCL2_sec_from_PrSC
    units: pg/milliliter
    uses_inputs:
    - CCL2_prsc_unstim_mean
    - CCL2_prsc_unstim_sd
    sample_size: 3
    sample_size_rationale: Same replicate number as the underlying ELISA measurement (assumed n=3).
    observation_code: |
      def derive_observation(inputs, sample_size):
          """
          Derive observation (point estimate + uncertainty) from PrSC secretion data.

          The paper reports CCL2 concentration = 1888 ± 631 pg/mL (mean ± SD, n=3).
          For lognormal likelihood, we need:
          - value: the observed concentration
          - sd: log-scale SD (dimensionless)

          The CV = 631/1888 ≈ 0.33, so σ_log = sqrt(ln(1 + CV²)) ≈ 0.32
          """
          import numpy as np

          conc_mean = inputs['CCL2_prsc_unstim_mean']  # pg/mL
          conc_sd = inputs['CCL2_prsc_unstim_sd']  # pg/mL

          # Point estimate: use arithmetic mean as observed value
          observed_value = conc_mean

          # Convert to log-scale SD for lognormal likelihood
          # σ_log = sqrt(ln(1 + CV²)) where CV = SD/mean
          cv = conc_sd / conc_mean
          sigma_log = np.sqrt(np.log(1 + cv**2))

          return {
              'value': observed_value,
              'sd': sigma_log,  # dimensionless for lognormal likelihood
              'sd_uncertain': False,  # SD computed from reported mean±SD
              'n': sample_size,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        The measured CCL2 concentration is positive and the forward model predicts concentration from the secretion rate parameter. A lognormal likelihood respects positivity and is appropriate for biological concentration data with multiplicative error structure.

  identifiability_notes: |
    Because the algebraic relationship C_meas·V = k_CCL2_sec·N_cells·t (ignoring degradation) directly links the measured concentration to k_CCL2_sec, the parameter is structurally identifiable given known N_cells, t, medium volume, and molecular weight. However, uncertainty in the true medium volume, possible chemokine degradation, and biological differences between benign prostate stroma and PDAC tumor/stromal cells mean that the experimental data constrain only the order of magnitude of k_CCL2_sec. This is reflected in the wide lognormal prior and the stochastic propagation of measurement uncertainty in the distribution_code.
