study_interpretation: |
  Fujita et al. quantified MCP-1/CCL2 secretion from primary human prostate stromal (PrSC) and epithelial (PrEC) cells under defined culture conditions and cytokine stimulation. The unstimulated PrSC condition provides a relatively clean measurement of chemokine accumulation in a known volume over a known time from a known number of stromal cells. By algebraically mapping this accumulation back to a per-cell secretion rate, we obtain an order-of-magnitude estimate of CCL2 production per stromal-like cell. In the PDAC QSP model, CCL2 production in the tumor compartment is represented as a constant per-cancer-cell rate k_CCL2_sec multiplied by the total number of tumor cells. Because PDAC cancer cells and associated fibroblasts (e.g., pancreatic stellate cells) are known sources of CCL2 in the tumor microenvironment, the PrSC secretion rate is used here as a mechanistic proxy for the aggregate per-cell CCL2 production driving local monocyte/MDSC recruitment in PDAC, with substantial cross-tissue and cross-cell-type uncertainty captured in the prior and likelihood.

key_assumptions:
- |
  MCP-1/CCL2 secretion machinery is sufficiently conserved across human stromal and epithelial cells that per-cell secretion rates from benign prostate stromal cells (PrSC) are within an order of magnitude of those in PDAC tumor and stromal cells under basal inflammatory conditions.
- |
  The medium volume in 24-well plates was approximately 1 mL per well; deviations (e.g., 0.5-1.0 mL) primarily rescale the inferred k_CCL2_sec and are absorbed into the broad prior.
- |
  CCL2 degradation, adsorption to plastic, and receptor-mediated uptake over 48 h in conditioned medium are small compared with cumulative secretion, so MCP-1 accumulation is approximately linear in time and proportional to k_CCL2_sec.
- |
  All 1x10^5 seeded PrSC remain viable and secreting throughout the 48 h incubation, so the effective number of secreting cells is constant.
- |
  The unstimulated PrSC condition (1,888+/-631 pg/mL) is more representative of chronic, low-grade inflammation in tumor stroma than are the high-cytokine stimulation conditions (IL-1beta, IFN-gamma, IL-2), which likely correspond to acute activation and would overestimate baseline k_CCL2_sec.
- |
  In the full PDAC QSP model, total tumor CCL2 production is lumped into a single rate proportional to cancer cell number; contributions from stromal cells and other sources are effectively scaled with C_total, so a stromal-cell-derived secretion rate can be used as a surrogate for this lumped parameter.

key_study_limitations:
- |
  The data are from benign human prostate stromal and epithelial cells in a BPH context, not from PDAC tumor cells or pancreatic stellate cells. Tissue- and disease-specific differences in CCL2 regulation may shift true PDAC secretion rates by more than an order of magnitude.
- |
  The experiment is performed in 2D monolayer culture with abundant nutrient and oxygen supply, which may not reflect the hypoxic, desmoplastic PDAC tumor microenvironment where cytokine secretion and stability can differ.
- |
  Medium volume in 24-well plates was not reported and is assumed to be 1 mL, introducing an unquantified scaling uncertainty in k_CCL2_sec.
- |
  Potential MCP-1 degradation or binding over the 48 h incubation was not characterized; ignoring this process may slightly underestimate the true secretion rate per cell.
- |
  Only a single time point (48 h) was measured for each condition, so any nonlinearity in secretion over time (e.g., due to cell proliferation or adaptation) cannot be resolved.
- |
  PrSC are stromal fibroblast-like cells; PDAC CCL2 production involves both cancer cells and activated pancreatic stellate cells. The mapping from a single cell type to the lumped tumor-cell-based parameter k_CCL2_sec is approximate.

