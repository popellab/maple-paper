study_interpretation: |
  Xiao et al. (2015) demonstrated that retinoic acid attenuates pancreatic fibrosis in a mouse chronic pancreatitis model and, in vitro, suppresses proliferation and promotes apoptosis of cultured mouse PSCs over a 5-day period. The in vitro time window over which substantial PSC apoptosis is observed suggests that activated PSCs can be cleared on a multi-day timescale under strong pro-apoptotic signaling. Under the assumption of first-order PSC death, this timescale can be mapped to an effective death rate constant k_apsc_death via k = ln(2)/t_half. In the QSPIO-PDAC model, this provides an order-of-magnitude anchor for the aPSC death rate used in the V_T.aPSC -> null reaction, with wide uncertainty to account for species, indication, and pharmacological differences.

key_assumptions:
- |
  RA-treated mouse PSCs undergoing increased apoptosis over 5 days provide a reasonable upper-bound timescale for activated PSC clearance, which can inform the order of magnitude of k_apsc_death in human PDAC.
- |
  PSC death in the relevant regime can be approximated as a first-order process, so that a single half-life parameter captures the dominant turnover behavior and maps to k_apsc_death via ln(2)/t_half.
- |
  The 5-day culture duration used for RA-treated PSCs corresponds roughly to one characteristic half-life under strong pro-apoptotic stimulation, recognizing that true kinetics may involve multiple phases and additional regulatory pathways.
- |
  Differences between mouse and human PSC biology, chronic pancreatitis versus PDAC microenvironments, and in vitro versus in vivo conditions can introduce at least a several-fold uncertainty in the true human PDAC CAF death rate; this is modeled by a wide lognormal prior and conversion distribution.
- |
  Other loss processes for aPSCs in the full QSP model (e.g., quiescence reversion, clearance via apoptosis-independent mechanisms) are either negligible compared to apoptosis or effectively subsumed into the single k_apsc_death parameter in this submodel.

key_study_limitations:
- |
  The Xiao et al. study does not report explicit numerical PSC apoptosis fractions over time; apoptosis is quantified graphically by flow cytometry and Hoechst staining, so the mapping from the 5-day culture window to a quantitative half-life is approximate.
- |
  Experiments use primary mouse PSCs and a cerulein-induced chronic pancreatitis model, not human PDAC-associated PSCs; cross-species and cross-indication translation is uncertain.
- |
  Retinoic acid is a strong pharmacological perturbation that likely accelerates PSC apoptosis relative to physiological conditions; thus the inferred half-life and k_apsc_death represent an upper-bound on death rate, and basal turnover in human PDAC may be slower.
- |
  In vitro PSC cultures lack important in vivo cues (e.g., mechanical confinement, immune cell interactions, hypoxia gradients), which can modulate PSC survival and apoptosis pathways.
- |
  The submodel ignores concurrent PSC proliferation and activation dynamics during RA treatment, effectively attributing observed net loss over several days entirely to death; real systems may involve simultaneous changes in proliferation and activation state.

