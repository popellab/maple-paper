calibration:
  parameters:
  - name: k_apsc_death
    units: 1/day
    prior:
      distribution: lognormal
      mu: -1.97
      sigma: 1.61
      lower:
      upper:
      rationale: |
        Centered so that median k_apsc_death corresponds to a half-life of about 5 days (ln(2)/5 ≈ 0.14 1/day). Sigma of 1.61 (ln(5)) reflects the 5-fold estimated translation uncertainty to account for species, indication, and pharmacological differences between the RA-treated mouse PSC system and human PDAC CAFs.

  forward_model:
    independent_variable:
    state_variables:
    type: algebraic
    formula: k_apsc_death = ln(2) / half_life_apsc
    code: |
      def compute(params, inputs):
          """Forward model: given k_apsc_death, predict half-life."""
          import numpy as np
          k = params['k_apsc_death']
          t_half = np.log(2) / k
          return t_half
    code_julia: |
      function compute(params, inputs)
          k = params["k_apsc_death"]
          t_half = log(2) / k
          return t_half  # days
      end
    data_rationale: |
      Xiao et al. cultured primary mouse PSCs with retinoic acid (RA) and observed substantial apoptosis over a 5-day period, indicating that activated PSCs can be cleared on a multi-day timescale under strong pro-apoptotic stimulation. We approximate this timescale by a characteristic half-life for activated PSCs under these conditions.
    submodel_rationale: |
      In the full QSPIO-PDAC model, activated PSCs (aPSCs) are removed via a first-order death reaction V_T.aPSC -> null with rate k_apsc_death * V_T.aPSC. For a first-order process, the death rate constant is related to the cell half-life by k_apsc_death = ln(2)/t_half. The direct_conversion submodel maps an assumed PSC half-life, informed by RA-induced apoptosis experiments, into the corresponding first-order death rate constant used in the tumor compartment reaction V_T.aPSC -> null.

  error_model:
  - name: k_apsc_death_from_half_life
    units: day
    uses_inputs:
    - half_life_apsc
    - assumed_sigma_log
    sample_size: 1
    sample_size_rationale: |
      Single inferred half-life estimate from the 5-day culture period.
    observation_code: |
      def derive_observation(inputs, sample_size):
          """
          Derive observation from PSC half-life estimate.

          The forward model predicts half-life in days, so we return
          the observed half-life with log-scale SD.
          """
          t_half = inputs['half_life_apsc']
          sigma_log = inputs['assumed_sigma_log']
          observed_value = t_half

          return {
              'value': observed_value,
              'sd': sigma_log,  # dimensionless for lognormal likelihood
              'sd_uncertain': False,  # SD is assumed
              'n': sample_size,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        The derived death rate is positive and may vary over orders of magnitude; a lognormal likelihood on k_apsc_death is appropriate when propagating uncertainty from the assumed half-life distribution.

  identifiability_notes: |
    This submodel does not use a direct quantitative apoptosis readout; instead, it treats the 5-day culture period over which Xiao et al. report clear RA-induced PSC apoptosis as an approximate characteristic half-life for activated PSCs under strong pro-apoptotic stimulation. The resulting estimate of k_apsc_death is therefore weakly data-informed and should be interpreted as setting the correct order of magnitude rather than a tightly constrained value. The broad lognormal prior and conversion distribution reflect large uncertainty due to (i) pharmacological RA exposure, (ii) mouse-to-human translation, and (iii) chronic pancreatitis vs PDAC stromal context. Additional time-resolved quantitative PSC apoptosis data (e.g., Annexin V fractions at multiple time points under defined conditions) would be required to more precisely identify k_apsc_death and to separate natural turnover from drug-induced apoptosis.

source_relevance:
  indication_match: related
  indication_match_justification: |
    The primary study (Xiao et al. 2015, PLoS One 10(11):e0141462) investigates pancreatic stellate cells in a mouse model of chronic pancreatitis and in vitro, not PDAC. Both chronic pancreatitis and PDAC feature activated PSCs and pancreatic fibrosis with dense desmoplastic stroma, so PSC activation and apoptosis mechanisms are closely related. However, inflammatory cues and cytokine milieu differ from PDAC, and the in vitro experiments include pharmacological retinoic acid exposure, so we treat this as a related rather than exact indication and inflate uncertainty accordingly.
  species_source: mouse
  species_target: human
  source_quality: primary_animal_in_vitro
  perturbation_type: pharmacological
  perturbation_relevance: |
    Retinoic acid is applied at micromolar doses to cultured mouse PSCs for several days, strongly promoting apoptosis and inhibiting activation. The inferred half-life therefore represents an upper-bound (fast) death timescale under strong pro-apoptotic stimulation rather than a basal in vivo turnover rate of human PDAC CAFs. The broad prior around ln(2)/5 days and the wide lognormal spread in the conversion model are intended to down-weight this pharmacological context and treat the RA system as providing only the order of magnitude for k_apsc_death.
  tme_compatibility: moderate
  tme_compatibility_notes: |
    The in vitro PSC culture lacks the full PDAC tumor microenvironment, but the in vivo component of the Xiao et al. study uses a murine chronic pancreatitis model with dense fibrosis and activated stellate cells, which resembles aspects of the desmoplastic PDAC stroma. Differences in inflammatory drivers, absence of malignant epithelium in CP, and culture conditions motivate treating TME compatibility as moderate, not high.
  estimated_translation_uncertainty_fold: 5.0
  validation_warnings: []
