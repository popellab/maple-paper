calibration:
  parameters:
  - name: k_CCL2_sec
    units: nanomole / cell / day
    prior:
      distribution: lognormal
      mu: -23.0
      sigma: 2.0
      lower:
      upper:
      rationale: |
        Center of prior (exp(mu) ~ 1e-10 nmol/cell/day) chosen to be consistent with order-of-magnitude chemokine secretion rates from fibroblast-like cells, with wide uncertainty (100-fold up/down) to account for indication (CP vs PDAC) and digitization error.
  forward_model:
    data_rationale: |
      Michalski et al. measured MCP-1 (CCL2) accumulated in PSC culture supernatants over 48 h using ELISA, with known seeding density, medium volume, and incubation time. This directly matches a batch accumulation secretion assay.
    submodel_rationale: |
      In the full QSPIO-PDAC model, CCL2 is produced in the tumor compartment by stromal cells (modeled via k_CCL2_sec * C_total). Here, we isolate per-cell CCL2 secretion from pancreatic stellate cells in vitro, which maps directly to k_CCL2_sec under batch accumulation conditions.
    independent_variable:
    state_variables:
    type: batch_accumulation
    secretion_rate: k_CCL2_sec
    cell_count:
      input_ref: psc_cell_seeded
    incubation_time:
      input_ref: incubation_time_48h
    molecular_weight:
      reference_ref: ccl2_molecular_weight_mature
    medium_volume:
      input_ref: medium_volume_well
    unit_conversion_factor: '1000.0'
  error_model:
  - name: mcp1_concentration_48h
    observable:
    units: picogram / milliliter
    uses_inputs:
    - mcp1_conc_48h_mean
    - mcp1_conc_48h_cv_assumed
    evaluation_points:
    sample_size: 3
    sample_size_rationale: |
      Michalski et al. report ELISA data as mean±SEM from three independent experiments for cytokine measurements in PSC supernatants.
    observation_code: |
      def derive_observation(inputs, sample_size):
          mean = inputs['mcp1_conc_48h_mean']
          cv_assumed = inputs['mcp1_conc_48h_cv_assumed']
          # For a lognormal likelihood, we treat sd as the coefficient of variation in linear space
          return {
              'value': mean,
              'sd': cv_assumed,
              'sd_uncertain': True,
              'n': int(sample_size),
          }
    likelihood:
      distribution: lognormal
      rationale: |
        Cytokine concentrations are positive and typically log-distributed across experiments; measurement error and biological variability are better captured on the log scale.
  identifiability_notes: |
    With a single batch-accumulation measurement (MCP-1 concentration at 48 h) and known cell number, medium volume, and molecular weight, the submodel constrains only the product k_CCL2_sec * incubation_time. Because incubation_time is fixed from the experiment, k_CCL2_sec is identifiable up to the assumed measurement uncertainty and the approximated concentration from figure digitization. The prior is intentionally broad to avoid overconfidence, and this target should be combined with additional CCL2 data (e.g., other cell types, in vivo concentrations) in the global QSP calibration.

source_relevance:
  indication_match: related
  indication_match_justification: |
    The data come from human pancreatic stellate cells isolated from chronic pancreatitis (CP) patients. PSCs from CP and PDAC share activation markers (alpha-SMA), myofibroblast-like phenotype, and robust secretion of inflammatory cytokines/chemokines including MCP-1/CCL2. However, CP lacks malignant epithelial cells and PDAC-specific oncogenic signaling, which can alter PSC activation state and secretory profile. Thus CP PSCs are used as a mechanistic proxy for PDAC CAF/PSC CCL2 secretion with an expected uncertainty of roughly one order of magnitude.
  species_source: human
  species_target: human
  source_quality: primary_human_in_vitro
  perturbation_type: pathological_state
  perturbation_relevance:
  tme_compatibility: moderate
  tme_compatibility_notes: |
    Chronic pancreatitis stroma is fibrotic and inflamed, sharing desmoplasia and PSC activation with PDAC but lacking malignant epithelium and tumor-driven immunosuppressive circuits. PSC CCL2 levels in CP may be somewhat lower than in fully developed PDAC stroma, but the order of magnitude is expected to be similar.
  estimated_translation_uncertainty_fold: 3.0
