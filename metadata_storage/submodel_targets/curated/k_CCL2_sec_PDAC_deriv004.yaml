study_interpretation: |
  Michalski et al. demonstrate that human pancreatic stellate cells isolated from chronic pancreatitis patients secrete substantial amounts of MCP-1 (CCL2) into culture supernatants over 48 h and that this secretion is modulated by cannabinoid receptor ligands. Using the reported seeding density (40,000 PSC per 0.5 mL well), incubation time (48 h), and MCP-1 ELISA readouts, we treat the control-condition MCP-1 concentration as an approximate quantitative constraint on per-cell CCL2 secretion. This provides a mechanistically matched in vitro estimate of k_CCL2_sec for activated human PSC in a pancreas-specific fibrotic context, which is closely related to but distinct from PDAC CAFs.

key_assumptions:
- |
  MCP-1 ELISA bar heights in Figure 7A are approximately 200 pg/mL for untreated control PSC supernatants at 48 h; this value was approximated by digitizing the figure and should be interpreted with at least ~30% error margin.
- |
  PSC proliferation over the 48 h accumulation period is modest once cultures are near confluence, so cell number is approximated as constant at the reported seeding density (40,000 cells/well).
- |
  All secreted MCP-1 during the 48 h period remains in the measured supernatant (no significant degradation, binding, or medium exchange), consistent with standard batch accumulation assays.
- |
  Activated PSC from chronic pancreatitis have CCL2 secretion rates within an order of magnitude of PDAC CAF/PSC in the PDAC tumor microenvironment.
- |
  Biological and technical variability for MCP-1 ELISA in PSC cultures is captured by an assumed coefficient of variation of 30% (used as SD for the lognormal likelihood).

key_study_limitations:
- |
  PSC were derived from chronic pancreatitis rather than PDAC, so tumor-specific oncogenic and immune cues that may further upregulate CCL2 are absent.
- |
  Absolute MCP-1 concentrations are only available from plotted ELISA bar graphs, requiring approximate digitization rather than exact tabulated values.
- |
  Cultures are 2D monolayers in low serum, which do not fully recapitulate the 3D, hypoxic, and heterogeneous PDAC stroma.
- |
  The study focuses on pharmacologic modulation of PSC via cannabinoids; control-condition CCL2 secretion is not extensively characterized across multiple donors or culture conditions, limiting generalizability.

