study_interpretation: |
  Gu et al. 2023 performed immunohistochemistry for CD86 (M1 marker) and CD163 (M2 marker) on 42 primary PDAC tumors and 50 metastatic lesions. For primary tumors, they reported median numbers and ranges of CD86+ and CD163+ macrophages per high-power field. These data show that, at the time of surgical resection in untreated PDAC, CD163+ M2 macrophages are more abundant than CD86+ M1 macrophages (median 27.1 vs. 11.6 cells per field), implying an M1:M2 ratio of approximately 0.43. This provides a direct, endogenous measurement of macrophage polarization bias in the PDAC tumor microenvironment, which we map to the steady-state ratio governed by k_M1_pol and k_M2_pol in the QSPIO-PDAC model. The metastatic lesions show a further shift toward M2 dominance, supporting the interpretation that the primary-tumor ratio represents an earlier metastatic stage of the same pathological process.

key_assumptions:
- |
  CD86+ cells in tumor nests and stroma are treated as M1-like macrophages and CD163+ cells as M2-like macrophages, neglecting intermediate or mixed phenotypes.
- |
  The reported median numbers of CD86+ and CD163+ cells per high-power field are representative of the steady-state macrophage composition in primary resectable PDAC at the time of surgery.
- |
  Spatial heterogeneity within tumors (different fields per slide) and between patients can be summarized by the reported medians and ranges, and conversion of ranges to approximate standard deviations via an assumed range-to-SD factor is acceptable for defining a lognormal likelihood.
- |
  The effective cytokine-dependent drive terms that modulate polarization (IL12/IFNg vs IL10/TGFbeta/IL6) can be absorbed into the steady_state_ratio model as fixed dimensionless factors (set to 1.0), so that the observed M1:M2 ratio primarily informs the ratio k_M1_pol/k_M2_pol.
- |
  Other processes affecting macrophage numbers (recruitment from blood, proliferation, death, and egress) either affect M1 and M2 similarly or are constrained by separate targets, allowing this dataset to be interpreted primarily in terms of polarization rates.

key_study_limitations:
- |
  The study reports medians and ranges but not full distributions or standard deviations for CD86+ and CD163+ counts, requiring approximate conversion from ranges to coefficients of variation and introducing additional uncertainty.
- |
  CD86 and CD163 are imperfectly specific for M1 and M2 phenotypes; some macrophages may co-express markers or fall outside this binary classification, which could bias the inferred M1:M2 ratio.
- |
  Quantification is based on counts per high-power field in selected representative regions rather than whole-tumor volumetric densities, potentially over- or under-representing hotspots of macrophage infiltration.
- |
  The cohort (n=42 primary tumors) is from a single center in China and may not fully capture global PDAC heterogeneity in stromal composition, stage at surgery, or prior subclinical treatments.
- |
  The analysis is cross-sectional at the time of resection and does not capture temporal dynamics of macrophage polarization or responses to therapy, so it constrains only the baseline pathological-state ratio, not dynamic rate changes.

