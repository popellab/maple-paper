calibration:
  parameters:
  - name: k_M1_pol
    units: 1/day
    prior:
      distribution: lognormal
      mu: -2.0
      sigma: 1.5
      lower:
      upper:
      rationale: |
        Wide prior for endogenous M2-to-M1 polarization centered around 0.14 1/day, spanning approximately 10^-3 to 10^1 1/day to accommodate pharmacological and pathological-state data.
  - name: k_M2_pol
    units: 1/day
    prior:
      distribution: lognormal
      mu: -1.0
      sigma: 1.5
      lower:
      upper:
      rationale: |
        Wide prior for M1-to-M2 polarization centered around 0.37 1/day, spanning approximately 10^-2 to 10^1 1/day; needed because the M1:M2 ratio constrains only the ratio k_M1_pol/k_M2_pol.
  forward_model:
    data_rationale: |
      Gu et al. 2023 report median numbers of CD86+ (M1) and CD163+ (M2) macrophages per high-power field in primary resected PDAC, which provide an endogenous pathological-state M1:M2 ratio without exogenous pharmacological stimulation.
    submodel_rationale: |
      In the full QSPIO-PDAC model, M1 and M2 macrophages interconvert via polarization reactions V_T.Mac_M2 -> V_T.Mac_M1 with rate k_M1_pol and V_T.Mac_M1 -> V_T.Mac_M2 with rate k_M2_pol, modulated by IL12/IFNg and IL10/TGFbeta/IL6. At quasi-steady state in the tumor microenvironment, the ratio of M1 to M2 macrophages is governed primarily by the ratio of effective polarization rates, after factoring in cytokine-dependent drive. The steady_state_ratio submodel captures this by mapping the measured CD86+/CD163+ ratio to k_M1_pol/k_M2_pol under pathological-state cytokine conditions.
    independent_variable:
    state_variables:
    unit_conversion_factor: '1.0'
    type: steady_state_ratio
    rate_numerator: k_M1_pol
    rate_denominator: k_M2_pol
    drive_numerator: '1.0'
    drive_denominator: '1.0'
  error_model:
  - name: m1_m2_ratio_pdac_gu2023
    observable:
    units: dimensionless
    uses_inputs:
    - cd86_primary_median_gu2023
    - cd86_primary_min_gu2023
    - cd86_primary_max_gu2023
    - cd163_primary_median_gu2023
    - cd163_primary_min_gu2023
    - cd163_primary_max_gu2023
    - n_primary_pdac_gu2023
    - range_to_sd_factor_gu2023
    evaluation_points:
    sample_size: 42
    sample_size_rationale: |
      Number of primary PDAC tumors (n=42) in which CD86+ and CD163+ macrophage counts were quantified.
    observation_code: |
      def derive_observation(inputs, sample_size):
          import numpy as np

          cd86_med = inputs['cd86_primary_median_gu2023']
          cd86_min = inputs['cd86_primary_min_gu2023']
          cd86_max = inputs['cd86_primary_max_gu2023']
          cd163_med = inputs['cd163_primary_median_gu2023']
          cd163_min = inputs['cd163_primary_min_gu2023']
          cd163_max = inputs['cd163_primary_max_gu2023']
          range_factor = inputs['range_to_sd_factor_gu2023']
          n = int(inputs['n_primary_pdac_gu2023'])

          # Approximate SD from reported range using assumed factor (range approx factor * SD)
          sd_cd86 = (cd86_max - cd86_min) / range_factor
          sd_cd163 = (cd163_max - cd163_min) / range_factor

          # Coefficients of variation for CD86 and CD163 counts
          cv_cd86 = sd_cd86 / cd86_med
          cv_cd163 = sd_cd163 / cd163_med

          # Observed M1:M2 ratio from medians (CD86+/CD163+)
          ratio_value = cd86_med / cd163_med

          # Propagate uncertainty for ratio R = X/Y: CV_R^2 approx CV_X^2 + CV_Y^2
          cv_ratio = float(np.sqrt(cv_cd86**2 + cv_cd163**2))

          return {
              'value': ratio_value,
              'sd': cv_ratio,
              'sd_uncertain': True,
              'n': n,
          }
    likelihood:
      distribution: lognormal
      rationale: |
        The M1:M2 ratio is positive and derived from counts with multiplicative biological variability; a lognormal likelihood with CV estimated from reported ranges is appropriate.
  identifiability_notes: |
    This target constrains the steady-state M1:M2 macrophage ratio in primary resected PDAC via CD86+/CD163+ counts. In the steady_state_ratio submodel, the observable depends only on the ratio k_M1_pol/k_M2_pol (after factoring fixed drive terms), so this dataset primarily informs the relative polarization bias toward M1 vs M2 rather than the absolute magnitude of either rate. k_M1_pol and k_M2_pol will therefore be strongly correlated in posterior samples when using this target alone; absolute scales must be anchored by additional targets (e.g., pharmacological polarization experiments, total TAM densities, or dynamic responses). The approximated uncertainty from reported ranges is relatively large, so this target acts as a soft anchor on the endogenous pathological-state M1:M2 balance rather than a precise constraint.

