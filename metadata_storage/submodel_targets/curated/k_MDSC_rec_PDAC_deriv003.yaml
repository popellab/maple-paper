calibration:
  parameters:
  - name: k_MDSC_rec
    units: cell/(milliliter*day)
    prior:
      distribution: lognormal
      mu: 18.9
      sigma: 2.0
      lower:
      upper:
      rationale: |
        Centered at exp(18.9) ~ 1.6e8 cell/(mL*day). With the decomposed steady-state fraction model using L_total = 2.5e8 cell/mL and drive=1.0, this produces MDSC fraction ~ 0.64, consistent with the observed 66.6%. Wide sigma spans several orders of magnitude to accommodate uncertainty in L_total and drive assumptions.
  - name: k_MDSC_death
    units: 1/day
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 1.5
      lower:
      upper:
      rationale: |
        Tumor-infiltrating myeloid cells (including MDSC) typically have lifespans on the order of 1 to 3 days; a lognormal prior centered at 1/day with broad uncertainty captures this while allowing slower or faster turnover.
  forward_model:
    data_rationale: |
      Porembka et al. report that in human pancreatic adenocarcinoma, approximately 66.6% of tumor-infiltrating CD45+ leukocytes are CD11b+CD15+ myeloid cells that coexpress arginase-1 and functionally correspond to MDSC. This high and relatively homogeneous fraction across tumors is consistent with a near steady-state balance between recruitment and loss of MDSC in established PDAC lesions. Because only endpoint fractions are reported (no time courses), a steady-state fraction model relating recruitment and loss rates to the observed MDSC fraction is appropriate.
    submodel_rationale: |
      In the full QSPIO-PDAC model, k_MDSC_rec appears as a zero-order source term for V_T.MDSC via the rate law k_MDSC_rec*V_T*(CCL2/(CCL2+CCL2_50))*(1+H_IL6_MDSC), while MDSCs are removed by first-order death. At steady state, the MDSC fraction among CD45+ leukocytes is f = k_MDSC_rec * chemokine_drive / (k_MDSC_death * L_leukocyte_T). The parent density L_leukocyte_T provides the dimensional anchor converting the dimensionless fraction to absolute rate units.
    independent_variable:
    state_variables:
    type: steady_state_fraction
    target_rate: k_MDSC_rec
    loss_rate: k_MDSC_death
    parent_density:
      reference_ref: pdac_cd45_density_volumetric
    drive_factor: "1.0"
  error_model:
  - name: human_tumor_MDSC_fraction_Porembka2012
    observable:
      type: identity
      state_variables: []
      rationale:
      code:
    units: dimensionless
    uses_inputs:
    - mdsc_frac_tumor_porembka_mean
    - mdsc_frac_tumor_porembka_sd
    evaluation_points:
    sample_size: 10
    sample_size_rationale: |
      The exact number of tumors contributing to the 66.6% +/- 3.2% estimate is not explicitly stated; based on typical small clinical series and the methods description (archived PDAC resections), we assume approximately 10 tumor samples. This affects only the interpretation of whether the +/- value is closer to SD or SEM; we conservatively treat it as SD.
    observation_code: |
      def derive_observation(inputs, sample_size):
          mean_frac = inputs['mdsc_frac_tumor_porembka_mean']
          sd_frac = inputs['mdsc_frac_tumor_porembka_sd']
          return {
              'value': mean_frac,
              'sd': sd_frac,
          }
    likelihood:
      distribution: normal
      rationale: |
        The reported MDSC fraction is relatively high (about 0.67) with modest variability across tumors; measurement noise and between-patient heterogeneity around this mean are reasonably approximated by a normal distribution on the fraction scale for values comfortably away from 0 and 1.
  identifiability_notes: |
    This algebraic submodel relates the steady-state tumor MDSC fraction to the ratio k_MDSC_rec/k_MDSC_death. With a single human PDAC measurement, only this ratio is statistically identifiable; k_MDSC_rec and k_MDSC_death cannot be independently determined from this dataset alone. The chosen broad lognormal priors encode external knowledge that tumor-infiltrating myeloid cells typically have rapid turnover (on the order of days), while the recruitment rate must be of similar magnitude to sustain the observed high MDSC fraction. Additional calibration targets (for example, longitudinal MDSC dynamics during therapy, or independent constraints on MDSC lifespan) would be required to separately constrain k_MDSC_rec and k_MDSC_death.

