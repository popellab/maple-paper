study_interpretation: Serial CT imaging of untreated human PDAC provides direct measurements of primary tumor volume doubling
  times, capturing the net expansion of the tumor mass in vivo under natural disease progression. Interpreting these VDTs
  as arising from exponential tumor cell growth in the regime where carrying capacity limitations are not yet dominant allows
  analytic conversion to the per capita cancer cell growth rate k_C1_growth used in the QSPIO-PDAC model.
