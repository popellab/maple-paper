calibration:
  identifiability_notes: Because only net tumor volume doubling time is observed, this target constrains the combined effect
    of cancer cell proliferation and loss (necrosis, apoptosis) embedded in the clinical growth rate. In the full QSPIO-PDAC
    model, k_C1_growth will be statistically correlated with separate death and immune-mediated killing parameters (k_C1_death,
    k_C_Tcell_eff, k_M1_phago). This submodel effectively identifies an effective net growth rate in the low-saturation regime;
    additional data (e.g., histologic proliferation indices, xenograft cell cycle measurements, or longitudinal volumetric
    data under varying microenvironmental conditions) would be needed to separately estimate intrinsic proliferation versus
    death terms and to refine how k_C1_growth changes with tumor size and stromal content.
  independent_variable: null
  measurements:
  - distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    # Mean and SD of tumor volume\
      \ doubling time (VDT)\n    vdt_mean = inputs['vdtime_mean'].to('day').magnitude\n    vdt_sd = inputs['vdtime_sd'].to('day').magnitude\n\
      \n    # Approximate VDT distribution as lognormal based on reported mean and SD\n    # Standard lognormal moment-matching\
      \ formulas\n    mu_log_vdt = np.log(vdt_mean**2 / np.sqrt(vdt_mean**2 + vdt_sd**2))\n    sigma_log_vdt = np.sqrt(np.log(1.0\
      \ + (vdt_sd**2) / (vdt_mean**2)))\n\n    # Sample VDT values, then transform to growth rate k = ln(2)/VDT\n    vdt_samples\
      \ = np.random.lognormal(mu_log_vdt, sigma_log_vdt, 10000)\n    k_samples = np.log(2.0) / vdt_samples  # 1/day\n\n  \
      \  # Return summary statistics for the implied distribution of k_C1_growth\n    log_k = np.log(k_samples)\n    return\
      \ {\n        'median': float(np.median(k_samples)),\n        'mu_log_k': float(np.mean(log_k)),\n        'sigma_log_k':\
      \ float(np.std(log_k))\n    }\n"
    evaluation_points:
    - 0.0
    likelihood:
      distribution: lognormal
      rationale: The clinical VDTs span nearly two orders of magnitude and are well-described by positively skewed distributions.
        Approximating VDT as lognormal and propagating uncertainty via k = ln(2)/VDT yields an approximately lognormal distribution
        for k_C1_growth. The derived lognormal for k_C1_growth (computed in distribution_code) is used as the observation
        model linking the literature-derived VDT summary to the QSP parameter.
    name: k_C1_growth_from_VDT
    observable: null
    sample_size: 100
    sample_size_rationale: The imaging study included 100 patients with histologically confirmed PDAC and at least two untreated
      CT scans; all contributed to the reported VDT distribution.
    units: 1/day
    uses_inputs:
    - vdtime_mean
    - vdtime_sd
  model:
    data_rationale: Ahn et al. followed 100 patients with untreated pancreatic ductal adenocarcinoma using serial multi-detector
      CT and computed tumor volume doubling times (VDT) assuming exponential tumor growth between scans. The published summary
      (mean ± SD VDT) directly characterizes net tumor expansion kinetics in human PDAC without treatment.
    formula: k_C1_growth = ln(2) / VDT
    submodel_rationale: In the full QSPIO-PDAC model, viable cancer cells C1 in the tumor compartment grow according to dC1/dt
      = k_C1_growth * C1 * (1 - C_total/C_max). When total cancer cell burden C_total is well below the carrying capacity
      C_max, the logistic term (1 - C_total/C_max) ≈ 1 and the dynamics reduce to exponential growth dC1/dt ≈ k_C1_growth
      * C1. Under this regime, the tumor cell population has a doubling time VDT related to k_C1_growth by k_C1_growth = ln(2)/VDT.
      The clinical VDT measurements thus provide a mechanistically consistent way to infer k_C1_growth during early-to-intermediate
      tumor growth where saturation effects are modest.
    type: direct_conversion
  parameters:
  - name: k_C1_growth
    prior:
      distribution: lognormal
      lower: null
      mu: -5.0
      rationale: Clinical imaging study reports a mean tumor volume doubling time (VDT) of 132.3 ± 132.1 days for untreated
        human PDAC (n=100). Converting via k = ln(2)/VDT gives typical net growth rates on the order of 10^-3–10^-2 1/day.
        A lognormal prior with mu = -5.0 and sigma = 1.0 on the log scale is chosen to be weakly informative while centered
        in this range, allowing for more than an order-of-magnitude variability to accommodate inter-patient heterogeneity.
      sigma: 1.0
      upper: null
    units: 1/day
  state_variables: null
experimental_context:
  cell_lines: null
  cell_types:
  - isolation_method: in situ within native pancreatic tumors; not isolated ex vivo
    name: pancreatic ductal adenocarcinoma cells
    phenotype: primary malignant epithelial cells within patient tumors
  culture_conditions: null
  indication: pancreatic ductal adenocarcinoma (PDAC)
  species: human
  system: clinical_imaging
