calibration:
  identifiability_notes: This submodel constrains n_CD8_clones primarily through the average number of experimentally identified
    tumor-reactive CD8 TCR clonotypes per PDAC tumor from Meng et al. 2023. Because the underlying dataset is small (9 tumors)
    and subject to detection limits (only clonotypes recovered and functionally tested are counted), the resulting constraint
    on n_CD8_clones is moderate. In the full QSP model, n_CD8_clones will be correlated with other parameters that scale antigen-driven
    T cell priming, such as P1_C1 (antigen per cancer cell), k_T_activation_per_APC, and n_T_expansion_burst. Additional data
    linking the absolute abundance of tumor-reactive CD8 T cells (e.g., tetramer frequencies or functional ELISPOT counts
    per tumor) to clinical responses in PDAC would help break these correlations and more tightly identify n_CD8_clones.
  independent_variable: null
  measurements:
  - distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    # Total number of tumor-reactive\
      \ clonotypes identified across all tumors\n    total_tr = inputs['total_TR_clonotypes_Meng2023'].magnitude\n    # Number\
      \ of PDAC tumors profiled\n    n_tumors = inputs['n_PDAC_tumors_Meng2023'].magnitude\n    # Assume the total number\
      \ of tumor-reactive clonotypes follows Poisson statistics\n    # with mean equal to the observed total, and derive the\
      \ distribution of\n    # mean tumor-reactive clones per tumor.\n    total_samples = np.random.poisson(lam=total_tr,\
      \ size=10000)\n    # Avoid division by zero in rare cases where Poisson gives zero\n    total_samples = np.clip(total_samples,\
      \ 1, None)\n    clones_per_tumor = total_samples / float(n_tumors)\n    return {\n        'median': float(np.median(clones_per_tumor)),\n\
      \        'ci95_lower': float(np.percentile(clones_per_tumor, 2.5)),\n        'ci95_upper': float(np.percentile(clones_per_tumor,\
      \ 97.5)),\n    }"
    evaluation_points:
    - 0.0
    likelihood:
      distribution: lognormal
      rationale: The derived observable is the average number of tumor-reactive CD8 T cell clonotypes per PDAC tumor, which
        is positive and can vary over orders of magnitude between patients. A lognormal likelihood, with its parameters informed
        by the distribution returned from distribution_code, is appropriate for such multiplicative biological variability.
    name: tumor_reactive_clones_per_tumor
    observable: null
    sample_size: 9
    sample_size_rationale: Meng et al. 2023 report 93 tumor-reactive TCR clonotypes identified across 3 genetically unstable
      and 6 genetically stable PDAC tumors (9 tumors total). We treat these 9 tumors as independent samples for the average
      number of tumor-reactive clones per tumor.
    units: dimensionless
    uses_inputs:
    - total_TR_clonotypes_Meng2023
    - n_PDAC_tumors_Meng2023
  model:
    data_rationale: Meng et al. 2023 used single-cell transcriptomics combined with functional testing of TCRs against autologous
      tumor cells to identify 93 tumor-reactive CD8 T cell receptor clonotypes across 9 PDAC tumors (3 genetically unstable,
      6 genetically stable). This directly constrains the typical number of distinct tumor-reactive CD8 clonotypes per PDAC
      tumor.
    formula: n_CD8_clones = total_TR_clonotypes_Meng2023 / n_PDAC_tumors_Meng2023
    submodel_rationale: In the full QSPIO-PDAC model, n_CD8_clones multiplies the rate of antigen-specific CD8 T cell activation
      and the amount of free tumor antigen P1 generated per cancer cell, effectively representing the number of distinct tumor-specific
      CD8 T cell clones recognizing independent epitopes. Assuming that each experimentally identified tumor-reactive TCR
      clonotype corresponds to one such functional clone, the average number of tumor-reactive clonotypes per tumor provides
      a direct estimate of n_CD8_clones in the baseline PDAC setting.
    type: direct_conversion
  parameters:
  - name: n_CD8_clones
    prior:
      distribution: lognormal
      lower: null
      mu: 2.3
      rationale: Tumor-reactive CD8 T cell repertoires in human PDAC tumors show on the order of 10 distinct tumor-reactive
        TCR clonotypes per tumor when 93 tumor-reactive clonotypes are distributed across 9 tumors in Meng et al. 2023, with
        substantial inter-patient variability. A lognormal prior with median around 10 and wide dispersion (approximate 95
        percent interval 1-100) captures this scale while remaining weakly informative.
      sigma: 1.0
      upper: null
    units: dimensionless
  state_variables: null
