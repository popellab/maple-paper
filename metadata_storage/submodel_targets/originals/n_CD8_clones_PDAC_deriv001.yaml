study_interpretation: Meng et al. 2023 provide a PDAC-specific quantification of tumor-reactive CD8 T cell receptor clonotypes
  by combining single-cell transcriptomics with functional validation of TCRs against autologous tumor cells. They report
  93 tumor-reactive TCR clonotypes across 3 genetically unstable and 6 genetically stable human PDAC tumors, indicating that
  individual tumors harbor multiple distinct tumor-reactive CD8 T cell clones. Treating these functionally validated clonotypes
  as independent tumor-specific CD8 T cell clones, the data imply an average on the order of 10 tumor-reactive CD8 T cell
  clones per PDAC tumor. In the QSPIO-PDAC model, this informs the parameter n_CD8_clones, which scales both the production
  of recognizable tumor antigen P1 and the rate of antigen-specific CD8 and Th activation in the tumor-draining lymph node.
target_id: n_CD8_clones_Meng2023_PDAC
