  value_snippet: IL-12, both in vivo and in vitro, induced a rapid (<90 min) reduction of tumor supportive macrophage activities
    and a concomitant increase in proinflammatory and proimmunogenic activities.
key_assumptions:
- Functional reprogramming of TAM cytokine production following IL-12 exposure reflects an underlying M2-to-M1 polarization
  process that is mechanistically represented by the Mac_M2 -> Mac_M1 transition in the QSPIO-PDAC model.
- The IL-12 treatment conditions (both in vivo and ex vivo) generate sufficiently high IL-12 (and, via downstream activation,
  IFNg) that the Hill-type modulation term in the full model is close to 1, so that the effective conversion rate equals k_M1_pol.
- The reported "rapid (<90 min)" time to observe loss of tumor-supportive cytokine production corresponds to at least one
  effective half-life of the M2-to-M1 polarization process; we encode uncertainty in the exact relationship via a Beta(2,2)
  prior over the ratio of polarization half-life to the 90 min upper bound.
- Macrophage polarization dynamics at the single-cell level can be approximated as a first-order process (exponential decay
  of M2 state into M1 state) under sustained IL-12 exposure, neglecting cell proliferation, death, and recruitment over this
  short timescale.
- Murine Lewis lung carcinoma TAM polarization kinetics are a reasonable proxy for PDAC TAMs/Human macrophages at the level
  of order-of-magnitude timescales, despite known context-dependent differences in the tumor microenvironment.
key_study_limitations:
- The Watkins et al. study characterizes functional changes in cytokine production rather than direct M1/M2 surface marker
  expression or transcriptional signatures; mapping functional reprogramming onto M1 vs M2 states is approximate.
- The reported timescale "<90 min" is qualitative and provides only an upper bound for reprogramming time, not a precise half-life;
  our conversion to a rate constant relies on additional assumptions encoded in the distribution_code.
- The tumor model is murine Lewis lung carcinoma rather than PDAC, and the species is mouse rather than human, introducing
  potential differences in macrophage biology and IL-12 signaling.
- In vivo IL-12 treatment involves complex indirect effects (e.g., NK and T cell activation and secondary IFNg production)
  that may accelerate or modulate TAM reprogramming relative to isolated cytokine exposure in the QSP model.
- Other macrophage fate processes in the full model (death, egress, recruitment) are neglected in this submodel because the
  reprogramming timescale is much shorter than typical turnover times, but this approximation may not hold under all conditions.
