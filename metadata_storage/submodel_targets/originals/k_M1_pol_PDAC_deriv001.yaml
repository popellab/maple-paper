calibration:
  identifiability_notes: This submodel constrains only the order of magnitude of k_M1_pol under conditions of strong IL-12
    (and associated IFNg) stimulation, based on a single summarized timescale (<90 min) for TAM functional reprogramming.
    The mapping from functional cytokine profile shift to stable M1 phenotypic polarization is approximate, and the conversion
    from an upper bound on reprogramming time to an effective half-life introduces additional uncertainty (encoded via a Beta
    prior over the half-life fraction). In the full QSPIO-PDAC model, k_M1_pol will be correlated with IL12_50 and IFNg_50
    (which determine how often the IL-12/IFNg modulation term is near 1) and with other macrophage turnover parameters (k_M2_pol,
    k_Mac_death, recruitment). Additional time-resolved measurements of M2-to-M1 marker expression (e.g., CD206 downregulation
    and iNOS/CD86 upregulation) under defined IL-12 and IFNg concentrations would be needed for tighter identification and
    for disentangling k_M1_pol from cytokine sensitivity parameters.
  independent_variable: null
  measurements:
  - distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    import math\n    # Upper bound\
      \ on the time required to observe strong functional reprogramming\n    t_max = inputs['t_reprogram_max_90min']  # Pint\
      \ quantity\n    t_max_min = t_max.to('minute').magnitude\n    # Assume the polarization half-life is a fraction r of\
      \ this upper bound, r ~ Beta(2, 2) on (0, 1)\n    r_samples = np.random.beta(2.0, 2.0, size=10000)\n    t_half_min =\
      \ r_samples * t_max_min\n    # Avoid zero-length half-lives\n    t_half_min = np.clip(t_half_min, 1.0, None)\n    t_half_days\
      \ = t_half_min / (60.0 * 24.0)\n    k_samples = math.log(2.0) / t_half_days\n    return {\n        'median': float(np.median(k_samples)),\n\
      \        'ci95_lower': float(np.percentile(k_samples, 2.5)),\n        'ci95_upper': float(np.percentile(k_samples, 97.5)),\n\
      \    }"
    evaluation_points:
    - 0.0
    likelihood:
      distribution: lognormal
      rationale: We approximate the derived distribution over k_M1_pol (obtained by sampling possible half-lives less than
        90 min) with a lognormal likelihood in log(k_M1_pol). This reflects positive support and multiplicative uncertainty
        in the rate constant.
    name: k_M1_pol_derived_from_90min
    observable: null
    sample_size: null
    sample_size_rationale: Not explicitly reported; the abstract summarizes consistent findings across multiple in vivo and
      in vitro experiments, so we treat the reported <90 min timescale as a single summarized observation.
    units: 1/day
    uses_inputs:
    - t_reprogram_max_90min
  model:
    data_rationale: Watkins et al. (2007) report that IL-12 treatment of tumor-bearing mice and ex vivo tumor-associated macrophages
      induces a rapid (<90 min) loss of tumor-supportive cytokine production (IL-10, MCP-1, migration inhibitory factor, TGFbeta)
      and gain of proinflammatory cytokines (TNFalpha, IL-15, IL-18). This functional reprogramming time is used as a proxy
      for the half-life of the M2-to-M1 polarization process under strong IL-12 stimulation.
    formula: k_M1_pol = ln(2) / t_half_days
    submodel_rationale: In the full QSPIO-PDAC model, M2-to-M1 polarization in the tumor compartment is modeled as a first-order
      transition V_T.Mac_M2 -> V_T.Mac_M1 with rate k_M1_pol*V_T.Mac_M2 multiplied by a Hill-type modulation of IL-12 and
      IFNg. Under strong IL-12 (and associated IFNg) exposure, this modulation term approaches 1, so the effective rate constant
      for M2-to-M1 conversion is k_M1_pol. The observed IL-12-induced rapid functional conversion of tumor-associated macrophages
      therefore constrains the magnitude of k_M1_pol assuming first-order kinetics at the cell level.
    type: direct_conversion
  parameters:
  - name: k_M1_pol
    prior:
      distribution: lognormal
      lower: null
      mu: 3.0
      rationale: Cellular-scale M2-to-M1 repolarization under strong IL-12 exposure occurs on a timescale <90 min in mouse
        tumor-associated macrophages; prior centered around ~20/day with wide uncertainty to allow for species and context
        differences and for mapping from functional reprogramming to phenotypic polarization.
      sigma: 1.0
      upper: null
    units: 1/day
  state_variables: null
