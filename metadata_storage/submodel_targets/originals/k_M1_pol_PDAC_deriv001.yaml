  title: IL-12 rapidly alters the functional profile of tumor-associated and tumor-infiltrating macrophages in vitro and in
    vivo
  year: 2007
secondary_data_sources: null
study_interpretation: Watkins et al. (2007) demonstrate that systemic or in vitro exposure of tumor-associated macrophages
  from Lewis lung carcinoma-bearing mice to IL-12 causes a rapid (<90 min) shift from an immunosuppressive, tumor-supportive
  cytokine profile (high IL-10, MCP-1, migration inhibitory factor, TGFbeta) to a proinflammatory, immunostimulatory profile
  (high TNFalpha, IL-15, IL-18). In the QSPIO-PDAC framework, this is interpreted as rapid reprogramming of M2-like TAMs toward
  an M1-like state under strong IL-12/IFNg signaling. Assuming first-order kinetics for the M2-to-M1 transition, the observed
  <90 min timescale provides an upper bound on the polarization half-life and thus constrains the magnitude of k_M1_pol when
  the IL-12/IFNg modulation term is saturated.
target_id: k_M1_pol_Watkins2007_IL12_TAM_reprogramming
