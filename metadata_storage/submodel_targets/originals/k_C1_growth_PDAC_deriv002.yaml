calibration:
  error_model:
  - evaluation_points: null
    likelihood:
      distribution: lognormal
      rationale: Tumor volume doubling times are positive and typically right-skewed across patients. Jang2015 reports a wide
        range of VDTs (18.3-417.8 days), consistent with a lognormal distribution. We use the range to approximate log-space
        variability and convert this to a CV for a lognormal likelihood.
    name: vdt_jang2015
    observable: null
    observation_code: "def derive_observation(inputs, sample_size, ureg):\n    import numpy as np\n    mean_vdt = inputs['jang_vdT_mean'].to('day')\n\
      \    vdt_min = inputs['jang_vdT_min'].to('day')\n    vdt_max = inputs['jang_vdT_max'].to('day')\n\n    # Approximate\
      \ log-space standard deviation assuming the observed range\n    # corresponds roughly to a 95% interval of a lognormal\
      \ distribution.\n    log_min = np.log(vdt_min.magnitude)\n    log_max = np.log(vdt_max.magnitude)\n    sd_log = (log_max\
      \ - log_min) / (2.0 * 1.96)\n\n    # Convert log-space SD to coefficient of variation (CV) for a lognormal.\n    cv\
      \ = np.sqrt(np.exp(sd_log**2) - 1.0)\n\n    n_patients = int(inputs['jang_n_patients'].magnitude)\n\n    return {\n\
      \        'value': mean_vdt,\n        'sd': cv,  # dimensionless CV for lognormal likelihood\n        'sd_uncertain':\
      \ True,\n        'n': n_patients,\n    }\n"
    sample_size: 22
    sample_size_rationale: Number of patients with prediagnostic MR imaging used to calculate PDAC VDT in Jang2015.
    units: day
    uses_inputs:
    - jang_vdT_mean
    - jang_vdT_min
    - jang_vdT_max
    - jang_n_patients
  forward_model:
    code: "def compute(params, inputs, ureg):\n    import numpy as np\n    k = params['k_C1_growth']  # 1/day\n    t_double\
      \ = np.log(2) / k\n    return t_double * ureg('day')\n"
    code_julia: "function compute(params, inputs)\n    k = params[\"k_C1_growth\"]  # 1/day\n    return log(2) / k  # in days\n\
      end"
    data_rationale: Jang2015 reports the mean tumor volume doubling time (TVDT) for untreated, early pancreatic ductal adenocarcinoma
      (PDAC) lesions imaged serially by MRI. The clinical observable is TVDT, not the instantaneous proliferation rate; an
      algebraic relationship between k_C1_growth and TVDT is therefore appropriate.
    formula: TVDT = ln(2) / k_C1_growth
    independent_variable: null
    state_variables: null
    submodel_rationale: 'In the full QSPIO-PDAC model, viable cancer cells C1 grow via a logistic term: dC1/dt = k_C1_growth
      * C1 * (1 - C_total/C_max). For small tumors where C_total << C_max, this reduces to exponential growth dC1/dt ≈ k_C1_growth
      * C1, with doubling time TVDT = ln(2)/k_C1_growth. The algebraic submodel uses this mechanistic relationship between
      k_C1_growth and tumor volume doubling time, effectively representing early-stage PDAC growth before carrying capacity
      effects are important and ignoring explicit death/killing terms so that k_C1_growth is calibrated as an effective net
      proliferation rate.'
    type: algebraic
  identifiability_notes: This submodel infers a single parameter, k_C1_growth, from a population-level estimate of tumor volume
    doubling time in early, untreated PDAC. Under the logistic growth law used in the full QSP model, early growth reduces
    to exponential with doubling time TVDT = ln(2)/k_C1_growth, so k_C1_growth is structurally identifiable from TVDT alone.
    However, the estimate represents an effective net proliferation rate, since natural cell death and endogenous immune killing
    are not separately modeled here. Inter-patient variability (large VDT range) and potential stage-dependence of growth
    rates are absorbed into the likelihood and prior rather than resolved mechanistically; thus, k_C1_growth should be interpreted
    as a typical baseline net proliferation rate for small, clinically detectable PDAC lesions rather than an invariant constant
    across all patients and stages.
  parameters:
  - name: k_C1_growth
    prior:
      distribution: lognormal
      lower: null
      mu: -5.39
      rationale: Centered on k = ln(2)/TVDT with TVDT ~150 days from early untreated PDAC in Jang2015, with a broad sigma
        to capture inter-patient variability and support from other PDAC doubling time summaries and solid-tumor PFS-based
        estimates.
      sigma: 0.7
      upper: null
    units: 1/day
