key_assumptions:
- Tumor growth between prediagnostic MRIs in Jang2015 can be approximated by logistic growth with C_total << C_max, so that
  dC1/dt ≈ k_C1_growth * C1 and TVDT ≈ ln(2)/k_C1_growth.
- The reported lesion volume doubling times primarily reflect intrinsic tumor cell kinetics under baseline host immunity and
  stroma, and can be mapped to an effective net proliferation rate without explicitly separating death and immune killing
  in the submodel.
- The observed minimum and maximum VDT values (18.3 and 417.8 days) approximate a 95 percent interval of an underlying lognormal
  distribution across patients, allowing the range to be used to estimate variability for the lognormal likelihood.
- Early, small PDAC lesions in this cohort have proliferation characteristics representative of the PDAC tumors modeled in
  QSPIO-PDAC, despite possible stage- and size-dependence of growth rates.
- Differences in imaging modality (MRI in Jang2015 vs. CT or other assessments in other clinical datasets) do not materially
  bias the estimated VDTs for the purpose of calibrating k_C1_growth.
key_study_limitations:
- Single-center retrospective cohort from a Korean tertiary hospital; patient demographics and tumor biology may not fully
  represent global PDAC populations.
- Sample size is modest (22 patients), and the wide VDT range (18.3-417.8 days) indicates substantial inter-patient heterogeneity
  that is only captured statistically, not mechanistically.
- Volume measurements and VDT estimates depend on MRI-based lesion segmentation, which may introduce systematic or random
  measurement errors, especially for small or poorly demarcated tumors.
- Growth is characterized only over the prediagnostic imaging interval; very early microscopic disease and later advanced
  stages may exhibit different proliferation dynamics than those captured here.
- The submodel ignores explicit death and immune-mediated killing terms present in the full QSP model, so k_C1_growth inferred
  here represents an effective net growth rate that may differ from the strictly intrinsic mitotic rate of PDAC cells.
