source_relevance:
  estimated_translation_uncertainty_fold: 2.0
  indication_match: exact
  indication_match_justification: The source study (Jang2015) specifically analyzes histologically confirmed pancreatic ductal
    adenocarcinoma (PDAC) in human patients. Tumor volume doubling times are measured from prediagnostic MRI scans in untreated
    individuals, providing direct information on the natural growth kinetics of PDAC primary tumors. This matches the target
    QSP model indication (human PDAC) and the same biological entity (viable cancer cells in the primary pancreatic tumor),
    making it an exact indication match for calibrating the cancer cell proliferation rate parameter k_C1_growth.
  perturbation_relevance: null
  perturbation_type: physiological_baseline
  source_quality: primary_human_clinical
  species_source: human
  species_target: human
  tme_compatibility: high
  tme_compatibility_notes: The tumors are early-stage, clinically detectable PDACs imaged prior to therapy. While some may
    be smaller and less desmoplastic than large, advanced PDAC, they still arise in the native pancreatic microenvironment
    with stromal and immune components intact. This is highly compatible with the QSPIO-PDAC tumor microenvironment, which
    is designed to represent untreated human PDAC.
  validation_warnings: null
study_interpretation: Jang2015 provides direct clinical measurements of tumor volume doubling time for untreated early PDAC
  lesions, derived from serial prediagnostic MRI scans in 22 patients. The reported mean VDT of 151.7 days (range 18.3-417.8
  days) reflects the net growth of viable cancer cells in vivo, encompassing intrinsic proliferation, natural cell death,
  and ongoing host immune interactions. By mechanistically linking VDT to the logistic growth term in the QSP model (TVDT
  = ln(2)/k_C1_growth for small tumors), these data constrain the effective cancer cell proliferation rate parameter k_C1_growth
  to values consistent with observed human PDAC growth kinetics.
