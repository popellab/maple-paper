calibration:
  identifiability_notes: Because the algebraic relationship C_meas·V = k_CCL2_sec·N_cells·t (ignoring degradation) directly
    links the measured concentration to k_CCL2_sec, the parameter is structurally identifiable given known N_cells, t, medium
    volume, and molecular weight. However, uncertainty in the true medium volume, possible chemokine degradation, and biological
    differences between benign prostate stroma and PDAC tumor/stromal cells mean that the experimental data constrain only
    the order of magnitude of k_CCL2_sec. This is reflected in the wide lognormal prior and the stochastic propagation of
    measurement uncertainty in the distribution_code.
  independent_variable: null
  measurements:
  - distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n\n    conc_mean = inputs['CCL2_prsc_unstim_mean'].magnitude\n\
      \    conc_sd = inputs['CCL2_prsc_unstim_sd'].magnitude\n\n    V_ml = inputs['V_medium_ml'].magnitude\n    N_cells =\
      \ inputs['n_cells_prsc'].magnitude\n    t_h = inputs['incubation_time_hours'].magnitude\n\n    # Sample concentrations,\
      \ truncating at zero to avoid negatives\n    samples = np.random.normal(conc_mean, conc_sd, 10000)\n    samples = np.clip(samples,\
      \ 1e-6, None)\n\n    MW = 8.7e3  # g/mol for MCP-1/CCL2\n\n    mass_pg = samples * V_ml\n    mass_g = mass_pg * 1e-12\n\
      \    moles = mass_g / MW\n    nmol = moles * 1e9\n\n    days = t_h / 24.0\n    k_samples = nmol / (N_cells * days)\n\
      \n    return {'median': float(np.median(k_samples))}"
    evaluation_points:
    - 0.0
    likelihood:
      distribution: lognormal
      rationale: '[Scrubbed due to ''secret'']'
    name: derived_k_CCL2_sec_from_PrSC
    observable: null
    sample_size: 3
    sample_size_rationale: Same replicate number as the underlying ELISA measurement (assumed n=3).
    units: nanomole/cell/day
    uses_inputs:
    - CCL2_prsc_unstim_mean
    - CCL2_prsc_unstim_sd
    - n_cells_prsc
    - incubation_time_hours
    - V_medium_ml
  model:
    data_rationale: '[Scrubbed due to ''secret'']'
    formula: k_CCL2_sec = f(CCL2_prsc_unstim_mean, CCL2_prsc_unstim_sd, n_cells_prsc, incubation_time_hours, V_medium_ml)
      converting pg/mL over 48 h in 1 mL from 1e5 cells to nmol/cell/day using MW≈8.7 kDa.
    submodel_rationale: '[Scrubbed due to ''secret'']'
    type: direct_conversion
  parameters:
  - name: k_CCL2_sec
    prior:
      distribution: lognormal
      lower: null
      mu: -20.64
      rationale: '[Scrubbed due to ''secret'']'
      sigma: 1.5
      upper: null
    units: nanomole/cell/day
  state_variables: null
