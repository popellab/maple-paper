key_assumptions:
- '[Scrubbed due to ''secret'']'
- The medium volume in 24-well plates was approximately 1 mL per well; deviations (e.g., 0.5–1.0 mL) primarily rescale the
  inferred k_CCL2_sec and are absorbed into the broad prior.
- '[Scrubbed due to ''secret'']'
- '[Scrubbed due to ''secret'']'
- The unstimulated PrSC condition (1,888±631 pg/mL) is more representative of chronic, low-grade inflammation in tumor stroma
  than are the high-cytokine stimulation conditions (IL-1β, IFN-γ, IL-2), which likely correspond to acute activation and
  would overestimate baseline k_CCL2_sec.
- '[Scrubbed due to ''secret'']'
key_study_limitations:
- '[Scrubbed due to ''secret'']'
- '[Scrubbed due to ''secret'']'
- Medium volume in 24-well plates was not reported and is assumed to be 1 mL, introducing an unquantified scaling uncertainty
  in k_CCL2_sec.
- '[Scrubbed due to ''secret'']'
- '[Scrubbed due to ''secret'']'
- PrSC are stromal fibroblast-like cells; PDAC CCL2 production involves both cancer cells and activated pancreatic stellate
  cells. The mapping from a single cell type to the lumped tumor-cell-based parameter k_CCL2_sec is approximate.
