calibration:
  error_model:
  - evaluation_points: null
    likelihood:
      distribution: lognormal
      rationale: Patient-to-patient TAM densities are positive and span more than an order of magnitude (range in CD68+ counts
        per HPF). A lognormal likelihood on the macrophage density naturally captures this multiplicative heterogeneity; the
        SD parameter is implemented as a coefficient of variation estimated from the reported range.
    name: tam_density_peritumor_cd68
    observable: null
    observation_code: "def derive_observation(inputs, sample_size, ureg):\n    import numpy as np\n    # Inputs arrive as\
      \ Pint quantities with declared units\n    med = inputs['cd68_peri_median_per_hpf']      # cell\n    low = inputs['cd68_peri_range_low_per_hpf']\
      \   # cell\n    high = inputs['cd68_peri_range_high_per_hpf'] # cell\n    thickness = inputs['section_thickness_um']\
      \    # micrometer\n    hpf_area = inputs['hpf_area_mm2']             # millimeter**2\n\n    # Convert thickness to millimeters\
      \ for volume calculation\n    thickness_mm = thickness.to('millimeter')\n\n    # Volume of one high-power field section\
      \ (mm^3)\n    vol = (hpf_area * thickness_mm).to('millimeter**3')\n\n    # Densities in cell/milliliter using Pint unit\
      \ conversion (1 mm^3 = 1 microliter)\n    rho_med_q = (med / vol).to('cell/milliliter')\n    rho_low_q = (low / vol).to('cell/milliliter')\n\
      \    rho_high_q = (high / vol).to('cell/milliliter')\n\n    rho_med = rho_med_q.magnitude\n    rho_low = rho_low_q.magnitude\n\
      \    rho_high = rho_high_q.magnitude\n\n    # Approximate SD from reported range assuming ~95% of observations between\
      \ low and high\n    sd_rho = (rho_high - rho_low) / (2.0 * 1.96)\n    # Coefficient of variation used as lognormal SD\
      \ parameter\n    cv = sd_rho / rho_med\n\n    value = rho_med_q  # Pint Quantity with units cell/milliliter\n    return\
      \ {\n        'value': value,\n        'sd': cv,\n    }\n"
    sample_size: 70
    sample_size_rationale: Seventy PDAC patients were included in the immunohistochemical analysis for CD68/CD163; for each
      case, counts from three random peripheral high-power fields were averaged.
    units: cell/milliliter
    uses_inputs:
    - cd68_peri_median_per_hpf
    - cd68_peri_range_low_per_hpf
    - cd68_peri_range_high_per_hpf
    - section_thickness_um
    - hpf_area_mm2
  forward_model:
    code: "def compute(params, inputs, ureg):\n    import numpy as np\n    # Parameter to infer; handle both plain floats\
      \ and Pint quantities\n    k_raw = params['k_Mac_rec']\n    k_rec = getattr(k_raw, 'magnitude', k_raw)\n    # Fixed\
      \ inputs\n    tau_raw = inputs['macrophage_res_time_days']\n    tau = getattr(tau_raw, 'magnitude', tau_raw)\n    H\
      \ = inputs['H_CCL2_PD']  # dimensionless Hill term for CCL2 in baseline PDAC\n\n    # Effective first-order macrophage\
      \ loss rate (1/day)\n    k_loss = np.log(2.0) / tau\n\n    # Steady-state total TAM density (cell/milliliter), numeric\
      \ value\n    rho_val = (k_rec / k_loss) * H\n    return rho_val * ureg('cell/milliliter')\n"
    code_julia: "function compute(params, inputs)\n    # Numeric implementation; units are handled externally in the inference\
      \ engine\n    k_rec = params[\"k_Mac_rec\"]\n    tau = inputs[\"macrophage_res_time_days\"]\n    H = inputs[\"H_CCL2_PD\"\
      ]  # dimensionless\n    # Effective loss rate 1/day\n    k_loss = log(2.0) / tau\n    rho = (k_rec / k_loss) * H\n \
      \   return rho\nend"
    data_rationale: Chen et al. quantified CD68+ tumor-associated macrophages per high-power field in peritumoral regions
      of resected human PDAC, providing a cross-sectional estimate of steady-state TAM density rather than time-course data.
      Under the assumption that macrophage numbers are in quasi-steady state over weeks in these untreated tumors, an algebraic
      steady-state relationship between recruitment rate, loss rate, and observed density is appropriate.
    formula: rho_TAM = (k_Mac_rec / k_Mac_loss) * H_CCL2_PD, with k_Mac_loss = ln(2) / macrophage_res_time_days and H_CCL2_PD
      ≈ 1 for CCL2-saturated PDAC tumors.
    independent_variable: null
    state_variables: null
    submodel_rationale: In the full QSPIO-PDAC model, k_Mac_rec appears in the recruitment reaction null -> V_T.Mac_M1 with
      rate k_Mac_rec * V_T * (CCL2 / (CCL2 + CCL2_50)). At the level of macrophage density per tumor volume (rho_TAM = (Mac_M1
      + Mac_M2)/V_T), and assuming (i) CCL2 is chronically elevated in PDAC so that CCL2 >> CCL2_50 and the Hill term is near
      1, and (ii) macrophage numbers are in approximate steady state where recruitment balances effective loss (death + egress
      + net polarization out of the counted pool), we obtain rho_TAM,ss = (k_Mac_rec / k_Mac_loss) * H_CCL2_PD with H_CCL2_PD
      ≈ 1. Here k_Mac_loss is an effective first-order loss rate reflecting average residence time of TAMs in tumor tissue.
      In the submodel we compute k_Mac_loss from an assumed macrophage residence time and treat the algebraic steady-state
      relation as the forward model linking k_Mac_rec to observed TAM density. This preserves the mechanistic role of k_Mac_rec
      as the source term for macrophages modulated by CCL2, but collapses fast polarization dynamics and local proliferation
      into an effective loss timescale.
    type: algebraic
  identifiability_notes: With a single steady-state measurement of TAM density in peritumoral PDAC tissue and no independent
    time-course information, only the ratio k_Mac_rec / k_Mac_loss is directly identifiable. In this submodel, the effective
    loss rate k_Mac_loss is computed from an assumed macrophage residence time (macrophage_res_time_days), so k_Mac_rec is
    effectively constrained but inherits uncertainty from that assumption. The CCL2 Hill term is fixed near 1 based on high
    CCL2 expression in PDAC; any deviation from saturation would scale the inferred k_Mac_rec. Additional longitudinal data
    on TAM depletion and re-accumulation (for example after CCR2 or CSF1R blockade) would be needed to independently constrain
    macrophage residence time and recruitment rate, and separate bone-marrow recruitment from local self-renewal contributions.
  parameters:
  - name: k_Mac_rec
    prior:
      distribution: lognormal
      lower: null
      mu: 14.66
      rationale: Centered so that, for a representative TAM density of ~1e8 cell/mL in peritumoral PDAC tissue and an assumed
        macrophage residence time of ~30 days, the implied recruitment rate k_Mac_rec ~ 2e6 cell/(mL*day). A broad sigma=1
        log-space prior (roughly 3-fold SD) allows for uncertainty in residence time, CCL2 saturation, and inter-patient heterogeneity.
      sigma: 1.0
      upper: null
    units: cell/(milliliter*day)
