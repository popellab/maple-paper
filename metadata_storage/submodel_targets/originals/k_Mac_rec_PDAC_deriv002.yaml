source_relevance:
  estimated_translation_uncertainty_fold: 2.0
  indication_match: exact
  indication_match_justification: The primary dataset is a retrospective clinical study of human pancreatic ductal adenocarcinoma
    (PDAC) surgical specimens. CD68-positive tumor-associated macrophages were quantified in central and peritumoral regions
    of PDAC lesions, exactly matching the indication and anatomic site of the QSPIO-PDAC model. The submodel uses these data
    to estimate steady-state TAM density in PDAC, which is directly relevant to calibrating the macrophage recruitment rate
    parameter in the same disease context.
  perturbation_relevance: null
  perturbation_type: pathological_state
  source_quality: primary_human_clinical
  species_source: human
  species_target: human
  tme_compatibility: high
  tme_compatibility_notes: The specimens are untreated human PDAC tumors with characteristic dense fibrosis and abundant tumor-associated
    macrophage infiltration. This closely reflects the desmoplastic, immunosuppressive tumor microenvironment represented
    in the QSPIO-PDAC model, including high myeloid content and stromal barriers. No experimental manipulation alters baseline
    trafficking; data reflect endogenous TAM accumulation in PDAC.
  validation_warnings: null
study_interpretation: Chen et al. provide quantitative immunohistochemical counts of CD68+ tumor-associated macrophages in
  central and peritumoral regions of human PDAC, showing substantially higher macrophage infiltration in PDAC than in chronic
  pancreatitis and enrichment at the tumor periphery. By combining the reported median peripheral CD68+ counts per 400x high-power
  field, the section thickness, and a standard HPF area, we estimate a typical TAM density on the order of 1e8 cells per mL
  of peritumoral PDAC tissue. Assuming that macrophage numbers are in quasi-steady state over weeks and that CCL2-driven recruitment
  is near saturation in PDAC, this steady-state density constrains the ratio of macrophage recruitment to effective loss rate.
  Fixing an effective TAM residence time based on macrophage self-renewal literature then allows us to infer a plausible magnitude
  for k_Mac_rec consistent with the full QSP model reaction null -> V_T.Mac_M1.
target_id: k_Mac_rec_PDAC_TAM_recruitment_Chen2015
