key_assumptions:
- Resected human PDAC tumors are approximated as being in a quasi-steady state with respect to intratumoral effector CD8+
  T cells at the time of surgery (no recent large perturbations in trafficking).
- The mechanistic recruitment term q_CD8_T_in * V_T * V_C.CD8 * (C_total^2/(C_total^2+Kc_rec)) * (1 - H_CXCL12_Texcl) can
  be approximated in the PDAC tumor center by an effective linear relationship between q_CD8_T_in and steady-state CD8+ density,
  condensed into the scale factor pdac_cd8_center_scale_factor.
- The scale factor is estimated from typical human circulating CD8+ T cell numbers, tumor sizes at resection, strong but incomplete
  CXCL12-mediated exclusion, and an effective CD8+ loss rate on the order of one per day; uncertainty in these quantities
  is captured as translation uncertainty and by a wide prior on q_CD8_T_in.
- CD8+ IHC counts in the tumor center predominantly reflect effector and effector-memory CD8+ cells relevant for antitumor
  activity, and non-tumor-specific CD8+ subpopulations do not dominate the signal.
- Heterogeneity of CD8+ density across the tumor is reasonably summarized by the reported mean and interquartile range for
  the tumor center; we approximate measurement variability using a lognormal likelihood with SD inferred from the IQR assuming
  approximate normality on the linear scale.
key_study_limitations:
- The PDAC data are cross-sectional at resection and do not provide time-resolved infiltration or clearance kinetics, so the
  inferred q_CD8_T_in is sensitive to assumptions about intratumoral CD8+ loss rates.
- CD8+ density is measured per unit area (cells/mm2) in histologic sections, whereas the QSP model is formulated in terms
  of cell numbers per tumor volume; we approximate the volumetric-to-areal conversion within the scale factor rather than
  modeling section thickness explicitly.
- The cohort represents resectable PDAC, which may differ in immune infiltration from unresectable or metastatic disease modeled
  in some QSP applications.
- Multiplex IHC and automated image analysis reduce but do not eliminate technical variability in cell detection and segmentation,
  contributing to additional noise beyond the reported distribution across patients.
- Auxiliary KPC mouse data on CD8+ infiltration kinetics and human melanoma/CRC CD8+ densities are used qualitatively for
  mechanistic context and prior setting but not directly linked in the algebraic forward model, so cross-species and cross-tissue
  translation remains approximate.
