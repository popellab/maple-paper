calibration:
  error_model:
  - evaluation_points: null
    likelihood:
      distribution: lognormal
      rationale: CD8+ T cell densities are positive, right-skewed across patients, and vary over orders of magnitude; a lognormal
        likelihood on density is appropriate.
    name: pdac_cd8_center_density
    observable: null
    observation_code: "def derive_observation(inputs, sample_size, ureg):\n    mean = inputs['pdac_cd8_center_mean']\n   \
      \ q1 = inputs['pdac_cd8_center_q1']\n    q3 = inputs['pdac_cd8_center_q3']\n    factor = inputs['iqr_to_sd_factor']\n\
      \    iqr = (q3 - q1).to(mean.units)\n    sd = iqr / factor\n    cv = sd.magnitude / mean.magnitude\n    n = int(inputs['pdac_cd8_center_n'].magnitude)\n\
      \    return {\n        'value': mean,\n        'sd': cv,\n        'sd_uncertain': True,\n        'n': n,\n    }"
    sample_size: 214
    sample_size_rationale: 214 resected PDAC specimens with whole-tissue multiplex IHC quantification of CD8+ cell density.
    units: cell / millimeter**2
    uses_inputs:
    - pdac_cd8_center_mean
    - pdac_cd8_center_q1
    - pdac_cd8_center_q3
    - pdac_cd8_center_n
    - iqr_to_sd_factor
  forward_model:
    code: "def compute(params, inputs, ureg):\n    q = params['q_CD8_T_in']\n    scale = inputs['pdac_cd8_center_scale_factor']\n\
      \    val = q * scale\n    return val * ureg('cell / millimeter**2')"
    code_julia: "function compute(params, inputs)\n    q = params[\"q_CD8_T_in\"]\n    scale = inputs[\"pdac_cd8_center_scale_factor\"\
      ]\n    val = q * scale\n    return val\nend"
    data_rationale: The PDAC study reports a static snapshot of intratumoral CD8+ T cell density by IHC (cells/mm2) in resected
      tumors rather than time-resolved trafficking. At baseline, intratumoral effector CD8+ counts can be approximated as
      a quasi-steady state between influx from blood and loss (death/exhaustion/egress), making an algebraic steady-state
      relationship appropriate.
    formula: cd8_density_pdac_center = q_CD8_T_in * pdac_cd8_center_scale_factor
    independent_variable: null
    state_variables: null
    submodel_rationale: In the full QSP model, the influx of CD8+ T cells into tumor is q_CD8_T_in * V_T * V_C.CD8 * (C_total^2/(C_total^2+Kc_rec))
      * (1 - H_CXCL12_Texcl), and intratumoral CD8+ T cells are removed via death and exhaustion. Under quasi-steady-state
      and for macroscopic PDAC tumors (C_total >> Kc_rec) with approximately constant exclusion term absorbed into an effective
      efficiency, the steady-state CD8+ density in the tumor center is proportional to q_CD8_T_in. The scale factor pdac_cd8_center_scale_factor
      approximates V_C.CD8, recruitment efficiency, effective loss rate, and geometric conversion from volumetric to areal
      density, preserving the linear dependence on q_CD8_T_in that arises from the mechanistic trafficking reaction.
    type: algebraic
  identifiability_notes: With a single cross-sectional measurement of CD8+ density in human PDAC, only the product q_CD8_T_in
    * pdac_cd8_center_scale_factor is directly constrained. We treat the scale factor as a fixed mechanistic estimate (central
    CD8 pool, effective recruitment efficiency, loss rate, and geometric conversion); thus the data primarily constrain q_CD8_T_in
    under this assumption. If the effective loss rate or recruitment efficiency are substantially different from the assumed
    values, q_CD8_T_in will be biased inversely. Incorporating additional time-resolved data (e.g., KPC mouse infiltration
    kinetics) or independent estimates of intratumoral CD8 residence time would be needed to separately identify transport
    and loss rates.
  parameters:
  - name: q_CD8_T_in
    prior:
      distribution: lognormal
      lower: null
      mu: -18.0
      rationale: Centered to give prior mass near q_CD8_T_in around 10^-8 1/(cm^3*min), which combined with the scale factor
        produces CD8 densities on the order of 10^2 cells/mm2, matching PDAC IHC data within an order of magnitude while allowing
        wide uncertainty.
      sigma: 2.0
      upper: null
    units: 1 / (centimeter**3 * minute)
