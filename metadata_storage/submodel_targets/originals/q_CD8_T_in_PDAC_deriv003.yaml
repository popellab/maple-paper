source_relevance:
  estimated_translation_uncertainty_fold: 2.0
  indication_match: exact
  indication_match_justification: The primary data source measures CD8+ tumor-infiltrating lymphocyte density by multiplex
    IHC directly in resected human pancreatic ductal adenocarcinoma. This matches the target indication of the QSPIO-PDAC
    model, including the desmoplastic, T cell-excluded tumor microenvironment. The measurement region (tumor center) corresponds
    to the immunologically cold compartment the model aims to represent.
  perturbation_relevance: null
  perturbation_type: pathological_state
  source_quality: primary_human_clinical
  species_source: human
  species_target: human
  tme_compatibility: high
  tme_compatibility_notes: Human PDAC tumors in this cohort display the characteristic dense desmoplastic stroma and restricted
    CD8+ infiltration in the tumor center, matching the PDAC tumor microenvironment represented in the QSP model.
  validation_warnings: null
study_interpretation: Masugi et al. quantified CD8+ T cell densities in whole sections of resected human PDAC using multiplex
  immunohistochemistry and image analysis, reporting mean and distributional statistics for the tumor center, tumor margin,
  and whole tumor. The tumor center showed relatively low CD8+ density compared with the invasive margin, reflecting T cell
  exclusion from the tumor core in most patients. We use the mean CD8+ density in the tumor center as a direct constraint
  on the quasi-steady-state intratumoral CD8+ population predicted by the QSP model under baseline (treatment-naive) conditions.
  Under a steady-state balance between influx from blood, driven by q_CD8_T_in, and loss by death/exhaustion/egress, the intratumoral
  CD8+ density is linearly proportional to q_CD8_T_in. We approximate the proportionality constant using independent estimates
  of the circulating CD8+ pool, effective recruitment efficiency (incorporating C_total dependence and CXCL12-mediated exclusion),
  and net loss rate, and encapsulate this in pdac_cd8_center_scale_factor. Cross-tissue reference values from colorectal cancer
  (median CD8+ densities in core and invasive margin) and advanced melanoma (CD8+ TIL density cutoff associated with anti-PD-1
  response) are extracted as auxiliary proxy measurements to provide context for how PDAC compares to more T cell-permissive
  tumors.
