source_relevance:
  estimated_translation_uncertainty_fold: 5.0
  indication_match: related
  indication_match_justification: The primary study (Xiao et al. 2015, PLoS One 10(11):e0141462) investigates pancreatic stellate
    cells in a mouse model of chronic pancreatitis and in vitro, not PDAC. Both chronic pancreatitis and PDAC feature activated
    PSCs and pancreatic fibrosis with dense desmoplastic stroma, so PSC activation and apoptosis mechanisms are closely related.
    However, inflammatory cues and cytokine milieu differ from PDAC, and the in vitro experiments include pharmacological
    retinoic acid exposure, so we treat this as a related rather than exact indication and inflate uncertainty accordingly.
  perturbation_relevance: Retinoic acid is applied at micromolar doses to cultured mouse PSCs for several days, strongly promoting
    apoptosis and inhibiting activation. The inferred half-life therefore represents an upper-bound (fast) death timescale
    under strong pro-apoptotic stimulation rather than a basal in vivo turnover rate of human PDAC CAFs. The broad prior around
    ln(2)/5 days and the wide lognormal spread in the conversion model are intended to down-weight this pharmacological context
    and treat the RA system as providing only the order of magnitude for k_apsc_death.
  perturbation_type: pharmacological
  source_quality: primary_animal_in_vitro
  species_source: mouse
  species_target: human
  tme_compatibility: moderate
  tme_compatibility_notes: The in vitro PSC culture lacks the full PDAC tumor microenvironment, but the in vivo component
    of the Xiao et al. study uses a murine chronic pancreatitis model with dense fibrosis and activated stellate cells, which
    resembles aspects of the desmoplastic PDAC stroma. Differences in inflammatory drivers, absence of malignant epithelium
    in CP, and culture conditions motivate treating TME compatibility as moderate, not high.
  validation_warnings: []
study_interpretation: Xiao et al. (2015) demonstrated that retinoic acid attenuates pancreatic fibrosis in a mouse chronic
  pancreatitis model and, in vitro, suppresses proliferation and promotes apoptosis of cultured mouse PSCs over a 5-day period.
  The in vitro time window over which substantial PSC apoptosis is observed suggests that activated PSCs can be cleared on
  a multi-day timescale under strong pro-apoptotic signaling. Under the assumption of first-order PSC death, this timescale
  can be mapped to an effective death rate constant k_apsc_death via k = ln(2)/t_half. In the QSPIO-PDAC model, this provides
  an order-of-magnitude anchor for the aPSC death rate used in the V_T.aPSC -> null reaction, with wide uncertainty to account
  for species, indication, and pharmacological differences.
target_id: k_apsc_death_RA_Xiao2015
