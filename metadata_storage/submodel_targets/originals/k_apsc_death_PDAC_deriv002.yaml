calibration:
  identifiability_notes: This submodel does not use a direct quantitative apoptosis readout; instead, it treats the 5-day
    culture period over which Xiao et al. report clear RA-induced PSC apoptosis as an approximate characteristic half-life
    for activated PSCs under strong pro-apoptotic stimulation. The resulting estimate of k_apsc_death is therefore weakly
    data-informed and should be interpreted as setting the correct order of magnitude rather than a tightly constrained value.
    The broad lognormal prior and conversion distribution reflect large uncertainty due to (i) pharmacological RA exposure,
    (ii) mouse-to-human translation, and (iii) chronic pancreatitis vs PDAC stromal context. Additional time-resolved quantitative
    PSC apoptosis data (e.g., Annexin V fractions at multiple time points under defined conditions) would be required to more
    precisely identify k_apsc_death and to separate natural turnover from drug-induced apoptosis.
  independent_variable: null
  measurements:
  - distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    # Half-life in days (assumed characteristic\
      \ timescale for substantial PSC apoptosis\n    # in the RA-treated culture system of Xiao et al. 2015)\n    t_half =\
      \ inputs['half_life_apsc'].magnitude\n    # Place a broad lognormal distribution on t_half centered at the nominal value,\n\
      \    # with sigma_log = 1 (about an order-of-magnitude 95% interval).\n    mu_log = np.log(t_half)\n    sigma_log =\
      \ 1.0\n    t_samples = np.random.lognormal(mu_log, sigma_log, size=10000)\n    k_samples = np.log(2.0) / t_samples\n\
      \    return {\n        'median': float(np.median(k_samples)),\n        'ci95_lower': float(np.percentile(k_samples,\
      \ 2.5)),\n        'ci95_upper': float(np.percentile(k_samples, 97.5)),\n    }"
    evaluation_points: []
    likelihood:
      distribution: lognormal
      rationale: The derived death rate is positive and may vary over orders of magnitude; a lognormal likelihood on k_apsc_death
        is appropriate when propagating uncertainty from the assumed half-life distribution.
    name: k_apsc_death_from_half_life
    observable: null
    sample_size: null
    sample_size_rationale: null
    units: 1/day
    uses_inputs:
    - half_life_apsc
  model:
    data_rationale: Xiao et al. cultured primary mouse PSCs with retinoic acid (RA) and observed substantial apoptosis over
      a 5-day period, indicating that activated PSCs can be cleared on a multi-day timescale under strong pro-apoptotic stimulation.
      We approximate this timescale by a characteristic half-life for activated PSCs under these conditions.
    formula: k_apsc_death = ln(2) / half_life_apsc
    submodel_rationale: In the full QSPIO-PDAC model, activated PSCs (aPSCs) are removed via a first-order death reaction
      V_T.aPSC -> null with rate k_apsc_death * V_T.aPSC. For a first-order process, the death rate constant is related to
      the cell half-life by k_apsc_death = ln(2)/t_half. The direct_conversion submodel maps an assumed PSC half-life, informed
      by RA-induced apoptosis experiments, into the corresponding first-order death rate constant used in the tumor compartment
      reaction V_T.aPSC -> null.
    type: direct_conversion
  parameters:
  - name: k_apsc_death
    prior:
      distribution: lognormal
      lower: null
      mu: -1.97
      rationale: Centered so that median k_apsc_death corresponds to a half-life of about 5 days (ln(2)/5 ≈ 0.14 1/day), with
        one order-of-magnitude uncertainty to account for species, indication, and pharmacological differences between the
        RA-treated mouse PSC system and human PDAC CAFs.
      sigma: 1.0
      upper: null
    units: 1/day
  state_variables: null
experimental_context:
  cell_lines: null
  cell_types:
  - isolation_method: Isolated from mouse pancreas; PSCs cultured on plastic and activated in vitro as described by Xiao et
