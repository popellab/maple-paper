source_relevance:
  estimated_translation_uncertainty_fold: 5.0
  indication_match: exact
  indication_match_justification: The primary PDAC study (Nummer et al., J Natl Cancer Inst 2007, doi:10.1093/jnci/djm064)
    quantifies Treg infiltration into human pancreatic ductal adenocarcinoma tissue versus adjacent nonmalignant pancreas
    and measures adhesion and transmigration of patient-derived Tregs across autologous tumor endothelium. These data directly
    probe the endothelial mechanisms underlying selective Treg recruitment into PDAC tumors, which is exactly the biology
    represented by q_Treg_T_in in the QSP model. The CD34+ progenitor transendothelial migration study (Voermans et al., Stem
    Cells 2000, doi:10.1634/stemcells.18-6-435) provides generic human leukocyte transendothelial migration kinetics (46%
    crossing in 4 h) used only to set the overall timescale of endothelial transmigration; this is treated as a mechanistic
    proxy with large uncertainty.
  perturbation_relevance: Nummer et al. studied PDAC patients with established tumors, so measured Treg infiltration and transmigration
    reflect a pathological, immunosuppressive tumor microenvironment with upregulated addressins. These values likely represent
    upper-bound or high-end Treg recruitment efficiencies compared to early or micro-metastatic disease. Voermans et al. examined
    primary human CD34+ progenitors under IL-1beta-stimulated bone marrow endothelium, which models an inflamed but non-malignant
    endothelium; this is used only to fix the generic timescale of transendothelial migration and may underestimate or overestimate
    Treg migration in PDAC, motivating the broad uncertainty assumed in the distribution code.
  perturbation_type: pathological_state
  source_quality: primary_human_clinical
  species_source: human
  species_target: human
  tme_compatibility: high
  tme_compatibility_notes: The key Treg transmigration data come from human PDAC tumors and autologous tumor-derived endothelial
    cells, which closely match the intended PDAC tumor microenvironment in the QSP model, including tumor-induced upregulation
    of addressins (MAdCAM-1, VCAM-1, CD62-E, CD166) that mediate selective Treg homing. The additional CD34+ migration data
    are from bone marrow endothelium stimulated with IL-1beta, which differs from PDAC vasculature but mainly inform the time
    scale of endothelial migration and not PDAC-specific selectivity; this is handled via proxy status and wide uncertainty.
  validation_warnings: []
study_interpretation: Nummer et al. demonstrate that human PDAC tumors harbor higher densities of infiltrating Tregs than
  adjacent nonmalignant pancreas (120 versus 80 cells/mm^2) and that patient-derived Tregs adhere to and transmigrate through
  autologous tumor endothelium more efficiently than conventional CD4+ T cells (approximately 1.5-fold higher transmigrated
  cell numbers in vitro and increased accumulation in vivo). These findings support modeling PDAC tumor endothelium as selectively
  permissive to Treg extravasation. Voermans et al. quantify the kinetics of human CD34+ cell migration across bone marrow
  endothelium, showing that roughly 46% of cells cross the endothelial barrier within 4 h under SDF-1 stimulation. By combining
  the generic first-order migration kinetics from Voermans et al. with the PDAC-specific fold increase in Treg transmigration
  versus conventional CD4+ T cells from Nummer et al., we obtain an approximate first-order rate constant for Treg extravasation
  across tumor endothelium. Mapping this rate constant onto the structure of the QSP model, where q_Treg_T_in multiplies tumor
  volume and central Treg numbers in a first-order flux term, yields an order-of-magnitude calibration for q_Treg_T_in that
  is consistent with human PDAC biology while explicitly acknowledging substantial uncertainty.
target_id: q_Treg_T_in_extravasation_PDAC
