calibration:
  identifiability_notes: Only a single effective data source (CD34+ transendothelial migration fraction scaled by PDAC-specific
    Treg versus conventional CD4+ transmigration ratio) directly informs q_Treg_T_in in this submodel, and both pieces of
    data are themselves proxies for true in vivo Treg extravasation into PDAC tumors. The resulting constraint on q_Treg_T_in
    is therefore weak and primarily order-of-magnitude, reflected in a broad prior and wide sampling distributions. In the
    full QSP model, q_Treg_T_in will be correlated with other trafficking parameters (e.g., CCR5-mediated recruitment k_CCR5_Treg_rec,
    central and peripheral Treg pool sizes, and Treg death/clearance rates). To improve identifiability, additional datasets
    with time-resolved in vivo Treg tumor infiltration (e.g., longitudinal imaging of labeled Tregs in PDAC or closely related
    solid tumors) and independent estimates of Treg residence times in tumors would be valuable.
  independent_variable: null
  measurements:
  - distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    # Base CD34+ migration fraction\
      \ over 4 h\n    f_hpc = inputs['cd34_migration_fraction_4h'].magnitude  # ~0.46\n    # Assume a broad 20% coefficient\
      \ of variation for this fraction (proxy cell type and assay)\n    cv_f = 0.20\n    sigma_f = np.sqrt(np.log(1.0 + cv_f**2))\n\
      \    mu_f = np.log(f_hpc) - 0.5 * sigma_f**2\n    f_hpc_samples = np.random.lognormal(mean=mu_f, sigma=sigma_f, size=10000)\n\
      \n    # PDAC-specific fold-increase of Treg transmigration vs conventional CD4+ T cells\n    n_conv = inputs['treg_transmigration_conventional_invitro_cells'].magnitude\n\
      \    n_treg = inputs['treg_transmigration_treg_invitro_cells'].magnitude\n    r_mean = float(n_treg / n_conv)  # ~1.49\n\
      \    # Assume 25% CV for this ratio to capture experimental & biological variability\n    cv_r = 0.25\n    sigma_r =\
      \ np.sqrt(np.log(1.0 + cv_r**2))\n    mu_r = np.log(r_mean) - 0.5 * sigma_r**2\n    r_samples = np.random.lognormal(mean=mu_r,\
      \ sigma=sigma_r, size=10000)\n\n    # Effective Treg migration fraction over 4 h, clipped to a plausible range\n   \
      \ f_treg_samples = f_hpc_samples * r_samples\n    f_treg_samples = np.clip(f_treg_samples, 0.01, 0.95)\n\n    # 4 h\
      \ migration time in hours, convert to minutes\n    tau_hr = inputs['migration_time_4h_hr'].magnitude\n    tau_min =\
      \ tau_hr * 60.0\n    # Nominal tumor volume of 1 cm^3 is absorbed into q units (1/(cm^3*min)), so V_T_ref = 1\n    V_T_ref\
      \ = 1.0\n\n    # First-order relation: f = 1 - exp(-k_in * tau_min), with k_in = q_Treg_T_in * V_T_ref\n    k_in_samples\
      \ = -np.log(1.0 - f_treg_samples) / tau_min\n    q_samples = k_in_samples / V_T_ref\n\n    return {\n        'median':\
      \ float(np.median(q_samples)),\n        'ci95_lower': float(np.percentile(q_samples, 2.5)),\n        'ci95_upper': float(np.percentile(q_samples,\
      \ 97.5)),\n    }\n"
    evaluation_points:
    - 0.0
    likelihood:
      distribution: lognormal
      rationale: We interpret the migration-derived distribution for q_Treg_T_in as pseudo-data on this rate constant. Because
        the underlying measurements are positive and likely multiplicatively distributed across experiments, a lognormal likelihood
        is appropriate. The median and 95% CI from derive_distribution are used to parameterize this likelihood.
    name: q_Treg_T_in_derived_from_migration
    observable: null
    sample_size: null
    sample_size_rationale: The CD34+ migration fraction and PDAC Treg transmigration counts are summary values from in vitro
      assays; replicate numbers are not clearly specified in the abstracts, so we treat them as point estimates and reflect
      uncertainty via broad assumed coefficients of variation in the distribution code rather than explicit n.
    units: 1/(cm^3*minute)
    uses_inputs:
    - cd34_migration_fraction_4h
    - migration_time_4h_hr
    - treg_transmigration_conventional_invitro_cells
    - treg_transmigration_treg_invitro_cells
  model:
    data_rationale: The key experimental data are (1) human CD34+ hematopoietic progenitor cells showing approximately 46%
      transendothelial migration across IL-1beta-stimulated human bone marrow endothelium after 4 h in response to SDF-1,
      and (2) human PDAC patient-derived Tregs exhibiting higher adhesion and transmigration across autologous tumor-derived
      endothelium than conventional CD4+ T cells, with 4976 versus 3332 transmigrated cells in vitro. These assays provide
      a fraction of circulating cells that cross an endothelial barrier over a defined time interval, which is naturally described
      by a first-order migration process.
    formula: q_Treg_T_in = -ln(1 - f_Treg) / (migration_time_4h_hr * 60 * V_T_ref); here f_Treg is inferred from cd34_migration_fraction_4h
      scaled by the ratio treg_transmigration_treg_invitro_cells / treg_transmigration_conventional_invitro_cells, migration_time_4h_hr
      is in hours, and V_T_ref is a nominal tumor volume of 1 cm^3.
    submodel_rationale: In the full QSP PDAC model, q_Treg_T_in appears in flux terms of the form q_Treg_T_in * V_T * V_C.Treg
      * (C_total^2 / (C_total^2 + Kc_rec)), i.e., a first-order extravasation rate from the central compartment into the tumor
      that scales with tumor volume and a recruitment signal. If C_total is large (advanced tumor, recruitment term ~1) and
      tumor volume is set to a nominal 1 cm^3, the effective per-cell homing rate constant from blood to tumor is k_in = q_Treg_T_in
      * V_T. Assuming first-order kinetics, the fraction of blood Tregs that transmigrate in time tau is f_Treg = 1 - exp(-k_in
      * tau). Solving for q_Treg_T_in gives q_Treg_T_in = -ln(1 - f_Treg) / (tau * V_T). We estimate f_Treg by scaling the
      CD34+ migration fraction (0.46 over 4 h) by the observed 1.49-fold higher transmigration of Tregs vs conventional CD4+
      T cells in PDAC endothelium, thereby obtaining an effective f_Treg, and then compute q_Treg_T_in via this analytical
      relation. This preserves the mechanistic role of q_Treg_T_in as a first-order extravasation coefficient while using
      simplified conditions (saturated recruitment signal, nominal tumor volume, neglect of CCR5-specific recruitment and
      back-flux).
    type: direct_conversion
  parameters:
  - name: q_Treg_T_in
    prior:
      distribution: lognormal
      lower: null
      mu: -5.34
      rationale: Center of prior corresponds to an effective Treg extravasation rate constant of ~4.8e-3 1/min for a nominal
        1 cm^3 tumor volume, derived from generic human CD34+ cell transendothelial migration fractions over 4 h combined
        with PDAC-specific data showing ~1.5-fold higher transmigration for Tregs vs conventional CD4+ T cells. Wide sigma
        (1.0 in log-space) reflects substantial uncertainty due to use of proxy cell types, in vitro assays, and tumor-type
        differences.
      sigma: 1.0
      upper: null
    units: 1/(cm^3*minute)
  state_variables: null
