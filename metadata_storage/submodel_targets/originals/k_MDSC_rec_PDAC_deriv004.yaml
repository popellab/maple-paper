calibration:
  error_model:
  - evaluation_points: null
    likelihood:
      distribution: lognormal
      rationale: MDSC fractions are positive and can span orders of magnitude between animals; a lognormal likelihood on the
        fraction with an assumed coefficient of variation captures multiplicative biological variability.
    name: mdsc_fraction_day27_measurement
    observable: null
    observation_code: "def derive_observation(inputs, sample_size, ureg):\n    # Observed MDSC fraction at day 27 (dimensionless)\n\
      \    f = inputs['mdsc_fraction_day27']\n    # Assumed coefficient of variation for between-mouse variability\n    cv\
      \ = inputs['mdsc_fraction_day27_cv'].magnitude\n    return {\n        'value': f,\n        'sd': cv,\n        'sd_uncertain':\
      \ True,\n        'n': int(sample_size) if sample_size is not None else None,\n    }"
    sample_size: 4
    sample_size_rationale: Figure 2a legend states that spleens (n = 4 per group) were collected from naive and Panc02 tumor-bearing
      mice at each time point including day 27.
    units: dimensionless
    uses_inputs:
    - mdsc_fraction_day27
    - mdsc_fraction_day27_cv
  forward_model:
    code: "def compute(params, inputs, ureg):\n    # k_MDSC_rec: recruitment rate into the spleen surrogate compartment\n\
      \    k_rec = params['k_MDSC_rec']  # cell / (milliliter * day)\n    f0 = inputs['mdsc_fraction_baseline']  # dimensionless\
      \ fraction at day 0\n    t = inputs['observation_time_day27']   # time from tumor implantation to observation (day)\n\
      \    rho = inputs['spleen_cell_density']    # parent splenocyte density (cell/milliliter)\n    # Predicted MDSC fraction\
      \ at time t assuming linear accumulation: f = f0 + (k_rec * t / rho)\n    return f0 + (k_rec * t / rho)"
    code_julia: "function compute(params, inputs)\n    # k_MDSC_rec: recruitment rate into the spleen surrogate compartment\
      \ (cell/(milliliter*day))\n    k_rec = params[\"k_MDSC_rec\"]\n    f0 = inputs[\"mdsc_fraction_baseline\"]\n    t =\
      \ inputs[\"observation_time_day27\"]\n    rho = inputs[\"spleen_cell_density\"]\n    # Predicted MDSC fraction at time\
      \ t assuming linear accumulation\n    return f0 + (k_rec * t / rho)\nend"
    data_rationale: The study reports baseline and day-27 percentages of CD11b+Gr1+ MDSC among splenocytes in Panc02 tumor-bearing
      mice. Interpreting the net increase in MDSC fraction over 27 days as being driven predominantly by tumor-induced recruitment
      from bone marrow, we can relate the recruitment rate per volume (k_MDSC_rec) to the observed change in fraction via
      a simple accumulation model.
    formula: f_MDSC(t_obs) = f0 + k_MDSC_rec * t_obs / rho_spleen
    independent_variable: null
    state_variables: null
    submodel_rationale: In the full QSPIO-PDAC model, k_MDSC_rec controls the source term null -> V_T.MDSC with units cell/(mL*day).
      Here we construct a surrogate compartment (spleen) where MDSC are produced by a constant influx term with rate k_MDSC_rec
      per unit volume and negligible loss over the 27-day window. Assuming a roughly constant splenocyte density, the change
      in MDSC fraction is proportional to k_MDSC_rec * time divided by the parent cell density, preserving the same mechanistic
      role of k_MDSC_rec as a volumetric recruitment rate.
    type: algebraic
  identifiability_notes: With a single quantitative time point (day 27) and a known baseline fraction, this algebraic model
    identifies only the combination k_MDSC_rec / spleen_cell_density under the assumption of linear accumulation. We fix spleen_cell_density
    based on physiological considerations to recover k_MDSC_rec in volumetric units, which introduces additional structural
    uncertainty. The inferred k_MDSC_rec is further a surrogate for tumor-driven systemic recruitment into spleen rather than
    direct tumor infiltration, so the posterior should be interpreted as an order-of-magnitude constraint and used with a
    broad prior when mapped onto tumor-compartment recruitment in the full QSP model.
  parameters:
  - name: k_MDSC_rec
    prior:
      distribution: lognormal
      lower: null
      mu: 15.4
      rationale: Centered on a back-of-the-envelope estimate from the increase in splenic MDSC fraction from 2% (0.02) to
        29% (0.29) over 27 days in Panc02-bearing mice, assuming a typical splenocyte density of 5e8 cell/mL. Wide sigma (1.0
        in log-space) allows ~10-fold variability to account for model and translation uncertainty.
      sigma: 1.0
      upper: null
    units: cell / (milliliter * day)
