  title: Dendritic cell immunotherapy combined with gemcitabine chemotherapy enhances survival in a murine model of pancreatic
    carcinoma
  year: 2013
secondary_data_sources: null
source_relevance:
  estimated_translation_uncertainty_fold: 3.0
  indication_match: exact
  indication_match_justification: The primary data are from a syngeneic murine Panc02 pancreatic ductal adenocarcinoma model,
    which is a standard transplantable PDAC model derived from chemically induced pancreatic ductal tumors in C57BL/6 mice.
    Although tumors are implanted subcutaneously rather than orthotopically, the tumor-induced expansion of CD11b+Gr1+ MDSC
    reflects the same PDAC-driven myelopoiesis and immunosuppressive biology captured in the QSPIO-PDAC model.
  perturbation_relevance: null
  perturbation_type: pathological_state
  source_quality: primary_animal_in_vivo
  species_source: mouse
  species_target: human
  tme_compatibility: moderate
  tme_compatibility_notes: Panc02 tumors are subcutaneous and lack the full desmoplastic and hypovascular TME of human PDAC
    or KPC orthotopic models. However, Panc02-bearing mice show robust systemic expansion of CD11b+Gr1+ MDSC driven by inflammatory
    cytokines such as IL-6 and MCP-1, which mechanistically overlap with MDSC recruitment cues in PDAC. We therefore expect
    systemic MDSC recruitment rates to be within an order of magnitude of those in true pancreatic tumors but allow for significant
    quantitative uncertainty.
  validation_warnings: null
study_interpretation: This study demonstrates that subcutaneous Panc02 pancreatic tumors drive a strong time-dependent expansion
  of CD11b+Gr1+ MDSC in the spleen, increasing from 2% (0.02) of splenocytes at baseline to 29% (0.29) by day 27 after tumor
  implantation. Under a simple linear accumulation assumption, this net increase over 27 days constrains the magnitude of
  the tumor-induced MDSC recruitment rate per unit volume (k_MDSC_rec) into a surrogate systemic compartment. While recruitment
  into tumor tissue is not directly measured, the same cytokine and chemokine signals (e.g., IL-6, MCP-1/CCL2) that mobilize
  MDSC systemically also drive tumor infiltration in PDAC, so the inferred k_MDSC_rec provides an order-of-magnitude anchor
  for the tumor recruitment term in the full QSP model.
target_id: k_MDSC_rec_panc02_spleenexpansion_ghansah2013
