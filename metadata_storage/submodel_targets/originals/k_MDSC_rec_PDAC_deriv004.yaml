key_assumptions:
- Expansion of splenic CD11b+Gr1+ MDSC over the first 27 days after Panc02 implantation is dominated by recruitment from bone
  marrow and blood, with negligible net loss over this period.
- Total splenocyte density (cells per mL of spleen) is approximately constant over the 27-day window at about 5e8 cells/mL,
  so changes in MDSC fraction directly reflect changes in absolute MDSC number.
- The chemokine and cytokine signals driving systemic MDSC expansion (e.g., IL-6, MCP-1/CCL2) are proportional to those governing
  recruitment into the tumor compartment, allowing k_MDSC_rec inferred from splenic data to be used as an approximate prior
  for tumor recruitment.
- Baseline MDSC fraction of 2% (0.02) at day 0 represents the pre-tumor physiological state in C57BL/6 mice.
- Gemcitabine treatment effects on MDSC are ignored by focusing exclusively on untreated control animals for parameterization.
key_study_limitations:
- MDSC measurements are from spleen, not directly from the tumor compartment, so mapping from systemic recruitment to intratumoral
  recruitment requires additional modeling assumptions.
- The simple linear accumulation model neglects MDSC death and egress from spleen; over 27 days this could bias k_MDSC_rec
  upward if significant loss processes exist.
- Panc02 tumors are implanted subcutaneously rather than orthotopically in the pancreas and may not fully reproduce the dense
  desmoplastic stroma and hypovascularity characteristic of human PDAC.
- Only one late time point (day 27) is available with an explicit numerical MDSC fraction in text, limiting dynamic identifiability
  and forcing reliance on a simplified accumulation model.
- Mouse-to-human translation and subcutaneous-to-pancreatic site differences are captured only crudely via an uncertainty
  factor and not an explicit interspecies scaling model.
