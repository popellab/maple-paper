source_relevance:
  estimated_translation_uncertainty_fold: 10.0
  indication_match: proxy
  indication_match_justification: The primary data come from rat hepatic stellate cells in biliary fibrosis resolving after
    bile duct ligation and biliodigestive anastomosis (Issa2001). Activated hepatic stellate cells are myofibroblast-like,
    alpha-SMA positive stromal cells that are mechanistically similar to activated pancreatic stellate cells (aPSCs) and cancer-associated
    fibroblasts in PDAC, particularly in their role in ECM production and their clearance via apoptosis during fibrosis resolution.
    However, liver fibrosis resolution is biologically distinct from the chronically activated, tumor-associated stroma in
    PDAC; therefore, we use these data only as a mechanistic proxy for the intrinsic apoptosis-driven turnover rate of activated
    stellate cells, not as a direct quantitative match.
  perturbation_relevance: The experiment studies activated hepatic stellate cells during resolution of biliary fibrosis after
    surgical reversal of bile duct ligation. This context corresponds to a pro-resolution, pro-apoptotic environment and likely
    provides an upper bound on the intrinsic apoptosis rate of activated stellate cells. In PDAC, survival signals and persistent
    injury are expected to reduce effective apoptosis rates, so the inferred k_apsc_death should be interpreted as an approximate
    scale for first-order death rather than a precise value.
  perturbation_type: pathological_state
  source_quality: primary_animal_in_vivo
  species_source: rat
  species_target: human
  tme_compatibility: low
  tme_compatibility_notes: 'The liver fibrotic microenvironment during biliary obstruction and its resolution differs substantially
    from the desmoplastic PDAC stroma: liver architecture, perfusion, inflammatory milieu, and mechanical context all differ,
    and PDAC represents a non-resolving, tumor-driven fibrotic lesion. Myofibroblasts in PDAC are expected to be more apoptosis-resistant
    than in resolving biliary fibrosis. Accordingly, we apply at least an order-of-magnitude uncertainty to translation of
    the hepatic stellate cell apoptosis rate to activated pancreatic stellate cells in PDAC.'
  validation_warnings: null
study_interpretation: Issa2001 demonstrates that during resolution of biliary fibrosis in rats, the number of activated hepatic
  stellate cells (alpha-SMA+ myofibroblast-like cells) decreases approximately fivefold over 42 days, with an early spike
  in TUNEL-positive apoptotic stellate cells in the first 2 days after biliodigestive anastomosis. Interpreting this decline
  as primarily driven by apoptosis allows us to approximate a first-order death rate constant for activated stellate cells.
  Because activated hepatic stellate cells and activated pancreatic stellate cells share a myofibroblast phenotype and similar
  roles in fibrotic ECM production, this apoptosis-driven turnover rate provides a mechanistic proxy for the k_apsc_death
  parameter governing activated PSC death in the QSPIO-PDAC model.
