calibration:
  error_model:
  - evaluation_points:
    - 42.0
    likelihood:
      distribution: lognormal
      rationale: We treat the surviving fraction of activated stellate cells at 42 days as a positive quantity with multiplicative
        (fold-change) uncertainty; a lognormal likelihood with coefficient of variation given by assumed_cv_hsc_fold is appropriate.
    name: hsc_fraction_42d
    observable:
      code: null
      rationale: null
      state_variables:
      - activated_stellate_cells
      type: identity
    observation_code: "def derive_observation(inputs, sample_size):\n    fold_decrease = inputs['hsc_fold_decrease_mean']\n\
      \    cv = inputs['assumed_cv_hsc_fold']\n    # Observed surviving fraction of activated stellate cells at 42 days\n\
      \    frac_42d = 1.0 / fold_decrease\n    return {\n        'value': frac_42d,\n        'sd': cv,\n        'sd_uncertain':\
      \ True,\n        'n': int(sample_size) if sample_size is not None else None,\n    }"
    sample_size: 13
    sample_size_rationale: Issa2001 reports n=15 rats subjected to bile duct ligation, of which n=13 underwent biliodigestive
      anastomosis and were followed during recovery. Exact numbers per time point are not stated; we approximate n=13 for
      the overall fold-change measurement.
    units: dimensionless
    uses_inputs:
    - hsc_fold_decrease_mean
    - assumed_cv_hsc_fold
  forward_model:
    data_rationale: Issa2001 quantified a fivefold decrease in the number of alpha-SMA positive activated hepatic stellate
      cells over 42 days during resolution of biliary fibrosis. This is naturally described by first-order loss of an activated
      stellate cell population.
    independent_variable:
      name: time
      rationale: null
      span:
      - 0.0
      - 42.0
      units: day
    rate_constant: k_apsc_death
    state_variables:
    - initial_condition:
        rationale: Population is normalized to 1 at the time of biliodigestive anastomosis; only the relative fivefold decline
          over 42 days constrains k_apsc_death.
        value: 1.0
      name: activated_stellate_cells
      units: cell
    submodel_rationale: In the full QSPIO-PDAC model, k_apsc_death multiplies the activated pancreatic stellate cell (aPSC)
      population in a first-order death term (V_T.aPSC -> null with rate k_apsc_death*V_T.aPSC). Activated hepatic stellate
      cells (HSCs) in liver fibrosis are myofibroblast-like and mechanistically analogous to activated PSCs in PDAC stroma,
      so we use their apoptosis-driven clearance as a proxy submodel with identical first-order kinetics.
    type: first_order_decay
  identifiability_notes: 'With a normalized initial condition and a single measurement of the surviving fraction of activated
    stellate cells at 42 days, the first-order decay model uniquely constrains k_apsc_death under the assumption that loss
    is dominated by apoptosis. However, the biological interpretation is approximate: the fivefold decrease in alpha-SMA+
    cells may reflect both apoptosis and loss of activation, and translation from rat hepatic stellate cells in resolving
    biliary fibrosis to human pancreatic stellate cells in PDAC introduces at least an order-of-magnitude uncertainty in the
    inferred parameter.'
  parameters:
  - name: k_apsc_death
    prior:
      distribution: lognormal
      lower: null
      mu: -3.26
      rationale: Centered on hepatic stellate cell apoptosis rate inferred from a fivefold decrease in activated HSC over
        42 days during resolution of biliary fibrosis in rats (Issa2001), with wide variance (sigma=1.5) to reflect cross-species
        and cross-tissue translation to activated pancreatic stellate cells in PDAC.
      sigma: 1.5
      upper: null
    units: 1/day
