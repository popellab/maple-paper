key_assumptions:
- Loss of alpha-SMA positive activated hepatic stellate cells during fibrosis resolution is dominated by apoptosis rather
  than by de-differentiation or migration, consistent with the TUNEL staining data in Issa2001.
- The fivefold decrease in activated hepatic stellate cell numbers over 42 days can be approximated as first-order decay,
  enabling inference of an effective death rate constant from a single fold-change measurement.
- Activated hepatic stellate cells in rat biliary fibrosis are mechanistically similar enough to activated pancreatic stellate
  cells in human PDAC that their intrinsic apoptosis kinetics provide a proxy scale for k_apsc_death, after accounting for
  substantial translation uncertainty.
- The assumed coefficient of variation (30%) on the fivefold decrease reasonably captures uncertainty in the qualitative "fivefold"
  description and inter-animal variability, in the absence of explicit confidence intervals in the paper.
- Other processes in the full QSPIO-PDAC model that remove aPSC (e.g., death-associated clearance or mechanical displacement)
  are treated separately via k_cell_clear; this submodel is intended to constrain only the intrinsic apoptosis-driven death
  component represented by k_apsc_death.
key_study_limitations:
- The study is performed in rats with biliary fibrosis and surgical reversal, not in human PDAC; both species and indication
  differences may alter stellate cell apoptosis kinetics.
- The quantified fivefold decrease in activated hepatic stellate cells reflects net loss, which may combine apoptosis, deactivation,
  and redistribution; we attribute the majority of this effect to apoptosis based on TUNEL data, but the exact contribution
  of each mechanism is uncertain.
- The time course and magnitude of stellate cell apoptosis during active resolution of fibrosis may overestimate the death
  rate in chronically activated, non-resolving PDAC stroma, where myofibroblasts are often apoptosis-resistant.
- Only a single overall fold-change over 42 days is reported in the abstract; detailed per-time-point counts and confidence
  intervals are not available from the abstract alone, limiting the precision of the inferred rate constant.
- Hepatic and pancreatic stellate cells, while both myofibroblast-like and alpha-SMA positive, reside in different tissue
  architectures and are exposed to distinct mechanical and biochemical cues, which may significantly influence apoptosis rates.
