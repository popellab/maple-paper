calibration:
  error_model:
  - evaluation_points: null
    likelihood:
      distribution: normal
      rationale: The observable is a cell fraction bounded between 0 and 1 and close to 1 in this experiment. Given the moderate
        assumed coefficient of variation and lack of strong skewness information, a normal likelihood on the linear scale
        is an adequate approximation for measurement noise around the mean fraction of CD86+CD206+ cells at 30 minutes.
    name: rp182_cd86pos_frac_30min
    observable: null
    observation_code: "def derive_observation(inputs, sample_size, ureg):\n    frac = inputs['rp182_cd86pos_cd206pos_frac_30min']\n\
      \    cv = inputs['rp182_cd86pos_frac_cv']\n    sd = frac * cv\n    return {\n        'value': frac * ureg('dimensionless'),\n\
      \        'sd': sd,\n    }"
    sample_size: 3
    sample_size_rationale: Yates et al. report that flow cytometry data are representative of three independent experiments
      conducted in triplicate; we treat n=3 biological replicates as the effective sample size for the fraction of CD86+CD206+
      cells at 30 minutes.
    units: dimensionless
    uses_inputs:
    - rp182_cd86pos_cd206pos_frac_30min
    - rp182_cd86pos_cd206pos_frac_vehicle
    - rp182_cd86pos_frac_cv
    - rp182_t_30min
  forward_model:
    code: "def compute(params, inputs, ureg):\n    import numpy as np\n    k = params['k_M1_pol']\n    # Stimulation time\
      \ in days (stored directly in inputs)\n    t = inputs['rp182_t_30min']\n    # Baseline CD86+ fraction in vehicle-treated\
      \ M2 macrophages\n    f0 = inputs['rp182_cd86pos_cd206pos_frac_vehicle']\n    frac = 1.0 - (1.0 - f0) * np.exp(-k *\
      \ t)\n    return frac * ureg('dimensionless')"
    code_julia: "function compute(params::Dict, inputs::Dict)\n    k = params[\"k_M1_pol\"]\n    # Stimulation time in days\
      \ (stored directly in inputs)\n    t = inputs[\"rp182_t_30min\"]\n    f0 = inputs[\"rp182_cd86pos_cd206pos_frac_vehicle\"\
      ]\n    frac = 1.0 - (1.0 - f0) * exp(-k * t)\n    return frac\nend"
    data_rationale: Yates et al. quantified the fraction of IL-4/IL-13-polarized murine bone marrow-derived M2 macrophages
      that became CD86+CD206+ within 30 min after addition of RP-182, reporting an increase in the double-positive fraction
      from 10.3% in vehicle-treated controls to 87.8% with RP-182. This provides a direct measurement of the timescale over
      which strong M1-promoting stimulation can reprogram M2 macrophages toward an M1-like phenotype.
    formula: fraction_CD86pos(t) = 1 - (1 - f0) * exp(-k_M1_pol * t) where f0 is the baseline CD86+ fraction in M2-polarized
      macrophages and t is time in days.
    independent_variable: null
    state_variables: null
    submodel_rationale: In the full QSP PDAC model, k_M1_pol appears in a first-order conversion term V_T.Mac_M2 -> V_T.Mac_M1,
      multiplied by a cytokine-dependent Hill function of IL-12 and IFNg. Under saturating M1-promoting signals (e.g., high
      IFNg/IL-12 or strong CD206 activation by RP-182), this Hill term approaches 1 and the effective polarization rate reduces
      to k_M1_pol * V_T.Mac_M2. The algebraic model assumes this saturated first-order Mac_M2 -> Mac_M1 conversion and relates
      k_M1_pol to the observed gain of CD86 expression over 30 min in M2 macrophages.
    type: algebraic
  identifiability_notes: This target uses a single early time point (30 min) for the fraction of CD86+CD206+ M2 macrophages
    under a very strong activating stimulus. Under the assumed first-order repolarization model with known baseline fraction,
    this single measurement is mathematically sufficient to identify k_M1_pol in the in vitro mouse system, but uncertainty
    remains due to the assumed measurement CV and potential deviations from simple first-order kinetics (e.g., multi-step
    signaling, cell-to-cell heterogeneity). Translation of this intrinsic rate constant from murine bone marrow-derived M2
    macrophages under pharmacologic CD206 activation to human PDAC tumor-associated macrophages under cytokine-driven polarization
    introduces additional 1–2 orders of magnitude uncertainty reflected in the wide prior and large translation uncertainty
    factor. The model intentionally ignores slower apoptotic loss of M2 cells at later times (>24 h) under RP-182 treatment,
    so k_M1_pol should be interpreted as an upper bound for rapid signaling-driven M2-to-M1 phenotype conversion rather than
    a net population turnover rate in tumors.
  parameters:
  - name: k_M1_pol
    prior:
      distribution: lognormal
      lower: null
      mu: 4.605
      rationale: RP-182 data imply a very rapid M2-to-M1-like polarization with an effective rate on the order of 10^2 per
        day (half-time ~10 min) under strong CD206 activation. We center the prior at exp(4.605) ~ 100/day with one log-unit
        SD to allow ~10-fold uncertainty in either direction and additional flexibility for translation to PDAC TAMs.
      sigma: 1.0
      upper: null
    units: 1/day
