key_assumptions:
- CD86+CD206+ double-positive macrophages 30 minutes after RP-182 exposure are treated as M1-like cells for the purpose of
  estimating the rapid M2-to-M1 polarization rate, even though they retain CD206 expression and may represent a transitional
  phenotype.
- The baseline 10.3% CD86+CD206+ fraction in vehicle-treated M2 macrophages reflects incomplete M2 polarization and is used
  as the initial M1-like fraction f0 in the first-order conversion model.
- RP-182 is assumed to provide a near-saturating M1-promoting signal such that the cytokine-dependent Hill term in the full
  QSP model is effectively 1, making the measured rate directly informative for k_M1_pol.
- Measurement variability in the reported fractions is not explicitly reported; a 10% coefficient of variation is assumed
  to capture combined technical and biological noise for the 30-minute time point.
- Intrinsic signaling and transcriptional kinetics of M2-to-M1 repolarization are assumed to be similar between murine bone
  marrow-derived M2 macrophages and human PDAC TAMs, with cross-species and context differences captured by the large translation
  uncertainty factor.
- Later time points (e.g., 24 h) in the RP-182 study are influenced by apoptosis of M2 macrophages and are not used directly
  to estimate k_M1_pol, which is interpreted as a short-timescale signaling-driven polarization rate rather than a long-term
  net population turnover rate.
key_study_limitations:
- Data are from murine bone marrow-derived M2 macrophages in vitro, not from tumor-associated macrophages in a PDAC model
  or human monocyte-derived macrophages, introducing substantial translational uncertainty.
- The M1-like phenotype is inferred from CD86 expression; cells remain CD206+ at early time points and may not fully correspond
  to the Mac_M1 compartment in the QSP model.
- Only a single early time point (30 min) with explicit quantitative fractions is used for calibration; the assumed error
  model (10% CV) is heuristic.
- RP-182 is a non-physiologic pharmacologic agonist of CD206 that additionally induces apoptosis of M2 macrophages over 24-48
  hours, which may not reflect typical cytokine-driven repolarization dynamics in PDAC.
- Human PDAC TAM phenotyping data used for contextualization (e.g., Gu et al. 2023, Ino et al. 2013) provide steady-state
  M1/M2 ratios but do not report repolarization kinetics, limiting direct linkage between tumor data and k_M1_pol in this
  submodel.
