source_relevance:
  estimated_translation_uncertainty_fold: 30.0
  indication_match: proxy
  indication_match_justification: The primary data come from murine bone marrow-derived macrophages polarized to an M2-like
    phenotype in vitro and rapidly reprogrammed toward an M1-like state by the synthetic peptide RP-182, which engages the
    mannose receptor CD206. These cells are not pancreatic tumor-associated macrophages and are studied outside the pancreatic
    tumor microenvironment. However, the measured timescale of CD86 acquisition after a strong M1-promoting signal primarily
    reflects cell-intrinsic signaling and transcriptional kinetics in M2 macrophages. We therefore use these data as a mechanistic
    proxy for the maximal M2-to-M1 polarization rate (k_M1_pol) under saturating activation, with additional uncertainty to
    account for species (mouse vs human), tissue context (bone marrow-derived vs PDAC TAM), and the pharmacologic nature of
    the stimulus.
  perturbation_relevance: RP-182 is a synthetic amphipathic peptide agonist of the mannose receptor CD206 that selectively
    binds M2-like macrophages and reprograms them toward an M1-like phenotype, ultimately inducing apoptosis of M2 cells.
    This represents a near-maximal pharmacologic drive toward M2-to-M1-like repolarization and cell clearance, not a physiologic
    IFNg/IL-12 signal. We therefore interpret the inferred k_M1_pol as an upper bound on the intrinsic polarization rate under
    saturating M1-promoting conditions; effective rates in PDAC tumors, where cytokine levels and receptor engagement are
    lower, will typically be smaller.
  perturbation_type: pharmacological
  source_quality: primary_animal_in_vitro
  species_source: mouse
  species_target: human
  tme_compatibility: low
  tme_compatibility_notes: Experiments were performed on isolated M2-polarized macrophages in 2D culture without the dense
    desmoplastic stroma, hypoxia, immunosuppressive cytokines (IL-10, TGFbeta), and metabolic constraints characteristic of
    the PDAC tumor microenvironment. These PDAC-specific features likely slow M2-to-M1 reprogramming and bias macrophages
    toward an M2 phenotype compared with the in vitro system used here.
  validation_warnings: null
study_interpretation: Yates et al. used the synthetic peptide RP-182 to engage the mannose receptor CD206 on murine M2-polarized
  bone marrow-derived macrophages and demonstrated rapid acquisition of M1-associated markers and functions. Within 30 minutes
  of RP-182 exposure, the fraction of CD11b+F4/80+Gr1- macrophages co-expressing CD86 and CD206 increased from about 10% in
  vehicle-treated controls to nearly 88%, indicating very fast induction of M1-associated costimulatory molecules in an initially
  M2-enriched population. This behavior is well described by a first-order M2-to-M1 conversion driven by a strong activating
  signal and is mechanistically analogous to the Mac_M2 -> Mac_M1 reaction in the QSP PDAC model under saturating IL-12/IFNg.
  We therefore use these data to constrain the intrinsic polarization rate constant k_M1_pol under maximal activation, recognizing
  that tumor-context effective rates will be lower because the cytokine-dependent Hill term multiplying k_M1_pol is <1 in
  most PDAC settings. Human PDAC ex vivo TAM phenotyping data (e.g., Gu et al. 2023; Ino et al. 2013) indicate that M2-like
  macrophages (CD163+, CD206+) are numerically dominant over M1-like (CD86+, HLA-DR+) TAMs in primary tumors, consistent with
  a PDAC microenvironment in which the effective M2-promoting influences (captured in the full QSP model by k_M2_pol and immunosuppressive
  cytokines) outweigh the effective M1-promoting drive encoded by k_M1_pol.
target_id: k_M1_pol_rp182_m2_to_m1_repolarization
