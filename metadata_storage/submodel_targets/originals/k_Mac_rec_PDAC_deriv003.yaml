calibration:
  error_model:
  - evaluation_points: null
    likelihood:
      distribution: lognormal
      rationale: IHC-positive pixel counts are positive and typically right-skewed across patients, so a lognormal likelihood
        with SD specified as coefficient of variation is appropriate.
    name: cd68_tam_ihc_index
    observable: null
    observation_code: "def derive_observation(inputs, sample_size, ureg):\n    mean_idx = inputs['cd68_pixels_mean']     \
      \   # dimensionless CD68-positive pixels/HPF\n    cv = inputs['assumed_cv_tam_ihc'].magnitude  # dimensionless coefficient\
      \ of variation\n    return {\n        'value': mean_idx,\n        'sd': cv,\n        'sd_uncertain': True,\n       \
      \ 'n': int(inputs['n_patients_cd40'].magnitude),\n    }\n"
    sample_size: null
    sample_size_rationale: null
    units: dimensionless
    uses_inputs:
    - cd68_pixels_mean
    - assumed_cv_tam_ihc
    - n_patients_cd40
  forward_model:
    code: "def compute(params, inputs, ureg):\n    # k_Mac_rec [cell/(mL*day)], scale_mac_index [mL*day/cell], cd68_pixels_mean\
      \ dimensionless\n    k = params['k_Mac_rec']\n    s = params['scale_mac_index']\n    cd68 = inputs['cd68_pixels_mean']\n\
      \    cd68_index = s * k * cd68\n    return cd68_index * ureg('')\n"
    code_julia: "function compute(params, inputs)\n    k = params[\"k_Mac_rec\"]\n    s = params[\"scale_mac_index\"]\n  \
      \  cd68 = inputs[\"cd68_pixels_mean\"]\n    return s * k * cd68\nend"
    data_rationale: Chang et al. quantified tumor-associated macrophages in human PDAC by ImageJ-based positive pixels per
      high-power field for CD68, CD163 and HLA-DR in 12 resected pancreatic cancers. The mean CD68-positive pixels/HPF are
      treated as a proxy for steady-state total TAM density in PDAC.
    formula: cd68_index = scale_mac_index * k_Mac_rec * cd68_pixels_mean
    independent_variable: null
    state_variables: null
    submodel_rationale: In the full QSPIO-PDAC model, macrophage recruitment enters the Mac_M1 equation as k_Mac_rec*V_T*CCL2/(CCL2+CCL2_50).
      At pre-treatment steady state, this influx balances an effective first-order loss, giving macrophage density proportional
      to k_Mac_rec times a lumped tumor/chemokine factor divided by effective loss. We collapse those poorly constrained factors
      into scale_mac_index so that the observable CD68 TAM index is proportional to k_Mac_rec while preserving its mechanistic
      role as the recruitment rate.
    type: algebraic
  identifiability_notes: With a single CD68-derived TAM density, k_Mac_rec and scale_mac_index are highly correlated; only
    their product is directly constrained. CD163 and HLA-DR measurements inform M1/M2 composition but not the absolute recruitment
    rate. This submodel therefore constrains k_Mac_rec up to an unknown scaling factor encoding tumor volume, CCL2 drive and
    effective loss; absolute macrophage units must be anchored by other targets in the global QSP model.
  parameters:
  - name: k_Mac_rec
    prior:
      distribution: lognormal
      lower: null
      mu: 0.0
      rationale: k_Mac_rec is a positive recruitment rate. A wide lognormal prior is used because IHC-based TAM densities
        constrain only the product of recruitment and effective loss terms rather than k_Mac_rec directly.
      sigma: 2.0
      upper: null
    units: cell/(milliliter*day)
  - name: scale_mac_index
    prior:
      distribution: lognormal
      lower: null
      mu: 0.0
      rationale: scale_mac_index lumps tumor volume, CCL2 drive, and effective loss rate into a single scaling factor mapping
        k_Mac_rec to the CD68-positive pixel index; this is a phenomenological scaling so a weak prior is appropriate.
      sigma: 2.0
      upper: null
    units: milliliter*day/cell
