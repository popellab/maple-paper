key_assumptions:
- CD68-positive pixels/HPF are proportional to total TAM number in the imaged region; saturation and overlap effects are neglected.
- Pre-treatment PDAC samples approximate a steady state of macrophage recruitment and loss, so CD68 index reflects a time-invariant
  balance determined by k_Mac_rec and effective loss.
- The scaling factor scale_mac_index can lump tumor volume, CCL2 levels and effective macrophage loss into a single parameter
  without biasing the inferred order of magnitude of k_Mac_rec.
- A coefficient of variation of 50% reasonably captures inter-patient heterogeneity in TAM IHC density in the absence of reported
  SD/SEM; this uncertainty is flagged as uncertain in the observation model.
key_study_limitations:
- Macrophage abundance is reported as positive pixels/HPF instead of cells per unit area/volume, requiring an extra scaling
  assumption to connect to model cell units.
- Cohort size (n=12) is modest, and IHC quantification does not separate intratumoral vs stromal subregions, whereas the QSP
  model aggregates both.
- Study focuses on resectable PDAC, which may differ from metastatic or unresectable disease states sometimes simulated in
  QSPIO-PDAC.
- Variance (SD/SEM) for CD68 pixel counts is not reported, so measurement uncertainty is approximated via an assumed CV.
