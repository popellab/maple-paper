study_interpretation: Chang et al. quantify macrophage marker expression in human PDAC using pixel-based IHC for CD68 (pan-macrophage),
  CD163 (M2) and HLA-DR (M1-like). The mean CD68-positive pixels/HPF reflect overall TAM abundance in untreated resectable
  PDAC. In the QSPIO-PDAC context, CD68 IHC is interpreted as a steady-state proxy for total intratumoral macrophage density
  arising from balance between k_Mac_rec-driven recruitment and effective loss. The algebraic submodel maps k_Mac_rec, via
  a phenomenological scaling factor, to the observed CD68-positive pixel index.
