calibration:
  identifiability_notes: 'This submodel constrains only the combination q_CD8_T_in * V_T * f_context, inferred indirectly
    from the time required for tumor-specific CD8+ T cells to accumulate near their maximal level in the tumor. By assuming
    a reference tumor volume (1 cm^3) and f_context ~ 1 for strongly activated, homing-competent effector T cells in the SV11
    model, we obtain an approximate distribution for q_CD8_T_in. However, q_CD8_T_in will remain only weakly identified due
    to: (1) uncertainty in the mapping from peak time to an effective first-order rate constant; (2) lack of explicit tumor
    volume measurements in the source study; and (3) biological differences between SV11 brain tumors in mice and human PDAC
    (including vasculature, stromal density, and chemokine fields). Additional data that simultaneously quantify circulating
    and tumor-infiltrating CD8+ T cell numbers over time in PDAC or closely related models, with known tumor volumes and CXCL12/ECM
    status, would be required for tighter identification.'
  independent_variable: null
  measurements:
  - distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n\n    # Extract peak time range in\
      \ days\n    t_lo = inputs['t_peak_immune_lower'].to('day').magnitude\n    t_hi = inputs['t_peak_immune_upper'].to('day').magnitude\n\
      \n    # Reference tumor volume in cm^3 (assumed experimental condition)\n    V_ref = inputs['reference_tumor_volume'].to('centimeter**3').magnitude\n\
      \n    # Sample peak times uniformly over reported 5-7 day window\n    t_samples_days = np.random.uniform(t_lo, t_hi,\
      \ size=20000)\n\n    # For a first-order approach to saturation y(t) = 1 - exp(-k t),\n    # time to ~95% of asymptotic\
      \ level is t_peak ~ 3/k, so k_in ~ 3/t_peak.\n    # Convert k_in to units of 1/min.\n    k_in_per_min = 3.0 / (t_samples_days\
      \ * 24.0 * 60.0)\n\n    # Map k_in to q_CD8_T_in via k_in = q * V_ref (with context factor ~1).\n    q_samples = k_in_per_min\
      \ / V_ref  # units: 1/(cm^3*min)\n\n    # Use the sampled distribution to summarize median and 95% CI.\n    median =\
      \ float(np.median(q_samples))\n    ci_lower = float(np.percentile(q_samples, 2.5))\n    ci_upper = float(np.percentile(q_samples,\
      \ 97.5))\n\n    return {\n        'median': median,\n        'ci95_lower': ci_lower,\n        'ci95_upper': ci_upper,\n\
      \    }"
    evaluation_points:
    - 0.0
    likelihood:
      distribution: lognormal
      rationale: q_CD8_T_in is positive and expected to vary over orders of magnitude across tumor types and species. We therefore
        use a lognormal likelihood anchored on the median and 95% CI derived from the time-to-peak window, treating this as
        a relatively weak, multiplicative constraint on the parameter.
    name: q_CD8_T_in_from_tpeak
    observable: null
    sample_size: 1
    sample_size_rationale: Yorty2007 reports a single characteristic peak time window (5-7 days) for tumor-site accumulation
      of Tag-specific CD8+ T cells after transfer of a high dose of immune donor cells; no explicit n is given for this summary
      statement, so we treat it as one aggregated measurement with broad uncertainty captured by the 5-7 day range.
    units: 1/(centimeter^3*minute)
    uses_inputs:
    - t_peak_immune_lower
    - t_peak_immune_upper
    - reference_tumor_volume
  model:
    data_rationale: Yorty2007 reports that after adoptive transfer of Tag-immune CD8+ T cells into SV11 mice with advanced
      choroid plexus tumors, the frequency of tumor-specific CD8+ T cells in the brain peaks within 5-7 days. This time-to-peak
      accumulation reflects the characteristic timescale for trafficking and expansion of circulating effector CD8+ T cells
      into the tumor site. Approximating the peak time as the time to ~95% of the asymptotic tumor-infiltrating CD8+ population
      yields a direct relationship between the observed peak time window and the effective first-order recruitment rate constant.
    formula: q_CD8_T_in = (3.0 / t_peak) / V_ref, where t_peak ~ time to near-maximal tumor-site CD8+ T cell accumulation
      (5-7 days) and V_ref = 1 cm^3
    submodel_rationale: In the full QSP model, CD8+ T cell influx from the central compartment into tumor is modeled by the
      reaction V_C.CD8 -> V_T.CD8 with rate q_CD8_T_in * V_T * V_C.CD8 * (C_total^2/(C_total^2+Kc_rec)) * (1-H_CXCL12_Texcl).
      For a given tumor and immune context (fixed C_total, Kc_rec, and CXCL12-mediated exclusion), this flux can be approximated
      as first-order in circulating CD8+ T cells with an effective rate constant k_in = q_CD8_T_in * V_T * f_context, where
      f_context combines the recruitment and exclusion Hill terms. In the Yorty2007 system, adoptively transferred effector
      CD8+ T cells experience strong homing and minimal exclusion, so f_context is approximated as ~1. Under these assumptions,
      the timescale for buildup of tumor-site CD8+ T cells is governed primarily by k_in, allowing us to relate the observed
      time to near-maximal accumulation (t_peak) to q_CD8_T_in via k_in ~ 3/t_peak (time to ~95% of asymptotic level for a
      first-order approach) and k_in = q_CD8_T_in * V_ref. Choosing V_ref = 1 cm^3 yields q_CD8_T_in = 3/(t_peak * V_ref),
      which preserves the mechanistic dependence on tumor volume used in the full model while collapsing other modulatory
      factors into the experimental context.
    type: direct_conversion
  parameters:
  - name: q_CD8_T_in
    prior:
      distribution: lognormal
      lower: null
      mu: -8.0
      rationale: Wide prior for CD8 T cell extravasation rate per tumor volume, centered on order 1e-4 1/(cm^3*min). This
        is consistent with an effective infiltration half-time of several days for a 1 cm^3 tumor, as inferred from Yorty2007
        kinetics, while allowing >2 orders of magnitude uncertainty to accommodate cross-species and cross-indication translation.
      sigma: 1.5
      upper: null
    units: 1/(centimeter^3*minute)
  state_variables: null
experimental_context:
  cell_lines: null
  cell_types:
  - isolation_method: Spleen and lymph node lymphocytes from immunized B6 mice, RBC-depleted, transferred i.v. as described
      in Materials and methods of Yorty2007
    name: CD8 T cell
    phenotype: Tag-specific effector CD8+ T cells from immunized C57BL/6 donors, adoptively transferred into tumor-bearing
      SV11 mice
  - isolation_method: In situ tumors in SV11 transgenic mice; not isolated ex vivo for the trafficking measurements
    name: choroid plexus tumor cell
    phenotype: SV40 large T antigen-driven autochthonous choroid plexus papilloma cells in SV11 transgenic mice
  culture_conditions: null
  indication: SV40 Tag-driven autochthonus choroid plexus tumors in mice
  species: mouse
  system: in_vivo
