key_assumptions:
- The 5-7 day time window reported for peak tumor-site CD8+ T cell accumulation in SV11 mice primarily reflects the timescale
  of CD8+ T cell trafficking and early expansion in the tumor, and can be approximated by the time to reach ~95% of the asymptotic
  tumor-infiltrating population in a first-order approach-to-saturation model.
- Under conditions of high-dose adoptive transfer of primed Tag-specific CD8+ T cells plus irradiation, the context-dependent
  recruitment and exclusion factors in the full QSP model (C_total^2/(C_total^2+Kc_rec) and 1-H_CXCL12_Texcl) can be approximated
  as unity (f_context ~ 1), so that k_in ~ q_CD8_T_in * V_T.
- A reference tumor volume of 1 cm^3 is assumed for calibration, since the SV11 study does not report quantitative tumor volumes
  at the time of T cell transfer. This choice allows us to infer q_CD8_T_in from an effective first-order rate constant without
  overfitting unknown tumor-size-dependent effects.
- We neglect CD8+ T cell death, exhaustion, and egress from the tumor over the first week post-transfer, treating net accumulation
  dynamics as dominated by influx and local expansion on the same timescale as trafficking.
- We assume that the trafficking kinetics of highly activated, tumor-specific murine CD8+ T cells into SV11 brain tumors provide
  at least an approximate upper bound on the efficiency of CD8+ T cell extravasation into human PDAC lesions, despite substantial
  differences in stromal architecture and chemokine-driven exclusion.
key_study_limitations:
- The SV11 model involves autochthonus choroid plexus tumors in the brain, not PDAC, so tissue-specific vasculature, stromal
  barriers, and chemokine gradients are likely very different from those in pancreatic tumors.
- The study uses whole-body irradiation and high-dose adoptive transfer of pre-primed donor cells, which enhance trafficking
  and expansion relative to untreated, endogenous T cell responses; thus, inferred rates may overestimate physiological CD8+
  T cell infiltration into PDAC.
- Only a coarse peak time window (5-7 days) is reported in the text for tumor-site accumulation; detailed time-course values,
  tumor volumes, and absolute cell counts in brain tissue are not given, limiting quantitative precision.
- The measured endpoint is the frequency of epitope-specific CD8+ T cells among CD8+ cells in the brain, not an absolute influx
  rate or flux per vessel area; mapping this frequency-based readout to an extravasation rate assumes relatively stable total
  CD8+ cell numbers and negligible confounding by non-tumor brain regions.
- Brain-specific barriers such as the blood-brain barrier and cerebrospinal fluid dynamics may alter trafficking kinetics
  in ways that are not captured in the PDAC QSP model, adding additional uncertainty to translation of q_CD8_T_in.
