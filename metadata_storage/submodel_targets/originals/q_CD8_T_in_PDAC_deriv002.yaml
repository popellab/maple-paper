source_relevance:
  estimated_translation_uncertainty_fold: 30.0
  indication_match: proxy
  indication_match_justification: The source study (Yorty2007) investigates adoptive transfer of Tag-specific CD8+ T cells
    into SV11 transgenic mice bearing spontaneous choroid plexus tumors in the brain. The QSPIO-PDAC model targets human pancreatic
    ductal adenocarcinoma, a distinct organ and disease context. We use the SV11 data only as a mechanistic proxy for the
    timescale of CD8+ effector T cell trafficking from blood to a solid tumor site under conditions of strong antigen recognition
    and homing receptor expression. Because brain tumors and PDAC differ substantially in vasculature, stromal architecture,
    chemokine fields, and immune exclusion, we expect at least an order-of-magnitude translation uncertainty when mapping
    this trafficking timescale to PDAC.
  perturbation_relevance: The SV11 system includes whole-body irradiation and high-dose adoptive transfer of primed CD8+ T
    cells, which enhance T cell priming, homing receptor expression, and niche availability. As a result, the observed 5-7
    day time-to-peak may represent a lower bound (faster-than-physiologic) on CD8+ T cell accumulation kinetics in untreated
    tumors. In the QSP PDAC model, we therefore treat the resulting q_CD8_T_in estimate as an upper-bound-leaning constraint,
    and combine it with a broad prior to allow substantially slower effective trafficking in non-irradiated, immunosuppressed
    PDAC.
  perturbation_type: pharmacological
  source_quality: primary_animal_in_vivo
  species_source: mouse
  species_target: human
  tme_compatibility: low
  tme_compatibility_notes: SV11 choroid plexus tumors arise in the brain and likely face blood-brain barrier and parenchymal
    constraints that differ markedly from the dense desmoplastic stroma, hypoxia, and CXCL12-rich exclusion zones characteristic
    of PDAC. Although both are solid tumors, the vascular permeability, stromal composition, and chemokine landscapes are
    not directly comparable. We therefore anticipate large differences in effective CD8+ T cell extravasation rates between
    SV11 brain tumors and human PDAC and model this as high (>=10-fold) translation uncertainty.
  validation_warnings: null
study_interpretation: Yorty2007 shows that after adoptive transfer of Tag-immune donor lymphocytes into SV11 mice bearing
  advanced choroid plexus tumors, tumor-specific CD8+ T cells accumulate rapidly at the tumor site, reaching peak frequency
  in the brain within roughly one week (5-7 days). This rapid accumulation is contrasted with a much slower buildup over more
  than 3 weeks when naive donor cells are used or when fewer immune donor cells are transferred. Interpreted through the lens
  of the QSPIO-PDAC model, the 5-7 day time-to-peak for immune donor cells reflects the characteristic timescale for efficient
  extravasation and local expansion of effector CD8+ T cells from the circulation into a solid tumor bed under favorable homing
  and antigen conditions. By mapping this timescale to an effective first-order recruitment rate and explicitly preserving
  the dependence of influx on tumor volume, we obtain a mechanistically consistent prior constraint on the CD8+ T cell extravasation
  parameter q_CD8_T_in.
target_id: q_CD8_T_in_yorty2007_sv11_brain_tumor
