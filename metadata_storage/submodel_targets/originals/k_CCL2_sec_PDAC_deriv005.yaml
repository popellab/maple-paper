key_assumptions:
- '[Scrubbed due to ''secret'']'
- '[Scrubbed due to ''secret'']'
- The reference value pdac_total_tumor_cells (~1e9 cells for a 10 mL resectable PDAC tumor) provides a reasonable order-of-magnitude
  anchor for total viable tumor cell burden in advanced PDAC; deviations among individuals are absorbed into the assumed coefficient
  of variation and the lognormal likelihood.
- The effective CCL2 distribution volume relevant for the measured plasma concentrations can be approximated by the central
  blood volume (reference blood_volume ~5 L), neglecting additional distribution into peripheral interstitial spaces or lymph,
  which would otherwise dilute concentrations.
- CCL2 clearance kinetics in these patients can be adequately described by first-order degradation with a rate constant consistent
  with a plasma half-life of approximately 0.1 day; disease-related changes in clearance are captured by the prior uncertainty
  on k_CCL2_deg.
- Because only the median and range of plasma MCP-1 are reported, a 50% coefficient of variation is assumed as a conservative
  estimate of inter-patient variability in CCL2 levels; this assumption is explicitly modeled via an auxiliary input and marked
  as uncertain in the likelihood specification.
- Conversion from pg/mL to nmol/L using a fixed molecular weight for mature CCL2 is accurate enough for QSP calibration purposes;
  isoform heterogeneity and post-translational modifications are neglected.
key_study_limitations:
- The CALGB 80303 cohort comprises patients with advanced (locally advanced/metastatic) PDAC, whereas the reference tumor
  cell count used in the model is based on resectable tumors; the relationship between cell burden and plasma CCL2 may differ
  between these settings.
- '[Scrubbed due to ''secret'']'
- Only a single baseline plasma measurement per patient is available, precluding direct assessment of temporal dynamics or
  confirmation of steady-state; transient fluctuations due to acute inflammation or sampling time relative to treatment are
  not captured.
- The analyte table reports median, minimum, and maximum but not standard deviation or interquartile range for MCP-1; as a
  result, variability must be assumed rather than directly measured, introducing additional uncertainty handled via an assumed
  CV and sd_uncertain flag.
- Patients were enrolled in a systemic therapy trial and may have heterogeneous performance status, comorbidities, and tumor
  burdens, all of which can influence inflammatory cytokine levels and clearance and are not explicitly modeled in this calibration
  target.
- The conversion factor from pg/mL to nmol/L assumes a single molecular weight for mature CCL2 and does not account for potential
  assay cross-reactivity with related chemokines or modified forms of CCL2, which could slightly bias the effective concentration
  scale.
