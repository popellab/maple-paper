calibration:
  error_model:
  - evaluation_points: null
    likelihood:
      distribution: lognormal
      rationale: Plasma cytokine concentrations are strictly positive and typically right-skewed across patients; a lognormal
        likelihood with an assumed coefficient of variation captures this behavior when only median and range (but not SD/SEM)
        are reported. The observable is expressed in nanomole per liter to match the units implied by k_CCL2_sec.
    name: plasma_mcp1_advanced_pdac_median
    observable: null
    observation_code: "def derive_observation(inputs, sample_size):\n    median_pgml = inputs['mcp1_plasma_median_advanced_pdac']\n\
      \    factor = inputs['mcp1_pgml_to_nmolL_factor']\n    cv_assumed = inputs['mcp1_plasma_assumed_cv']\n    median_nmolL\
      \ = median_pgml * factor\n    # Use the converted median (nmol/L) as the central tendency; assume a 50% coefficient\
      \ of variation\n    # as a conservative estimate of inter-patient variability in plasma MCP-1.\n    return {\n     \
      \   'value': median_nmolL,\n        'sd': cv_assumed,\n        'sd_uncertain': True,\n    }"
    sample_size: 328
    sample_size_rationale: Number of advanced pancreatic cancer patients with baseline EDTA plasma biomarker measurements
      in the CALGB 80303 correlative study (N=328).
    units: nanomole / liter
    uses_inputs:
    - mcp1_plasma_median_advanced_pdac
    - mcp1_plasma_assumed_cv
    - mcp1_pgml_to_nmolL_factor
  forward_model:
    clearance_rate: k_CCL2_deg
    data_rationale: '[Scrubbed due to ''secret'']'
    distribution_volume:
      reference_ref: blood_volume
    independent_variable: null
    secretion_rate: '[Scrubbed due to ''secret'']'
    source_count:
      reference_ref: pdac_total_tumor_cells
    state_variables: null
    submodel_rationale: '[Scrubbed due to ''secret'']'
    type: steady_state_concentration
    unit_conversion_factor: '1.0'
  identifiability_notes: With a single steady-state concentration measurement (converted to nanomole per liter), this target
    constrains primarily the ratio k_CCL2_sec * (pdac_total_tumor_cells) / (k_CCL2_deg * blood_volume). On its own, the dataset
    cannot uniquely identify both k_CCL2_sec and k_CCL2_deg. An informative prior on k_CCL2_deg derived from independent CCL2
    half-life data anchors the clearance, making k_CCL2_sec the main parameter updated by this calibration. Uncertainty in
    tumor cell burden, distribution volume, and unit conversion is represented via reference values and the assumed CV; large
    systematic errors in these quantities will rescale the inferred k_CCL2_sec approximately linearly.
  parameters:
  - name: k_CCL2_sec
    prior:
      distribution: lognormal
      lower: null
      mu: -20.0
      rationale: '[Scrubbed due to ''secret'']'
      sigma: 1.0
      upper: null
    units: nanomole / cell / day
  - name: k_CCL2_deg
    prior:
      distribution: lognormal
      lower: null
      mu: 1.94
      rationale: Anchored to independent data on CCL2 plasma half-life (~0.1 day), corresponding to a first-order degradation
        rate k_CCL2_deg ≈ ln(2)/0.1 ≈ 6.9 day^-1, with a moderately tight prior (roughly 2-fold credible range) to reflect
        residual uncertainty and possible disease-related variation.
      sigma: 0.3
      upper: null
    units: 1 / day
