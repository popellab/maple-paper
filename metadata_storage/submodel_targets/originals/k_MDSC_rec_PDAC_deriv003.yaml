calibration:
  error_model:
  - evaluation_points: null
    likelihood:
      distribution: normal
      rationale: The reported MDSC fraction is relatively high (about 0.67) with modest variability across tumors; measurement
        noise and between-patient heterogeneity around this mean are reasonably approximated by a normal distribution on the
        fraction scale for values comfortably away from 0 and 1.
    name: human_tumor_MDSC_fraction_Porembka2012
    observable:
      code: null
      rationale: null
      state_variables: []
      type: identity
    observation_code: "def derive_observation(inputs, sample_size, ureg):\n    mean_frac = inputs['mdsc_frac_tumor_porembka_mean']\n\
      \    sd_frac = inputs['mdsc_frac_tumor_porembka_sd']\n    return {\n        'value': mean_frac.to(ureg('dimensionless')),\n\
      \        'sd': sd_frac.magnitude,\n    }"
    sample_size: 10
    sample_size_rationale: The exact number of tumors contributing to the 66.6% +/- 3.2% estimate is not explicitly stated;
      based on typical small clinical series and the methods description (archived PDAC resections), we assume approximately
      10 tumor samples. This affects only the interpretation of whether the +/- value is closer to SD or SEM; we conservatively
      treat it as SD.
    units: dimensionless
    uses_inputs:
    - mdsc_frac_tumor_porembka_mean
    - mdsc_frac_tumor_porembka_sd
  forward_model:
    code: "def compute(params, inputs, ureg):\n    k_rec = params['k_MDSC_rec']\n    k_death = params['k_MDSC_death']\n  \
      \  f_ss = k_rec / k_death\n    return f_ss * ureg('dimensionless')"
    code_julia: "function compute(params::Dict, inputs::Dict)\n    k_rec = params[\"k_MDSC_rec\"]\n    k_death = params[\"\
      k_MDSC_death\"]\n    f_ss = k_rec / k_death\n    return f_ss\nend"
    data_rationale: Porembka et al. report that in human pancreatic adenocarcinoma, approximately 66.6% of tumor-infiltrating
      CD45+ leukocytes are CD11b+CD15+ myeloid cells that coexpress arginase-1 and functionally correspond to MDSC. This high
      and relatively homogeneous fraction across tumors is consistent with a near steady-state balance between recruitment
      and loss of MDSC in established PDAC lesions. Because only endpoint fractions are reported (no time courses), a steady-state
      algebraic model relating recruitment and loss rates to the observed MDSC fraction is appropriate.
    formula: f_MDSC_steady = k_MDSC_rec / k_MDSC_death (normalized to a reference leukocyte density).
    independent_variable: null
    state_variables: null
    submodel_rationale: In the full QSPIO-PDAC model, k_MDSC_rec appears as a zero-order source term for V_T.MDSC, scaled
      by tumor volume and chemokine/cytokine-dependent factors, while MDSCs are removed by first-order death and clearance
      processes. Under conditions of a fixed effective tumor volume and averaged chemokine/cytokine drive, the steady-state
      tumor MDSC burden is proportional to k_MDSC_rec/k_MDSC_death. We therefore construct an algebraic submodel in which
      the predicted observable is the steady-state MDSC fraction, approximated (up to a scaling constant) by the ratio k_MDSC_rec/k_MDSC_death.
      This preserves the mechanistic role of k_MDSC_rec as a source term balanced by first-order loss, while collapsing spatial
      and chemokine heterogeneity into an effective steady-state relationship.
    type: algebraic
  identifiability_notes: This algebraic submodel relates the steady-state tumor MDSC fraction to the ratio k_MDSC_rec/k_MDSC_death.
    With a single human PDAC measurement, only this ratio is statistically identifiable; k_MDSC_rec and k_MDSC_death cannot
    be independently determined from this dataset alone. The chosen broad lognormal priors encode external knowledge that
    tumor-infiltrating myeloid cells typically have rapid turnover (on the order of days), while the recruitment rate must
    be of similar magnitude to sustain the observed high MDSC fraction. Additional calibration targets (for example, longitudinal
    MDSC dynamics during therapy, or independent constraints on MDSC lifespan) would be required to separately constrain k_MDSC_rec
    and k_MDSC_death.
  parameters:
  - name: k_MDSC_rec
    prior:
      distribution: lognormal
      lower: null
      mu: 0.0
      rationale: Very weakly-informative prior centered at 1 cell/(mL*day), spanning several orders of magnitude to accommodate
        uncertainty in mapping from tumor MDSC fraction to absolute recruitment rate.
      sigma: 2.0
      upper: null
    units: cell/(milliliter*day)
  - name: k_MDSC_death
    prior:
      distribution: lognormal
      lower: null
      mu: 0.0
      rationale: Tumor-infiltrating myeloid cells (including MDSC) typically have lifespans on the order of 1 to 3 days; a
        lognormal prior centered at 1/day with broad uncertainty captures this while allowing slower or faster turnover.
      sigma: 1.5
      upper: null
    units: 1/day
