source_relevance:
  estimated_translation_uncertainty_fold: 2.0
  indication_match: exact
  indication_match_justification: Porembka et al. directly analyze tumor-infiltrating CD11b+CD15+ myeloid cells (MDSC) in
    resected human pancreatic ductal adenocarcinoma specimens and demonstrate that these cells constitute approximately two-thirds
    of CD45+ leukocytes in the tumor stroma. This matches the PDAC indication, tumor compartment, and functional myeloid suppressor
    population represented by V_T.MDSC in the QSPIO-PDAC model.
  perturbation_relevance: null
  perturbation_type: pathological_state
  source_quality: primary_human_clinical
  species_source: human
  species_target: human
  tme_compatibility: high
  tme_compatibility_notes: The data are derived from treatment-naive human PDAC surgical specimens with intact desmoplastic
    stroma, abundant myeloid infiltration, and sparse effector T cells, closely matching the tumor microenvironment represented
    in the QSPIO-PDAC model.
  validation_warnings: null
study_interpretation: Porembka et al. quantify CD11b+CD15+ arginase-1+ myeloid cells in human PDAC tumors and show that these
  cells dominate the CD45+ leukocyte infiltrate (about 66.6% of CD45+ cells). In parallel, they demonstrate expansion of similar
  CD11b+CD15+ cells in bone marrow and peripheral blood, and show that murine Pan02 pancreatic tumors recapitulate this myeloid-dominated
  infiltrate. In the context of the QSPIO-PDAC model, these data indicate that, in established PDAC, tumor-resident MDSC are
  maintained at a high steady-state fraction, implying that MDSC recruitment into the tumor must approximately balance their
  relatively rapid loss. By abstracting tumor volume and chemokine dependence into an effective steady-state relationship,
  the observed human PDAC MDSC fraction constrains the ratio of the recruitment rate k_MDSC_rec to the effective loss rate
  k_MDSC_death.
target_id: k_MDSC_rec_PDAC_Porembka2012
