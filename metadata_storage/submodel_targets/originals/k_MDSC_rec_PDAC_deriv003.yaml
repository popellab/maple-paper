key_assumptions:
- Established human PDAC lesions sampled at surgical resection are approximately at steady state with respect to tumor-infiltrating
  MDSC numbers (net dMDSC/dt close to 0 on the timescale of days).
- CD11b+CD15+CD33+HLA-DR- cells quantified by Porembka et al. constitute the dominant tumor MDSC compartment represented by
  V_T.MDSC in the QSP model; contributions from monocytic MDSC are subdominant for this parameterization.
- Chemokine and cytokine factors driving MDSC recruitment (for example, CCL2, GM-CSF, IL-6) can be lumped into an effective,
  approximately constant drive in untreated PDAC, so that recruitment behaves as a zero-order source term balanced by first-order
  loss.
- The reported 66.6% +/- 3.2% value reflects inter-patient variability and/or measurement error around the mean tumor MDSC
  fraction, and the +/- value is treated conservatively as an SD rather than SEM to avoid underestimating variability.
- Scaling from absolute MDSC cell numbers to the reported fraction among CD45+ leukocytes can be normalized away in this submodel,
  so that the steady-state fraction is effectively proportional to k_MDSC_rec/k_MDSC_death.
key_study_limitations:
- Porembka et al. provide only cross-sectional data at a single time point; there are no longitudinal measurements of tumor
  MDSC dynamics to independently constrain recruitment versus loss rates.
- The study defines human MDSC primarily as CD11b+CD15+ cells; monocytic MDSC subsets (CD14+HLA-DRlow/-) are not fully quantified
  within tumors, so the calibrated parameter primarily reflects granulocytic/PMN-MDSC recruitment.
- Absolute tumor-infiltrating leukocyte densities (cells per mm2 or per gram of tissue) are not reported, preventing direct
  calibration of k_MDSC_rec in physical units without additional assumptions about total leukocyte density.
- Patients in this series represent resectable PDAC and may under-represent very advanced, unresectable disease where MDSC
  fractions and recruitment dynamics could differ.
- KPC mouse and Pan02 models discussed in the paper qualitatively recapitulate myeloid-dominated infiltrates but differ in
  stromal architecture and immune contexture from human PDAC; these are therefore used qualitatively rather than quantitatively
  in this submodel.
