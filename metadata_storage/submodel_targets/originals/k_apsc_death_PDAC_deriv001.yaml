study_interpretation: "The Estar\x1As et al. study quantifies how pharmacologic melatonin and the ER-stress inducer thapsigargin\
  \ reduce the viability of activated rat PSCs under 1% O2 hypoxia. The reported 86.77% (±1.15%) viability after 48 h with\
  \ 1 mM melatonin, relative to 100% in hypoxia alone, constrains the timescale of PSC loss under strong pro-apoptotic, hypoxic\
  \ conditions. Approximating this decline as first-order death of activated PSCs yields an effective death rate of ~0.071\
  \ 1/day, which is used to center the prior for k_apsc_death in the QSPIO-PDAC model, with wide uncertainty to account for\
  \ species differences and for the pharmacologic nature of the stimulus."
