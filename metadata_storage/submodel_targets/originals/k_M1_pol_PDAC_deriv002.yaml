  units: hour
  value: 24.0
  value_snippet: As a first validation, we performed qPCR analysis of selected genes of the literature signature at three
    time points after transfection. The highest impact of the knockdown on the gene expression of M1-like and M2-like associated
    genes was observed at 24 h and 48 h after transfection with the combined siRNA pool (Fig 5, S5 Table). Ten and eight out
    of fourteen M1- and M2-associated genes, respectively, switched their gene expression as expected at 24 h and 48 h after
    transfection. [...] At 24 h after transfection of the M2-like macrophages with the siRNA pool, the cytokine profile had
    already shifted to an M1-like phenotype in the transfected group compared to the control group (mock treated M2-like macrophages)
    (Fig 6A).
key_assumptions:
- M2-like macrophages reprogrammed by siRNA-mediated knockdown of E2f1, Myc, Pparg and Stat6 have a similar intrinsic polarization
  time scale to M2 tumor-associated macrophages exposed to strong IL-12/IFNg stimulation in vivo.
- The 24–48 h window over which most M1/M2 marker genes and cytokines switch expression can be reasonably approximated by
  an effective half-time for the M2-to-M1 transition, even though individual markers may exhibit distinct kinetics.
- Macrophage death, proliferation, recruitment, and M1-to-M2 transitions are negligible over the 72 h in vitro reprogramming
  experiment, so the dominant relevant process is M2-to-M1 phenotypic conversion.
- Species (mouse vs human) and microenvironmental differences mainly introduce multiplicative uncertainty in k_M1_pol (order-of-magnitude
  scale), rather than fundamentally changing the qualitative first-order nature of the polarization process.
- The Hill-type dependence of M2-to-M1 polarization on IL-12 and IFNg in the full QSP model can be approximated as H(IL12,
  IFNg) ≈ 1 in the Hörhold et al. setting, because the siRNA perturbation induces a maximally pro-inflammatory transcriptional
  program analogous to strong cytokine stimulation.
key_study_limitations:
- Repolarization is achieved via non-physiological siRNA knockdown of transcription factors rather than direct cytokine stimulation
  (IL-12/IFNg), so the measured time scale may not exactly match cytokine-driven polarization kinetics.
- '[Scrubbed due to ''secret'']'
- Experiments use murine peritoneal exudate macrophages in vitro, whereas the QSPIO-PDAC model targets human PDAC tumor-associated
  macrophages in a desmoplastic, hypoxic, and immunosuppressive microenvironment.
- Time resolution is limited to 24, 48, and 72 h; faster dynamics occurring within the first 12 h cannot be resolved, so the
  true half-time could be shorter than 24 h.
- No explicit statistical model for repolarization time is provided in the paper; the 24–48 h window is interpreted qualitatively
  from gene expression and cytokine profiles, leading to relatively broad uncertainty in the derived k_M1_pol.
