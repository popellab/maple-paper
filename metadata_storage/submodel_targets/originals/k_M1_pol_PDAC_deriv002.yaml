source_relevance:
  estimated_translation_uncertainty_fold: 5.0
  indication_match: proxy
  indication_match_justification: The target QSP model describes human pancreatic ductal adenocarcinoma (PDAC) tumor-associated
    macrophages, whereas Hörhold et al. study murine peritoneal exudate macrophages polarized and reprogrammed in vitro without
    a tumor present. We use these data purely to constrain the intrinsic time scale of M2-to-M1 phenotypic switching under
    strong pro-inflammatory drive, which is largely governed by cell-intrinsic signaling and gene-regulatory processes that
    are expected to be similar across tissues and indications. However, differences in species (mouse vs human), macrophage
    ontogeny, and the absence of a desmoplastic PDAC tumor microenvironment introduce substantial uncertainty in mapping this
    rate directly to human PDAC TAMs.
  perturbation_relevance: Repolarization was induced by siRNA-mediated knockdown of four transcription factors (E2f1, Myc,
    Pparg, Stat6) in IL-4-polarized M2-like macrophages, rather than by IL-12/IFNg stimulation. We assume that the time required
    for coordinated transcriptional and cytokine reprogramming under this strong synthetic perturbation is comparable to or
    slightly faster than physiologic M2-to-M1 repolarization driven by high IL-12/IFNg in tumors. Thus, the inferred k_M1_pol
    should be interpreted as an approximate upper bound on the intrinsic polarization rate under maximally pro-inflammatory
    conditions and may overestimate rates in human PDAC TAMs.
  perturbation_type: genetic_perturbation
  source_quality: primary_animal_in_vitro
  species_source: mouse
  species_target: human
  tme_compatibility: moderate
  tme_compatibility_notes: Experiments were performed in 2D culture of murine peritoneal macrophages without stromal barriers,
    hypoxia, or chronic suppressive cytokines characteristic of PDAC. These conditions likely allow somewhat faster polarization
    than in the dense, immunosuppressive PDAC tumor microenvironment, but the measured time scale mainly reflects intracellular
    signaling and gene-regulatory processes that should not differ by orders of magnitude across TMEs.
