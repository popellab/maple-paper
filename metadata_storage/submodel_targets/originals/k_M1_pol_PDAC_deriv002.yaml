calibration:
  identifiability_notes: This target provides a single effective constraint on the magnitude of k_M1_pol under strong pro-inflammatory
    drive (saturating IL-12/IFNg conditions, where the Hill term in the full model is near 1). Because the data are indirect
    (based on transcriptional and cytokine reprogramming rather than direct counts of M1 vs M2 macrophages) and come from
    murine peritoneal macrophages in vitro, the resulting posterior for k_M1_pol should remain relatively broad and may be
    correlated with the IL12_50 and IFNg_50 parameters that modulate the effective polarization rate in vivo. Additional in
    vivo tumor-associated macrophage data (e.g., time-resolved changes in M1/M2 markers after cytokine or checkpoint therapy)
    would be needed to more tightly identify k_M1_pol and disentangle it from context-dependent cytokine levels and other
    macrophage fluxes (recruitment, death, M1-to-M2 polarization).
  independent_variable: null
  measurements:
  - distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    # Reported time scale for strong\
      \ M2-to-M1 reprogramming is 24–48 h.\n    # We model the effective half-time t_half as uniformly distributed between\n\
      \    # 24 h and 48 h, then convert to a first-order rate constant in 1/day.\n    t_half_hours = inputs['m2_to_m1_repol_time'].to('hour').magnitude\n\
      \    # Use the reported 95% interval [24, 48] h directly rather than the point value.\n    low_h = 24.0\n    high_h\
      \ = 48.0\n    samples_h = np.random.uniform(low_h, high_h, 10000)\n    # Convert to days\n    samples_d = samples_h\
      \ / 24.0\n    k_samples = np.log(2.0) / samples_d  # 1/day\n    return {\n        'median': float(np.median(k_samples)),\n\
      \        'ci95_lower': float(np.percentile(k_samples, 2.5)),\n        'ci95_upper': float(np.percentile(k_samples, 97.5)),\n\
      \    }"
    evaluation_points:
    - 0.0
    likelihood:
      distribution: lognormal
      rationale: k_M1_pol is positive and expected to vary approximately log-normally across experiments and biological contexts.
        The derived distribution over k_M1_pol from the reported 24–48 h repolarization window is used to parameterize a lognormal
        observation model for Bayesian calibration.
    name: k_M1_pol_from_M2_repolarization_horhold2020
    observable: null
    sample_size: 2
    sample_size_rationale: '[Scrubbed due to ''secret'']'
    units: 1/day
    uses_inputs:
    - m2_to_m1_repol_time
  model:
    data_rationale: Hörhold et al. measured the time course of M2-like murine macrophages reprogrammed toward an M1-like phenotype
      after siRNA knockdown of key transcription factors. They report that by 24 h the cytokine profile has already shifted
      to an M1-like pattern, with maximal changes in M1/M2 marker gene expression at 24–48 h. This provides an approximate
      characteristic time scale for M2-to-M1 repolarization, but not a full cell-count time course, so using an effective
      half-time is appropriate.
    formula: k_M1_pol = ln(2) / t_half_M2_to_M1
    submodel_rationale: 'In the full QSPIO-PDAC model, M2-to-M1 polarization in the tumor compartment is modeled as a first-order
      transition: d(Mac_M2)/dt = -k_M1_pol * Mac_M2 * H(IL12, IFNg), d(Mac_M1)/dt = +k_M1_pol * Mac_M2 * H(IL12, IFNg), where
      H(IL12, IFNg) is a Hill-type function that approaches 1 when IL-12 and/or IFNg are high. Under saturating IL-12/IFNg,
      this reduces to a simple first-order process with effective half-time t_half = ln(2)/k_M1_pol. The direct_conversion
      submodel explicitly encodes this relationship, allowing us to infer k_M1_pol from an estimated half-time of M2-to-M1
      repolarization under strong pro-inflammatory drive.'
    type: direct_conversion
  parameters:
  - name: k_M1_pol
    prior:
      distribution: lognormal
      lower: null
      mu: -0.6931471805599453
      rationale: k_M1_pol is a positive first-order polarization rate. Mouse in vitro data suggest a characteristic M2-to-M1
        repolarization time on the order of 1–2 days, corresponding to k in the 0.3–0.7 1/day range. A lognormal prior with
        median ~0.5 1/day (mu=ln(0.5)) and one-log10-wide uncertainty (sigma=1.0) allows for order-of-magnitude variation
        and cross-species/context translation.
      sigma: 1.0
      upper: null
    units: 1/day
  state_variables: null
