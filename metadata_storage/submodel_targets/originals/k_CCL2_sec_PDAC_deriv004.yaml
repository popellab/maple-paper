calibration:
  error_model:
  - evaluation_points: null
    likelihood:
      distribution: lognormal
      rationale: Cytokine concentrations are positive and typically log-distributed across experiments; measurement error
        and biological variability are better captured on the log scale.
    name: mcp1_concentration_48h
    observable: null
    observation_code: "def derive_observation(inputs, sample_size):\n    mean = inputs['mcp1_conc_48h_mean']\n    cv_assumed\
      \ = inputs['mcp1_conc_48h_cv_assumed']\n    # For a lognormal likelihood, we treat sd as the coefficient of variation\
      \ in linear space\n    return {\n        'value': mean,\n        'sd': cv_assumed,\n        'sd_uncertain': True,\n\
      \        'n': int(sample_size),\n    }\n"
    sample_size: 3
    sample_size_rationale: Michalski et al. report ELISA data as mean±SEM from three independent experiments for cytokine
      measurements in PSC supernatants.
    units: picogram / milliliter
    uses_inputs:
    - mcp1_conc_48h_mean
    - mcp1_conc_48h_cv_assumed
  forward_model:
    cell_count:
      input_ref: psc_cell_seeded
    data_rationale: '[Scrubbed due to ''secret'']'
    incubation_time:
      input_ref: incubation_time_48h
    independent_variable: null
    medium_volume:
      input_ref: medium_volume_well
    molecular_weight:
      reference_ref: ccl2_molecular_weight_mature
    secretion_rate: '[Scrubbed due to ''secret'']'
    state_variables: null
    submodel_rationale: '[Scrubbed due to ''secret'']'
    type: batch_accumulation
    unit_conversion_factor: '1000.0'
  identifiability_notes: With a single batch-accumulation measurement (MCP-1 concentration at 48 h) and known cell number,
    medium volume, and molecular weight, the submodel constrains only the product k_CCL2_sec * incubation_time. Because incubation_time
    is fixed from the experiment, k_CCL2_sec is identifiable up to the assumed measurement uncertainty and the approximated
    concentration from figure digitization. The prior is intentionally broad to avoid overconfidence, and this target should
    be combined with additional CCL2 data (e.g., other cell types, in vivo concentrations) in the global QSP calibration.
  parameters:
  - name: k_CCL2_sec
    prior:
      distribution: lognormal
      lower: null
      mu: -23.0
      rationale: '[Scrubbed due to ''secret'']'
      sigma: 2.0
      upper: null
    units: nanomole / cell / day
