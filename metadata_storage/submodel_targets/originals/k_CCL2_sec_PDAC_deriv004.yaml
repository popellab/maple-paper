key_assumptions:
- MCP-1 ELISA bar heights in Figure 7A are approximately 200 pg/mL for untreated control PSC supernatants at 48 h; this value
  was approximated by digitizing the figure and should be interpreted with at least ~30% error margin.
- PSC proliferation over the 48 h accumulation period is modest once cultures are near confluence, so cell number is approximated
  as constant at the reported seeding density (40,000 cells/well).
- '[Scrubbed due to ''secret'']'
- '[Scrubbed due to ''secret'']'
- Biological and technical variability for MCP-1 ELISA in PSC cultures is captured by an assumed coefficient of variation
  of 30% (used as SD for the lognormal likelihood).
key_study_limitations:
- PSC were derived from chronic pancreatitis rather than PDAC, so tumor-specific oncogenic and immune cues that may further
  upregulate CCL2 are absent.
- Absolute MCP-1 concentrations are only available from plotted ELISA bar graphs, requiring approximate digitization rather
  than exact tabulated values.
- Cultures are 2D monolayers in low serum, which do not fully recapitulate the 3D, hypoxic, and heterogeneous PDAC stroma.
- '[Scrubbed due to ''secret'']'
