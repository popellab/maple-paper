source_relevance:
  estimated_translation_uncertainty_fold: 2.0
  indication_match: exact
  indication_match_justification: The primary data (Jiang2014) are FOXP3+ lymphocyte densities measured directly in resected
    human pancreatic ductal adenocarcinoma specimens, the same disease indication modeled in QSPIO-PDAC. The algebraic submodel
    uses these PDAC tumor measurements together with peripheral Treg prevalence in pancreas cancer patients and generic adult
    CD4+ T cell counts to constrain the tumor extravasation rate q_Treg_T_in for Treg/Th cells in human PDAC.
  perturbation_relevance: null
  perturbation_type: pathological_state
  source_quality: primary_human_clinical
  species_source: human
  species_target: human
  tme_compatibility: high
  tme_compatibility_notes: The Jiang2014 cohort comprises untreated PDAC patients undergoing radical resection, with typical
    desmoplastic and immunosuppressive tumor microenvironments. These conditions closely match the baseline PDAC TME represented
    in QSPIO-PDAC, so additional uncertainty from TME translation is limited.
  validation_warnings: null
study_interpretation: Jiang2014 quantified FOXP3+ lymphocytes (putative regulatory T cells) in primary pancreatic ductal adenocarcinoma
  and adjacent paratumoral pancreas, reporting an average of 4.8±5.2 FOXP3+ cells per high-power field in tumor vs 0.47±0.94
  per high-power field in paratumoral tissue, with higher densities in poorly differentiated and node-positive tumors. Hiraoka2006
  independently showed that the prevalence of FOXP3+ regulatory T cells among CD4+ T cells increases along the PanIN-to-PDAC
  progression sequence, linking Treg accumulation to human PDAC carcinogenesis. Liyanage2002 demonstrated that pancreas cancer
  patients have elevated CD4+CD25+ Treg-enriched cells in peripheral blood (13.2% of CD4+ cells) and even higher prevalence
  in tumor-infiltrating lymphocytes (~20%), indicating a recruitment bias of Treg toward the tumor microenvironment. Kamallou2014
  provides typical adult CD4+ T cell absolute counts (~1.0×10^9 CD4+ cells/L), which, combined with the pancreas cancer Treg
  fraction, yields a proxy for central Treg-enriched CD4+ cell numbers. Under a quasi-steady state approximation where q_Treg_T_in-mediated
  influx from blood balances an effective intratumoral Treg loss rate, these data together imply that the tumor extravasation
  rate must be sufficiently high to sustain FOXP3+ cell densities on the order of 10^7 cells/cm^3 in PDAC. This submodel encodes
  that relationship algebraically, allowing Bayesian updating of q_Treg_T_in given priors on intratumoral Treg loss and measured
  tumor FOXP3+ density.
