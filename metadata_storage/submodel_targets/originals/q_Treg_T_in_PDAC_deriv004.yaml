key_assumptions:
- Intratumoral FOXP3+ lymphocyte density measured in 5-µm sections is representative of the three-dimensional Treg-enriched
  CD4+ T cell density throughout the PDAC tumor mass, after converting from cells per high-power field to cells per cubic
  centimeter using reported section thickness and a typical high-power field area.
- For established, surgically resected PDAC lesions, tumor Treg numbers are approximated as being near a quasi-steady state
  where q_Treg_T_in-mediated influx from blood is balanced by an effective loss rate k_Treg_T_loss (death, egress, or transdifferentiation),
  such that time derivatives of total intratumoral Treg are small relative to fluxes.
- The fraction of CD4+ cells that are Treg-enriched in peripheral blood of pancreas cancer patients (~13.2% in Liyanage2002)
  is a reasonable approximation for the PDAC population underlying Jiang2014, despite differences in geography and enrollment
  period.
- Absolute CD4+ T cell counts from healthy Iranian adults (Kamallou2014) are used as a proxy for central CD4+ counts in PDAC
  patients; disease- and population-specific deviations are absorbed into the translation uncertainty and into the effective
  loss-rate prior.
- FOXP3+ mononuclear lymphocytes in PDAC sections predominantly represent CD4+CD25+ regulatory T cells; contamination by FOXP3+
  tumor cells or other FOXP3-expressing subsets is limited and does not dominate the counted population.
- The recruitment Hill term C_total^2/(C_total^2+Kc_rec) in the full QSP model is close to unity for macroscopic PDAC lesions
  at resection, so it can be approximated as 1.0 when relating q_Treg_T_in to tumor Treg density.
- The same extravasation coefficient q_Treg_T_in can be applied to both Treg and Th populations in the tumor recruitment reactions,
  consistent with the full model structure, even though chemokine receptor expression may differ modestly between these subsets
  in vivo.
key_study_limitations:
- Jiang2014 reports FOXP3+ cell densities per two-dimensional high-power field in 5-µm sections. Converting to volumetric
  densities requires assumptions about high-power field area and uniformity through the section depth, introducing geometric
  uncertainty.
- FOXP3 is a robust but not absolutely specific marker of regulatory T cells; some FOXP3+ cells in PDAC tissue may be tumor
  cells or non-classical regulatory subsets, leading to a potential overestimate of true CD4+CD25+ Treg density.
- The Kamallou2014 CD4+ reference counts are from healthy Iranian adults rather than PDAC patients; systemic inflammation,
  treatment, or comorbidities in PDAC cohorts could alter CD4+ and Treg absolute counts relative to these reference values.
- Liyanage2002 reports Treg prevalence among CD4+ cells in mixed cohorts of breast and pancreas cancer patients with CD4+CD25
  phenotyping (without FOXP3), which may imperfectly match the FOXP3+ Treg population quantified by Jiang2014.
- The algebraic steady-state approximation neglects potential local proliferation or conversion of CD4+CD25− cells into FOXP3+
  Treg within the tumor, which could contribute to FOXP3+ density independently of blood-derived influx.
- Inter-patient heterogeneity in tumor size, stromal content, and microregional chemokine gradients is collapsed into a single
  average density measurement, limiting the ability to resolve spatially varying trafficking parameters.
