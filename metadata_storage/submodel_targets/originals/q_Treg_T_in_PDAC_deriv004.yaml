calibration:
  error_model:
  - evaluation_points: null
    likelihood:
      distribution: lognormal
      rationale: Tumor-infiltrating lymphocyte densities are positive and typically span orders of magnitude across patients.
        Modeling measurement noise and biological variability on a log scale via a lognormal likelihood is appropriate. The
        coefficient of variation derived from Jiang2014 (SD/mean in cells per high-power field) is used as an approximate
        log-space SD.
    name: foxp3_tumor_density_jiang2014
    observable:
      code: null
      rationale: null
      state_variables: []
      type: identity
    observation_code: "def derive_observation(inputs, sample_size, ureg):\n    mean_density = inputs['treg_density_tumor_mean_cm3']\n\
      \    cv = inputs['treg_density_tumor_cv']\n    return {\n        'value': mean_density.to('1/cm^3'),\n        'sd':\
      \ float(cv),\n    }"
    sample_size: 50
    sample_size_rationale: Jiang2014 analyzed FOXP3+ lymphocyte density in primary pancreatic cancer tissue from 50 patients
      who underwent radical resection of pancreatic head adenocarcinoma.
    units: 1/cm^3
    uses_inputs:
    - treg_density_tumor_mean_cm3
    - treg_density_tumor_cv
  forward_model:
    code: "def compute(params, inputs, ureg):\n    q = params['q_Treg_T_in']\n    k_loss = params['k_Treg_T_loss']\n    cd4_abs\
      \ = inputs['cd4_abs_count_mean']  # proxy for central CD4+ count\n    treg_frac = inputs['treg_fraction_pbmc_pancreas_mean']\
      \  # fraction of CD4 that are Treg-enriched\n    blood_treg_number = cd4_abs * treg_frac  # proxy for central Treg-enriched\
      \ CD4+ cell number\n    rho = q * blood_treg_number / k_loss\n    return rho * ureg('1/cm^3')"
    code_julia: "function compute(params, inputs)\n    q = params[\"q_Treg_T_in\"]\n    k_loss = params[\"k_Treg_T_loss\"\
      ]\n    cd4_abs = inputs[\"cd4_abs_count_mean\"]\n    treg_frac = inputs[\"treg_fraction_pbmc_pancreas_mean\"]\n    blood_treg_number\
      \ = cd4_abs * treg_frac\n    rho = q * blood_treg_number / k_loss\n    return rho\nend"
    data_rationale: Jiang2014 reports mean density of FOXP3+ lymphocytes per high-power field in human PDAC resections. Using
      reported section thickness and a typical high-power field area, this can be converted to an approximate volumetric FOXP3+
      cell density (cells/cm^3). Liyanage2002 provides the fraction of CD4+ cells that are CD4+CD25+ (Treg-enriched) in peripheral
      blood of pancreas cancer patients. Kamallou2014 provides reference absolute CD4+ T cell counts in healthy adults, used
      here as a proxy for central CD4+ counts. Under the assumption that intratumoral FOXP3+ lymphocyte density in established
      PDAC is approximately at a quasi-steady state between blood influx and local loss, an algebraic relationship links the
      extravasation rate q_Treg_T_in, a proxy for central Treg-enriched CD4+ cell number, and an effective Treg loss rate
      to the observed tumor Treg density.
    formula: rho_Treg_T = q_Treg_T_in * cd4_abs_count_mean * treg_fraction_pbmc_pancreas_mean / k_Treg_T_loss
    independent_variable: null
    state_variables: null
    submodel_rationale: In the full QSPIO-PDAC model, q_Treg_T_in controls extravasation of circulating Th and Treg cells
      into the tumor compartment with a flux V_T * q_Treg_T_in * V_C.Treg * (C_total^2/(C_total^2+Kc_rec)). For macroscopic,
      established tumors where C_total >> sqrt(Kc_rec), the recruitment Hill term is near unity and tumor volume changes slowly
      relative to cellular trafficking. Under these conditions, tumor Treg density can be approximated as a steady-state balance
      between q_Treg_T_in-mediated influx from blood and an effective loss rate k_Treg_T_loss. This algebraic submodel therefore
      captures the same mechanistic role of q_Treg_T_in (blood-to-tumor Treg influx per tumor volume) while coarse-graining
      other tumor processes into k_Treg_T_loss.
    type: algebraic
  identifiability_notes: With a single PDAC intratumoral FOXP3+ density measurement (converted to an approximate volumetric
    density), the algebraic model constrains only the ratio q_Treg_T_in / k_Treg_T_loss given an assumed proxy for central
    Treg-enriched CD4+ cell number. Consequently, q_Treg_T_in and k_Treg_T_loss are strongly correlated in the posterior.
    The prior on k_Treg_T_loss (effective Treg loss rate in tumor) therefore has a substantial influence on the inferred q_Treg_T_in.
    Additional longitudinal data on tumor-infiltrating Treg kinetics (e.g., time-resolved measurements in KPC or orthotopic
    models), or independent estimates of intratumoral Treg turnover, would be required to identify q_Treg_T_in and k_Treg_T_loss
    separately. The submodel nonetheless anchors q_Treg_T_in to order-of-magnitude consistency between peripheral Treg levels
    and observed PDAC FOXP3+ cell densities, providing a human-clinical reference point complementary to prior mouse MRI tracking
    and transwell-based estimates.
  parameters:
  - name: q_Treg_T_in
    prior:
      distribution: lognormal
      lower: null
      mu: -7.0
      rationale: Wide prior over several orders of magnitude (approximately 10^-9 to 10^-3 1/(cm^3*min)) to encompass plausible
        Treg extravasation rates that link peripheral blood Treg levels to intratumoral Treg densities in PDAC.
      sigma: 2.0
      upper: null
    units: 1/(centimeter^3*minute)
  - name: k_Treg_T_loss
    prior:
      distribution: lognormal
      lower: null
      mu: -10.0
      rationale: Effective loss rate of tumor-infiltrating Treg (death, egress, or differentiation). Prior spans half-lives
        from hours to weeks, reflecting limited direct data on Treg turnover in PDAC tumors.
      sigma: 1.5
      upper: null
    units: 1/minute
