calibration:
  identifiability_notes: This submodel constrains k_Mac_rec primarily through a single steady-state relation using cross-sectional
    human PDAC data. The estimate is sensitive to assumptions about macrophage half-life, the fraction of macrophages that
    are recently recruited versus tissue-resident or locally proliferating, and the exact area of the 400x high-power field.
    Because M1 counts are modest compared to M2, and polarization and clearance processes are neglected, k_Mac_rec should
    be interpreted as an effective recruitment rate into the M1 compartment under high-CCL2 conditions rather than a precise
    biophysical flux. Joint calibration with k_Mac_death and polarization parameters in the full QSP model will be required
    for full structural identifiability.
  independent_variable: null
  measurements:
  - distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    # Extract inputs and convert to\
      \ base units\n    M1_per_HPF = inputs['M1_per_HPF_primary_PDAC'].magnitude  # cells per 400x field\n    A = inputs['HPF_area_400x_microscope'].to('millimeter**2').magnitude\n\
      \    thickness = inputs['section_thickness_histology'].to('millimeter').magnitude\n    t_min = inputs['macrophage_half_life_min'].to('day').magnitude\n\
      \    t_max = inputs['macrophage_half_life_max'].to('day').magnitude\n\n    # Volume of tissue represented in one 400x\
      \ high-power field (in mL)\n    # V_field = A [mm^2] * thickness [mm] * (1 mL / 1000 mm^3)\n    V_mm3 = A * thickness\n\
      \    V_mL = V_mm3 / 1000.0\n\n    # M1 macrophage density in cells/mL\n    density = M1_per_HPF / V_mL\n\n    # Sample\
      \ macrophage half-life uniformly between reported bounds\n    N = 10000\n    half_life_samples = np.random.uniform(t_min,\
      \ t_max, size=N)\n    k_death = np.log(2.0) / half_life_samples  # 1/day\n\n    # Recruitment rate at steady state (cells/(mL*day))\n\
      \    k_rec_samples = k_death * density\n\n    return {\n        'median': float(np.median(k_rec_samples)),\n       \
      \ 'ci95_lower': float(np.percentile(k_rec_samples, 2.5)),\n        'ci95_upper': float(np.percentile(k_rec_samples,\
      \ 97.5)),\n    }"
    evaluation_points:
    - 0.0
    likelihood:
      distribution: lognormal
      rationale: Treat the literature-derived steady-state estimate of k_Mac_rec as a lognormal observation on the parameter
        scale, with uncertainty captured via the Monte Carlo distribution from distribution_code.
    name: k_Mac_rec_literature
    observable: null
    sample_size: 42
    sample_size_rationale: Number of primary PDAC tumors in which CD86+ M1 macrophages were quantified (Gu 2023, Table 2).
    units: cell/(milliliter*day)
    uses_inputs:
    - M1_per_HPF_primary_PDAC
    - HPF_area_400x_microscope
    - section_thickness_histology
    - macrophage_half_life_min
    - macrophage_half_life_max
  model:
    data_rationale: Gu 2023 reports the median number of CD86+ M1 macrophages per 400x high-power field in primary human PDAC
      tumors, which provides an estimate of steady-state M1 macrophage density in the tumor microenvironment.
    formula: At steady state for tumor M1 macrophages with saturating CCL2, k_Mac_rec * V_T = k_Mac_death * Mac_M1, where
      Mac_M1/V_T is the M1 density estimated from CD86+ counts per high-power field and histology section thickness. We set
      k_Mac_death = ln(2)/t_half. Thus k_Mac_rec = (ln(2)/t_half) * (M1_per_HPF / (HPF_area_400x * section_thickness)).
    submodel_rationale: In the full QSP model, macrophage recruitment into the tumor is represented by k_Mac_rec * V_T * (CCL2/(CCL2
      + CCL2_50)), and tumor macrophages are lost via first-order death with rate k_Mac_death. For established PDAC lesions
      with high CCL2 expression, CCL2 >> CCL2_50 so the chemokine term is approximated as 1. Assuming quasi-steady state for
      M1 macrophages and neglecting slower polarization and clearance terms, recruitment balances death, yielding an analytical
      relation between k_Mac_rec, k_Mac_death, and the measured M1 density.
    type: direct_conversion
  parameters:
  - name: k_Mac_rec
    prior:
      distribution: lognormal
      lower: null
      mu: 13.89
      rationale: Steady-state balance between recruitment and death using PDAC M1 macrophage density (Gu 2023) and tissue
        macrophage half-life 4-15 days (Phagocyte review).
      sigma: 0.32
      upper: null
    units: cell/(milliliter*day)
  state_variables: null
experimental_context:
  cell_lines: null
  cell_types:
