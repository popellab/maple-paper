study_interpretation: Immunohistochemical quantification of CD86+ M1 macrophages in primary human PDAC provides a snapshot
  of steady-state M1 density in the tumor microenvironment. Combined with generic estimates of tissue macrophage half-life
  and typical 400x high-power field area, this allows an approximate calculation of the macrophage recruitment rate constant
  k_Mac_rec under conditions of high CCL2 where recruitment is chemokine-saturated. The resulting submodel links the histologic
  counts directly to the mechanistic recruitment term used in the full QSPIO-PDAC model.
