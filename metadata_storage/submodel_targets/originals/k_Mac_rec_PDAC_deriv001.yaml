key_assumptions:
- Primary PDAC tumors analyzed by Gu 2023 are in a quasi-steady state with respect to M1 macrophage numbers, so recruitment
  approximately balances death.
- CCL2 expression in established PDAC is high enough that CCL2/(CCL2 + CCL2_50) can be approximated as 1, so the chemokine
  term in the recruitment reaction is effectively saturated.
- The median CD86+ count per 400x high-power field reflects the average M1 macrophage density in the tumor parenchyma, and
  the high-power field area can be approximated by 0.196 mm2 as reported for a standard 10x/20 mm ocular with a 40x objective.
- Local proliferation and polarization of macrophages (M1<->M2) and additional clearance terms are secondary compared with
  recruitment and death for setting the overall M1 density in these lesions.
- Generic tissue macrophage life span (4-15 days) is a reasonable proxy for the effective death/turnover rate of tumor-associated
  macrophages in human PDAC.
key_study_limitations:
- The PDAC data from Gu 2023 are static immunohistochemistry counts rather than dynamic time-course measurements, so only
  a steady-state constraint on k_Mac_rec is available.
- High-power field size was not reported in Gu 2023 and is approximated from an external digital pathology methods paper;
  true field area on the microscopes used in the PDAC study may differ.
- CD86 is an imperfect marker of purely M1-polarized macrophages, and some CD86+ cells may represent other myeloid subsets;
  conversely, some functionally M1 macrophages may be CD86-low.
- The analysis assumes that most CD86+ cells in the tumor are recently recruited monocyte-derived macrophages, whereas PDAC
  lesions contain a mixture of tissue-resident and monocyte-derived macrophage populations.
- Macrophage half-life estimates are taken from generic tissue macrophage literature rather than PDAC-specific measurements,
  introducing additional uncertainty that is only approximately captured in the prior on k_Mac_rec.
