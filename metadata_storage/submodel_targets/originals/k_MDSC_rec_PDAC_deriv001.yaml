study_interpretation: Hong2015 demonstrates that in established subcutaneous B16 and LLC tumors, approximately 8-17 percent
  of viable cells are CD11b+/Gr1+ myeloid-derived suppressor cells, and that this fraction is modulated by pericyte coverage
  and IL-6-driven hypoxia. Assuming that by two weeks after inoculation the intratumoral MDSC population has reached a quasi-steady
  state where recruitment balances death, and using literature estimates that MDSCs in the tumor microenvironment have a lifespan
  of about one to two days, we can back-calculate the implied MDSC recruitment rate into tumor tissue. This provides a physiologically
  grounded scale for k_MDSC_rec in the QSP PDAC model, capturing chemokine-driven influx into the tumor microenvironment under
  conditions of high myeloid inflammation.
target_id: k_MDSC_rec_recruitment_pericyte_MDSC_Hong2015
