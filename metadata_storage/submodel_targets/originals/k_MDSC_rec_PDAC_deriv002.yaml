calibration:
  identifiability_notes: This submodel constrains k_MDSC_rec under conditions of high stromal CCL2 and baseline IL-6, effectively
    providing an estimate of the maximal CCL2-driven MDSC recruitment rate. The absolute value of k_MDSC_rec depends on the
    assumed effective imaging volume per microscope field, which is uncertain by roughly an order of magnitude; this uncertainty
    is explicitly propagated in the distribution_code and reflected by a wide prior (sigma = 2 on the log scale). In the context
    of the full QSP PDAC model, k_MDSC_rec will be correlated with the CCL2_50 parameter and any IL-6-dependent modulation
    (H_IL6_MDSC). Additional in vivo PDAC data on MDSC accumulation kinetics and CCL2 levels would be needed to separately
    identify k_MDSC_rec, CCL2_50, and IL-6 effects.
  independent_variable: null
  measurements:
  - distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    # Mean migrated BM cells per field\
      \ at 9 h in HSC-2 + PDS1 coculture\n    migrated_mean = inputs['bm_cells_migrated_PDS1_9h_per_field'].magnitude\n  \
      \  # Assume biological and counting variability with coefficient of variation ~30% (not reported explicitly)\n    cv_migrated\
      \ = 0.30\n    sigma_m = np.sqrt(np.log(1.0 + cv_migrated**2))\n    mu_m = np.log(migrated_mean) - 0.5 * sigma_m**2\n\
      \    migrated_samples = np.random.lognormal(mu_m, sigma_m, 10000)\n\n    # Effective imaging volume per field (mL).\
      \ We treat the nominal value as median of a lognormal\n    V_eff = inputs['imaging_volume_per_field'].magnitude\n  \
      \  # Encode one order-of-magnitude geometric uncertainty (0.1x to 10x) around this median\n    sigma_V = np.log(10.0)\
      \ / 1.96  # so that ~95% CI spans 10-fold\n    mu_V = np.log(V_eff)\n    V_samples = np.random.lognormal(mu_V, sigma_V,\
      \ 10000)\n\n    # Migration time: 9 hours converted to days\n    t_hours = inputs['migration_time_9h'].magnitude\n \
      \   t_days = (t_hours * ureg.hour).to('day').magnitude\n\n    k_samples = migrated_samples / (V_samples * t_days)\n\n\
      \    return {\n        'median': float(np.median(k_samples)),\n        'ci95_lower': float(np.percentile(k_samples,\
      \ 2.5)),\n        'ci95_upper': float(np.percentile(k_samples, 97.5)),\n    }"
    evaluation_points:
    - 0.0
    likelihood:
      distribution: lognormal
      rationale: k_MDSC_rec is strictly positive and expected to vary over orders of magnitude. The derived distribution from
        the Transwell assay (via derive_distribution) is treated as an informative lognormal likelihood for this parameter,
        incorporating experimental variability and geometric uncertainty in the effective imaging volume.
    name: k_MDSC_rec_from_PDS1_Transwell
    observable: null
    sample_size: 3
    sample_size_rationale: Oo2022 reports Transwell migration data as mean ± SD over n = 3 independent experiments, with 5
      fields per group.
    units: cell/(milliliter*day)
    uses_inputs:
    - bm_cells_migrated_PDS1_9h_per_field
    - migration_time_9h
    - imaging_volume_per_field
  model:
    data_rationale: Oo2022 quantified the number of bone marrow-derived cells migrating from an upper Transwell chamber into
      a lower chamber containing oral squamous cell carcinoma (HSC-2) cells plus high-CCL2 patient-derived stroma (PDS1).
      After 9 hours, an average of 610 cells per microscope field were present on the lower side of the membrane. Under these
      short-time, in vitro conditions, cell death and egress are negligible, so the accumulated migrated cells approximate
      the time-integrated recruitment flux driven primarily by stromal CCL2.
    formula: k_MDSC_rec = bm_cells_migrated_PDS1_9h_per_field / (imaging_volume_per_field * migration_time_days)
    submodel_rationale: In the full QSP PDAC model, tumor MDSCs obey d(MDSC_T)/dt = k_MDSC_rec * V_T * (CCL2/(CCL2 + CCL2_50))
      * (1 + H_IL6_MDSC) - death and clearance terms. In the Oo2022 Transwell assay, IL-6 is not experimentally manipulated
      and can be treated as baseline (H_IL6_MDSC ≈ 0), and PDS1 stroma produces high CCL2 such that CCL2 ≫ CCL2_50, so the
      Hill term approaches 1. Over 9 hours, MDSC death and clearance from the lower compartment are minimal. Under these assumptions,
      the governing equation reduces to dM/dt ≈ k_MDSC_rec * V_eff, giving M(9 h) ≈ k_MDSC_rec * V_eff * t. Using the observed
      migrated cell count per field as M(9 h) and an effective stromal volume per imaged field V_eff (imaging_volume_per_field),
      we can directly solve for k_MDSC_rec.
    type: direct_conversion
  parameters:
  - name: k_MDSC_rec
    prior:
      distribution: lognormal
      lower: null
      mu: 12.0
      rationale: Centered on order-of-magnitude estimate from Oo2022 Transwell migration (approximately 1.6×10^5 cell/(mL*day)
        for high-CCL2 stroma), with wide sigma=2 to allow >2 orders-of-magnitude uncertainty due to cross-species and cross-indication
        translation and geometric assumptions about imaging volume.
      sigma: 2.0
      upper: null
    units: cell/(milliliter*day)
  state_variables: null
