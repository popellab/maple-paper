key_assumptions:
- Migrated BM cells counted in the Transwell assay at 9 hours are dominated by CCR2+ MDSCs when PDS1 high-CCL2 stroma is present,
  based on in vivo data showing preferential recruitment of Arg1+CD11b+GR1+GFP+ MDSCs in the same model.
- Cell death and reverse migration from the lower chamber are negligible over the 9-hour assay, so the accumulated migrants
  equal the integral of the recruitment flux.
- PDS1 stroma produces sufficiently high CCL2 that CCL2/(CCL2 + CCL2_50) ≈ 1, and IL-6 levels remain at a baseline where H_IL6_MDSC
  ≈ 0, so the QSP recruitment term reduces to a constant k_MDSC_rec * V_eff.
- An effective stromal volume corresponding to one microscope field in the Transwell lower chamber can be approximated as
  0.01 mL with about one order-of-magnitude geometric uncertainty; this simplification links the 2D imaging readout to the
  3D volumetric recruitment term used in the QSP model.
- Biological and counting variability in migrated cell numbers is approximated by a lognormal distribution with 30% coefficient
  of variation in the absence of reported SD values.
- OSCC stroma-driven MDSC recruitment is mechanistically similar to PDAC stroma-driven recruitment through the CCL2/CCR2 axis,
  so the estimated maximal recruitment rate is transferable up to a large uncertainty factor.
key_study_limitations:
- The experiment uses human OSCC cells and patient-derived oral stroma rather than PDAC tissue, so tumor-intrinsic and stromal
  properties (e.g., stiffness, vascularization, hypoxia) differ from the PDAC microenvironment.
- Migration was measured in a 2D Transwell system with murine BM cells, which lacks tumor vasculature, interstitial flow,
  and full 3D extracellular matrix structure present in vivo.
- The readout is total migrated BM cells per field and not directly gated MDSCs; attribution to MDSCs relies on separate in
  vivo multicolor IHC demonstrating that PDS1/PDS2 preferentially recruit Arg1+CD11b+GR1+GFP+ MDSCs.
- Only a single short time point (9 h) was reported for the Transwell assay, preventing direct estimation of any saturation
  or depletion effects and requiring the assumption of constant recruitment rate over this interval.
- The effective imaging volume per field is not experimentally reported and is approximated from plate geometry, introducing
  an additional order-of-magnitude uncertainty in the absolute value of k_MDSC_rec.
