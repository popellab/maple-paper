  tme_compatibility_notes: Both OSCC and PDAC tumors display cancer-associated fibroblasts and chemokine-rich stroma that
    recruit myeloid cells, and CCL2/CCR2-dependent MDSC recruitment has been reported in multiple solid tumors. However, PDAC
    typically exhibits a denser, more hypoxic desmoplastic stroma and stronger T cell exclusion than OSCC. These differences
    likely alter absolute myeloid recruitment rates and spatial distribution, so the OSCC-derived k_MDSC_rec estimate is treated
    as an approximate upper bound for PDAC with at least one order-of-magnitude uncertainty.
