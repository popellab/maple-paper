key_assumptions:
- Canonical CD86+CD163− M1 and CD86−CD163+ M2 TAM subsets in DLBCL approximate the pure Mac_M1 and Mac_M2 populations represented
  in the PDAC QSP model; mixed CD86+CD163+ cells are treated as an intermediate phenotype not explicitly modeled.
- Macrophage recruitment and death rates are similar for M1 and M2 subsets at pathological steady state, so that the observed
  M1:M2 abundance ratio primarily reflects the balance of M2→M1 vs. M1→M2 polarization rates.
- The intrinsic polarization machinery of human TAMs (e.g., STAT1/STAT6, NF-kB, IRF5) is broadly conserved across tumor types,
  making the DLBCL M1:M2 balance a very rough proxy for PDAC, albeit with large uncertainty.
- Measurement errors in canonical M1 and M2 TAM fractions are approximately independent and can be propagated to the M1:M2
  ratio using standard error-propagation formulas.
key_study_limitations:
- 'Indication mismatch: DLBCL arises in lymphoid tissue and has a very different stromal and vascular microenvironment compared
  to PDAC, limiting direct quantitative translation of TAM ratios.'
- A large noncanonical CD86+CD163+ M1M2 population (approximately half of all TAMs) is present and not explicitly represented
  in the PDAC QSP model, introducing structural model discrepancy.
- The canonical M1 and M2 fractions are reported from only three DLBCL cases, yielding limited statistical power and uncertain
  generalizability.
- Marker-based M1/M2 classification (CD86/CD163) is an oversimplification of macrophage polarization, which exists on a continuum
  and may not map cleanly to functional anti- vs pro-tumor phenotypes.
