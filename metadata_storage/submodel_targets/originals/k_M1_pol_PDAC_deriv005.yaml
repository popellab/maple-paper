  authors:
  - Manfroi B
  - Hoffmann B
  - et al.
  doi: 10.1182/bloodadvances.2021004203
  source_tag: Manfroi2021_DLBCL_TAM
  title: The microenvironment of DLBCL is characterized by noncanonical macrophages recruited by tumor-derived CCL5
  year: 2021
secondary_data_sources: null
source_relevance:
  estimated_translation_uncertainty_fold: 30.0
  indication_match: proxy
  indication_match_justification: The primary data quantify canonical M1 and M2 TAM fractions in human DLBCL biopsies using
    CD68, CD86, and CD163 as markers. These measurements inform the intrinsic balance between M1- and M2-like polarization
    states in a human tumor microenvironment, which is mechanistically related to the M2→M1 polarization process encoded by
    k_M1_pol. However, DLBCL arises in lymphoid tissue with a highly different stromal architecture, vasculature, and cytokine
    milieu than PDAC, so the absolute M1:M2 ratio and the degree of mixed M1M2 phenotypes may differ by orders of magnitude.
    We therefore use this source only to weakly inform the plausible order-of-one magnitude for the polarization rate ratio,
    with a large translation-uncertainty factor.
  perturbation_relevance: null
  perturbation_type: pathological_state
  source_quality: primary_human_clinical
  species_source: human
  species_target: human
  tme_compatibility: low
  tme_compatibility_notes: DLBCL lesions are lymphoid-organ tumors with relatively permissive immune infiltration and limited
    desmoplastic stroma, in contrast to the dense, hypoxic, and T cell–excluded PDAC microenvironment. TAM ontogeny, exposure
    to stromal cues, and cytokine gradients (e.g., IL-10, TGFbeta, IFNg, IL-12) are therefore substantially different. As
    a result, the canonical M1:M2 fraction measured in DLBCL likely overestimates the M1 contribution relative to PDAC and
    should be treated as a very uncertain proxy for PDAC TAM polarization balance.
  validation_warnings: []
study_interpretation: The Manfroi2021 DLBCL study quantifies canonical M1 and M2 tumor-associated macrophages in human lymphoma
  biopsies using CD68, CD86, and CD163 markers. Canonical M1 (CD86+CD163−) and canonical M2 (CD86−CD163+) TAMs constitute
  roughly 16% and 21% of the total CD68+ macrophage pool, respectively, with the remainder belonging to a noncanonical CD86+CD163+
  M1M2 subset. Interpreted through a simple polarization-balance lens, this implies an order-of-one M1:M2 ratio at pathological
  steady state, suggesting that the forward (M2→M1) polarization rate is of similar magnitude to, but modestly lower than,
  the reverse (M1→M2) rate. We use this as a weak cross-indication constraint on the ratio k_M1_pol/k_M2_pol in the PDAC QSP
  model, acknowledging substantial differences in tumor microenvironments and macrophage ontogeny between DLBCL and PDAC.
target_id: k_M1_pol_steady_state_ratio_DLBCL2021
