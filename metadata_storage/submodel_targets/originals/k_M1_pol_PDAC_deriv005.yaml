calibration:
  error_model:
  - evaluation_points: null
    likelihood:
      distribution: lognormal
      rationale: The M1:M2 ratio is positive and expected to exhibit multiplicative inter-patient variability; a lognormal
        likelihood is appropriate.
    name: m1_m2_ratio_dlbcl
    observable: null
    observation_code: "def derive_observation(inputs, sample_size, ureg):\n    import numpy as np\n    m1 = inputs['m1_fraction_mean']\n\
      \    m1_sd = inputs['m1_fraction_sd']\n    m2 = inputs['m2_fraction_mean']\n    m2_sd = inputs['m2_fraction_sd']\n \
      \   # Mean M1:M2 ratio\n    ratio_mean = (m1 / m2).to('dimensionless')\n    # Propagate relative SD assuming independent\
      \ errors\n    rel_sd_m1 = m1_sd.magnitude / m1.magnitude\n    rel_sd_m2 = m2_sd.magnitude / m2.magnitude\n    cv_ratio\
      \ = float(np.sqrt(rel_sd_m1**2 + rel_sd_m2**2))\n    return {\n        'value': ratio_mean,\n        'sd': cv_ratio,\n\
      \        'sd_uncertain': False,\n    }\n"
    sample_size: 3
    sample_size_rationale: Canonical M1 and M2 TAM fractions were quantified in 3 primary DLBCL cases; data are reported as
      mean ± SD across these patients.
    units: dimensionless
    uses_inputs:
    - m1_fraction_mean
    - m1_fraction_sd
    - m2_fraction_mean
    - m2_fraction_sd
  forward_model:
    data_rationale: The study quantifies canonical M1 (CD86+CD163−) and canonical M2 (CD86−CD163+) tumor-associated macrophages
      as percentages of CD68+ TAMs in human DLBCL biopsies. At steady state, the observed fraction ratio M1:M2 primarily reflects
      the balance of M2→M1 versus M1→M2 polarization rates, assuming comparable recruitment and death rates across phenotypes.
    drive_denominator: '1.0'
    drive_numerator: '1.0'
    independent_variable: null
    rate_denominator: k_M2_pol
    rate_numerator: k_M1_pol
    state_variables: null
    submodel_rationale: In the full PDAC QSP model, k_M1_pol governs V_T.Mac_M2 → V_T.Mac_M1 polarization, while k_M2_pol
      governs the reverse M1→M2 transition. Under quasi-steady polarization dynamics with similar net loss and recruitment
      across phenotypes, the steady-state M1:M2 abundance ratio scales approximately with k_M1_pol/k_M2_pol. The SteadyStateRatio
      model therefore maps the canonical M1:M2 TAM ratio onto the polarization rate ratio, while acknowledging substantial
      uncertainty due to indication and TME differences.
    type: steady_state_ratio
    unit_conversion_factor: '1.0'
  identifiability_notes: This target constrains primarily the ratio k_M1_pol/k_M2_pol via the observed canonical M1:M2 TAM
    fraction in DLBCL. Absolute magnitudes of k_M1_pol and k_M2_pol remain weakly identified and must be informed by other
    PDAC-specific targets (e.g., pharmacologic polarization assays, macrophage turnover data). The presence of a large noncanonical
    M1M2 TAM subset means that the canonical M1 and M2 fractions only approximate the pure Mac_M1 and Mac_M2 pools of the
    PDAC QSP model; we treat this as an additional source of model discrepancy captured via the large translation-uncertainty
    factor in source_relevance.
  parameters:
  - name: k_M1_pol
    prior:
      distribution: lognormal
      lower: null
      mu: 0.0
      rationale: Wide prior centered at 1/day to cover plausible macrophage polarization rates (approximately 0.01–10 1/day)
        given limited translational relevance of DLBCL TAM data to PDAC.
      sigma: 2.0
      upper: null
    units: 1/day
  - name: k_M2_pol
    prior:
      distribution: lognormal
      lower: null
      mu: 0.0
      rationale: Wide prior for reverse M1→M2 polarization rate; only the ratio k_M1_pol/k_M2_pol is informed by this target,
        so a broad prior avoids biasing the inferred ratio.
      sigma: 2.0
      upper: null
    units: 1/day
