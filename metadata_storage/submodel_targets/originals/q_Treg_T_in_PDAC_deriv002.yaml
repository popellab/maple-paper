calibration:
  identifiability_notes: This submodel constrains q_Treg_T_in primarily through the steady-state ratio of intratumoral to
    peripheral Treg fractions and an external estimate of peripheral Treg turnover. Under the saturated-recruitment, quasi-steady-state
    assumptions, q_Treg_T_in is effectively proportional to the product of the tumor-to-blood Treg enrichment ratio and the
    Treg turnover rate. Because we treat the Treg doubling time as fixed rather than inferring it jointly, q_Treg_T_in is
    identifiable in this reduced model up to the modeling assumptions about equal Treg fractions tracking relative concentrations.
    If k_Treg_death or the effective tumor volume scale were also free, only the combination q_Treg_T_in/k_Treg_death (per
    unit tumor volume) would be identifiable; additional dynamic data on Treg accumulation or independent estimates of Treg
    death in PDAC tumors would be needed to disentangle these effects.
  independent_variable: null
  measurements:
  - distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    # Extract means and standard deviations\
      \ for Treg fractions\n    f_tumor = inputs['PDAC_TIL_Treg_fraction_mean'].magnitude\n    sd_tumor = inputs['PDAC_TIL_Treg_fraction_sd'].magnitude\n\
      \    f_pbmc = inputs['PBMC_Treg_fraction_mean'].magnitude\n    sd_pbmc = inputs['PBMC_Treg_fraction_sd'].magnitude\n\
      \    # Doubling time for human peripheral blood Tregs (days)\n    t_doubling_days = inputs['Treg_doubling_time_mean'].to('day').magnitude\n\
      \n    n_samples = 10000\n    tumor_samples = np.random.normal(f_tumor, sd_tumor, n_samples)\n    pbmc_samples = np.random.normal(f_pbmc,\
      \ sd_pbmc, n_samples)\n    # Prevent non-physical negative fractions\n    tumor_samples = np.clip(tumor_samples, 1e-6,\
      \ None)\n    pbmc_samples = np.clip(pbmc_samples, 1e-6, None)\n\n    ratio_samples = tumor_samples / pbmc_samples\n\n\
      \    # First-order turnover rate from doubling time\n    k_per_day = np.log(2.0) / t_doubling_days\n    k_per_min =\
      \ k_per_day / (24.0 * 60.0)\n\n    # Reference tumor volume of 1 cm^3 to recover units 1/(cm^3*min)\n    V_ref = 1.0\n\
      \n    q_samples = ratio_samples * k_per_min / V_ref\n\n    return {\n        'median': float(np.median(q_samples)),\n\
      \        'ci95_lower': float(np.percentile(q_samples, 2.5)),\n        'ci95_upper': float(np.percentile(q_samples, 97.5)),\n\
      \    }"
    evaluation_points:
    - 0.0
    likelihood:
      distribution: lognormal
      rationale: The derived q_Treg_T_in distribution represents uncertainty in mapping from measured tumor vs blood Treg
        enrichment and Treg turnover into an effective extravasation rate. A lognormal likelihood is appropriate for this
        positive, multiplicative quantity.
    name: q_Treg_T_in_derived
    observable: null
    sample_size: 45
    sample_size_rationale: Tang et al. report flow cytometry data from 45 PDAC patients with paired PBMC and tumor TIL measurements.
      The Treg turnover estimate is based on 8 healthy donors, but is treated as a fixed auxiliary parameter here.
    units: 1/(centimeter^3*minute)
    uses_inputs:
    - PDAC_TIL_Treg_fraction_mean
    - PDAC_TIL_Treg_fraction_sd
    - PBMC_Treg_fraction_mean
    - PBMC_Treg_fraction_sd
    - Treg_doubling_time_mean
  model:
    data_rationale: Tang et al. provide paired measurements of regulatory T cell (Treg) fractions in peripheral blood and
      PDAC tumor-infiltrating lymphocytes across 45 patients, which constrains the steady-state enrichment of Tregs in tumor
      relative to blood. Vukmanovic-Stejic et al. provide an in vivo doubling time for human CD4+CD25hiFoxp3+ Tregs, characterizing
      their peripheral turnover rate. Assuming that in resectable PDAC the intratumoral Treg pool is near steady state, these
      data together constrain the net influx rate required to maintain the observed intratumoral Treg fraction against turnover.
    formula: q_Treg_T_in = (PDAC_TIL_Treg_fraction_mean / PBMC_Treg_fraction_mean) * (ln(2) / Treg_doubling_time_mean) / (1
      centimeter**3)
    submodel_rationale: In the full QSPIO-PDAC model, q_Treg_T_in multiplies tumor volume, central-compartment Treg number,
      and a cancer-burden dependent recruitment term (C_total^2/(C_total^2+Kc_rec)) to give the flux of Tregs (and Th cells)
      from blood into tumor. For established PDAC lesions at surgical resection, tumor burden is high so C_total>>sqrt(Kc_rec)
      and the recruitment term is effectively 1. The central Treg pool and tumor volume change slowly compared to trafficking,
      allowing their product to be treated as approximately constant over the timescale of Treg turnover. Under these conditions,
      the tumor Treg pool obeys a first-order balance between a constant influx proportional to q_Treg_T_in and a first-order
      loss due to death/turnover. The direct_conversion model analytically maps the observed steady-state tumor-to-blood Treg
      ratio and an externally measured Treg turnover rate to an effective q_Treg_T_in that is mechanistically consistent with
      the full trafficking term in the saturated, steady-state limit.
    type: direct_conversion
  parameters:
  - name: q_Treg_T_in
    prior:
      distribution: lognormal
      lower: null
      mu: -8.52
      rationale: Center prior at the value implied by PDAC patient tumor vs blood Treg enrichment (~3-fold) combined with
        human Treg turnover (doubling time ~8 days), but allow roughly one order-of-magnitude uncertainty to account for modeling
        simplifications and inter-patient variability.
      sigma: 1.0
      upper: null
    units: 1/(centimeter^3*minute)
  state_variables: null
experimental_context:
  cell_lines: null
  cell_types:
  - isolation_method: TILs isolated from resected PDAC tissue; PBMCs isolated from peripheral blood using density-gradient
      separation, followed by multicolor flow cytometry gating on CD3+CD4+CD25+Foxp3+ cells.
    name: CD4+CD25+Foxp3+ regulatory T cell
    phenotype: regulatory T cell (Treg) from PDAC tumor-infiltrating lymphocytes and peripheral blood
  - isolation_method: Same TIL and PBMC preparations, gated as CD3+CD4+ T cells by flow cytometry.
    name: CD4+ T cell
    phenotype: conventional CD4+ T cells in tumor and blood, used as denominator for Treg fractions
  culture_conditions: null
  indication: pancreatic_ductal_adenocarcinoma
  species: human
  system: human_clinical_tumor_and_peripheral_blood
