  estimated_translation_uncertainty_fold: 2.0
  indication_match: exact
  indication_match_justification: The primary dataset comes from PDAC patients undergoing surgical resection, measuring CD4+CD25+Foxp3+
    regulatory T cell frequencies in tumor-infiltrating lymphocytes and matched peripheral blood by flow cytometry. This directly
    matches the PDAC indication and tumor compartment structure in the QSPIO-PDAC model, so the observed enrichment of Tregs
    in PDAC tumor tissue is highly informative for calibrating the tumor-directed Treg extravasation rate. The auxiliary Treg
    turnover data are from healthy human volunteers, providing systemic Treg kinetics in the same species without tumor-specific
    confounding; these are used only to set an overall turnover timescale.
  perturbation_relevance: null
  perturbation_type: pathological_state
  source_quality: primary_human_clinical
  species_source: human
  species_target: human
  tme_compatibility: high
  tme_compatibility_notes: Tang et al. analyze Tregs in human PDAC tumor tissue and adjacent normal pancreas, capturing the
    desmoplastic, immunosuppressive microenvironment characteristic of PDAC, including juxtatumoral stromal localization of
    Foxp3+ cells and reduced CD8+ T cell density near tumor epithelium. This microenvironment closely matches that represented
    in the QSPIO-PDAC model. The Treg turnover data from Vukmanovic-Stejic et al. are derived from peripheral blood in healthy
    donors rather than tumor, so they characterize systemic Treg homeostasis rather than tumor-specific survival; this mainly
    affects the mapping from turnover to extravasation rate rather than the relative enrichment between tumor and blood.
  validation_warnings: null
study_interpretation: Tang et al. demonstrate that in human PDAC, regulatory T cells are markedly enriched within tumor-infiltrating
  lymphocytes compared to both normal pancreatic tissue and peripheral blood, with mean Treg fractions of approximately 17.8%
  of CD4+ T cells in TILs versus 5.8% in PBMCs. This roughly three-fold enrichment, together with the observation that peripheral
  Treg frequencies are similar in PDAC patients and healthy controls, indicates a strong net recruitment and/or retention
  of Tregs into the PDAC tumor microenvironment. Vukmanovic-Stejic et al. show that human CD4+CD25hiFoxp3+ Tregs in peripheral
  blood have a rapid in vivo turnover with a doubling time of about 8 days, implying substantial ongoing proliferation and
  death. Assuming that resectable PDAC tumors are in a quasi-steady state with respect to Treg numbers, the intratumoral Treg
  pool must be replenished at a rate that balances this turnover while maintaining a three-fold higher fraction than in blood.
  The submodel therefore interprets the PDAC tumor-to-blood Treg enrichment as arising from a constant influx proportional
  to q_Treg_T_in acting against a first-order Treg loss rate set by the turnover timescale, and uses a direct analytical mapping
  to derive an effective distribution for q_Treg_T_in consistent with these observations.
