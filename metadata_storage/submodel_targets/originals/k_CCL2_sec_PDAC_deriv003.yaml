  model:
    data_rationale: '[Scrubbed due to ''secret'']'
    formula: k_CCL2_sec = (MDA_MB231_CCL2_mass_48h / CCL2_molecular_weight / MDA_MB231_cell_count / MDA_MB231_time_interval_48h)
    submodel_rationale: In the full QSP PDAC model, tumor CCL2 dynamics in the tumor compartment follow d(CCL2)/dt = k_CCL2_sec
      * C_total - k_CCL2_deg * CCL2. Integrating this ODE over a short interval with approximately constant cell number and
      ignoring degradation yields CCL2(t) - CCL2(0) ≈ k_CCL2_sec * C_total * t. The in vitro assay measures this cumulative
      production per cell over a fixed time, so an algebraic conversion from cumulative mass to moles per cell per day is
      a mechanistically consistent submodel for k_CCL2_sec.
    type: direct_conversion
