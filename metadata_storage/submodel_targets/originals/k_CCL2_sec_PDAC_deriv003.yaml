  identifiability_notes: '[Scrubbed due to ''secret'']'
  independent_variable: null
  measurements:
  - distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    mass = inputs['MDA_MB231_CCL2_mass_48h']\n\
      \    time = inputs['MDA_MB231_time_interval_48h']\n    cells = inputs['MDA_MB231_cell_count']\n    mw = inputs['CCL2_molecular_weight']\n\
      \    # Convert to base units\n    mass_g = mass.to('gram').magnitude\n    mw_g_per_mol = mw.to('gram/mole').magnitude\n\
      \    moles = mass_g / mw_g_per_mol\n    time_days = time.to('day').magnitude\n    cell_number = cells.magnitude\n  \
      \  k_mol_per_cell_per_day = moles / (cell_number * time_days)\n    k_nmol_per_cell_per_day = k_mol_per_cell_per_day\
      \ * 1e9\n    samples = np.array([k_nmol_per_cell_per_day])\n    return {\n        'median': float(np.median(samples)),\n\
      \        'ci95_lower': float(np.percentile(samples, 2.5)),\n        'ci95_upper': float(np.percentile(samples, 97.5)),\n\
      \    }"
    evaluation_points:
    - 0.0
