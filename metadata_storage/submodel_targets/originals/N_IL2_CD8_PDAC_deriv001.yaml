study_interpretation: Castro et al. 2012 demonstrate that transient enhancement of IL-2 receptor signaling during priming
  (via IL-2/anti-IL-2 complexes that target the high-affinity IL-2R) can amplify antigen-specific OT-I CD8+ effector-memory
  cell numbers by roughly 40- to 70-fold at 10 to 30 days post-priming relative to peptide/LPS alone. Within a division destiny
  framework where total expansion is approximated by 2^N, this fold increase implies an additional ~5-6 effective cell generations
  attributable to IL-2 signaling. Mapping this amplification factor to N_IL2_CD8 provides a mechanistically grounded estimate
  of the maximum number of extra CD8 T cell divisions that IL-2 can drive in the QSPIO-PDAC model.
