calibration:
  identifiability_notes: This submodel constrains N_IL2_CD8 primarily through a single proxy observable (fold-change in OT-I
    memory CD8 T cells with vs. without IL-2 complexes). As such, it provides an order-of-magnitude estimate for the maximum
    IL-2-driven generations but cannot distinguish IL-2 effects on proliferation vs. survival. N_IL2_CD8 may be correlated
    in the full QSP model with other parameters controlling CD8 survival, contraction, and baseline division destiny from
    TCR and costimulation signals. Additional in vitro CFSE/CTV division destiny data under graded IL-2 would improve identifiability
    and separation of IL-2-specific division effects from survival effects.
  independent_variable: null
  measurements:
  - distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    # Extract lower and upper reported\
      \ fold-changes in OT-I memory cells\n    f_low = inputs['fold_increase_memory_day10_min'].magnitude\n    f_high = inputs['fold_increase_memory_day30_max'].magnitude\n\
      \n    # Treat f_low and f_high as approximate 95 percent interval bounds\n    # for a lognormal distribution of the\
      \ IL-2-driven fold increase.\n    mu_log = 0.5 * (np.log(f_low) + np.log(f_high))\n    sigma_log = (np.log(f_high) -\
      \ np.log(f_low)) / (2.0 * 1.96)\n\n    # Sample fold-increase values on the original scale\n    fold_samples = np.random.lognormal(mean=mu_log,\
      \ sigma=sigma_log, size=10000)\n\n    # Map fold increase to additional IL-2-driven generations\n    # assuming each\
      \ division doubles cell number: fold = 2^N.\n    N_samples = np.log2(fold_samples)\n\n    return {\n        'median':\
      \ float(np.median(N_samples)),\n        'ci95_lower': float(np.percentile(N_samples, 2.5)),\n        'ci95_upper': float(np.percentile(N_samples,\
      \ 97.5)),\n    }"
    evaluation_points:
    - 0.0
    likelihood:
      distribution: normal
      rationale: We treat the derived distribution over N_IL2_CD8 as a summary observation on the maximum IL-2-driven CD8
        division generations; a normal likelihood on N_IL2_CD8 in the calibration will be matched to this derived median and
        CI.
    name: N_IL2_CD8_estimate_from_OTI_memory_fold
    observable: null
    sample_size: 3
    sample_size_rationale: Castro et al. report data as mean +/- SE from 3-9 mice per time point; we conservatively take n=3
      as the effective sample size for the 40- to 70-fold increase in OT-I memory cells.
    units: dimensionless
    uses_inputs:
    - fold_increase_memory_day10_min
    - fold_increase_memory_day30_max
  model:
    data_rationale: Castro et al. 2012 quantified that transient high-affinity IL-2 receptor stimulation via IL-2/anti-IL-2
      complexes led to a 40- to 70-fold increase in antigen-specific OT-I CD8 memory T cell numbers at 10 and 30 days post-priming
      compared with peptide/LPS alone. This fold-increase acts as a proxy for the cumulative IL-2-driven proliferation and
      survival advantage acquired during priming.
    formula: N_IL2_CD8 = log2(fold_increase_IL2_memory)
    submodel_rationale: In the full QSPIO-PDAC model, N_IL2_CD8 represents the maximum number of CD8 T cell generations attributable
      to IL-2 signaling (division destiny style cap). Assuming that extra IL-2-driven divisions amplify T cell numbers approximately
      as 2^N in the expansion phase, the additional IL-2-specific generations can be estimated as N_IL2_CD8 = log2(fold_increase_due_to_IL2).
      Using fold expansion of OT-I memory CD8 T cells under IL-2/anti-IL-2 complex treatment thus provides a mechanistic proxy
      for this division cap.
    type: direct_conversion
  parameters:
  - name: N_IL2_CD8
    prior:
      distribution: normal
      lower: 0.0
      mu: 5.0
      rationale: Wide prior for maximum number of IL-2-driven CD8 T cell generations, centered around ~5 divisions with generous
        uncertainty to accommodate different experimental systems and potential species differences.
      sigma: 2.0
      upper: 15.0
    units: dimensionless
  state_variables: null
experimental_context:
  cell_lines: null
  cell_types:
  - isolation_method: Magnetic CD8+ T cell enrichment from OT-I/Rag1-/- donor mice followed by adoptive transfer into CD45.1
      C57BL/6 recipients and peptide/LPS immunization with or without IL-2/anti-IL-2 complexes.
    name: CD8 T cell
    phenotype: Naive OT-I CD8+ T cells adoptively transferred into C57BL/6 mice; antigen-experienced OT-I effector and effector-memory
      CD8+ T cells generated in vivo
  culture_conditions: null
  indication: non-tumor infectious disease model; used here as a mechanistic proxy for IL-2-driven CD8 expansion in PDAC immunotherapy
    modeling
  species: mouse
  system: in_vivo
