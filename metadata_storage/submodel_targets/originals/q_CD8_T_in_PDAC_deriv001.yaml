study_interpretation: Boissonnas et al. (2007) provide quantitative data on the accumulation of adoptively transferred OT1
  CD8 T cells within established subcutaneous EG7 thymomas in C57BL/6 mice, including an absolute late-phase density of 327
  +/- 50 OT1 cells per mm^2 at day 6 in 500-1,000 mm^3 tumors after transfer of 10^7 naive OT1-GFP cells. These data, combined
  with section thickness and tumor volume, imply a characteristic scale for the total tumor-infiltrating OT1 population. De
  Boer et al. (2003) report an in vivo CD8 effector contraction half-life of ~41 h, which we use to approximate the first-order
  loss rate of tumor-infiltrating CD8 T cells. Assuming an approximate steady state between constant influx and first-order
  loss at day 6, we analytically map these measurements to an effective CD8 extravasation rate coefficient q_CD8_T_in via
  the same mechanistic structure used in the full QSPIO-PDAC model (flux proportional to V_T * V_C.CD8). This yields an empirically
  grounded distribution for q_CD8_T_in in a permissive solid tumor setting, which can serve as a prior for PDAC calibration
  (with additional downscaling to account for T cell exclusion in PDAC).
target_id: q_CD8_T_in_extravasation_boissonnas2007
