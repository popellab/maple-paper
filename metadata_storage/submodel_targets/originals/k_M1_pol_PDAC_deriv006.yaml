  tme_compatibility_notes: Macrophage densities and phenotypes were measured in situ in resected human PDAC tumors and peri-tumoral
    regions, capturing the desmoplastic, immunosuppressive microenvironment characteristic of PDAC. Although sampling is limited
    to selected cores and high-power fields, the overall TAM composition (iNOS+ vs CD163+) is representative of the PDAC tumor
    compartment modeled in QSPIO-PDAC.
