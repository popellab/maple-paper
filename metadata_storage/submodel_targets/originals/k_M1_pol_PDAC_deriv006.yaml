key_assumptions:
- iNOS+ tumor-associated macrophages are treated as a proxy for M1-like macrophages and CD163+ tumor-associated macrophages
  as a proxy for M2-like macrophages in the PDAC tumor microenvironment.
- Counts of iNOS+ and CD163+ macrophages per high-power field in tumor and peri-tumoral regions reflect the relative abundance
  of Mac_M1 and Mac_M2 in the QSPIO-PDAC tumor compartment, despite potential spatial heterogeneity within tumors.
- The average values reported (5 iNOS+ vs 92 CD163+ macrophages in tumor/peri-tumoral areas) can be interpreted as cohort-level
  means suitable for constraining a population-level M1:M2 ratio in the model.
- Differences in recruitment rates, survival, and proliferation between M1 and M2 macrophages are either modest relative to
  polarization fluxes or are effectively absorbed into the effective polarization rate constants, so that the steady-state
  Mac_M1:Mac_M2 ratio is approximated by k_M1_pol/k_M2_pol.
- A conservative 50% coefficient of variation on the M1:M2 ratio captures unreported dispersion in macrophage counts across
  patients and fields, as well as uncertainties arising from using marker-defined subsets (iNOS, CD163) rather than functional
  assays.
key_study_limitations:
- Single-center retrospective cohort with a relatively small sample size (38 patients), which may limit generalizability across
  PDAC populations.
- Macrophage counts were derived from selected tissue microarray cores and high-power fields, which may not fully capture
  intra-tumoral spatial heterogeneity in M1/M2 distribution.
- Only two markers (iNOS for M1-like and CD163 for M2-like TAMs) were used; some macrophages may co-express or lack these
  markers, leading to potential misclassification of intermediate phenotypes along the M1-M2 spectrum.
- Absolute counts are reported without explicit standard deviations or standard errors for iNOS+ and CD163+ macrophages, requiring
  an assumed coefficient of variation for calibration.
- The analysis combines intra-tumoral and peri-tumoral macrophages, whereas the QSP model tumor compartment may effectively
  represent predominantly intra-tumoral regions; this is mitigated by focusing on the ratio rather than absolute densities.
