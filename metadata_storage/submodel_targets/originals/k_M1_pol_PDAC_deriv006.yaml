calibration:
  error_model:
  - evaluation_points: null
    likelihood:
      distribution: lognormal
      rationale: The M1:M2 macrophage ratio is a positive quantity that can vary over orders of magnitude between patients;
        a lognormal likelihood is appropriate for such ratios and is consistent with using a coefficient-of-variation style
        uncertainty.
    name: m1_m2_ratio_pdac_desimoni2023
    observable: null
    observation_code: "def derive_observation(inputs, sample_size):\n    inos = inputs['inos_tumor_mean_per_hpf']\n    cd163\
      \ = inputs['cd163_tumor_mean_per_hpf']\n    # Compute endogenous/pathological-state M1:M2 ratio in PDAC tumor tissue\n\
      \    if cd163 <= 0:\n        ratio = 0.0\n    else:\n        ratio = inos / cd163\n    cv = inputs['m1_m2_ratio_assumed_cv']\n\
      \    return {\n        'value': ratio,\n        # For a lognormal likelihood, sd is the coefficient of variation (dimensionless)\n\
      \        'sd': cv,\n        'sd_uncertain': True,\n        'n': int(sample_size) if sample_size is not None else None,\n\
      \    }"
    sample_size: 38
    sample_size_rationale: Number of resected PDAC patients (n = 38) included in De Simoni et al. for tumor microenvironment
      characterization.
    units: dimensionless
    uses_inputs:
    - inos_tumor_mean_per_hpf
    - cd163_tumor_mean_per_hpf
    - m1_m2_ratio_assumed_cv
  forward_model:
    data_rationale: De Simoni et al. quantified intra- and peri-tumoral tumor-associated macrophages in resected human PDAC
      by immunohistochemistry, reporting average counts of iNOS+ (M1-like) and CD163+ (M2-like) macrophages per high-power
      field in tumor versus normal pancreatic parenchyma. The ratio of M1 to M2 marker-positive macrophages in untreated PDAC
      provides a direct readout of endogenous/pathological-state macrophage polarization in the tumor microenvironment.
    drive_denominator: '1.0'
    drive_numerator: '1.0'
    independent_variable: null
    rate_denominator: k_M2_pol
    rate_numerator: k_M1_pol
    state_variables: null
    submodel_rationale: In the full QSPIO-PDAC model, M2 tumor macrophages (Mac_M2) polarize to M1 (Mac_M1) at rate k_M1_pol
      * Mac_M2 times an IL12/IFNg-dependent activation factor, while M1 polarize back to M2 at rate k_M2_pol * Mac_M1 times
      a TGFbeta/IL10/IL6-dependent factor. At quasi-steady state, and assuming comparable recruitment and loss rates for the
      two phenotypes, the Mac_M1:Mac_M2 abundance ratio scales with the net forward-to-reverse polarization propensity, approximated
      here as k_M1_pol/k_M2_pol with cytokine drive factors absorbed into the effective rates. The steady_state_ratio model
      therefore maps the polarization rate constants from the full QSP model to the observed M1:M2 macrophage ratio in untreated
      PDAC tissue.
    type: steady_state_ratio
    unit_conversion_factor: '1.0'
  identifiability_notes: This target constrains the steady-state ratio of M1-like to M2-like tumor-associated macrophages
    in untreated human PDAC, approximated as the ratio of iNOS+ to CD163+ macrophage counts (5 vs 92 cells per high-power
    field). Under the simplified steady_state_ratio submodel, the predicted ratio is k_M1_pol/k_M2_pol, so this dataset informs
    only the relative magnitude of forward (M2->M1) to reverse (M1->M2) polarization rates, not their absolute scale. Absolute
    identifiability of k_M1_pol and k_M2_pol therefore relies on integration with additional submodels (e.g., pharmacologically
    stimulated polarization kinetics and other steady-state ratio targets). The assumed 50% CV on the ratio further reflects
    uncertainty due to lack of reported dispersion measures and potential sampling heterogeneity within tumors.
  parameters:
  - name: k_M1_pol
    prior:
      distribution: lognormal
      lower: null
      mu: -2.3
      rationale: Wide lognormal prior centered at ~0.1/day, reflecting basal macrophage polarization timescales on the order
        of days and allowing >10-fold uncertainty due to limited direct kinetic data in human PDAC tissue.
      sigma: 1.0
      upper: null
    units: 1/day
  - name: k_M2_pol
    prior:
      distribution: lognormal
      lower: null
      mu: -2.3
      rationale: Wide lognormal prior centered at ~0.1/day for reverse M1->M2 polarization, symmetric with k_M1_pol prior
        so that the DeSimoni2023 ratio measurement primarily constrains the ratio k_M1_pol/k_M2_pol rather than imposing a
        strong bias toward either direction.
      sigma: 1.0
      upper: null
    units: 1/day
