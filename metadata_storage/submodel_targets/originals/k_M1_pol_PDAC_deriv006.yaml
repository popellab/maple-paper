study_interpretation: De Simoni et al. performed tissue microarray-based immunohistochemistry on resected human PDAC specimens
  to characterize the tumor immune microenvironment, including tumor-associated macrophages (TAMs). They quantified iNOS+
  (M1-like) and CD163+ (M2-like) macrophages in tumor and peri-tumoral regions versus normal pancreatic parenchyma, reporting
  that both markers are enriched in tumor tissue but that CD163+ macrophages greatly outnumber iNOS+ macrophages (92 vs 5
  cells per high-power field on average in tumor/peri-tumoral regions). This implies an endogenous/pathological-state M1:M2
  ratio of roughly 1:18 within the PDAC tumor microenvironment, consistent with a predominance of immunosuppressive M2-like
  TAMs. In the QSPIO-PDAC model, the balance between Mac_M1 and Mac_M2 is governed primarily by the opposing polarization
  rate constants k_M1_pol (M2->M1) and k_M2_pol (M1->M2), modulated by cytokine milieus. By mapping the observed iNOS+:CD163+
  ratio onto the k_M1_pol/k_M2_pol ratio under pathological PDAC conditions, this study provides an endogenous anchor for
  the basal M2->M1 polarization rate, complementing existing pharmacologically stimulated polarization targets.
