key_assumptions:
- Tumor-infiltrating CD14+HLA-DR-/lo cells in Trovato et al. are an adequate phenotypic proxy for the MDSC population represented
  in the QSPIO-PDAC model.
- Resected or biopsied PDAC tumors from treatment-naive patients are in a quasi-steady-state for MDSC trafficking, so that
  recruitment approximately balances loss over the timescale probed by the cross-sectional measurements.
- Chemokine- and cytokine-dependent drivers of MDSC recruitment (for example, CCL2, IL-6) are near saturating in advanced
  PDAC, allowing the recruitment term in the full model to be approximated by k_MDSC_rec times tumor volume without explicit
  CCL2 or IL-6 modulation in this submodel.
- Effective MDSC loss in tumor can be represented by a single first-order rate k_MDSC_death that aggregates true cell death
  and any clearance or egress processes relevant on the timescale of days.
- Inter-patient heterogeneity in immune composition (reflected in the reported variability) is treated as measurement and
  biological noise around a single population-level mean fraction for calibration purposes.
key_study_limitations:
- The study reports the mean and variability of MDSC and other immune subset frequencies across 29 patients but does not stratify
  by detailed clinical covariates (for example, stage, tumor size, anatomical site), which may contribute additional heterogeneity
  compared with the homogeneous virtual patient population in the model.
- The reported variability (0.969 +/- 0.167%) is given without explicit clarification in the text as SD vs. SEM for Figure
  1; here it is treated as SD, and this ambiguity is reflected by marking the observational SD as uncertain in the error model.
- Flow cytometric gating of human MDSC subsets is challenging and may include or exclude functionally distinct myeloid populations;
  the CD14+HLA-DR-/lo gate captures monocytic MDSCs but does not explicitly quantify granulocytic or PMN-MDSCs in tumor.
- The data provide only a single steady-state fraction for one MDSC subset, so k_MDSC_rec and k_MDSC_death are not separately
  identifiable from this target alone; additional data or priors are needed to break this degeneracy.
