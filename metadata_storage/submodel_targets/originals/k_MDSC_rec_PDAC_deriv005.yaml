calibration:
  error_model:
  - evaluation_points: null
    likelihood:
      distribution: lognormal
      rationale: Frequencies are positive and typically right-skewed across patients; modeling measurement noise on the log
        scale via a lognormal likelihood is appropriate.
    name: mmdsc_fraction_pdac_trovato2019
    observable: null
    observation_code: "def derive_observation(inputs, sample_size):\n    mean = inputs['mmdsc_fraction_cd14_hdrlow_mean']\n\
      \    sd = inputs['mmdsc_fraction_cd14_hdrlow_sd']\n    cv = sd / mean\n    return {\n        'value': mean,\n      \
      \  'sd': cv,\n        'sd_uncertain': True,\n        'n': int(inputs['mmdsc_fraction_cd14_hdrlow_n']),\n    }"
    sample_size: 29
    sample_size_rationale: Number of PDAC tumor samples analyzed by flow cytometry for tumor-infiltrating leukocyte composition
      in Trovato et al. (n = 29).
    units: percent
    uses_inputs:
    - mmdsc_fraction_cd14_hdrlow_mean
    - mmdsc_fraction_cd14_hdrlow_sd
    - mmdsc_fraction_cd14_hdrlow_n
  forward_model:
    data_rationale: Trovato et al. (2019) quantified the abundance of multiple immune subsets in freshly digested PDAC tumor
      biopsies from 29 treatment-naive patients using multicolor flow cytometry. They report the frequency of monocytic MDSCs
      (defined as CD14+HLA-DR-/lo cells) as 0.969 +/- 0.167% of CD45+ tumor-infiltrating leukocytes. Under a quasi-steady-state
      assumption for the chronic PDAC microenvironment at the time of surgery or biopsy, this fractional abundance constrains
      the balance between MDSC recruitment into the tumor and their loss (death and clearance).
    drive_factor: '1.0'
    independent_variable: null
    loss_rate: k_MDSC_death
    parent_density:
      reference_ref: pdac_cd45_density_volumetric
    state_variables: null
    submodel_rationale: In the full QSPIO-PDAC model, intratumoral MDSCs obey d(MDSC_T)/dt = k_MDSC_rec * V_T * f(CCL2,IL6)
      - k_MDSC_death * MDSC_T - other loss terms. For large, established PDAC tumors with high CCL2 and IL-6, we approximate
      chemokine-dependent recruitment as effectively saturated (f(CCL2,IL6) ~ 1), so that the net recruitment rate per tumor
      volume is governed by k_MDSC_rec. At steady state, the fraction of CD45+ cells that are MDSCs is proportional to the
      ratio k_MDSC_rec / k_MDSC_death scaled by the total CD45+ cell density in PDAC. The steady_state_fraction submodel captures
      this algebraic balance while preserving the same mechanistic roles of k_MDSC_rec (recruitment) and k_MDSC_death (loss)
      as in the full ODE system.
    target_rate: k_MDSC_rec
    type: steady_state_fraction
    unit_conversion_factor: '1.0'
  identifiability_notes: This target constrains the ratio k_MDSC_rec / (k_MDSC_death * parent_density) through the observed
    fraction of CD45+ cells that are CD14+HLA-DR-/lo MDSCs in PDAC tumors. With k_MDSC_rec and k_MDSC_death both treated as
    free parameters, only their ratio is identifiable from this single steady-state fraction measurement; absolute values
    of each parameter remain correlated. Dimensional anchoring is provided by the reference CD45+ leukocyte density in PDAC
    (pdac_cd45_density_volumetric), so the inferred combination k_MDSC_rec / k_MDSC_death has units of cell/(mL*day). To separately
    constrain k_MDSC_death, additional data are required (for example, MDSC Ki-67 positivity or in situ turnover), or informative
    priors on MDSC lifetimes. In practice, this clinical PDAC target is intended to be combined with other murine and human
    data (for example, Hong2015, Porembka2012) in a joint calibration, where those additional targets help regularize k_MDSC_death
    while this study primarily anchors the overall magnitude of k_MDSC_rec in human PDAC.
  parameters:
  - name: k_MDSC_rec
    prior:
      distribution: lognormal
      lower: null
      mu: 15.0
      rationale: Very weakly informative prior centered around 3e6 cell/(mL*day), spanning several orders of magnitude to
        cover literature estimates from mouse PDAC and human tumors. Reflects large uncertainty in absolute MDSC recruitment
        rates.
      sigma: 2.0
      upper: null
    units: cell/(milliliter*day)
  - name: k_MDSC_death
    prior:
      distribution: lognormal
      lower: null
      mu: 0.0
      rationale: Weakly informative prior for effective MDSC loss (death + clearance) in tumor, centered at 1/day with approximately
        10-fold variability, consistent with typical myeloid cell lifetimes in tissues.
      sigma: 1.0
      upper: null
    units: 1/day
