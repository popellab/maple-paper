study_interpretation: Trovato et al. (2019) provide quantitative flow cytometry data on the composition of tumor-infiltrating
  leukocytes in human PDAC. Among CD45+ cells, monocytic MDSCs (CD14+HLA-DR-/lo) constitute on average approximately 1% (0.969
  +/- 0.167%) of the infiltrate, while other myeloid subsets (PMNs, macrophages, e-MDSCs) and Tregs are also reported. Assuming
  that established PDAC tumors at resection are in a quasi-steady-state with respect to myeloid trafficking, this fractional
  abundance reflects a balance between continuous recruitment of MDSCs into the tumor and their loss through death and clearance.
  Using a reference CD45+ cell density for PDAC, the observed fraction constrains the combination k_MDSC_rec / k_MDSC_death
  and thereby anchors the magnitude of the MDSC recruitment rate parameter k_MDSC_rec in the human clinical setting. This
  provides an independent clinical PDAC target complementary to earlier human tumor data (for example, Porembka2012) and preclinical
  murine PDAC studies (for example, Hong2015), helping to reconcile mouse and human estimates of MDSC trafficking.
