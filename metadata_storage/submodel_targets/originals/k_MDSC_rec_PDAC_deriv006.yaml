key_assumptions:
- CD11b+GR-1+ cells quantified in Panc02 tumors predominantly represent tumor-infiltrating MDSC-like populations relevant
  to the QSPIO-PDAC MDSC compartment.
- Orthotopic Panc02 tumors at one month post-implantation are in a quasi–steady state with respect to MDSC influx and loss,
  so a steady_state_fraction approximation is reasonable.
- Conversion from MDSC density (cells/mm2) to a fraction among CD45+ leukocytes using a reference PDAC CD45+ density (1000
  cells/mm2) is a valid order-of-magnitude approximation despite inter-study and species variability.
- Chemokine-mediated recruitment factors f(CCL2,IL6) are near saturation in established PDAC, allowing them to be absorbed
  into an effective k_MDSC_rec for baseline calibration.
- Reported errors are SEM; conversion to SD using sqrt(n) is appropriate for deriving variability across animals.
key_study_limitations:
- MDSC infiltration is quantified at a single late timepoint (approximately day 30); early-time kinetics are described qualitatively
  but not reported with numerical values, limiting dynamic inference.
- Sample size for immune infiltrate quantification in the wild-type group is small (n=4), and reported uncertainty is SEM
  rather than SD, contributing to substantial statistical uncertainty.
- The syngeneic orthotopic Panc02 model, while PDAC-like, does not fully capture the fibrosis, heterogeneity, and chronic
  evolution of human PDAC or KPC GEMMs; MDSC recruitment rates may differ quantitatively.
- The mapping from CD11b+GR-1+ density to MDSC fraction relies on an external estimate of PDAC CD45+ leukocyte density, introducing
  additional cross-study and cross-species uncertainty.
- CD11b+GR-1+ cells include heterogeneous myeloid subsets; not all such cells may correspond strictly to the MDSC compartment
  as defined in the QSP model.
