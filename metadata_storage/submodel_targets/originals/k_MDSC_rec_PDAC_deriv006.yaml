source_relevance:
  estimated_translation_uncertainty_fold: 3.0
  indication_match: exact
  indication_match_justification: The study uses an orthotopic syngeneic Panc02 pancreatic ductal adenocarcinoma model in
    immunocompetent C57Bl/6 mice, which recapitulates key features of human PDAC, including desmoplastic stroma and myeloid-rich
    immunosuppressive infiltrates. Thus the indication (PDAC) matches the QSPIO-PDAC model; remaining uncertainties arise
    from species (mouse vs human) and specific model differences rather than disease type.
  perturbation_relevance: null
  perturbation_type: pathological_state
  source_quality: primary_animal_in_vivo
  species_source: mouse
  species_target: human
  tme_compatibility: moderate
  tme_compatibility_notes: Orthotopic Panc02 tumors reproduce many PDAC microenvironment features (desmoplasia, strong myeloid
    infiltration) but are still faster-growing, less heterogeneous, and less fibrotic than human PDAC or KPC GEMMs. MDSC recruitment
    levels and cell turnover may therefore differ by several-fold from human PDAC.
  validation_warnings: []
study_interpretation: Chopra et al. (2013) quantified immune infiltrates, including CD11b+GR-1+ myeloid cells, in orthotopic
  Panc02 pancreatic tumors one month after implantation in C57Bl/6 mice. In wild-type hosts (B6.WT), CD11b+GR-1+ density reached
  ~172 cells/mm2 with substantial inter-mouse variability, indicating robust accumulation of MDSC-like cells in established
  tumors. Under a quasi–steady-state assumption for late-stage tumors, this density can be mapped to a steady-state fraction
  of MDSC among CD45+ leukocytes, which in turn constrains the ratio of MDSC recruitment to loss in the tumor compartment.
  Because the full QSPIO-PDAC model defines MDSC recruitment as k_MDSC_rec * V_T * f(CCL2,IL6), balancing k_MDSC_death * MDSC
  at steady state, the observed MDSC fraction provides a direct albeit noisy constraint on k_MDSC_rec when combined with an
  external prior on k_MDSC_death and a reference CD45+ density in PDAC.
target_id: k_MDSC_rec_panc02_tnfr1_chopra2013
