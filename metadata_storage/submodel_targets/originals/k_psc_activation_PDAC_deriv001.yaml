study_interpretation: "The Apte et al. 1998 Gut study establishes that freshly isolated, quiescent rat pancreatic stellate\
  \ cells cultured on tissue culture plastic lose their vitamin A-containing lipid droplets and become alpha-SMA-positive\
  \ between 24 and 48 hours in vitro, implying an activation timescale on the order of 2 days under strong activation conditions.\
  \ Assuming that the quiescent-to-activated transition follows approximately first-order kinetics and that autocrine/paracrine\
  \ TGF\x03b and PDGF signals in this setting are near-saturating, the characteristic activation time (~48 h) provides a direct\
  \ constraint on the PSC activation rate constant k_psc_activation used in the QSPIO-PDAC tumour compartment."
