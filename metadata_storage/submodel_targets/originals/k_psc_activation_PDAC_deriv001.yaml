  name: psc_activation_time_48h
  role: target
  source_location: 'Results; culture on plastic: cells cultured for 24 hours vs 48 hours'
  source_ref: Apte1998
  uncertainty: null
  units: hour
  value: 48.0
  value_snippet: Cells cultured for 24 hours had an angular appearance, contained lipid droplets manifesting positive vitamin
    A autofluorescence, and stained positively for desmin but negatively for alpha-SMA. At 48 hours, cells were positive for
    alpha-SMA.
key_assumptions:
- "PSC activation in vitro on rigid tissue culture plastic with 10% serum recapitulates, at least in terms of timescale, the\
  \ activation of resident quiescent PSCs in the PDAC tumour microenvironment under strong profibrotic signaling (high TGF\x03\
  b/PDGF, oxidant stress, mechanical stress)."
- The quiescent-to-activated PSC transition over the first 48 h in primary culture can be approximated as a first-order process
  characterized by a single effective rate constant k_psc_activation.
- "Autocrine and serum-derived TGF\x03b and PDGF levels during early primary culture are high enough that the Hill-type TGF\x03\
  b and PDGF terms in the full model are close to 1, so the observed activation rate approximates k_psc_activation itself\
  \ rather than k_psc_activation multiplied by submaximal signaling factors."
- PSC proliferation and death are relatively slow compared to activation over the initial 48 h, so total PSC number remains
  approximately constant and does not strongly confound the activation timescale inferred from the appearance of alpha-SMA
  positivity.
- Rat PSC activation kinetics are reasonably representative of human PSC/CAF activation kinetics in PDAC, without applying
  explicit interspecies allometric scaling for this cellular state-transition rate.
key_study_limitations:
- The Apte 1998 study involves primary rat PSCs from normal pancreas cultured on stiff plastic, which may activate faster
  than stromal PSCs embedded in the complex 3D PDAC tumour microenvironment in vivo.
- Activation is inferred from qualitative immunostaining for alpha-SMA at discrete time points (24 h vs 48 h), without a quantitative
  time-course of the fraction of activated cells, so the precise shape of the activation curve and its half-time are uncertain.
- "The culture conditions do not report exact TGF\x03b and PDGF concentrations or their temporal evolution; mapping these\
  \ undefined conditions onto the explicit TGF\x03b- and PDGF-dependent activation term in the full QSP model requires the\
  \ assumption of near-saturating signaling."
- The data are from rat PSCs; species differences in PSC biology and activation kinetics between rat and human (particularly
  in the context of PDAC-associated stellate cells/CAFs) are not explicitly accounted for.
- Other processes present in vivo, such as immune cell-derived cytokines, ECM stiffness gradients, and hypoxia, are absent
  or altered in the in vitro system, so the calibrated k_psc_activation should be interpreted as an effective parameter rather
  than a precise physiological rate.
