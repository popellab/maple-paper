calibration:
  identifiability_notes: "This submodel provides only an order-of-magnitude constraint on k_psc_activation based on a single\
    \ qualitative timing observation (onset of alpha-SMA positivity at ~48 h). The inferred k_psc_activation conflates effects\
    \ of TGF\x03b, PDGF, mechanical cues, and other stimuli present during primary culture and should be interpreted as an\
    \ effective activation rate under strong profibrotic signaling. Additional time-course data quantifying the fraction of\
    \ PSCs that are alpha-SMA+ over multiple time points, ideally under defined TGF\x03b and PDGF concentrations and in human\
    \ PSCs, would be required for tighter and more mechanistically specific identification."
  independent_variable: null
  measurements:
  - distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    # Observed activation time (onset\
      \ of alpha-SMA positivity)\n    t_obs = inputs['psc_activation_time_48h']\n    # Convert to days for consistency with\
      \ k_psc_activation units\n    t_days = t_obs.to('day').magnitude\n    # Assume a 25% coefficient of variation on activation\
      \ time (not reported in the paper)\n    cv = 0.25\n    sigma = np.sqrt(np.log(1.0 + cv**2))\n    mu = np.log(t_days)\
      \ - 0.5 * sigma**2\n    # Draw a lognormal distribution for activation time\n    t_samples = np.random.lognormal(mu,\
      \ sigma, 10000)\n    # Map to implied k_psc_activation samples via t_activation = 1 / k\n    k_samples = 1.0 / t_samples\n\
      \    return {'median': float(np.median(k_samples))}\n"
    evaluation_points:
    - 0.0
    likelihood:
      distribution: lognormal
      rationale: Activation time is positive and likely subject to multiplicative biological and experimental variability;
        we therefore represent uncertainty in the observed ~48 h activation time with a lognormal distribution over t_activation,
        which is then mapped to k_psc_activation via t_activation = 1/k_psc_activation.
    name: psc_activation_time_constraint
    observable: null
    sample_size: 1
    sample_size_rationale: Single primary culture timing estimate for onset of alpha-SMA positivity from Apte 1998 Gut.
    units: hour
    uses_inputs:
    - psc_activation_time_48h
  model:
    data_rationale: "Apte et al. 1998 report that primary rat pancreatic stellate cells cultured on plastic are negative for\
      \ \x11-smooth muscle actin (alpha-SMA) at 24 h but positive at 48 h, indicating that the quiescent-to-activated transition\
      \ occurs on a timescale of order 2 days under strong activation conditions in vitro."
    formula: t_activation = 1 / k_psc_activation
    submodel_rationale: "In the full QSPIO-PDAC model, the rate of quiescent PSC activation to myofibroblast-like activated\
      \ PSCs (CAF phenotype) in the tumour compartment is governed by k_psc_activation multiplied by saturable TGF\x03b- and\
      \ PDGF-dependent Hill terms. In early primary cultures, PSC activation on plastic is driven by autocrine/paracrine cytokines\
      \ and mechanical cues that are expected to produce near-saturating activation signals. Under this assumption, the in\
      \ vitro activation timescale (~48 h) approximates the inverse of k_psc_activation in the full model when the TGF\x03\
      b and PDGF Hill terms are near 1."
    type: direct_conversion
  parameters:
  - name: k_psc_activation
    prior:
      distribution: lognormal
      lower: null
      mu: -0.693
      rationale: Centre on ~0.5/day corresponding to an activation timescale of ~2 days (48 h) as observed for primary rat
        PSCs on plastic, but allow ~10-fold uncertainty to account for species and context differences between in vitro culture
        and PDAC tumour stroma.
      sigma: 1.0
      upper: null
    units: 1/day
  state_variables: null
