calibration:
  identifiability_notes: This submodel constrains only the order-of-magnitude of the product q_Treg_T_in * V_T_ref under conditions
    of saturated T cell recruitment (C_total >> sqrt(Kc_rec)). The mapping from the observed 24 h time-to-visibility to an
    effective half-time is heuristic and encoded with a very broad lognormal uncertainty, so the resulting information on
    q_Treg_T_in is weak and should be treated as a soft prior informed by in vivo trafficking times for adoptively transferred
    Tregs in a non-PDAC tumor model rather than a precise estimate.
  independent_variable: null
  measurements:
  - distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    import math\n\n    # Observed\
      \ time at which MRI-visible accumulation of Tregs in tumor is first apparent\n    t_vis = inputs['t_vis_Treg'].to('hour').magnitude\n\
      \n    # Assume trafficking half-time t_half is of the same order as t_vis, with large uncertainty.\n    # Model t_half\
      \ as lognormal with median = t_vis and ~3-fold 95% CI (very broad).\n    median_t_half = t_vis\n    sigma_log = math.log(3.0)\
      \ / 1.96  # gives about a 3-fold 95% interval\n    mu_log = math.log(median_t_half)\n\n    # Sample half-times (hours)\n\
      \    t_half_samples_h = np.random.lognormal(mean=mu_log, sigma=sigma_log, size=20000)\n\n    # Convert to first-order\
      \ extravasation rate constant k_extrav (1/min)\n    k_extrav_per_h = math.log(2.0) / t_half_samples_h\n    k_extrav_per_min\
      \ = k_extrav_per_h / 60.0\n\n    # Map to q_Treg_T_in using reference tumor volume V_T_ref (in cm^3)\n    V_T_ref =\
      \ inputs['V_T_ref'].to('centimeter**3').magnitude\n    q_samples = k_extrav_per_min / V_T_ref  # units: 1/(cm^3*min)\n\
      \n    # Summarize distribution\n    median = float(np.median(q_samples))\n    ci95_lower = float(np.percentile(q_samples,\
      \ 2.5))\n    ci95_upper = float(np.percentile(q_samples, 97.5))\n\n    return {\n        'median': median,\n       \
      \ 'ci95_lower': ci95_lower,\n        'ci95_upper': ci95_upper,\n    }"
    evaluation_points:
    - 0.0
    likelihood:
      distribution: lognormal
      rationale: q_Treg_T_in is a positive rate parameter spanning orders of magnitude; the synthetic data distribution derived
        from MRI timing is therefore compared to model predictions on the log scale.
    name: q_Treg_T_in_estimate
    observable: null
    sample_size: 1
    sample_size_rationale: Not a direct experimental sample distribution; a synthetic distribution over q_Treg_T_in is derived
      from the single reported trafficking time scale using Monte Carlo propagation of heuristic uncertainty.
    units: 1/(centimeter^3*minute)
    uses_inputs:
    - t_vis_Treg
    - V_T_ref
  model:
    data_rationale: Tremblay et al. 2017 report that SPIO-labeled CD4+CD25+FoxP3+ regulatory T cells become MRI-visible in
      HPV-driven cervical tumors at 24 h post intravenous injection, with labeled cells largely cleared by 72 h. These timings
      constrain the characteristic time scale of Treg recruitment from blood to tumor but do not provide a full time course
      suitable for ODE fitting.
    formula: q_Treg_T_in = (ln(2) / t_half) / V_T_ref, with t_half approximated from the observed 24 h time to MRI-visible
      Treg accumulation.
    submodel_rationale: In the full QSPIO-PDAC model, Treg and Th extravasation from the central compartment into the tumor
      is modeled as q_Treg_T_in * V_T * V_C.Treg * (C_total^2 / (C_total^2 + Kc_rec)). For established tumors (C_total >>
      sqrt(Kc_rec)), the recruitment factor approaches 1 and the flux reduces to q_Treg_T_in * V_T * V_C.Treg. Under this
      saturated-recruitment approximation and for a reference tumor volume V_T_ref, the effective first-order rate constant
      for loss of circulating Tregs into tumor is k_extrav = q_Treg_T_in * V_T_ref. The MRI-derived trafficking time scale
      can therefore be mapped analytically to q_Treg_T_in via k_extrav, without explicitly simulating the rest of the QSP
      network.
    type: direct_conversion
  parameters:
  - name: q_Treg_T_in
    prior:
      distribution: lognormal
      lower: null
      mu: -7.64
      rationale: Prior centered on order-of-magnitude estimate derived from Tremblay et al. 2017 MRI tracking of SPIO-labeled
        Tregs into cervical tumors, interpreting the 24 h time-to-visibility as an approximate trafficking half-time and allowing
        roughly a 10-fold uncertainty (95 percent CI) in either direction.
      sigma: 0.56
      upper: null
    units: 1/(centimeter^3*minute)
  state_variables: null
