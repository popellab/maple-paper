study_interpretation: Tremblay et al. 2017 used SPIO-labeled CD4+CD25+FoxP3+ regulatory T cells in a murine HPV-driven cervical
  cancer model and showed that labeled Tregs become MRI-detectable in tumors by 24 h after intravenous injection, with signal
  largely gone by 72 h. Interpreting the 24 h time-to-visibility as reflecting the characteristic time scale for Treg trafficking
  from blood into an established solid tumor provides an in vivo constraint on the effective extravasation rate. Under the
  saturated-recruitment approximation used in the full QSP model, this timing can be mapped to the composite rate q_Treg_T_in
  * V_T_ref, and thus to q_Treg_T_in when a reference tumor volume is specified.
target_id: q_Treg_T_in_Tremblay2017_MRIcelltracking
