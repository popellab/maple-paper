# Schema: SubmodelTarget
# Source: Liu et al. (2013) Biomed Rep - Collagen I secretion by LX-2 hepatic stellate cells

target_id: ecm_secretion_apsc_PDAC_deriv001

# =============================================================================
# INPUTS: Extracted values with full provenance
# =============================================================================
inputs:
  - name: collagen_conc_mean
    value: 26.30
    units: nanogram / milliliter
    uncertainty:
      sd: 3.69
    n: 3
    input_type: direct_measurement
    role: target
    source_ref: Liu2013_HSC_ColI
    source_location: Results, ELISA measurements
    value_snippet: "Col I: 28.61±3.25 vs. 26.30±3.69 ng/ml"

  - name: collagen_conc_sd
    value: 3.69
    units: nanogram / milliliter
    input_type: direct_measurement
    role: auxiliary
    source_ref: Liu2013_HSC_ColI
    source_location: Results, ELISA measurements
    value_snippet: "Col I: 28.61±3.25 vs. 26.30±3.69 ng/ml"

  - name: culture_duration
    value: 2.0
    units: day
    input_type: experimental_condition
    role: auxiliary
    source_ref: Liu2013_HSC_ColI
    source_location: Methods
    value_snippet: "incubated with HBs (10 ng/ml) for 48 h"

  - name: cells_per_well
    value: 2000.0
    units: cell
    input_type: direct_measurement
    role: auxiliary
    source_ref: Liu2013_HSC_ColI
    source_location: Methods
    value_snippet: "The cells (2×10³ cells/well) were cultured"

  - name: medium_volume
    value: 0.1
    units: milliliter
    input_type: assumed_value
    role: auxiliary
    source_ref: Liu2013_HSC_ColI
    source_location: Standard 96-well plate volume (not explicitly stated)

# =============================================================================
# CALIBRATION: Everything needed for inference
# =============================================================================
calibration:
  parameters:
    - name: k_ECM_apsc_sec
      units: milligram / (cell * day)
      prior:
        distribution: lognormal
        mu: -15.0  # log(~3e-7) mg/(cell*day)
        sigma: 1.5
        rationale: |
          Prior centered at ~3e-7 mg/(cell*day) based on collagen concentration
          measurements (~26 ng/mL) normalized by cell count (2000 cells/well).
          Wide sigma to accommodate uncertainty in medium volume and ECM
          composition beyond collagen I.

  model:
    type: direct_conversion
    formula: "k = (conc * volume) / (cells * time)"
    data_rationale: |
      Collagen I concentration in supernatant after 48h culture measures net
      secretion rate. Convert ng/mL to mg/(cell*day) using cell count and
      medium volume.
    submodel_rationale: |
      In the full QSPIO_PDAC model, k_ECM_apsc_sec appears in reaction
      null -> V_T.ECM with rate modulated by TGFb and saturation terms.
      This direct conversion captures basal secretion capacity.

  measurements:
    - name: ecm_secretion_rate
      units: milligram / (cell * day)
      uses_inputs:
        - collagen_conc_mean
        - collagen_conc_sd
        - culture_duration
        - cells_per_well
        - medium_volume
      evaluation_points: [0.0]
      distribution_code: |
        def derive_distribution(inputs, ureg):
            import numpy as np

            rng = np.random.default_rng(42)
            n_mc = 10000

            # Extract values
            conc_mean = inputs['collagen_conc_mean'].magnitude  # ng/mL
            conc_sd = inputs['collagen_conc_sd'].magnitude      # ng/mL
            cells = inputs['cells_per_well'].magnitude          # cells
            volume = inputs['medium_volume'].magnitude          # mL
            time = inputs['culture_duration'].magnitude         # day

            # Sample concentration (lognormal for positive values)
            mu_log = np.log(conc_mean**2 / np.sqrt(conc_mean**2 + conc_sd**2))
            sigma_log = np.sqrt(np.log(1 + conc_sd**2 / conc_mean**2))
            conc_samples = rng.lognormal(mu_log, sigma_log, n_mc)

            # Add uncertainty in cell count (30% CV)
            cells_samples = rng.normal(cells, cells * 0.3, n_mc)
            cells_samples = np.clip(cells_samples, cells * 0.5, cells * 1.5)

            # Add uncertainty in medium volume (50% CV for 96-well)
            volume_samples = rng.uniform(0.05, 0.15, n_mc)

            # Convert: ng/mL -> mg/(cell*day)
            # k = (conc [ng/mL] * volume [mL]) / (cells * time [day]) * 1e-6 [mg/ng]
            k_samples = (conc_samples * volume_samples * 1e-6) / (cells_samples * time)

            return {
                'median': [np.median(k_samples)],
                'ci95': [[np.percentile(k_samples, 2.5), np.percentile(k_samples, 97.5)]],
                'units': 'milligram / (cell * day)'
            }
      likelihood:
        distribution: lognormal
        rationale: |
          Secretion rates are positive with multiplicative uncertainty from
          concentration measurement, cell count, and medium volume estimates.

  identifiability_notes: |
    ECM secretion rate computed from collagen I ELISA measurement (26.30 ng/mL)
    normalized by cell count (2000 cells/well) and estimated medium volume.
    Key uncertainties: medium volume (±50%), cell count (±30%). Result
    represents activated stellate cell collagen I secretion capacity.

# =============================================================================
# EXPERIMENTAL CONTEXT
# =============================================================================
experimental_context:
  species: human
  system: in_vitro_cell_line
  indication: liver_fibrosis
  cell_types:
    - name: hepatic stellate cell
      phenotype: activated (LX-2 immortalized cell line)
  culture_conditions:
    culture_type: 2d_monolayer
    serum_concentration: 10.0
    serum_concentration_units: percent

# =============================================================================
# STUDY INTERPRETATION
# =============================================================================
study_interpretation: |
  Liu et al. (2013) measured collagen I secretion by LX-2 hepatic stellate
  cells using ELISA. Control cells (without HBs treatment) secreted
  26.30 ± 3.69 ng/mL collagen I over 48 hours. LX-2 is an immortalized
  human HSC line that maintains activated stellate cell characteristics.
  PSCs and HSCs have similar myofibroblastic phenotypes when activated,
  making this a reasonable proxy for aPSC ECM secretion.

key_assumptions:
  - |
    Hepatic and pancreatic stellate cells have similar ECM secretion capacity
    when activated to myofibroblastic phenotype.
  - |
    Medium volume of ~0.1 mL per well assumed for 96-well plate format.
  - |
    Collagen I represents the major ECM component secreted by activated
    stellate cells.
  - |
    LX-2 cell line maintains activated stellate cell ECM secretion capacity.

key_study_limitations:
  - |
    Data from hepatic stellate cells (LX-2), not pancreatic stellate cells.
  - |
    Medium volume not explicitly stated; assumed from typical 96-well protocols.
  - |
    2D culture on plastic; 3D matrix environment may alter secretion rates.
  - |
    LX-2 is immortalized; primary stellate cells may differ in secretion rates.

# =============================================================================
# DATA SOURCES
# =============================================================================
primary_data_source:
  doi: "10.3892/br.2013.201"
  title: "The S protein of hepatitis B virus promotes collagen type I expression in hepatic stellate cells by virtue of hepatocytes"
  authors: [Liu, Tu, Deng, Liang]
  year: 2013
  source_tag: Liu2013_HSC_ColI
