# Schema: SimplifiedIsolatedTarget
# Source: Louzoun et al. (2014) J Theor Biol - Mathematical model for pancreatic cancer

target_id: psc_death_quiescent_PDAC_deriv001

# =============================================================================
# INPUTS: Extracted values with full provenance
# =============================================================================
inputs:
  - name: psc_half_life_lower
    value: 2.0
    units: day
    input_type: direct_measurement
    role: auxiliary
    source_ref: Louzoun2014_PCModel
    source_location: Table 1, PSC parameters
    value_snippet: "The half-life T₁/₂ of PSC is 2–5 days."

  - name: psc_half_life_upper
    value: 5.0
    units: day
    input_type: direct_measurement
    role: target
    source_ref: Louzoun2014_PCModel
    source_location: Table 1, PSC parameters
    value_snippet: "The half-life T₁/₂ of PSC is 2–5 days."

# =============================================================================
# CALIBRATION: Everything needed for inference
# =============================================================================
calibration:
  parameters:
    - name: k_qpsc_death
      units: 1/day
      prior:
        distribution: lognormal
        mu: -1.897  # log(0.15) - midpoint estimate
        sigma: 0.5
        rationale: |
          Prior centered at 0.15/day based on reported half-life range of 2-5 days.
          Using ln(2)/T_half: lower bound gives 0.35/day (T=2d), upper bound gives
          0.14/day (T=5d). Sigma of 0.5 spans this range in log-space.

  model:
    type: direct_conversion
    formula: "k = ln(2) / half_life"
    data_rationale: |
      PSC half-life is reported as a range (2-5 days). The death rate constant
      is computed directly from half-life using first-order decay kinetics:
      k = ln(2) / T_half. No ODE integration needed.
    submodel_rationale: |
      In the full QSPIO_PDAC model, k_qpsc_death appears in reaction
      V_T.qPSC → null with rate k_qpsc_death * V_T.qPSC. This direct
      conversion preserves the first-order death mechanism.

  measurements:
    - name: death_rate_from_half_life
      units: 1/day
      uses_inputs:
        - psc_half_life_lower
        - psc_half_life_upper
      evaluation_points: [0.0]
      distribution_code: |
        def derive_distribution(inputs, ureg):
            import numpy as np

            rng = np.random.default_rng(42)
            n_mc = 10000

            # Half-life range: uniform distribution between lower and upper bounds
            t_half_lower = inputs['psc_half_life_lower'].magnitude
            t_half_upper = inputs['psc_half_life_upper'].magnitude

            # Sample half-lives uniformly
            t_half_samples = rng.uniform(t_half_lower, t_half_upper, n_mc)

            # Convert to death rate: k = ln(2) / t_half
            k_samples = np.log(2) / t_half_samples

            return {
                'median': [np.median(k_samples)],
                'ci95': [[np.percentile(k_samples, 2.5), np.percentile(k_samples, 97.5)]],
                'units': '1/day'
            }
      likelihood:
        distribution: lognormal
        rationale: |
          Death rates are positive; lognormal captures the right-skewed
          distribution arising from inverting uniformly distributed half-lives.

  identifiability_notes: |
    The death rate is directly computed from reported half-life range using
    k = ln(2)/T_half. The range 2-5 days yields k ∈ [0.14, 0.35] per day.
    This represents turnover of quiescent PSCs in normal/early disease
    pancreas, which may differ from activated PSC death in established tumors.

# =============================================================================
# EXPERIMENTAL CONTEXT
# =============================================================================
experimental_context:
  species: human
  system: in_vitro_primary_cells
  indication: PDAC
  cell_types:
    - name: pancreatic stellate cell
      phenotype: quiescent (vitamin A lipid droplet positive)

# =============================================================================
# STUDY INTERPRETATION
# =============================================================================
study_interpretation: |
  Louzoun et al. (2014) compiled PSC kinetic parameters from multiple sources
  for their mathematical model of pancreatic cancer. They report PSC half-life
  as 2-5 days, which translates to a death rate of 0.14-0.35/day via first-order
  kinetics. While this estimate encompasses both quiescent and activated PSCs
  in their general model, we apply it specifically to quiescent PSCs as a
  baseline turnover rate. Quiescent PSCs in normal pancreas have relatively
  slow turnover compared to activated myofibroblastic PSCs.

key_assumptions:
  - |
    The reported 2-5 day half-life applies to quiescent PSCs specifically,
    though the original source may include both quiescent and activated cells.
  - |
    First-order decay kinetics: dN/dt = -k*N with k = ln(2)/T_half.
  - |
    Human PSC turnover rates are similar to those in the cited rodent studies.
  - |
    Uniform distribution between half-life bounds captures parameter uncertainty.

key_study_limitations:
  - |
    Half-life range compiled from multiple sources; original experimental
    conditions may vary.
  - |
    Does not distinguish between quiescent and activated PSC populations.
  - |
    Parameter derived for mathematical modeling, not measured directly in
    PDAC tissue.
  - |
    Quiescent PSC death in tumor microenvironment may differ from normal
    pancreas due to survival signals.

# =============================================================================
# DATA SOURCES
# =============================================================================
primary_data_source:
  doi: "10.1016/j.jtbi.2014.02.028"
  title: "A mathematical model for pancreatic cancer growth and treatments"
  authors: [Louzoun, Xue, Lesinski, Friedman]
  year: 2014
  source_tag: Louzoun2014_PCModel
