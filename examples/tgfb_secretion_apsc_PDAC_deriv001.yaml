# Schema: SimplifiedIsolatedTarget
# Source: Shek et al. (2002) Am J Pathol - TGF-beta secretion by PSCs

target_id: tgfb_secretion_apsc_PDAC_deriv001

# =============================================================================
# INPUTS: Extracted values with full provenance
# =============================================================================
inputs:
  - name: tgfb_conc_mean
    value: 1076.0
    units: picogram / milliliter
    uncertainty:
      sd: 225.0
    n: 6
    input_type: direct_measurement
    role: target
    source_ref: Shek2002_PSC_TGFb
    source_location: Results, TGF-β1 secretion section
    value_snippet: "Latent TGF-β1 production by PSCs was 1076 ± 225 pg/ml/24 hours"

  - name: tgfb_conc_sd
    value: 225.0
    units: picogram / milliliter
    input_type: direct_measurement
    role: auxiliary
    source_ref: Shek2002_PSC_TGFb
    source_location: Results, TGF-β1 secretion section
    value_snippet: "Latent TGF-β1 production by PSCs was 1076 ± 225 pg/ml/24 hours"

  - name: culture_duration
    value: 1.0
    units: day
    input_type: experimental_condition
    role: auxiliary
    source_ref: Shek2002_PSC_TGFb
    source_location: Methods
    value_snippet: "24 hours"

  - name: tgfb_mw
    value: 25000.0
    units: gram / mole
    input_type: assumed_value
    role: auxiliary
    source_ref: Shek2002_PSC_TGFb
    source_location: Standard value for TGF-β1 homodimer

  - name: cells_per_well
    value: 50000.0
    units: cell
    input_type: assumed_value
    role: auxiliary
    source_ref: Shek2002_PSC_TGFb
    source_location: Typical seeding density for PSCs in 24-well plates (not explicitly stated)

  - name: medium_volume
    value: 0.5
    units: milliliter
    input_type: assumed_value
    role: auxiliary
    source_ref: Shek2002_PSC_TGFb
    source_location: Typical medium volume for 24-well plate (not explicitly stated)

# =============================================================================
# CALIBRATION: Everything needed for inference
# =============================================================================
calibration:
  parameters:
    - name: k_TGFb_sec_apsc
      units: nanomolarity * liter / (cell * day)
      prior:
        distribution: lognormal
        mu: -21.0  # log(~1e-9) - very small per-cell rate
        sigma: 1.5
        rationale: |
          Wide prior to accommodate uncertainty in cell density assumptions.
          Expected rate ~1e-9 to 1e-8 nM*L/(cell*day) based on unit conversion.

  model:
    type: direct_conversion
    formula: "k = (conc_pg_mL * volume_mL * 1e-12) / (MW * cells * time) * 1e9"
    data_rationale: |
      TGF-β1 concentration in supernatant after 24h culture directly measures
      secretion rate. Convert pg/mL to nmol/(cell*day) using molecular weight,
      cell count, and medium volume.
    submodel_rationale: |
      In the full QSPIO_PDAC model, k_TGFb_sec_apsc appears in reaction
      null -> V_T.TGFb with rate k_TGFb_sec_apsc * V_T.aPSC. This direct
      conversion from ELISA data preserves the per-cell secretion mechanism.

  measurements:
    - name: secretion_rate
      units: nanomolarity * liter / (cell * day)
      uses_inputs:
        - tgfb_conc_mean
        - tgfb_conc_sd
        - culture_duration
        - tgfb_mw
        - cells_per_well
        - medium_volume
      evaluation_points: [0.0]
      distribution_code: |
        def derive_distribution(inputs, ureg):
            import numpy as np

            rng = np.random.default_rng(42)
            n_mc = 10000

            # Extract values
            conc_mean = inputs['tgfb_conc_mean'].magnitude  # pg/mL
            conc_sd = inputs['tgfb_conc_sd'].magnitude      # pg/mL
            mw = inputs['tgfb_mw'].magnitude                # g/mol
            cells = inputs['cells_per_well'].magnitude      # cells
            volume = inputs['medium_volume'].magnitude      # mL
            time = inputs['culture_duration'].magnitude     # day

            # Sample concentration (lognormal for positive values)
            mu_log = np.log(conc_mean**2 / np.sqrt(conc_mean**2 + conc_sd**2))
            sigma_log = np.sqrt(np.log(1 + conc_sd**2 / conc_mean**2))
            conc_samples = rng.lognormal(mu_log, sigma_log, n_mc)

            # Add uncertainty in cell count (assume 30% CV)
            cells_samples = rng.normal(cells, cells * 0.3, n_mc)
            cells_samples = np.clip(cells_samples, cells * 0.5, cells * 1.5)

            # Convert: pg/mL -> g/L -> mol/L -> nmol/L
            # Then divide by cells and time, multiply by volume
            # k = (conc [pg/mL] * volume [mL] * 1e-12 [g/pg]) / (MW [g/mol] * cells * time [day])
            # Result in mol/(cell*day), convert to nmol: * 1e9

            k_samples = (conc_samples * volume * 1e-12) / (mw * cells_samples * time) * 1e9

            return {
                'median': [np.median(k_samples)],
                'ci95': [[np.percentile(k_samples, 2.5), np.percentile(k_samples, 97.5)]],
                'units': 'nanomolarity * liter / (cell * day)'
            }
      likelihood:
        distribution: lognormal
        rationale: |
          Secretion rates are positive with multiplicative uncertainty from
          both concentration measurement and cell count assumptions.

  identifiability_notes: |
    The secretion rate is computed from ELISA concentration data with assumed
    cell density. Key uncertainty sources: (1) measured TGF-β1 concentration
    (±20% CV), (2) cell count per well (assumed 50,000 ± 30%), (3) medium
    volume (assumed 0.5 mL). The parameter represents total TGF-β1 secretion
    (latent form); biological activity depends on subsequent activation.

# =============================================================================
# EXPERIMENTAL CONTEXT
# =============================================================================
experimental_context:
  species: rat
  system: in_vitro_primary_cells
  indication: chronic_pancreatitis
  cell_types:
    - name: pancreatic stellate cell
      phenotype: activated (alpha-SMA positive)
      isolation_method: Density gradient centrifugation from rat pancreas
  culture_conditions:
    culture_type: 2d_monolayer
    serum_concentration: 0.0
    serum_concentration_units: percent

# =============================================================================
# STUDY INTERPRETATION
# =============================================================================
study_interpretation: |
  Shek et al. (2002) quantified TGF-β1 secretion by cultured rat pancreatic
  stellate cells using ELISA. Activated PSCs (passages 2-4, α-SMA positive)
  secreted 1076 ± 225 pg/mL of latent TGF-β1 over 24 hours in serum-free
  conditions. This provides a quantitative constraint on the TGF-β1 secretion
  rate parameter. The majority (95-98%) of secreted TGF-β1 was in latent form,
  requiring activation for biological activity. We use the total (latent)
  secretion rate as the model parameter, consistent with TGF-β production
  prior to any activation step.

key_assumptions:
  - |
    Cell density of ~50,000 cells per well is assumed based on typical PSC
    culture protocols in 24-well plates (not explicitly stated in paper).
  - |
    Medium volume of 0.5 mL per well is assumed for 24-well format.
  - |
    TGF-β1 molecular weight of 25 kDa (mature homodimer) is used for unit conversion.
  - |
    Latent TGF-β1 secretion rate is used; activation is handled separately in the model.
  - |
    Rat PSC secretion rates are applicable to human PDAC-associated aPSCs.

key_study_limitations:
  - |
    Exact cell count per well not reported; assumed from typical protocols.
  - |
    Rat PSCs from normal pancreas, not human PDAC-derived CAFs.
  - |
    Measured in 2D culture; in vivo secretion rates may differ.
  - |
    Only latent TGF-β1 measured; active form was ~2-5% of total.

# =============================================================================
# DATA SOURCES
# =============================================================================
primary_data_source:
  doi: "10.1016/S0002-9440(10)61125-X"
  title: "Expression of Transforming Growth Factor-β1 by Pancreatic Stellate Cells and Its Implications for Matrix Secretion and Turnover in Chronic Pancreatitis"
  authors: [Shek, Benyon, Walker, McCrudden, Pender, Williams, Johnson, Johnson, Bateman, Fine, Iredale]
  year: 2002
  source_tag: Shek2002_PSC_TGFb
