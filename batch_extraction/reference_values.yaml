# =============================================================================
# MOLECULAR WEIGHTS
# =============================================================================

- name: ccl2_molecular_weight_mature
  display_name: Mature human CCL2 (MCP-1) molecular weight
  value: 8679.0
  units: gram / mole
  category: molecular_properties
  species: human
  source:
    description: |
      Mature human CCL2 (UniProt P13500, residues 24-99, 76 amino acids)
      after signal peptide cleavage. The precursor includes a 23-residue
      signal peptide (MW ~11025 Da). ELISA kits calibrated against mature
      recombinant CCL2 should use 8679 Da for mass-to-mole conversion.
  typical_range: [8600.0, 8800.0]
  notes: |
    DrugBank/UniProt report 11024.87 for the full precursor (99 aa).
    The secreted, bioactive form is the mature protein (76 aa, 8679 Da).
    Use mature MW for converting in vitro secretion assay data (pg or ng)
    to molar secretion rates (nmol/cell/day).